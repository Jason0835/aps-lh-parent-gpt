server:
  port: 9105

nacos:
  server-addr: 127.0.0.1:8848

# Spring
spring:
  application:
    # 应用名称
    name: mix-sync-data
  profiles:
    # 环境配置
    active: dev
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${nacos.server-addr}
      config:
        # 配置中心地址
        server-addr: ${nacos.server-addr}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs[0]:
          data-id: application-mix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[1]:
          data-id: druid_mix_${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[2]:
          data-id: system-frame-mix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[3]:
          data-id: system-api-mix-prefix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[4]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[5]:
          data-id: sync-data-mix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        #自动刷新配置文件
        refresh-enabled: true
mq:
  scheduleLog:
    queue: dev.schedule.schedule.log.queue
    exchange: dev.schedule.schedule.log.exchange
    rutekey: dev.schedule.schedule.log.rutekey
    
#模板文件的配置路径
excelModelPath: excelModel/
#分布式事务默认不开启
seata:
  enabled: false