# Tomcat
server:
  port: 9103

nacos:
  server-addr: 192.168.3.112:9917,192.168.3.115:9917,192.168.3.122:9917
#  server-addr: 127.0.0.1:8848

## Spring
spring:
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        namespace: prod
        group: MIX_PROD_GROUP
      config:
        shared-configs[0]:
          data-id: application-mix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[1]:
          data-id: druid_mix_${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[2]:
          data-id: system-frame-mix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[3]:
          data-id: system-api-mix-prefix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[4]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[5]:
          data-id: sync-data-mix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        refresh-enabled: true
        namespace: prod
        group: PROD_GROUP
mq:
  scheduleLog:
    queue: prod.setting.schedule.log.queue
    exchange: prod.setting.schedule.log.exchange
    rutekey: prod.setting.schedule.log.rutekey