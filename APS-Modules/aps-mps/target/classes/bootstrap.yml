server:
  port: 9011

nacos:
  #  server-addr: 192.168.2.93:8848
  server-addr: 127.0.0.1:8848
  run-group: PLAT

# Spring
spring:
  application:
    # 应用名称
    name: aps-mps
  profiles:
    # 环境配置
    active: dev
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${nacos.server-addr}
      config:
        # 配置中心地址
        server-addr: ${nacos.server-addr}
        group: DEFAULT_GROUP
        namespace: ""
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs[0]:
          data-id: application-aps-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: DEFAULT_GROUP
        shared-configs[1]:
          data-id: druid_aps_${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: DEFAULT_GROUP
        shared-configs[2]:
          data-id: system-frame-aps-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: DEFAULT_GROUP
        shared-configs[3]:
          data-id: system-api-prefix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: DEFAULT_GROUP
        shared-configs[4]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: DEFAULT_GROUP
        shared-configs[5]:
          data-id: rabbit-sync-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: DEFAULT_GROUP
        shared-configs[6]:
          data-id: sync-data-receive-aps-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: DEFAULT_GROUP
        #自动刷新配置文件
        refresh-enabled: true
mq:
  scheduleLog:
    queue: dev.mps.schedule.log.queue
    exchange: dev.mps.schedule.log.exchange
    rutekey: dev.mps.schedule.log.rutekey
  mpsPlanMain:
    queue: dev.mps.aps.month.plan.main.queue
    exchange: dev.mps.aps.month.plan.main.exchange
    rutekey: dev.mps.aps.month.plan.main.rutekey

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn
    com.zlt: debug