# Tomcat
server:
  port: 9011

nacos:
  server-addr: 192.168.3.112:9917,192.168.3.115:9917,192.168.3.122:9917
#  server-addr: 127.0.0.1:8848

## Spring
spring:
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        namespace: prod
        group: APS_PROD_GROUP
      config:
        shared-configs[0]:
          data-id: application-aps-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[1]:
          data-id: druid_aps_${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[2]:
          data-id: system-frame-aps-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[3]:
          data-id: system-api-prefix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[4]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[5]:
          data-id: rabbit-sync-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[6]:
          data-id: sync-data-receive-aps-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        refresh-enabled: true
        namespace: prod
        group: PROD_GROUP
mq:
  scheduleLog:
    queue: prod.mps.schedule.log.queue
    exchange: prod.mps.schedule.log.exchange
    rutekey: prod.mps.schedule.log.rutekey
  mpsPlanMain:
    queue: prod.mps.aps.month.plan.main.queue
    exchange: prod.mps.aps.month.plan.main.exchange
    rutekey: prod.mps.aps.month.plan.main.rutekey
