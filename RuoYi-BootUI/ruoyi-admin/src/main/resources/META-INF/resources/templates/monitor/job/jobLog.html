<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('定时任务日志列表')" />
</head>
<body class="gray-bg">

	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="jobLog-form">
					<div class="select-list">
						<ul>
							<li>
								[[#{ui.data.column.job.name}]]：<input type="text" name="jobName" th:value="${job!=null?job.jobName:''}"/>
							</li>
							<li>
								[[#{ui.data.column.job.jobGroup}]]：<select name="jobGroup" th:with="type=${@dict.getType('sys_job_group')}">
									<option value="">[[#{ui.frame.select.select.all}]]</option>
									<th:block th:if="${job==null}"><option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option></th:block>
									<th:block th:if="${job!=null}"><option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{job.jobGroup}"></option></th:block>
								</select>
							</li>
							<li>
								[[#{ui.data.column.jobLog.status}]]：<select name="status" th:with="type=${@dict.getType('sys_common_status')}">
									<option value="">[[#{ui.frame.select.select.all}]]</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select>
							</li>
							<li class="select-time">
								<label>[[#{ui.data.column.jobLog.runTime}]]： </label>
								<input type="text" class="time-input" id="startTime" th:placeholder="#{ui.data.column.time.start}" name="beginTime"/>
								<span>-</span>
								<input type="text" class="time-input" id="endTime" th:placeholder="#{ui.data.column.time.end}" name="endTime"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.name.search}]]</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.name.reset}]]</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
			<div class="btn-group-sm" id="toolbar" role="group">
				 <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="monitor:job:remove">
	                <i class="fa fa-remove"></i> [[#{ui.frame.btn.name.del}]]
	            </a>
	            <a class="btn btn-danger" onclick="$.operate.clean()" shiro:hasPermission="monitor:job:remove">
	                <i class="fa fa-trash"></i>  [[#{ui.frame.btn.name.clear}]]
	            </a>
	            <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="monitor:job:export">
		            <i class="fa fa-download"></i> [[#{ui.frame.btn.name.export}]]
		        </a>
	        </div>
	        
	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var detailFlag = [[${@permission.hasPermi('monitor:job:detail')}]];
		var statusDatas = [[${@dict.getType('sys_common_status')}]];
		var groupDatas = [[${@dict.getType('sys_job_group')}]];
		var prefix = ctx + "monitor/jobLog";

		$(function() {
		    var options = {
		        url: prefix + "/list",
		        cleanUrl: prefix + "/clean",
		        detailUrl: prefix + "/detail/{id}",
		        removeUrl: prefix + "/remove",
		        exportUrl: prefix + "/export",
		        sortName: "createTime",
		        sortOrder: "desc",
		        modalName: [[#{ui.data.column.job.log}]],
		        columns: [{
		            checkbox: true
		        },
		        {
		            field: 'jobLogId',
		            title: [[#{ui.data.column.operlog.operId}]]
		        },
		        {
		            field: 'jobName',
		            title: [[#{ui.data.column.job.name}]]
		        },
		        {
		            field: 'jobGroup',
		            title: [[#{ui.data.column.job.jobGroup}]],
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(groupDatas, value);
		            }
		        },
		        {
		            field: 'invokeTarget',
		            title: [[#{ui.data.column.job.invokeTarget}]],
		            formatter: function(value, row, index) {
                    	return $.table.tooltip(value);
                    }
		        },
		        {
		            field: 'jobMessage',
		            title: [[#{ui.data.column.jobLog.jobMessage}]]
		        },
		        {
		            field: 'status',
		            title: [[#{ui.data.column.state}]],
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(statusDatas, value);
		            }
		        },
		        {
		            field: 'createTime',
		            title: [[#{ui.data.column.createtime}]],
		            sortable: true
		        },
		        {
		            title: [[#{ui.frame.btn.name.oper}]],
		            align: 'center',
		            formatter: function(value, row, index) {
		                var actions = [];
		                actions.push('<a class="btn btn-warning btn-xs ' + detailFlag + '" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.jobLogId + '\')"><i class="fa fa-search"></i>'+[[#{ui.frame.btn.name.detail}]]+'</a> ');
		                return actions.join('');
		            }
		        }]
		    };
		    $.table.init(options);
		});
	</script>
</body>
</html>
