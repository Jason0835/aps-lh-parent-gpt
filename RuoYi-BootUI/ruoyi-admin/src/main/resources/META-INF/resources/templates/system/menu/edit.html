<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改菜单')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-menu-edit" th:object="${menu}">
			<input name="menuId"   type="hidden" th:field="*{menuId}"   />
			<input id="treeId" name="parentId" type="hidden" th:field="*{parentId}" />
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.menu.parent}]]：</label>
				<div class="col-sm-8">
				    <div class="input-group">
						<input class="form-control" type="text" onclick="selectMenuTree()" id="treeName" readonly="true" th:value="${menu.parentName == null ? '无' : menu.parentName}">
					    <span class="input-group-addon"><i class="fa fa-search"></i></span>
				    </div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">[[#{ui.data.column.menu.type}]]：</label>
				<div class="col-sm-8">
					<!--<label class="radio-box"> <input type="radio" th:field="*{menuType}" name="menuType" value="M" /> 目录 </label>
					<label class="radio-box"> <input type="radio" th:field="*{menuType}" name="menuType" value="C" /> 菜单 </label> 
					<label class="radio-box"> <input type="radio" th:field="*{menuType}" name="menuType" value="F" /> 按钮 </label>-->
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_menu_type')}">
						<input type="radio" name="menuType" th:id="${dict.dictCode}" th:value="${dict.dictValue}" th:attr="checked=${menu.menuType == dict.dictValue?true:false}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">[[#{ui.data.column.menu.name}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="menuName" id="menuName" th:field="*{menuName}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.operlog.operUrl}]]：</label>
				<div class="col-sm-8">
					<input id="btUrl" name="btUrl" class="form-control" type="text" th:field="*{btUrl}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.menu.target}]]：</label>
				<!--<div class="col-sm-8">
					<select id="target" name="target" class="form-control m-b">
	                    <option value="menuItem" th:field="*{target}">页签</option>
	                    <option value="menuBlank" th:selected="*{target == 'menuBlank'}">新窗口</option>
	                </select>
				</div>-->
				<div class="col-sm-8">
					<select id="target" name="target"  class="form-control m-b" th:with="type=${@dict.getType('sys_menu_open_type')}">
						<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{target}"></option>
					</select>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.menu.btPerms}]]：</label>
				<div class="col-sm-8">
					<input id="btPerms" name="btPerms" class="form-control" type="text" th:field="*{btPerms}">
				    <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> [[#{ui.biz.page.menu.btPerms.placeholder}]]</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">[[#{ui.data.column.show.index}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="orderNum" th:field="*{orderNum}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.icon}]]：</label>
				<div class="col-sm-8">
					<input id="btIcon" name="btIcon" class="form-control" type="text" th:placeholder="#{ui.data.column.menu.btIcon.placeholder}" th:field="*{btIcon}">
                    <div class="ms-parent" style="width: 100%;">
                        <div class="icon-drop animated flipInX" style="display: none;max-height:200px;overflow-y:auto">
                            <div data-th-include="system/menu/icon"></div>
                        </div>
                    </div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.menu.state}]]：</label>
				<div class="col-sm-3">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_show_hide')}">
						<input type="radio" th:id="${dict.dictCode}" name="visible" th:value="${dict.dictValue}" th:field="*{visible}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>

			<!--TODO:I18N语言  4.6升级要测试-->
			<div class="form-group">
				<label class="col-sm-3 control-label is-refresh" title="打开菜单选项卡是否刷新页面">是否刷新：<i class="fa fa-question-circle-o"></i></label>
				<div class="col-sm-3 is-refresh">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_yes_no')}">
						<input type="radio" th:id="${dict.dictCode}" name="isRefresh" th:value="${dict.dictValue}" th:field="*{isRefresh}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.lang}]]：</label>
				<div class="col-sm-8">
					<input id="langJson" name="langJson" class="form-control" type="text" th:field="*{langJson}">
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	 <script>
        var prefix = ctx + "system/menu";

        $(function() {
            var menuType = $('input[name="menuType"]:checked').val();
            menuVisible(menuType);
        });

        $("#form-menu-edit").validate({
        	onkeyup: false,
        	rules:{
        		menuType:{
        			required:true,
        		},
        		menuName:{
        			remote: {
                        url: prefix + "/checkMenuNameUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                        	"menuId": function() {
                                return $("#menuId").val();
                            },
                            "parentId": function() {
		                		return $("input[name='parentId']").val();
		                    },
                			"menuName": function() {
                                return $.common.trim($("#menuName").val());
                            }
                        },
                        dataFilter: function(data, type) {
                        	return $.validate.unique(data);
                        }
                    }
        		},
        		orderNum:{
        			digits:true
        		},
        	},
        	messages: {
                "menuName": {
                    remote: '[[#{ui.biz.alter.menu.isMenuExist}]]'
                }
            },
            focusCleanup: true
        });
        
        function submitHandler() {
	        if ($.validate.form()) {
	            $.operate.save(prefix + "/edit", $('#form-menu-edit').serialize());
	        }
	    }

        $(function() {
            $("input[name='btIcon']").click(function() {
                $(".icon-drop").show();
            });
            $("#form-menu-edit").click(function(event) {
                var obj = event.srcElement || event.target;
                if (!$(obj).is("input[name='btIcon']")) {
                    $(".icon-drop").hide();
                }
            });
            $(".icon-drop").find(".ico-list i").on("click",
            function() {
                $('#btIcon').val($(this).attr('class'));
            });
            $('input').on('ifChecked',
            function(event) {
                var menuType = $(event.target).val();
                menuVisible(menuType);
            });
        });

        function menuVisible(menuType) {
            if (menuType == "M") {
                $("#btUrl").parents(".form-group").hide();
                $("#btPerms").parents(".form-group").hide();
                $("#btIcon").parents(".form-group").show();
                $("#target").parents(".form-group").hide();
                $("input[name='visible']").parents(".form-group").show();
				$(".is-refresh").hide();
            } else if (menuType == "C") {
                $("#btUrl").parents(".form-group").show();
                $("#btPerms").parents(".form-group").show();
                $("#btIcon").parents(".form-group").show();
                $("#target").parents(".form-group").show();
                $("input[name='visible']").parents(".form-group").show();
				$(".is-refresh").show();
            } else if (menuType == "F") {
                $("#btUrl").parents(".form-group").hide();
                $("#btPerms").parents(".form-group").show();
                $("#btIcon").parents(".form-group").hide();
                $("#target").parents(".form-group").hide();
                $("input[name='visible']").parents(".form-group").hide();
				$(".is-refresh").hide();
            }
        }

        /*菜单管理-修改-选择菜单树*/
        function selectMenuTree() {
        	var menuId = $("#treeId").val();
        	if(menuId > 0) {
        		var url = prefix + "/selectMenuTree/" + menuId;
        		$.modal.open('[[#{ui.biz.page.menu.menuSelect}]]', url, '380', '380');
        	} else {
        		$.modal.alertError('[[#{ui.biz.alter.menu.noMenuChoose}]]');
        	}
        }
        
        function selectMenuTree() {
        	var menuId = $("#treeId").val();
        	if(menuId > 0) {
        		var url = prefix + "/selectMenuTree/" + menuId;
        		var options = {
       				title: '[[#{ui.biz.page.menuChoose.title}]]',
       				width: "380",
       				url: url,
       				callBack: doSubmit
       			};
       			$.modal.openOptions(options);
        	} else {
        		$.modal.alertError('[[#{ui.biz.alter.menu.noMenuChoose}]]');
        	}
		}
		
		function doSubmit(index, layero){
			var body = layer.getChildFrame('body', index);
   			$("#treeId").val(body.find('#treeId').val());
   			$("#treeName").val(body.find('#treeName').val());
   			layer.close(index);
		}
    </script>
</body>
</html>
