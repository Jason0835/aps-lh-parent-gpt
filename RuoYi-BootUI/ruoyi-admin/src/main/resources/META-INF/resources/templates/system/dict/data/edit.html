<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改字典数据')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-dict-edit" th:object="${dict}">
			<input name="dictCode"  type="hidden"  th:field="*{dictCode}" />
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">[[#{ui.data.column.dictdata.dictLabel}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="dictLabel" id="dictLabel" th:field="*{dictLabel}" required readonly="true">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">[[#{ui.data.column.dictdata.dictValue}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="dictValue" id="dictValue" th:field="*{dictValue}" required readonly="true">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.dict.code}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" readonly="true" th:field="*{dictType}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.dict.show.porperty}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" id="cssClass" name="cssClass" th:field="*{cssClass}">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label is-required">[[#{ui.data.column.show.index}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="dictSort" th:field="*{dictSort}" required>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.dict.show.style}]]：</label>
				<div class="col-sm-8">
					<select name="listClass" class="form-control m-b" th:with="type=${@dict.getType('sys_show_style')}" th:placeholder="#{ui.frame.combox.all}">
						<option value="">---[[#{ui.frame.combox.all}]]---</option>
						<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{listClass}"></option>
					</select>
	                <span class="help-block m-b-none"><i class="fa fa-info-circle"></i> [[#{ui.biz.page.dictdata.listClass.placeholder}]]</span>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.dictdata.isDefault}]]：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_yes_no')}">
						<input type="radio" th:id="${dict.dictCode}" name="isDefault" th:value="${dict.dictValue}" th:field="*{isDefault}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.state}]]：</label>
				<div class="col-sm-8">
					<div class="radio-box" th:each="dict : ${@dict.getType('sys_normal_disable')}">
						<input type="radio" th:id="${dict.dictCode}" name="status" th:value="${dict.dictValue}" th:field="*{status}">
						<label th:for="${dict.dictCode}" th:text="${dict.dictLabel}"></label>
					</div>
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-3 control-label ">[[#{ui.data.column.lang}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" name="locale" id="locale" th:field="*{locale}" >
				</div>
			</div>

			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
				<div class="col-sm-8">
					<textarea id="remark" name="remark" class="form-control">[[*{remark}]]</textarea>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
		var prefix = ctx + "system/dict/data";
	
		$("#form-dict-edit").validate({
			rules:{
				dictSort:{
					digits:true
				},
			},
			focusCleanup: true
		});
		
		function submitHandler() {
	        if ($.validate.form()) {
	        	$.operate.save(prefix + "/edit", $('#form-dict-edit').serialize());
	        }
	    }
	</script>
</body>
</html>
