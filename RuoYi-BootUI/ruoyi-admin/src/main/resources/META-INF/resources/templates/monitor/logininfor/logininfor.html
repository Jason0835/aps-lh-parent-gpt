<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('登录日志列表')" />
</head>
<body class="gray-bg">
	<div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="logininfor-form">
					<div class="select-list">
						<ul>
							<li>
								<label>[[#{ui.data.column.logininfo.ipaddr}]]：</label><input type="text" name="ipaddr"/>
							</li>
							<li>
								<label>[[#{ui.data.column.loginname}]]：</label><input type="text" name="loginName"/>
							</li>
							<li>
								<label>[[#{ui.data.column.logininfo.status}]]：</label><select name="status" th:with="type=${@dict.getType('sys_common_status')}">
									<option value="">[[#{ui.frame.select.select.all}]]</option>
									<option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
								</select>
							</li>
							<li class="select-time">
								<label>[[#{ui.data.column.logininfo.accessTime}]]： </label>
								<input type="text" class="time-input" id="startTime" th:placeholder="#{ui.data.column.time.start}" name="beginTime"/>
								<span>-</span>
								<input type="text" class="time-input" id="endTime" th:placeholder="#{ui.data.column.time.end}" name="endTime"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.name.search}]]</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.name.reset}]]</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
			<div class="btn-group-sm" id="toolbar" role="group">
				<a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="monitor:logininfor:remove">
		            <i class="fa fa-remove"></i> [[#{ui.frame.btn.name.del}]]
		        </a>
		        <a class="btn btn-danger" onclick="$.operate.clean()" shiro:hasPermission="monitor:logininfor:remove">
	                <i class="fa fa-trash"></i>  [[#{ui.frame.btn.name.clear}]]
	            </a>
<!--				<a class="btn btn-primary single disabled" onclick="unlock()" shiro:hasPermission="monitor:logininfor:unlock">-->
<!--					<i class="fa fa-unlock"></i> 解锁-->
<!--				</a>-->
	            <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="monitor:logininfor:export">
		            <i class="fa fa-download"></i> [[#{ui.frame.btn.name.export}]]
		        </a>
	        </div>
        
	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	
	<th:block th:include="include :: footer" />
	<script th:inline="javascript">
	    var datas = [[${@dict.getType('sys_common_status')}]];
		var prefix = ctx + "monitor/logininfor";
	
		$(function() {
		    var options = {
		        url: prefix + "/list",
		        cleanUrl: prefix + "/clean",
		        removeUrl: prefix + "/remove",
		        exportUrl: prefix + "/export",
		        sortName: "accessTime",
		        sortOrder: "desc",
		        modalName: [[#{ui.biz.page.logininfo.title}]],
		        escape: true,
		        showPageGo: true,
		        rememberSelected: true,
		        columns: [{
		        	field: 'state',
		            checkbox: true
		        },
		        {
		            field: 'infoId',
		            title: [[#{ui.data.column.logininfo.infoId}]]
		        },
		        {
		            field: 'userName',
		            title: [[#{ui.data.column.user.loginname}]],
		            sortable: true
		        },
		        {
		            field: 'ipaddr',
		            title: [[#{ui.data.column.logininfo.ipaddr}]]
		        },
		        // {
		        //     field: 'loginLocation',
		        //     title: [[#{ui.data.column.logininfo.loginLocation}]]
		        // },
		        // {
		        //     field: 'browser',
		        //     title: '浏览器'
		        // },
		        // {
		        //     field: 'os',
		        //     title: '操作系统'
		        // },
		        {
		            field: 'status',
		            title: [[#{ui.data.column.logininfo.status}]],
		            align: 'center',
		            formatter: function(value, row, index) {
		            	return $.table.selectDictLabel(datas, value);
		            }
		        },
		        {
		            field: 'msg',
		            title: [[#{ui.data.column.logininfo.msg}]]
		        },
		        {
		            field: 'accessTime',
		            title: [[#{ui.data.column.logininfo.accessTime}]],
		            sortable: true
		        }]
		    };
		    $.table.init(options);
		});
		
		// function unlock() {
        //     $.operate.post(prefix + "/unlock?loginName=" + $.table.selectColumns("loginName"));
        // }
	</script>
</body>
</html>
