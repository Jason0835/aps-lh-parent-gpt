<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('操作日志详细')" />
	<th:block th:include="include :: jsonview-css" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
	<form class="form-horizontal m-t" id="signupForm">
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.data.column.operlog.title}]]：</label>
			<div class="form-control-static" th:text="${operLog.title} + ' / ' + ${@dict.getLabel('sys_oper_type',operLog.businessType)}">
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.biz.page.operlog.logininfo}]]：</label>
			<div class="form-control-static" id="logininfo" th:text="${operLog.operName == null ? '' : operLog.operName}+ ${operLog.deptName == null ? '' : ' / '} + ${operLog.deptName == null ? '' : operLog.deptName} + ${operLog.operIp == null ? '' : ' / '} + ${operLog.operIp == null ? '' : operLog.operIp}+ ${operLog.operLocation == null ? '' : ' / '}+ ${operLog.operLocation == null ? '' : operLog.operLocation}">
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.data.column.operlog.operUrl}]]：</label>
			<div class="form-control-static" th:text="${operLog.operUrl}">
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.data.column.operlog.requestMethod}]]：</label>
			<div class="form-control-static" th:text="${operLog.requestMethod}">
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.data.column.operlog.method}]]：</label>
			<div class="form-control-static" th:text="${operLog.method}">
			</div>
		</div>
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.data.column.operlog.operParam}]]：</label>
			<div class="form-control-static"><pre id="operParam"></pre></div>
		</div>
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.data.column.operlog.jsonResult}]]：</label>
			<div class="form-control-static"><pre id="jsonResult"></pre></div>
		</div>
		<div class="form-group">
			<label class="col-sm-2 control-label">[[#{ui.data.column.state}]]：</label>

			<th:block th:with="dictObject = ${@dict.getOneDict('sys_runtime_status', operLog.status)}">
				<block th:if="${dictObject}">
					<div class="form-control-static"
						 th:class="@{'label label-'+${dictObject.listClass}}" th:text="${dictObject.dictLabel}">
					</div>
				</block>
				<block th:unless="${dictObject}">
					<div class="form-control-static"
						 th:class="label" th:text="${operLog.status}">
					</div>
				</block>
			</th:block>
		</div>
		<div class="form-group" th:style="'display:' + ${operLog.status == 0 ? 'none' : 'block'}">
			<label class="col-sm-2 control-label">[[#{ui.data.column.operlog.errorMsg}]]：</label>
			<div class="form-control-static" th:text="${operLog.errorMsg}">
			</div>
		</div>
	</form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: jsonview-js" />
    <script th:inline="javascript">
	    $(function() {
	    	var operParam = [[${operLog.operParam}]];
	    	if ($.common.isNotEmpty(operParam) && operParam.length < 2000) {
	    		$("#operParam").JSONView(operParam);
	    	} else {
	    		$("#operParam").text(operParam);
	    	}
	    	var jsonResult = [[${operLog.jsonResult}]];
	    	if ($.common.isNotEmpty(jsonResult) && jsonResult.length < 2000) {
	    		$("#jsonResult").JSONView(jsonResult);
	    	} else {
	    		$("#jsonResult").text(jsonResult);
	    	}
	    });
    </script>
</body>
</html>
