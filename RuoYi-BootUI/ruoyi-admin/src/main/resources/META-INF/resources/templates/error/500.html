<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RuoYi - 500</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/css/animate.css}" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
    <div class="middle-box text-center animated fadeInDown">
        <h1>500</h1>
        <h3 class="font-bold">[[#{ui.frame.page.err.msg.500}]]</h3>

        <div class="error-desc">
                                [[#{ui.frame.page.err.info.500}]]<br>
            [[${errorMessage}]]<br>
            <a href="javascript:index()" class="btn btn-primary m-t">[[#{ui.frame.btn.name.index}]]</a>
        </div>
    </div>
    <script th:inline="javascript">
      var ctx = [[@{/}]];
      function index() {
          window.top.location = ctx + "index";
      }
    </script>
</body>
</html>
