<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
	<th:block th:include="include :: header('在线用户列表')" />
</head>
<body class="gray-bg">
    <div class="container-div">
		<div class="row">
			<div class="col-sm-12 search-collapse">
				<form id="online-form">
					<div class="select-list">
						<ul>
							<li>
								[[#{ui.data.column.logininfo.ipaddr}]]：<input type="text" name="ipaddr"/>
							</li>
							<li>
								[[#{ui.data.column.loginname}]]：<input type="text" name="loginName"/>
							</li>
							<li>
								<a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.name.search}]]</a>
								<a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.name.reset}]]</a>
							</li>
						</ul>
					</div>
				</form>
			</div>
			
	        <div class="btn-group-sm" id="toolbar" role="group">
	            <a class="btn btn-danger multiple disabled" onclick="javascript:batchForceLogout()" shiro:hasPermission="monitor:online:batchForceLogout">
	                <i class="fa fa-sign-out"></i> [[#{ui.frame.btn.name.forcelogout}]]
	            </a>
	        </div>
	        
	        <div class="col-sm-12 select-table table-striped">
			    <table id="bootstrap-table"></table>
			</div>
		</div>
	</div>
	<th:block th:include="include :: footer" />
	<th:block th:include="include :: bootstrap-table-export-js" />
	<script th:inline="javascript">
		var forceFlag = [[${@permission.hasPermi('monitor:online:forceLogout')}]];
		var prefix = ctx + "monitor/online";

		$(function() {
		    var options = {
		    	uniqueId: "sessionId",
		        url: prefix + "/list",
		        exportUrl: prefix + "/export",
		        sortName: "lastAccessTime",
		        sortOrder: "desc",
		        showExport: true,
		        escape: true,
		        columns: [{
		            checkbox: true
		        },
		        {
                    title: [[#{ui.data.column.index}]],
                    formatter: function (value, row, index) {
                 	    return $.table.serialNumber(index);
                    }
                },
		        {
		            field: 'sessionId',
		            title: [[#{ui.data.column.online.sessionId}]],
		            formatter: function(value, row, index) {
                    	return $.table.tooltip(value);
                    }
		        },
		        {
		            field: 'userName',
		            title: [[#{ui.data.column.user.loginname}]],
		            sortable: true
		        },
		        {
		            field: 'deptName',
		            title: [[#{ui.data.column.user.dept}]]
		        },
		        {
		            field: 'ipaddr',
		            title: [[#{ui.data.column.online.ipaddr}]]
		        },
		        {
		            field: 'loginLocation',
		            title: [[#{ui.data.column.logininfo.loginLocation}]]
		        },
		        // {
		        //     field: 'browser',
		        //     title: '浏览器'
		        // },
		        // {
		        //     field: 'os',
		        //     title: '操作系统'
		        // },
		        // {
		        //     field: 'status',
		        //     title: '会话状态',
		        //     align: 'center',
		        //     formatter: function(value, row, index) {
		        //         if (value == 'on_line') {
		        //             return '<span class="badge badge-primary">[[#{ui.frame.btn.user.state.online}]]</span>';
		        //         } else if (value == 'off_line') {
		        //             return '<span class="badge badge-danger">离线</span>';
		        //         }
		        //     }
		        // },
		        {
		            field: 'loginTime',
		            title: [[#{ui.data.column.logininfo.accessTime}]],
		            sortable: true
		        },
		        {
		            field: 'lastAccessTime',
		            title: [[#{ui.data.column.online.lastAccessTime}]],
		            sortable: true
		        },
		        {
		            title: [[#{ui.frame.btn.name.oper}]],
		            align: 'center',
		            formatter: function(value, row, index) {
		                var msg = '<a class="btn btn-danger btn-xs ' + forceFlag + '" href="javascript:void(0)" onclick="forceLogout(\'' + row.sessionId + '\')"><i class="fa fa-sign-out"></i>'+[[#{ui.frame.btn.name.forcelogout}]]+'</a> ';
		                return msg;
		            }
		        }]
		    };
		    $.table.init(options);
		});

		// 单条强退
		function forceLogout(sessionId) {
		    $.modal.confirm([[#{ui.biz.alter.isLogoutSelectUser}]], function() {
		    	var data = { "ids": sessionId };
		        $.operate.post(prefix + "/batchForceLogout", data);
		    })
		}

		// 批量强退
		function batchForceLogout() {
		    var rows = $.table.selectColumns("loginTime");
		    if (rows.length == 0) {
		        $.modal.alertWarning([[#{ui.biz.alter.selectLogoutUser}]]);
		        return;
		    }

			var info = String.format([[#{ui.biz.alter.isLogoutSelected}]],rows.length);
		    $.modal.confirm(info, function() {
		        var url = prefix + "/batchForceLogout";

				var rows = $.table.selectColumns("sessionId");
		        var data = { "ids": rows.join() };
		        $.operate.post(url, data);
		    });
		}
	</script>
</body>
</html>
