<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
	<th:block th:include="include :: header('修改用户密码')" />
</head>
<body class="white-bg">
	<div class="wrapper wrapper-content animated fadeInRight ibox-content">
		<form class="form-horizontal m" id="form-user-resetPwd">
			<input name="userId"  type="hidden"  th:value="${user.userId}" />
			<input id="passwordMinLength" th:value="${passwordMinLength}" type="hidden">
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.loginname}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="text" readonly="true" name="loginName" th:value="${user.userName}"/>
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.user.oldPwd}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="password" name="oldPassword" id="oldPassword">
				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.user.newPwd}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="password" name="newPassword" id="newPassword">
<!--TODO:I18N-->
					<th:block ><i class="fa fa-info-circle" style="color: red;"></i>  <span th:text="${passwordTip}"></span> </th:block>
<!--					<th:block th:with="chrtype=${@ryConfig.getKey('sys.account.chrtype')}">-->
<!--						<th:block th:if="${chrtype != '0'}">-->
<!--                            <span class="help-block m-b-none">-->
<!--                                <th:block th:if="${chrtype == '1'}"><i class="fa fa-info-circle" style="color: red;"></i>  密码只能为0-9数字 </th:block>-->
<!--                                <th:block th:if="${chrtype == '2'}"><i class="fa fa-info-circle" style="color: red;"></i>  密码只能为a-z和A-Z字母</th:block>-->
<!--                                <th:block th:if="${chrtype == '3'}"><i class="fa fa-info-circle" style="color: red;"></i>  密码必须包含（字母，数字）</th:block>-->
<!--                                <th:block th:if="${chrtype == '4'}"><i class="fa fa-info-circle" style="color: red;"></i>  密码必须包含（字母，数字，特殊字符!@#$%^&*()-=_+）</th:block>-->
<!--                            </span>-->
<!--						</th:block>-->
<!--					</th:block>-->

				</div>
			</div>
			<div class="form-group">
				<label class="col-sm-3 control-label">[[#{ui.data.column.user.confPwd}]]：</label>
				<div class="col-sm-8">
					<input class="form-control" type="password" name="confirmPassword" id="confirmPassword">
					<span class="help-block m-b-none"><i class="fa fa-info-circle"></i> [[#{ui.data.column.user.checknewPwd.placeholder}]]</span>
				</div>
			</div>
		</form>
	</div>
	<th:block th:include="include :: footer" />

	<script th:inline="javascript">
		$("#form-user-resetPwd").validate({
			rules:{
				oldPassword:{
					required:true,
					remote: {
	                    url: ctx + "system/user/profile/checkPassword",
	                    type: "get",
	                    dataType: "json",
	                    data: {
	                        password: function() {
	                            return $("input[name='oldPassword']").val();
	                        }
	                    }
	                }
				},
				newPassword: {
	                required: true,
	                minlength: $("#passwordMinLength").val(),
	    			maxlength: 20
	            },
	            confirmPassword: {
	                required: true,
	                equalTo: "#newPassword"
	            }
			},
			messages: {
	            oldPassword: {
	                required: [[#{ui.data.column.user.oldPwd.placeholder}]],
	                remote: '[[#{ui.biz.user.checkOldPwd.fail}]]'
	            },
	            confirmPassword: {
	                required: [[#{ui.data.column.user.checknewPwd.placeholder}]],
	                equalTo: [[#{ui.biz.user.checkTwoPwd}]]
	            }

	        },
	        focusCleanup: true
		});
		
		function submitHandler() {
            var chrtype = [[${#strings.defaultString(@ryConfig.getKey('sys.account.chrtype'), 0)}]];
			var password = $("#newPassword").val();
	        if ($.validate.form() && checkpwd(chrtype, password)) {
	        	$.operate.save(ctx + "system/user/profile/resetPwd", $('#form-user-resetPwd').serialize());
	        }
	    }
	</script>
</body>

</html>
