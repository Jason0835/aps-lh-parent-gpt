<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改密炼机常用大规格设置')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-glueCommonDemand-edit" th:object="${glueCommonDemand}">
            <input id="id" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{setting.glueCommonDemand.mixArea}]]：</label>
                <div class="col-sm-8">
	                <select id="mixArea" class="form-control" name="mixArea" th:with="type=${@dict.getType('MIX_AREA')}" onchange="getMachines()" required>
	                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
	                            th:value="${dict.dictValue}" th:field="*{mixArea}"></option>
	                </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{setting.glueCommonDemand.machineCode}]]：</label>
                <div class="col-sm-8">
	                <select id="machineCode" name="machineCode" class="form-control" required>
	                </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{setting.glueCommonDemand.glue}]]：</label>
                <div class="col-sm-8">
                    <input name="glue" th:field="*{glue}" class="form-control GlueNames" type="text" maxlength="16" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}"  maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
	<th:block th:include="include :: bootstrap-suggest-js"/>
	<th:block th:include="include :: bootstrap-typeahead-js"/>
    <script th:inline="javascript">
        var prefix = ctx + "setting/glueCommonDemand";
	    //获取胶料名称列表
	    var datas = [[${@setting.getFinalGlueNames()}]];
	    $('.GlueNames').typeahead({
	        source: datas,
	        autoSelect: false,
	    });
	    
	    $(function () {
	        getMachines();
    	});
	    
	    /* 获取机台下拉框 */
	    function getMachines(){
	        var mixArea=$("#mixArea").val();
	        if ($.common.isEmpty(mixArea)) {
	            var $machineCode = $("#machineCode");
	            $machineCode.empty();
	            $machineCode.append("<option value='' disabled>" + [[#{ui.message.filterMachine.errorWhileGetMachine}]] + "</option>");
	            return ;
	        }
	        var config = {
	            url: "/setting/machine/getMachines",
	            type: "post",
	            dataType: "json",
	            data: {"mixArea": mixArea},
	            success: function (result) {
	                if (result.code === web_status.SUCCESS){
	                    var machines = result.data;
	                    var rSelect = "<option value=''> </option>";
	                    var select = [[${glueCommonDemand.machineCode}]] + "";
	                    var selets = select.split(",");
	                    for(var i = 0; i < machines.length; i++){
	                        for(var key in selets){
	                            if(selets[key] === machines[i].machineCode){
	                                machines[i].isSelected = true;
	                            }
	                        }
	                    }
	                    for (var j = 0; j < machines.length; j++) {
	                        if (machines[j].isSelected){
	                            rSelect += ("<option value = '"+machines[j].machineCode+"' selected>"+machines[j].machineName+"</option>");
	                        }else {
	                            rSelect += ("<option value = '"+machines[j].machineCode+"'>"+machines[j].machineName+"</option>");
	                        }
	                    }
	                    var $machineCode = $("#machineCode");
	                    $machineCode.empty();
	                    $machineCode.append(rSelect);
	                } else {
	                    $.modal.alertWarning(result.msg);
	                }
	            }
	        };
	        $.ajax(config)
	    }
        
	    function submitHandler() {
	        if ($.validate.form()) {
	            if ($("#id").val() == null || $("#id").val() == '') {
	                $.operate.save(prefix + "/save", $('#form-glueCommonDemand-edit').serialize());
	            } else {
	                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-glueCommonDemand-edit').serializeArray());
	            }
	        }
	    }
    </script>
</body>
</html>
