<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('炼胶时间信息列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{setting.glueFinish.orderNo}]]：</label>
                            <input id="orderNo" type="text" name="orderNo"/>
                        </li>
                        <li>
                            <label>[[#{setting.glueFinish.scheduleDate}]]：</label>
                            <input id="scheduleDate" type="text" class="time-input" placeholder="yyyy-MM-dd"
                                   name="scheduleDate"/>
                        </li>
                        <li>
                            <label>[[#{setting.glueFinish.mixArea}]]：</label>
                            <select class="form-control" name="mixArea" th:with="type=${@dict.getType('MIX_AREA')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{setting.glueFinish.glue}]]：</label>
                            <div class="neat">
                                <input type="text" name="glue" class="GlueNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="setting:glueFinish:import">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="setting:glueFinish:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
    // var machineNameList = [[${@setting.getMachineInfo()}]];
    var prefix = ctx + "setting/glueFinish";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });


    $(function () {
        var options = {
            url: prefix + "/list",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{setting.glueFinish.modelName}]],
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: [[#{setting.glueFinish.id}]],
                    halign: 'center',
                    align: 'center',
                    visible: false
                },
                {
                    field: 'orderNo',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 13,
                    title: [[#{setting.glueFinish.orderNo}]],
                },
                {
                    field: 'scheduleDate',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 15,
                    title: [[#{setting.glueFinish.scheduleDate}]],
                },

                {
                    field: 'mixArea',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 15,
                    title: [[#{setting.glueFinish.mixArea}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(mixAreaDatas, value);
                    }
                },
                {
                    field: 'glue',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 15,
                    title: [[#{setting.glueFinish.glue}]],
                },
                {
                    field: 'machineName',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 15,
                    title: [[#{setting.glueFinish.machineCode}]],
                    // formatter: function (value, row, index) {
                    //     if ($.common.isEmpty(value)) {
                    //         var actions = [];
                    //         return actions.join('');
                    //     }
                    //     return selectMachineName(machineNameList, value, row);
                    // },
                },
                {
                    field: 'totalFinishQty',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.glueFinish.totalFinishQty}]],
                },
                {
                    field: 'midFinishQty',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.glueFinish.midFinishQty}]],
                },
                {
                    field: 'nightFinishQty',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.glueFinish.nightFinishQty}]],
                },
                {
                    field: 'dayFinishQty',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.glueFinish.dayFinishQty}]],
                }]
        };
        $.table.init(options);
    });


    //回显机台名称
    // function selectMachineName(datas, value, row) {
    //     if ($.common.isEmpty(datas)) {
    //         return '';
    //     }
    //     var actions = [];
    //     $.each(datas, function (index, dict) {
    //         if (dict.machineCode == (value) && dict.mixArea == row.mixArea) {
    //             var machineName = $.common.equals("default", dict.machineName) || $.common.isEmpty(dict.machineName) ? "" : dict.machineName;
    //             actions.push($.common.sprintf("<span>%s</span>", machineName, dict.machineName));
    //             return false;
    //         }
    //     });
    //     return actions.join(',');
    // }


    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
