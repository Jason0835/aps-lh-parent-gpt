<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改返回胶日返回率')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-fhGlueRate-edit" th:object="${fhGlueReturnRate}">
            <input id="id" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{setting.fhGlueRate.mixArea}]]：</label>
                <div class="col-sm-8">
	                <select name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"  required="true">
	                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
	                            th:field="*{mixArea}"></option>
	                </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{setting.fhGlueRate.glue}]]：</label>
                <div class="col-sm-8">
	                <input name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off" type="text"
	                       required="true" maxlength="30">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{setting.fhGlueRate.returnRate}]]：</label>
                <div class="col-sm-8">
                    <input name="returnRate" th:field="*{returnRate}"  class="form-control" type="text"  number="true" required="true"
                    	min="0" max="9999">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}"  maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "setting/fhGlueRate";
        
	    //获取胶料名称列表
	    var datas = [[${@setting.getGlueNames()}]];
	    $('.GlueNames').typeahead({
	        source: datas,
	        autoSelect: false,
	    });
	    
        $("#form-fhGlueRate-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
	            if ($("#id").val() == null || $("#id").val() == '') {
                	$.operate.save(prefix + "/save", $('#form-fhGlueRate-edit').serialize());
	            } else {
	                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-fhGlueRate-edit').serializeArray());
	            }
            }
        }
    </script>
</body>
</html>
