<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('密炼机指定胶料分解列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{setting.machineGlueDecompose.glue}]]：</label>
                            <div class="neat">
                                <input type="text" name="glue" class="GlueNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <label>[[#{setting.machineGlueDecompose.mixArea}]]：</label>
                            <select class="form-control" id="mixArea" name="mixArea"
                                    th:with="type=${@dict.getType('MIX_AREA')}"
                                    onchange="getMachines()">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{setting.machineGlueDecompose.machineName2}]]：</label>
                            <select class="form-control" id="machineCode" name="machineCode" th:with="type=${machines}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="item : ${type}" th:text="${item.machineName}"
                                        th:value="${item.machineCode}"></option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="myReset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="setting:machineGlueDecompose:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit()"
               shiro:hasPermission="setting:machineGlueDecompose:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="setting:machineGlueDecompose:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
            <a class="btn btn-info" onclick="$.table.importExcel()"
               shiro:hasPermission="setting:machineGlueDecompose:import">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="setting:machineGlueDecompose:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('setting:machineGlueDecompose:edit')}]];
    var removeFlag = [[${@permission.hasPermi('setting:machineGlueDecompose:remove')}]];
    var prefix = ctx + "setting/machineGlueDecompose";
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    $(function () {
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{setting.machineGlueDecompose.modelName}]],
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.id}]],
                    visible: false
                },
                {
                    field: 'mixArea',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.mixArea}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(mixAreaDatas, value);
                    }
                },
                {
                    field: 'machineCode',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.machineCode}]],
                },
                {
                    field: 'machineName',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.machineName}]],
                },
                {
                    field: 'glue',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.glue}]],
                },
                {
                    field: 'motherGlue1',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue1}]],
                },
                {
                    field: 'motherGlue2',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue2}]],
                },
                {
                    field: 'motherGlue3',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue3}]],
                },
                {
                    field: 'motherGlue4',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue4}]],
                },
                {
                    field: 'motherGlue5',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue5}]],
                },
                {
                    field: 'motherGlue6',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue6}]],
                },
                {
                    field: 'motherGlue7',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue7}]],
                },
                {
                    field: 'motherGlue8',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue8}]],
                },
                {
                    field: 'motherGlue9',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.machineGlueDecompose.motherGlue9}]],
                },
                {
                    field: 'remark',
                    sortable: true,
                    title: [[#{ui.common.column.remark}]],
                    halign: 'center',
                    align: 'left',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                    title: [[#{setting.machineGlueDecompose.remark}]],
                },
                {
                    title: [[#{ui.data.btn.option}]],
                    align: 'center',
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });

    //解决点击重置按钮的密炼机还是存在上一次密炼区的列表项
    function myReset() {
        $.form.reset();
        getMachines();
    }

    //获取机台下拉框
    function getMachines() {
        var mixArea = $("#mixArea").val();
        if ($.common.isEmpty(mixArea)) {
            var rSelect = ("<option value = ''>" + [[#{ui.frame.btn.all}]] + "</option>");
            $("#machineCode").empty();
            $("#machineCode").append(rSelect);
            return;
        }
        var config = {
            url: "/setting/machine/getMachines",
            type: "post",
            dataType: "json",
            data: {"mixArea": mixArea},
            success: function (result) {
                if (result.code == web_status.SUCCESS) {
                    var machines = result.data;
                    var rSelect = ("<option value = ''>" + [[#{ui.frame.btn.all}]] + "</option>");
                    for (var i = 0; i < machines.length; i++) {
                        rSelect += ("<option value = '" + machines[i].machineCode + "'>" + machines[i].machineName + "</option>");
                    }
                    $("#machineCode").empty();
                    $("#machineCode").append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }


    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
