<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('硫磺辅料库存信息列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li class="select-time">
                            <label>[[#{setting.lhflGlueStock.stockDate}]]：</label>
                            <input type="text" class="time-input" id="stockDate"
                                   th:placeholder="yyyy-mm-dd" name="stockDate"/>
                        </li>
                        <li>
                            <label>[[#{setting.lhflGlueStock.mixArea}]]：</label>
                            <select class="form-control" name="mixArea" th:with="type=${@dict.getType('MIX_AREA')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{setting.lhflGlueStock.materialName}]]：</label>
                            <div class="neat">
                                <input type="text" name="materialName" class="AccessoriesNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
<!--            <a class="btn btn-success" onclick="$.operate.add('',600)" shiro:hasPermission="setting:lhflGlueStock:add">-->
<!--                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]-->
<!--            </a>-->
<!--            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',600)"-->
<!--               shiro:hasPermission="setting:lhflGlueStock:edit">-->
<!--                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]-->
<!--            </a>-->
<!--            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"-->
<!--               shiro:hasPermission="setting:lhflGlueStock:remove">-->
<!--                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]-->
<!--            </a>-->
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="setting:lhflGlueStock:import">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="setting:lhflGlueStock:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('setting:lhflGlueStock:edit')}]];
    var removeFlag = [[${@permission.hasPermi('setting:lhflGlueStock:remove')}]];
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
    var prefix = ctx + "setting/lhflGlueStock";

    //获取辅料名称列表
    var datas = [[${@setting.getAccessoriesNames()}]];
    $('.AccessoriesNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    $(function () {
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{setting.lhflGlueStock.modelName}]],
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: [[#{setting.lhflGlueStock.id}]],
                    visible: false
                },
                {
                    field: 'stockDate',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.lhflGlueStock.stockDate}]],
                },
                {
                    field: 'barCode',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                    title: [[#{setting.lhflGlueStock.barCode}]],
                },
                {
                    field: 'validTime',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.lhflGlueStock.validTime}]],
                },
                {
                    field: 'mixArea',
                    halign: 'center',
                    align: 'center',
                    sortable: true,
                    title: [[#{setting.lhflGlueStock.mixArea}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(mixAreaDatas, value);
                    }
                },
                {
                    field: 'materialName',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.lhflGlueStock.materialName}]],
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                },
                {
                    field: 'stockNum',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    title: [[#{setting.lhflGlueStock.stockNum}]],
                },
                {
                    field: 'stockWeight',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    title: [[#{setting.lhflGlueStock.stockWeight}]],
                },
                {
                    field: 'remark',
                    sortable: true,
                    halign: 'center',
                    title: [[#{ui.common.column.remark}]],
                    align: 'left',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                },
                // {
                //     title: [[#{ui.data.btn.option}]],
                //     align: 'center',
                //     formatter: function (value, row, index) {
                //         var actions = [];
                //         actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\',600)"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                //         actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                //         return actions.join('');
                //     }
                // }
                ]
        };
        $.table.init(options);
    });

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isOverwriteExistStock}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
