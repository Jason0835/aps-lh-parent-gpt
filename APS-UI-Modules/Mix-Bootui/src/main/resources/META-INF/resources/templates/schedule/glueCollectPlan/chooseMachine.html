<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('汇总胶料需求计划选机台')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-glueCollectPlan-edit" th:object="${glueCollectPlan}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <input id="glue" name="glue" th:field="*{glue}" type="hidden">
        <input id="mixArea" name="mixArea" th:field="*{mixArea}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.glueCollectPlan.machineCode}]]：</label>
            <div class="col-sm-8">
                <select id="machineCode" name="machineCode" class="form-control" required>
                </select>
            </div>
        </div>

    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/glueCollectPlan";

    $("#form-glueCollectPlan-edit").validate({
        focusCleanup: true
    });

    $(function () {
        getMachines();
    });

    function submitHandler() {
        if ($.validate.form()) {
            var fromData = $('#form-glueCollectPlan-edit').serializeArray();
            $.operate.saveNoRefresh(prefix + "/chooseMachine", fromData, updateParentCell);
        }
    }

    function updateParentCell(result) {
        if (result.code == web_status.SUCCESS) {
            var id = $("#id").val();
            var machineCode = $("#machineCode option:selected").val();
            var parent = window.parent;
            parent.$("#" + parent.table.options.id).bootstrapTable('updateCellByUniqueId', {
                id: id,
                field: "machineCode",
                value: machineCode
            });
        }
    }

    //获取机台下拉框
    function getMachines(){
        var mixArea=$("#mixArea").val();
        var glue = $("#glue").val();
        if ($.common.isEmpty(glue) || $.common.isEmpty(mixArea)) {
            var $machineCode = $("#machineCode");
            $machineCode.empty();
            $machineCode.append("<option value='' disabled>" + [[#{ui.message.filterMachine.mixAreaAndGlueNotNull}]] + "</option>");
            return ;
        }
        var config = {
            url: "/setting/formulaMachine/getFormulaMachineList",
            type: "post",
            dataType: "json",
            data: {"mixArea": mixArea, "glue": glue},
            success: function (result) {
                if (result.code === web_status.SUCCESS){
                    var machines=result.data;
                    var rSelect = '';
                    rSelect += "<option value='' disabled selected>" + [[#{ui.frame.btn.choose}]] + "</option>";
                    for (var j = 0; j < machines.length; j++) {
                        rSelect += ("<option value = '"+machines[j].machineCode+"'>"+machines[j].machineName+"</option>");
                    }
                    if ($.common.isEmpty(rSelect)) {
                        rSelect = "<option value='' disabled>" + [[#{ui.message.filterMachine.noGlueMachine}]] + "</option>";
                    }
                    var $machineCode = $("#machineCode");
                    $machineCode.empty();
                    $machineCode.append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }
</script>
</body>
</html>
