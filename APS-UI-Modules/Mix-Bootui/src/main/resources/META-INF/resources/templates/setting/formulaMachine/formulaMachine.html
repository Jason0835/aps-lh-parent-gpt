<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('配方与机台对应列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-editable-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{setting.formulaMachine.glue}]]：</label>
                            <div class="neat">
                                <input type="text" name="glue" class="GlueNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <label>[[#{setting.formulaMachine.mixArea}]]：</label>
                            <select class="form-control" name="mixArea" th:with="type=${@dict.getType('MIX_AREA')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add('',500)" shiro:hasPermission="setting:formulaMachine:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',500)"
               shiro:hasPermission="setting:formulaMachine:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="setting:formulaMachine:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="setting:formulaMachine:import">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="setting:formulaMachine:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-reorderable-columns="true"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<!--<th:block th:include="include :: bootstrap-table-fixed-columns-js"/>-->
<!--<th:block th:include="include :: bootstrap-table-editable-js" />-->
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('setting:formulaMachine:edit')}]];
    var removeFlag = [[${@permission.hasPermi('setting:formulaMachine:remove')}]];
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
    var prefix = ctx + "setting/formulaMachine";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    $(function () {
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{setting.formulaMachine.modelName}]],
            columns: [{
                checkbox: true,
                widthUnit: '%',
                width: 3,
            },
                {
                    field: 'id',
                    title: 'ID',
                    halign: 'center',
                    align: 'center',
                    visible: false,
                    widthUnit: '%',
                    width: 2,
                },
                {
                    field: 'mixArea',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.formulaMachine.mixArea}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(mixAreaDatas, value);
                    }
                },
                {
                    field: 'glue',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 25,
                    title: [[#{setting.formulaMachine.glue}]],
                },
                {
                    field: 'machineName',
                    sortable: true,
                    halign: 'center',
                    align: 'left',
                    widthUnit: '%',
                    width: 25,
                    title: [[#{setting.formulaMachine.machineCode}]],
                    formatter: function (value, row, index) {
                        if ($.common.isEmpty(value)) {
                            return value;
                        }
                        var machineArr = String(value).split(",");
                        var action = [];
                        for (let i = 0; i < machineArr.length; i++) {
                            action.push($.common.sprintf("<span class=\"badge badge-primary\">%s</span>  ", machineArr[i]))
                        }
                        return action.join("");
                    },
                },
                {
                    field: 'remark',
                    sortable: true,
                    title: [[#{ui.common.column.remark}]],
                    halign: 'center',
                    align: 'left',
                    widthUnit: '%',
                    width: 20,
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                },
                {
                    title: [[#{ui.data.btn.option}]],
                    align: 'center',
                    widthUnit: '%',
                    width: 15,
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\',500)"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });


    // function edit2 (mixAreaAndGlue) {
    //     // if($.common.isEmpty(id) && table.options.type == table_type.bootstrapTreeTable) {
    //     //     var row = $("#" + table.options.id).bootstrapTreeTable('getSelections')[0];
    //     //     if ($.common.isEmpty(row)) {
    //     //         $.modal.alertWarning(frame.alter.mustChooseOneRecord);
    //     //         return;
    //     //     }
    //         var url = table.options.updateUrl.replace("{mixAreaAndGlue}", mixAreaAndGlue);
    //         $.modal.open(frame.btn.modify + table.options.modalName, url,500,500);
    //     // }
    // }

    //回显机台名称
    // function selectMachineName(datas, value, row) {
    //     if ($.common.isEmpty(datas)) {
    //         return '';
    //     }
    //     var actions = [];
    //     var arr = value.split(",");
    //     $.each(datas, function (index, dict) {
    //         $.each(arr, function (index, item) {
    //             if (dict.machineCode == (item) && dict.mixArea == row.mixArea) {
    //
    //                 var machineName = $.common.equals("default", dict.machineName) || $.common.isEmpty(dict.machineName) ? "" : dict.machineName;
    //                 actions.push($.common.sprintf("<span>%s</span>", machineName, dict.machineName));
    //                 return false;
    //             }
    //         })
    //     });
    //     return actions.join(',');
    // }


    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <span id="updateSupport" name="updateSupport"></span>
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
