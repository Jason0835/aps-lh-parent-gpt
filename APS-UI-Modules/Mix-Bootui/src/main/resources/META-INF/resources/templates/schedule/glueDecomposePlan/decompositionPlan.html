<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('分解计划')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-glueDecomposePlan-decompositionPlan">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.glueDecomposePlan.planDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group">
                    <input id="planDate" name="planDate" class="form-control time-input" placeholder="yyyy-MM-dd" type="text"
                           th:value="${initDate}" required>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.glueDecomposePlan.mixArea}]]：</label>
            <div class="col-sm-8">
                <select id="mixArea" class="form-control" name="mixArea" th:with="type=${@setting.scheduleMixAreaPermission()}"
                        required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                            th:value="${dict.dictValue}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/glueDecomposePlan";
    $("#form-glueDecomposePlan-decompositionPlan").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.ajax({
                url: prefix + "/checkPlanDateAndMixAreaExist",
                type: "post",
                dataType: "json",
                data: {
                    "planDate": $("#planDate").val(),
                    "mixArea": $("#mixArea").val(),
                },
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        if (result.msg == '1') {
                            $.modal.confirm([[#{schedule.glueDecomposePlan.database.exist.tip}]], function () {
                                submitData();
                            })
                        } else if (result.msg == '0') {
                            submitData();
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            });
        }
    }

    function submitData() {
        //清空父级搜索，并设置日期
        window.parent.$('#glue').val('');
        window.parent.$('#mixArea').val($("#mixArea").val());
        window.parent.$("#planDate").val($("#planDate").val());

        //设置密炼区目前选中的显示
        let mixAreaText = window.parent.$('#mixArea').find("option:selected").text();
        window.parent.$('#select2-mixArea-container').text(mixAreaText);
        window.parent.changeMixArea();

        $.operate.save(prefix + "/decompositionPlan", $('#form-glueDecomposePlan-decompositionPlan').serialize());
    }
</script>
</body>
</html>
