<!DOCTYPE html>

<script th:inline="javascript">
    var prefix = ctx + "schedule/glueScheduleResult";
    $("#form-glueScheduleResult-edit").validate({
        focusCleanup: true
    });

    $(function () {
        var $midFinishRate = $("#midFinishRate");
        var midFinishRate = $midFinishRate.val();
        var midStr = Number(midFinishRate * 100).toFixed(2) + "%";
        $midFinishRate.val(midStr);
        var $nightFinishRate = $("#nightFinishRate");
        var nightFinishRate = $nightFinishRate.val();
        var nightStr = Number(nightFinishRate * 100).toFixed(2) + "%";
        $nightFinishRate.val(nightStr);
        var $dayFinishRate = $("#dayFinishRate");
        var dayFinishRate = $dayFinishRate.val();
        var dayStr = Number(dayFinishRate * 100).toFixed(2) + "%";
        $dayFinishRate.val(dayStr);
    });

    function submitHandler() {
        // 提交前校验
        updateMidPlanQty();
        updateNightPlanQty();
        updateDayPlanQty();
        if ($.validate.form()) {
            var serializeArray = $('#form-glueScheduleResult-edit').serializeArray();
            var yseStr = [[#{schedule.glueCollectPlan.isFinishing.yes}]];
            var notStr = [[#{schedule.glueCollectPlan.isFinishing.not}]];
            var parent = window.parent;
            let tableData = parent.$("#" + parent.table.options.id).bootstrapTable('getData');
            // 校验当前机台下，各个班次顺序是否与修改的有重复
            let isRepeated = isProduceOrderRepeated(tableData);
            if (isRepeated) {
                return ;
            }
            
            var isChangeMasterbatch = parent.$("#isChangeMasterbatch").val() == "1";
            if (!isChangeMasterbatch) {
            	// 如果参数配置不启用级联，则直接使用非级联提交即可
                submitHandlerNoCascade(serializeArray);
                return;
            }
            
            layer.confirm([[#{ui.message.isChangeMasterbatch}]], {
                icon: 3,
                title: frame.title.sysAlter,
                btn: [yseStr, notStr, frame.btn.cancel]
                ,btn3: function(index, layero){
                    // 点击取消后回调
                }
            }, function (index, layero) {
                // 点击是后回调
                serializeArray.push({name: 'isChangeMasterbatch', value: true});
                $.operate.saveUpdateParentRow(prefix + "/save", serializeArray, function (result) {
                    if (result.code === web_status.SUCCESS) {
                        var parent = window.parent;
                        var data = result.data;
                        for (var i = 0; i < data.length; i++) {
                            if (data[i].isAddNew && !parent.$("input[name=isFilterNoMachine]").is(":checked")) {
                                parent.$('#' + parent.table.options.id).bootstrapTable('append', data[i]);
                            }else {
                                parent.$("#" + parent.table.options.id).bootstrapTable('updateByUniqueId', {
                                    id: data[i].id,
                                    row: data[i]
                                });
                            }
                        }
                    }
                });
                layer.close(index);
            },function (index, layero) {
                // 点击否后回调
                submitHandlerNoCascade(serializeArray);
                layer.close(index);
            });
        }
    }
    
    // 非级联提交
    function submitHandlerNoCascade(serializeArray) {
        serializeArray.push({name: 'isChangeMasterbatch', value: false});
        $.operate.saveUpdateParentRow(prefix + "/save", serializeArray, function (result) {
            if (result.code === web_status.SUCCESS) {
                var parent = window.parent;
                var data = result.data;
                for (var i = 0; i < data.length; i++) {
                    parent.$("#" + parent.table.options.id).bootstrapTable('updateByUniqueId', {
                        id: data[i].id,
                        row: data[i]
                    });
                }
            }
        });
    }

    // 更改对应班次计划量后总计划量同步更改
    function changeQty() {
        var midPlanQty = Number($("#midPlanQty").val());
        var nightPlanQty = Number($("#nightPlanQty").val());
        var dayPlanQty = Number($("#dayPlanQty").val());
        var totalPlanQty = midPlanQty + nightPlanQty + dayPlanQty;
        var $totalPlanQty = $("#totalPlanQty");
        let $totalSurplus = $("#totalSurplus");
        var oldProductQty = Number($totalPlanQty.val()) + Number($totalSurplus.val());
        $totalPlanQty.val(totalPlanQty);
        if (totalPlanQty <= oldProductQty) {
            $totalSurplus.val(oldProductQty - totalPlanQty);
        }
        var midFinishQty = Number($("#midFinishQty").val());
        var nightFinishQty = Number($("#nightFinishQty").val());
        var dayFinishQty = Number($("#dayFinishQty").val());
        if (midPlanQty !== 0) {
            $("#midFinishRate").val(Number(midFinishQty / midPlanQty * 100).toFixed(2) + "%");
        }
        if (nightPlanQty !== 0) {
            $("#nightFinishRate").val(Number(nightFinishQty / nightPlanQty * 100).toFixed(2) + "%");
        }
        if (dayPlanQty !== 0) {
            $("#dayFinishRate").val(Number(dayFinishQty / dayPlanQty * 100).toFixed(2) + "%");
        }
    }

    /**
     * 更新中班计划量后判断是否要添加顺序必填
     */
    function updateMidPlanQty() {
        var $midProduceOrder = $("#midProduceOrder");
        var $midProduceOrderLabel = $("#midProduceOrderLabel");
        $midProduceOrder.removeAttr("required");
        $midProduceOrderLabel.removeClass("is-required")
        if ($("#midPlanQty").val() > 0) {
            $midProduceOrder.attr("required", "true");
            $midProduceOrderLabel.addClass("is-required");
        }
        changeQty();
    }

    /**
     * 更新夜班计划量后判断是否要添加顺序必填
     */

    // 校验当前机台下，各个班次顺序是否与修改的有重复
    function isProduceOrderRepeated(tableData) {
        let machineName = $("#machineName").val();
        let id = $("#id").val();
        let filterData = tableData.filter(item => item.machineName === machineName && item.id != id);
        let midProduceOrderMap = filterData.map(item => item.midProduceOrder);
        let midProduceOrder = $("#midProduceOrder").val();
        if ($.common.isNotEmpty(midProduceOrder)) {
            for (var i = 0; i < midProduceOrderMap.length; i++) {
                if (midProduceOrderMap[i] == midProduceOrder) {
                    $.modal.alertWarning([[#{ui.message.machine.sameMidProduceOrder}]]);
                    return true;
                }
            }
        }
        let nightProduceOrderMap = filterData.map(item => item.nightProduceOrder);
        let nightProduceOrder = $("#nightProduceOrder").val();
        if ($.common.isNotEmpty(nightProduceOrder)) {
            for (var i = 0; i < nightProduceOrderMap.length; i++) {
                if (nightProduceOrderMap[i] == nightProduceOrder) {
                    $.modal.alertWarning([[#{ui.message.machine.sameNightProduceOrder}]]);
                    return true;
                }
            }
        }
        let dayProduceOrderMap = filterData.map(item => item.dayProduceOrder);
        let dayProduceOrder = $("#dayProduceOrder").val();
        if ($.common.isNotEmpty(dayProduceOrder)) {
            for (var i = 0; i < dayProduceOrderMap.length; i++) {
                if (dayProduceOrderMap[i] == dayProduceOrder) {
                    $.modal.alertWarning([[#{ui.message.machine.sameDayProduceOrder}]]);
                    return true;
                }
            }
        }
    }
</script>
