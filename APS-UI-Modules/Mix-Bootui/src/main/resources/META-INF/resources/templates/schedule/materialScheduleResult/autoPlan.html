<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('自动排程')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-autoPlan">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.materialScheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="scheduleDate" name="scheduleDate" type="text" class="time-input form-control"
                               th:value="${initDate}" th:min="${initDate}" placeholder="yyyy-MM-dd" required>
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.materialScheduleResult.mixArea}]]：</label>
            <div class="col-sm-8">
                <select id="mixArea" class="form-control" name="mixArea"
                        th:with="type=${@setting.scheduleMixAreaPermission()}" required>
                    <option value=""></option>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                            th:value="${dict.dictValue}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/materialScheduleResult";

    $("#form-scheduleResult-autoPlan").validate({
        focusCleanup: true,
    });

    $(function () {
        var mixArea = window.parent.$("#mixArea").val();
        let selectObj = $("#mixArea")
        selectObj.val([mixArea]).trigger("change");
        selectObj.find("option:first").remove();
    });

    function submitHandler() {
        if ($.validate.form()) {
            let scheduleDate = $("#scheduleDate").val();
            let mixArea = $("#mixArea option:selected").val()
            var config = {
                url: prefix + "/validateAutoPlan",
                type: "post",
                dataType: "json",
                data: {"scheduleDate": scheduleDate},
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        if (result.msg == "0") { //已发布,有权限重新生成
                            $.modal.confirm([[#{ui.biz.alter.makeSureRecreateByPublished}]], function () {
                                submitData(scheduleDate, mixArea)
                            })
                        } else if (result.msg == "1") { //已经生成，提示是否重新生成
                            $.modal.confirm([[#{ui.biz.alter.makeSureRecreate}]], function () {
                                submitData(scheduleDate, mixArea)
                            })
                        } else if (result.msg == "2") { //未生成，直接生成
                            submitData(scheduleDate, mixArea)
                        } else if (result.msg == "3") { //已发布，提示不能重新生成
                            $.modal.alertWarning([[#{ui.biz.alter.CanNotRecreate}]]);
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };

            $.ajax({
                url: prefix + "/checkScheduleDateAndMixAreaExist",
                type: "post",
                dataType: "json",
                data: {
                    "scheduleDate": $("#scheduleDate").val(),
                    "mixArea": $("#mixArea").val()
                },
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        if (result.msg == '1') {
                            $.modal.confirm([[#{schedule.materialScheduleResult.database.exist.tip}]], function () {
                                $.ajax(config);
                            })
                        } else if (result.msg == '0') {
                            $.ajax(config);
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            });
        }
    }

    function submitData(scheduleDate, mixArea) {

        //清空父级搜索，并设置日期，密炼区
        window.parent.$("#scheduleDate").val($("#scheduleDate").val());
        window.parent.$('#mixArea').val(mixArea);
        window.parent.$('#materialName').val('');

        // 更新父表格表头
        window.parent.changeMixAreaAndDate();

        //设置密炼区目前选中的显示
        window.parent.$('#select2-mixArea-container').text(mixArea);

        $.operate.save(prefix + "/autoSchedule", {"scheduleDate": scheduleDate, "mixArea": mixArea});
    }
</script>
</body>
</html>
