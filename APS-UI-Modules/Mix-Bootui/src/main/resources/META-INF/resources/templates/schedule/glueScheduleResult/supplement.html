                            if (value === 0) {

    /**
     * 查询参数
     * @param params
     * @returns {*}
     */
    function queryParams(params) {
        var search = $.table.queryParams(params);
        search.mixArea = $('#mixArea').val();
        search.scheduleDate = $('#scheduleDate').val();
        return search;
    }

    function selectRecipe(id) {
        let row = $("#" + table.options.id).bootstrapTable('getRowByUniqueId', id);
        let machineName = encodeURIComponent($.common.isEmpty(row.machineName) ? '' : row.machineName);
        let glue = encodeURIComponent($.common.isEmpty(row.glue) ? '' : row.glue);
        let recipeType = row.recipeType;
        let recipeVersionId = row.recipeVersionId;
        
        var param = "machineName={machineName}&glue={glue}&id={id}&recipeType={recipeType}&recipeVersionId={recipeVersionId}";
        param = param.replace("{machineName}", machineName);
        param = param.replace("{glue}", glue);
        param = param.replace("{id}", id);
        param = param.replace("{recipeType}", recipeType);
        param = param.replace("{recipeVersionId}", recipeVersionId);
        var url = table.options.toSelectRecipeUrl + "?" + param;
        $.modal.open(table.options.modalName, url, 800, 500);
    }


    function backColor1(){
        return {css: {'background-color': '#10d3be','color':'#035149'}};
    }
    function backColor2(){
        return {css: {'background-color': '#f4cf01','color':'#735c00'}};
    }

    /**
     * 合并相同行
     * @param data 原始数据（在服务端完成排序）
     * @param fieldName 合并属性数组
     * @param condition 合并添加（符合前一个condition和当前condition相等才合并）
     * @param target 目标表格对象
     */
    function mergeCells(dataAll, fieldName, condition, target) {
        var data = dataAll;
        setTimeout(function () {
            if (data.rows.length == 0) {
                return;
            }
            var numArr = [];
            var number = 0;
            if (data.rows.length > 1) {
                for (let i = 0; i < data.rows.length; i++) {
                    if (data.rows[i][fieldName] != '' && data.rows[i][fieldName] != '-') {
                        if (data.rows[i - 1]) {
                            if (data.rows[i - 1][fieldName] != '' && data.rows[i - 1][fieldName] != '-') {
                                if (data.rows[i - 1][fieldName] == data.rows[i][fieldName] && data.rows[i - 1][condition] == data.rows[i][condition]) {
                                    number++
                                } else {
                                    number = number + 1
                                    numArr.push({index: i - number, number: number, pan: '1'})
                                    number = 0
                                }
                            }
                        }
                        if (!data.rows[i + 1]) {
                            number = number
                            numArr.push({index: i - number, number: number + 1, pan: '2'})
                            number = 0
                        } else {
                            if (data.rows[i + 1][fieldName] == '' || data.rows[i + 1][fieldName] == '-') {
                                number = number
                                numArr.push({index: i - number, number: number + 1, pan: '3'})
                                number = 0
                            }
                        }
                    } else {
                        numArr.push({index: i, number: 1, pan: '4'})
                    }
                }
            } else {
                numArr.push({index: 0, number: 1, pan: '5'})
            }
            // console.log(numArr);
            for (let x = 0; x < numArr.length; x++) {
                if (x % 2) {
                    for (let y = 0; y < numArr[x]['number']; y++) {
                        //  $(target).children('tbody').children('tr').eq(numArr[x]['index']+y).css('background','yellow')
                    }
                } else {
                    for (let y = 0; y < numArr[x]['number']; y++) {
                        $(target).children('tbody').children('tr').eq(numArr[x]['index'] + y).css('background', '#fff')
                    }
                }
                $(target).bootstrapTable('mergeCells', {
                    index: numArr[x]['index'],
                    field: fieldName,
                    colspan: 1,
                    rowspan: numArr[x]['number']
                });
                var find = $(".fixed-columns").find("#bootstrap-table");
                find.bootstrapTable('mergeCells', {
                    index: numArr[x]['index'],
                    field: fieldName,
                    colspan: 1,
                    rowspan: numArr[x]['number']
                });
                // 解决冻结列后合并单元格失效的问题
                var trChildren = find.children('tbody').children('tr');
                $($(trChildren[numArr[x]['index']]).children('td')[1]).attr('rowspan', numArr[x]['number']);
                for (var i = numArr[x]['index'] + 1; i < numArr[x]['index'] + numArr[x]['number']; i++) {
                    $($(trChildren[i]).children('td')[1]).css('display', 'none');
                }
            }
        })
    }

    /* 行内编辑*/
    function onEditableSave(field, row, rowIndex, oldValue, $el) {
    	var capacity;
        var	formulaTime = row.formulaTime; // 炼胶时长
        var mixOntervalTime = row.mixOntervalTime; // 每车间隔时长
        var scheduleSwitchTime = row.scheduleSwitchTime; // 排程切换时间
        var capacityField;
        
        if (field === 'midPlanQty') {
        	capacity = row.oldMidCapacity;
        	capacityField = 'midCapacity';
        } else if (field === 'nightPlanQty') {
        	capacity = row.oldNightCapacity;
        	capacityField = 'nightCapacity';
        } else if (field === 'dayPlanQty') {
        	capacity = row.oldDayCapacity;
        	capacityField = 'dayCapacity';
        }
        
        var totalCapacity = 0;
        var datas = $('#' + table.options.id).bootstrapTable('getData');
        var modifyRow = [];
        datas.forEach(data => {
        	if (data.machineCode == row.machineCode) { // 计算该机台的同一个班别的产能消耗量
        		var planQty = data[field];
        		if (planQty > 0) {
        			totalCapacity += (data[field] * (data.formulaTime + data.mixOntervalTime) + scheduleSwitchTime);
        		}
        		modifyRow.push(data)
        	}
        });
        
        modifyRow.forEach(data => {
	        data[capacityField] = capacity - totalCapacity;
	        $('#' + table.options.id).bootstrapTable('updateCellByUniqueId', {
	            id: data.id,
	            field: capacityField,
	            value: data[capacityField]
	        });
        });
    }

    // 弹出消息提示，并回滚成旧值
    function alertMessageRevertValue(message, row, field, oldValue){
        $.modal.msg(message);
        $('#' + table.options.id).bootstrapTable('updateCellByUniqueId', {
            id: row.id,
            field: field,
            value: oldValue === 0 ? null : oldValue
        });
    }
    
    function submitHandler() {
        var tableRows = $("#" + table.options.id).bootstrapTable('getData');
        if (tableRows.length == 0) {
        	$.modal.alertWarning('没有可补量的机台');	
        	return;
        }
    	$.modal.confirm('每天只能进行一次补量，是否确认补量？', function () {
        	var data = {"glueScheduleSupplementList": tableRows};
    		$.ajax({
		        cache: false,
		        type: "POST",
		        contentType: 'application/json',
		        url: prefix + "/saveSupplement",
		        data: JSON.stringify(tableRows),
	            beforeSend: function () {
	                $.modal.loading(frame.alter.doingWaiting);
	                $.modal.disable();
	            },
		        success: (result) => {
                	if (result.code === web_status.SUCCESS){
    					layer.msg(result.msg, {icon: $.modal.icon("success"), time: 1000, shift: 5 }, () => $.modal.close());
                	} else {
	                    $.modal.alertWarning(result.msg);
	                }
	                $.modal.closeLoading();
	                $.modal.enable();
		        }
	        });
        });
    }
    
    $(window).resize(function() {
        /*全屏或者放大缩小屏幕时候重新设置固定表格的高度*/
        var wh = $(window).height();//ifram容器高度
        var fixTop = $(".fixed-table-container").offset().top;  //表格到顶部的像素
        var bh = wh-(fixTop-50);//基础默认表格高度
        $('#bootstrap-table').bootstrapTable("resetView",{height:bh});
    });
</script>
