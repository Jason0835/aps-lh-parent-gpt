<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改物料信息')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-material-edit" th:object="${mesBasMaterial}">
            <input id="id" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{setting.material.materialCode}]]：</label>
                <div class="col-sm-8">
                    <input name="materialCode" th:field="*{materialCode}"  class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{setting.material.materialName}]]：</label>
                <div class="col-sm-8">
                    <input name="materialName" th:field="*{materialName}"  class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{setting.material.erpCode}]]：</label>
                <div class="col-sm-8">
                    <input name="erpCode" th:field="*{erpCode}"  class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{setting.material.sapMaterialCode}]]：</label>
                <div class="col-sm-8">
                    <input name="sapMaterialCode" th:field="*{sapMaterialCode}"  class="form-control" type="text"  readonly>
                </div>
            </div>

            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{setting.material.materialGroup}]]：</label>
                <div class="col-sm-8">
                    <input name="materialGroup" th:field="*{materialGroup}"  class="form-control" type="text" readonly>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{setting.material.minparkTime}]]：</label>
                <div class="col-sm-8">
                    <input name="minparkTime" th:field="*{minparkTime}"  class="form-control" type="text" readonly>
                </div>
            </div>

            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{setting.material.majorType}]]：</label>
                <div class="col-sm-8">
                    <select name="majorType" class="form-control" th:with="type=${@dict.getType('MAJOR_TYPE')}"  disabled="disabled">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{majorType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{setting.material.glueType}]]：</label>
                <div class="col-sm-8">
                    <select name="glueType" class="form-control" th:with="type=${@dict.getType('GLUE_TYPE')}" >
                        <option value="">&nbsp;</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{glueType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}"  maxlength="300" ></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "setting/material";
        $("#form-material-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                if ($("#id").val() == null || $("#id").val() == '') {
                    $.operate.save(prefix + "/save", $('#form-material-edit').serialize());
                } else {
                    $.operate.saveUpdateParentRow(prefix + "/save", $('#form-material-edit').serializeArray());
                }
            }
        }
    </script>
</body>
</html>
