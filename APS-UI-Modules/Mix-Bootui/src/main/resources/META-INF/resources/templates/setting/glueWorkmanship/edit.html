<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改分厂胶料工艺信息')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-group-edit" th:object="${glueWorkmanship}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.workmanship.factoryCode}]]：</label>
            <div class="col-sm-8">
                <select name="factoryCode" class="form-control" th:with="type=${@dict.getType('FACTORY')}"
                        required="true">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{factoryCode}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.workmanship.glue}]]：</label>
            <div class="col-sm-8">
                <input name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off" type="text"
                       required="true"
                       maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.workmanship.knifeNum}]]：</label>
            <div class="col-sm-8">
                <input name="knifeNum" th:field="*{knifeNum}" class="form-control" type="text" required="true" min="0"
                       digits="true"
                       max="999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.workmanship.carNum}]]：</label>
            <div class="col-sm-8">
                <input name="carNum" th:field="*{carNum}" class="form-control" type="text" required="true" min="0"
                       digits="true"
                       max="999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: datetimepicker-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/glueWorkmanship";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
        items: 5
    });

    $("#form-group-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            if ($("#id").val() == null || $("#id").val() == '') {
                $.operate.save(prefix + "/save", $('#form-group-edit').serialize());
            } else {
                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-group-edit').serializeArray());
            }
        }
    }

</script>
</body>
</html>
