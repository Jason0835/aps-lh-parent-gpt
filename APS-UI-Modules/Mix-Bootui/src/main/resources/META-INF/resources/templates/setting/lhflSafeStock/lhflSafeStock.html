<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('硫磺辅料安全库存列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <th:block th:include="include :: bootstrap-editable-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{setting.safeStock.material}]]：</label>
                            <div class="neat">
                                <input type="text" name="material" class="AccessoriesNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <label>[[#{setting.safeStock.mixArea}]]：</label>
                            <select class="form-control" name="mixArea" th:with="type=${@dict.getType('MIX_AREA')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add('',500)" shiro:hasPermission="setting:lhflSafeStock:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',500)"
               shiro:hasPermission="setting:lhflSafeStock:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="setting:lhflSafeStock:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="setting:lhflSafeStock:import">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="setting:lhflSafeStock:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-table-editable-js" />
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('setting:lhflSafeStock:edit')}]];
    var removeFlag = [[${@permission.hasPermi('setting:lhflSafeStock:remove')}]];
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
    var prefix = ctx + "setting/lhflSafeStock";

    //获取胶料名称列表
    var datas = [[${@setting.getAccessoriesNames()}]];
    $('.AccessoriesNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    $(function () {
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{setting.safeStock.modelName}]],
            onEditableSave: onEditableSave,
            onEditableShown:function(){
                setTimeout(function (){
                    $(".form-control.input-sm").select();
                },100)
            },
            onEditableHidden:function () {
                $(".editable-submit").click()
            },
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.safeStock.id}]],
                    visible: false
                },
                {
                    field: 'mixArea',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.safeStock.mixArea}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(mixAreaDatas, value);
                    }
                },
                {
                    field: 'material',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 15,
                    title: [[#{setting.safeStock.material}]],
                },
                {
                    field: 'stockNum',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    widthUnit: '%',
                    width: 15,
                    title: [[#{setting.safeStock.stockNum}]],
                },
                {
                    field: 'safeStock',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    title: [[#{setting.safeStock.safeStock}]],
                    editable: {
                            type: 'text',
                            title: [[#{setting.safeStock.safeStock}]],
                            emptytext: '-',
                            validate: function (value) {
                                // 输入非负整数正则校验
                                var regu = /^\d+$/;
                                if (!regu.test(value) && $.common.isNotEmpty(value)) {
                                    layer.msg([[#{ui.message.editable.digits}]]);
                                    return [[#{ui.message.editable.digits}]];
                                }
                                if (value.length > 6) {
                                    let message = String([[#{ui.message.editable.maxSeven}]]).replace('9999999', '999999');
                                    layer.msg(message);
                                    return message;
                                }
                            }
                        },
                },
                {
                    field: 'remark',
                    sortable: true,
                    halign: 'center',
                    align: 'left',
                    widthUnit: '%',
                    width: 20,
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                    title: [[#{setting.safeStock.remark}]],
                },
                {
                    title: [[#{ui.data.btn.option}]],
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 20,
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\',500)"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });
    
    function onEditableSave(field, row, rowIndex, oldValue, $el) {
        $.operate.updateRow(prefix + "/save", "post", row, rowIndex, function (result) {
            if (result.code === web_status.FAIL) {
                $("#" + table.options.id).bootstrapTable('updateCell', {
                    index: rowIndex,
                    field: field,
                    value: oldValue
                });
            }
        });
    }

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
<style>
    .popover-title {
        padding: 8px 14px;
        margin: 0 !important;
        font-size: 14px;
        background-color: #FFFFFF;
        border-bottom: 1px solid #ebebeb;
        color: #808080;
        border-radius: 5px 5px 0 0;
    }

    .editable-input {
        vertical-align: top;
        display: inline-block;
        width: auto;
        white-space: normal;
        zoom: 1;
        color: #808080;
    }

    .popover-content {
        padding: 5px;
        background-color: #F0F0F0;
    }

    .popover ::after {
        border-style: none;
    }

    .popover {
        width: 340px;
        background-color: #E7E7E7;
        color: #808080;
    }

    .pagination-detail {
        margin-top: 0 !important;
        margin-bottom: 0 !important;
    }

    .select-table {
        padding-bottom: 0 !important;
    }

    button.btn.btn-default.btn-sm.editable-cancel {
        display: none
    }
</style>
</html>
