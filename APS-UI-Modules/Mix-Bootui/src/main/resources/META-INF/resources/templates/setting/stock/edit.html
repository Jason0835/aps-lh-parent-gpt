<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('终炼胶库存信息列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-stock-edit" th:object="${tGlueStockDto}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.stock.stockDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input name="stockDate" th:value="${#dates.format(tGlueStockDto.stockDate, 'yyyy-MM-dd')}"
                           class="form-control" placeholder="yyyy-MM-dd" type="text" autocomplete="off" required="true">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.stock.barCode}]]：</label>
            <div class="col-sm-8">
                <input name="barCode" th:field="*{barCode}" class="form-control" type="text" required="true"
                       isCode="true" maxlength="60">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.stock.validTime}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input id="validTime" name="validTime"
                           th:value="${#dates.format(tGlueStockDto.validTime, 'yyyy-MM-dd HH:mm:ss')}"
                           class="form-control" placeholder="yyyy-MM-dd HH:mm:ss" type="text" autocomplete="off"
                           required="true">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.stock.mixArea}]]：</label>
            <div class="col-sm-8">
                <select name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}" required="true">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{mixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.stock.glue}]]：</label>
            <div class="col-sm-8">
                <input name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off" type="text"
                       required="true" maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.stock.stockNum}]]：</label>
            <div class="col-sm-8">
                <input name="stockNum" th:field="*{stockNum}" class="form-control" type="text" required="true" min="0"
                       digits="true" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.stock.stockWeightNum}]]：</label>
            <div class="col-sm-8">
                <input name="stockWeight" th:field="*{stockWeight}" class="form-control" type="text" required="true"
                       min="0"
                       number="true" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.stock.safeStock}]]：</label>
            <div class="col-sm-8">
                <input id="safeStock" name="safeStock" th:field="*{safeStock}" class="form-control" type="text" min="0"
                       digits="true"
                       max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: datetimepicker-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/stock";
    var safeStock = [[${tGlueStockDto.safeStock}]];
    $("#form-stock-edit").validate({
        focusCleanup: true
    });

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
        items: 7
    });

    function submitHandler() {
        if ($.validate.form()) {
            var value = $("#glue").val();
            var regu = /^.*\/.*$/;
            var newSafeStock = $("#safeStock").val();
            var data = $('#form-stock-edit').serializeArray();
            if ($.common.isEmpty(newSafeStock) && $.common.isNotEmpty(safeStock)) {
                data = data.map(function (value, index, arr) {
                    if (value.name === 'safeStock') {
                        value.value = 0;
                    }
                    return value;
                })
            }
            if (!regu.test(value)) {
                submitData(data);
            } else {
                $.modal.confirm([[#{setting.stock.glue.mismatch}]], function () {
                    submitData(data);
                })
            }
        }
    }

    function submitData(data) {
        if ($("#id").val() == null || $("#id").val() == '') {
            $.operate.save(prefix + "/save", data);
        } else {
            $.operate.saveUpdateParentRow(prefix + "/save", data, function (result) {
                if (result.code == web_status.SUCCESS) {
                    var resArray = result.data;
                    if (resArray) {
                        //更新列表上相同密炼区和胶料名称的安全库存
                        $.each(resArray, function (key, value) {
                            window.parent.$("#" + parent.table.options.id).bootstrapTable('updateByUniqueId', {
                                id: value.id,
                                row: value
                            });
                        });
                    }
                }
            });
        }
    }

    $("input[name='stockDate']").datetimepicker({
        format: "yyyy-mm-dd",
        minView: "month",
        autoclose: true
    });

    layui.use('laydate', function () {
        var laydate = layui.laydate;

        laydate.render({
            elem: '#validTime',
            type: 'datetime',
            trigger: 'click'
        });
    });


</script>
</body>
</html>
