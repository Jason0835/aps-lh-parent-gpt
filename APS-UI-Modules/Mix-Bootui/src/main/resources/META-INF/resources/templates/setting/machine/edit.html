<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改密炼机台信息')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-machine-edit" th:object="${mixMachine}">
        <input id="editType" name="editType" th:value="${editType}" type="hidden">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machine.mixArea}]]：</label>
            <div class="col-sm-8">
                <input id="mixArea2" name="mixArea" th:field="*{mixArea}" hidden>
                <select id="mixArea" name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"
                        required="true">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{mixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machine.machineCode}]]：</label>
            <div class="col-sm-8">
                <input id="machineCode" name="machineCode" th:field="*{machineCode}" class="form-control" type="text"
                       isCode="true" required="true"
                       maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machine.machineName}]]：</label>
            <div class="col-sm-8">
                <input id="machineName" name="machineName" th:field="*{machineName}" class="form-control" type="text"
                       required="true"
                       maxlength="40">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machine.haveSulfurSteelyard}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="haveSulfurSteelyard"
                           th:checked="${mixMachine.haveSulfurSteelyard == '0' || mixMachine.haveSulfurSteelyard == null ? false : true}">
                    <span></span>
                </label>
            </div>

            <label class="col-sm-6 control-label" style="width: 18%;min-width: 75px;">[[#{setting.machine.haveMaterialSteelyard}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="haveMaterialSteelyard"
                           th:checked="${mixMachine.haveMaterialSteelyard == '0' || mixMachine.haveMaterialSteelyard == null ? false : true}">
                    <span></span>
                </label>
            </div>

            <label class="col-sm-3 control-label" style="width: 15%;min-width: 90px;">[[#{setting.machine.status}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="status"
                           th:checked="${mixMachine.status == '0' || mixMachine.status == null ? true : false}"
                           onchange="disableStatus()">
                    <span></span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machine.midStatus}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="midStatus"
                           th:checked="${mixMachine.midStatus == '0' || mixMachine.midStatus == null ? true : false}"
                           onchange="enableStatus(this)">
                    <span></span>
                </label>
            </div>

            <label class="col-sm-3 control-label" style="width: 18%;min-width: 75px;">[[#{setting.machine.nightStatus}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="nightStatus"
                           th:checked="${mixMachine.nightStatus == '0' || mixMachine.nightStatus == null ? true : false}"
                           onchange="enableStatus(this)">
                    <span></span>
                </label>
            </div>

            <label class="col-sm-3 control-label" style="width: 15%;min-width: 75px;">[[#{setting.machine.dayStatus}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="dayStatus"
                           th:checked="${mixMachine.dayStatus == '0' || mixMachine.dayStatus == null ? true : false}"
                           onchange="enableStatus(this)">
                    <span></span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/machine";
    $(function () {
        var editType = $("#editType").val();
        if (editType == "0") {
            $('#mixArea2').attr("disabled", "disabled");
        } else if(editType=='1'){ //编辑
            $('#machineCode').attr("readonly","true");
            $('#mixArea').attr("disabled", "disabled");
        }
    });

    $("#form-machine-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var data = $("#form-machine-edit").serializeArray();
            var status = $("input[id='status']").is(':checked') == true ? '0' : '1';
            var midStatus = $("input[id='midStatus']").is(':checked') === true ? '0' : '1';
            var nightStatus = $("input[id='nightStatus']").is(':checked') === true ? '0' : '1';
            var dayStatus = $("input[id='dayStatus']").is(':checked') === true ? '0' : '1';
            var haveSulfurSteelyard = $("input[id='haveSulfurSteelyard']").is(':checked') == true ? '1' : '0';
            var haveMaterialSteelyard = $("input[id='haveMaterialSteelyard']").is(':checked') == true ? '1' : '0';
            data.push({"name": "status", "value": status});
            data.push({"name": "midStatus", "value": midStatus});
            data.push({"name": "nightStatus", "value": nightStatus});
            data.push({"name": "dayStatus", "value": dayStatus});
            data.push({"name": "haveSulfurSteelyard", "value": haveSulfurSteelyard});
            data.push({"name": "haveMaterialSteelyard", "value": haveMaterialSteelyard});
            if ($("#id").val() == null || $("#id").val() == '') {
                $.operate.save(prefix + "/save", data);
            } else {
                $.operate.saveUpdateParentRow(prefix + "/save", data);
            }
        }
    }

    // 禁用机台状态时，将三班状态都禁用
    function disableStatus() {
        let isChecked = $("#status").is(":checked");
        if (!isChecked) {
            $("#midStatus").removeAttr('checked');
            $("#nightStatus").removeAttr('checked');
            $("#dayStatus").removeAttr('checked');
        }
    }

    // 启用三班状态时，将机台状态启用
    function enableStatus($ele) {
        let isChecked = $($ele).is(":checked");
        if (isChecked) {
            $("#status").prop("checked", true);
        }
    }
</script>
</body>
</html>
