<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">

    function chooseMachine(id) {
        table.set();
        var row = $("#bootstrap-table").bootstrapTable('getRowByUniqueId', id);
        var param = [];
        param.push("id=" + encodeURIComponent(id));
        if ($.common.isNotEmpty(row.machineCode)) {
            param.push("machineCode=" + encodeURIComponent(row.machineCode));
        }
        if ($.common.isNotEmpty(row.machineName)) {
            param.push("machineName=" + encodeURIComponent(row.machineName));
        }
        if ($.common.isNotEmpty(row.recipeTypeName)) {
            param.push("recipeTypeName=" + encodeURIComponent(row.recipeTypeName));
        }
        if ($.common.isNotEmpty(row.recipeType)) {
            param.push("recipeType=" + encodeURIComponent(row.recipeType));
        }
        if ($.common.isNotEmpty(row.recipeVersionId)) {
            param.push("recipeVersionId=" + encodeURIComponent(row.recipeVersionId));
        }
        if ($.common.isNotEmpty(row.recipeStage)) {
            param.push("recipeStage=" + encodeURIComponent(row.recipeStage));
        }
        var url = prefix + "/toChooseMachine?" + param.join("&");
        $.modal.open([[#{schedule.glueScheduleResult.receiveCrossRegional.modelName}]], url, 800, 580);
    }

    // 接收跨区请求
    function receiveGlueSpan() {
        table.set();
        var selectList = getSelectedData('bootstrap-table', true);
        if (selectList.length === 0) {
            $.modal.alertWarning(frame.alter.mustChooseOneRecord);
            return;
        }
        var validateFlag = true;
        // 校验选中记录的单元格和机台
        for (var i = 0; i < selectList.length; i++) {
            validateFlag = validateFlag && $('#form-glueScheduleResult-receiveCrossRegional').validate().element($("#receiveQty" + selectList[i].id));
            var validateMachineFlag = $.common.isNotEmpty(selectList[i].machineCode);
            var validateRecipeTypeFlag = $.common.isNotEmpty(selectList[i].recipeType);
            validateFlag = validateFlag && validateMachineFlag;
            validateFlag = validateFlag && validateRecipeTypeFlag;
            if (!validateMachineFlag) {
                $.modal.alertWarning([[#{ui.data.message.receiveMachineAndRecipeTypeNull}]]);
                return ;
            }
            if (!validateRecipeTypeFlag) {
                $.modal.alertWarning([[#{ui.data.message.receiveMachineAndRecipeTypeNull}]]);
                return ;
            }
            /*var validateReceiveFlag = Number(selectList[i].receiveQty) <= Number(selectList[i].sendQty);
            validateFlag = validateFlag && validateReceiveFlag;
            if (!validateReceiveFlag) {
                $.modal.alertWarning([[#{ui.data.message.receiveMoreThanSend}]]);
                return ;
            }*/
        }
        if (validateFlag) {
            var data = [];
            var receiveIds = [];
            for (var j = 0; j < selectList.length; j++) {
                var keyList = Object.keys(selectList[j]);
                var valueList = Object.values(selectList[j]);
                for (var k = 0; k < keyList.length; k++) {
                    data.push({name: "glueSpanReceiveList[" + j + "]." + keyList[k], value: valueList[k]})
                }
                receiveIds.push(selectList[j].id);
            }
            $.operate.postNotRefresh(prefix + "/receiveGlueSpanReceive", data, function (result) {
                if (result.code === web_status.SUCCESS) {
                    var tableData = getTableData('bootstrap-table');
                    var filterData = tableData.filter(item => receiveIds.indexOf(item.id) !== -1);
                    var loadParentData = [];
                    for (var i = 0; i < filterData.length; i++) {
                        // 发送标识修改为已发送
                        filterData[i].row['receiveStatus'] = '1';
                    }
                    for (var j = 0; j < tableData.length; j++) {
                        loadParentData.push(tableData[j].row);
                    }
                    $("#bootstrap-table").bootstrapTable('load', loadParentData);
                }
            });
        }
    }

    // 获取表格选中的数据，包括文本框内填写的值
    function getSelectedData(tableId) {
        var currentId = $.common.isEmpty(tableId) ? table.options.id : tableId;
        var cols = $('#' + currentId).bootstrapTable('getVisibleColumns');
        var dataColumns = [];
        dataColumns.push({checkbox: true, width: '3', widthUnit: '%'});
        for (var columnIndex = 0; columnIndex < cols.length; columnIndex++) {
            dataColumns.push(cols[columnIndex]);
        }
        var params = new Array();
        var data = $("#" + currentId).bootstrapTable('getSelections');
        var count = data.length;
        var selectIds = data.map(item => item.id);
        for (var dataIndex = 0; dataIndex < count; dataIndex++) {
            var columns = $('#' + currentId + ' tr[data-uniqueid="' + selectIds[dataIndex] + '"] td');
            var obj = new Object();
            for (var i = 0; i < columns.length; i++) {
                var inputValue = $(columns[i]).find('input');
                var selectValue = $(columns[i]).find('select');
                var textareaValue = $(columns[i]).find('textarea');
                var key = dataColumns[i].field;
                if ($.common.isNotEmpty(inputValue.val())) {
                    obj[key] = inputValue.val();
                } else if ($.common.isNotEmpty(selectValue.val())) {
                    obj[key] = selectValue.val();
                } else if ($.common.isNotEmpty(textareaValue.val())) {
                    obj[key] = textareaValue.val();
                } else {
                    obj[key] = "";
                }
            }
            var item = data[dataIndex];
            var extendObj = $.extend({}, item, obj);
            params.push(extendObj);
        }
        return params;
    }

    // 获取表格的数据，包括文本框内填写的值
    function getTableData(tableId) {
        var currentId = $.common.isEmpty(tableId) ? table.options.id : tableId;
        var cols = $('#' + currentId).bootstrapTable('getVisibleColumns');
        var dataColumns = [];
        dataColumns.push({checkbox: true, width: '3', widthUnit: '%'});
        for (var columnIndex = 0; columnIndex < cols.length; columnIndex++) {
            dataColumns.push(cols[columnIndex]);
        }
        var params = new Array();
        var data = $("#" + currentId).bootstrapTable('getData');
        var count = data.length;
        for (var dataIndex = 0; dataIndex < count; dataIndex++) {
            var columns = $('#' + currentId + ' tr[data-index="' + dataIndex + '"] td');
            var obj = new Object();
            for (var i = 0; i < columns.length; i++) {
                var inputValue = $(columns[i]).find('input');
                var selectValue = $(columns[i]).find('select');
                var textareaValue = $(columns[i]).find('textarea');
                var key = dataColumns[i].field;
                if ($.common.isNotEmpty(inputValue.val())) {
                    obj[key] = inputValue.val();
                } else if ($.common.isNotEmpty(selectValue.val())) {
                    obj[key] = selectValue.val();
                } else if ($.common.isNotEmpty(textareaValue.val())) {
                    obj[key] = textareaValue.val();
                } else {
                    obj[key] = "";
                }
            }
            var item = data[dataIndex];
            var extendObj = $.extend({}, item, obj);
            params.push({id: extendObj.id, row: extendObj});
        }
        return params;
    }

    // 跨区接收请求查询 表格1请求参数
    function queryParamsTable1(params) {
        var search = $.table.queryParams(params);
        search.scheduleDate = $("#scheduleDateTab1").val();
        search.entrustedMixArea = $("#entrustedMixAreaTab1").val();
        return search;
    }

    // 跨区接收请求查询 表格2请求参数
    function queryParamsTable2(params) {
        var search = $.table.queryParams(params);
        // 仅查询已接收跨区请求
        search.receiveStatus = "1";
        search.scheduleDate = $("#scheduleDateTab2").val();
        search.entrustMixArea = $("#entrustMixAreaTab2 option:selected").val();
        search.glue = $("#glue").val();
        search.permissionMixAreaList = mixAreaDatasPermission.map(item => item.dictValue).join(',');
        return search;
    }

    function getDictLabel(datas, value) {
        if ($.common.isEmpty(datas)) {
            return '';
        }
        var actions = [];
        $.each(datas, function(index, dict) {
            if (dict.dictValue == ('' + value)) {
                actions.push(dict.dictLabel);
                return false;
            }
        });
        return actions.join('');
    }

    function resetTab2View() {
        var wh = $(window).height();//ifram容器高度
        var fixTop = $($(".fixed-table-container")[1]).offset().top;  //表格到顶部的像素
        var bh = wh-(fixTop-35);//基础默认表格高度
        //设置最低高度
        if(bh<wh*0.65){
            bh=wh*0.65
        }
        if (bh < 300) {
            bh = 300
        }
        $('#bootstrap-table-tab2').bootstrapTable("resetView",{height:bh});
    }
</script>
