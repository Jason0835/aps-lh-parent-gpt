<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('配方信息列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{setting.MesPmtRecipe.machineName}]]：</label>
                            <input class="form-control" id="machineName" type="text" name="machineName" th:value="${machineName == null ? '' : machineName}" readonly/>
                        </li>
                        <li>
                            <label>[[#{setting.MesPmtRecipe.recipeMaterialName}]]：</label>
                            <input class="form-control" id="recipeMaterialName" type="text" name="recipeMaterialName" th:value="${materialName == null ? '' : materialName}"
                                  style="width: auto" readonly/>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <div style="font-size: 12px;display: inline-block;text-indent: 2rem;font-weight: bold;">
                [[#{setting.MesPmtRecipe.modelName}]]
            </div>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/materialScheduleResult";
    var productStageData = [[${@dict.getType('PRODUCT_STAGE')}]];
    var id = [[${id}]];

    $(function () {
        var options = {
            uniqueId: "id",
            url: ctx + "setting/MesPmtRecipe/selectMesPmtRecipeByParams",
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            singleSelect: true,
            clickToSelect: true,
            modalName: [[#{setting.MesPmtRecipe.modelName}]],
            pageSize: 10000,
            pageList: [10000],
            queryParams: queryParams,
            onLoadSuccess: function(data) {
                var recipeType = String([[${recipeType}]]);
                var recipeTypeName = String([[${recipeTypeName}]]);
                var recipeVersionId = String([[${recipeVersionId}]]);
                var recipeStage = $.common.isEmpty([[${recipeStage}]]) ? null : String([[${recipeStage}]]);
                var checkIndex;
                for (var i = 0; i < data.rows.length; i++) {
                    var row = data.rows[i];
                    if (row.recipeType === recipeType && row.recipeTypeName === recipeTypeName &&
                        row.recipeVersionId === recipeVersionId && row.productStage === recipeStage) {
                        checkIndex = i;
                        break;
                    }
                }
                if ($.common.isNotEmpty(checkIndex)) {
                    $('#' + table.options.id).bootstrapTable('check', checkIndex);
                }
            },
            columns: [
                {
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'recipeId',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.recipeId}]],
                },
                {
                    field: 'mixArea',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.mixArea}]],
                    visible: false
                },
                {
                    field: 'recipeEquipCode',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.recipeEquipCode}]],
                    visible: false
                },
                {
                    field: 'machineName',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.machineName}]],
                },
                {
                    field: 'recipeMaterialCode',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.recipeMaterialCode}]],
                },
                {
                    field: 'recipeMaterialName',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.recipeMaterialName}]],
                },
                {
                    field: 'recipeVersionId',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.recipeVersionId}]],
                },
                {
                    field: 'recipeType',
                    halign: 'center',
                    align: 'right',
                    title: [[#{setting.MesPmtRecipe.recipeType}]],
                    visible: false
                },
                {
                    field: 'recipeTypeName',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.recipeTypeName}]],
                },
                {
                    field: 'productStage',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.MesPmtRecipe.productStage}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(productStageData, value);
                    },
                },
            ]
        };
        $.table.init(options, false);
    });

    /**
     * 查询参数
     * @param params
     * @returns {*}
     */
    function queryParams(params) {
        var search = $.table.queryParams(params);
        search.machineCode = $('#machineCode').val();
        search.recipeMaterialName = $('#recipeMaterialName').val();
        return search;
    }

    function submitHandler() {
        var rows = $("#bootstrap-table").bootstrapTable('getSelections');
        if (rows.length === 0) {
            $.modal.alertWarning(frame.alter.mustChooseOneRecord);
            return;
        }
        var row = rows[0];
        let recipeVersionId = row.recipeVersionId;
        let recipeType = row.recipeType;
        let recipeTypeName = row.recipeTypeName;
        let recipeStage = row.productStage;
        var data = [];
        data.push({name: "id", value: id});
        data.push({name: "recipeVersionId", value: recipeVersionId});
        data.push({name: "recipeType", value: recipeType});
        data.push({name: "recipeStage", value: recipeStage});
        $.operate.saveUpdateParentRow(prefix + "/changeRecipe", data, function (result) {
            if (result.code === web_status.SUCCESS) {
                var parent = window.parent;
                parent.$("#" + parent.table.options.id).bootstrapTable('updateByUniqueId', {
                    id: id,
                    row: {
                        "recipeVersionId": recipeVersionId,
                        "recipeTypeName": recipeTypeName,
                        "recipeType": recipeType,
                        "recipeStage": recipeStage,
                        "releaseStatus": result.data
                    }
                });
            }
        });
    }
</script>
</body>
<style>
    .container-div {
        height: auto;
    }
</style>
</html>
