<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改分厂胶料需求计划')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-glueDemandPlan-add" th:object="${glueDemandPlan}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <h4 class="form-header h4">[[#{ui.baseInfo}]]</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">[[#{schedule.glueDemandPlan.planDate}]]：</label>
                    <div class="col-sm-8">
                        <div class="input-group">
                            <input id="planDate" name="planDate"
                                   th:value="${#dates.format(glueDemandPlan.planDate, 'yyyy-MM-dd')}"
                                   class="form-control time-input" placeholder="yyyy-MM-dd" type="text" required>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">[[#{schedule.glueDemandPlan.factory}]]：</label>
                    <div class="col-sm-8">
                        <select name="factory" class="form-control" th:with="type=${@dict.getType('FACTORY')}" required>
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                                    th:field="*{factory}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">[[#{schedule.glueDemandPlan.glue}]]：</label>
                    <div class="col-sm-8">
                        <input name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off"
                               type="text" maxlength="30" required>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">[[#{schedule.glueDemandPlan.mixArea}]]：</label>
                    <div class="col-sm-8">
                        <select name="mixArea" class="form-control"
                                th:with="type=${@dict.getType('MIX_AREA')}" th:title="#{ui.frame.btn.choose}" required>
                            <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                                    th:field="*{mixArea}"></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{schedule.glueDemandPlan.totalPlanQty}]]：</label>
                    <div class="col-sm-8">
                        <input name="totalPlanQty" th:value="*{@nf.stripZeros(totalPlanQty)}" class="form-control"
                               type="text" digits="true"
                               max="9999999">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                    <div class="col-sm-8">
                        <textarea name="remark" class="form-control" rows="2" th:field="*{remark}"
                                  maxlength="300"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4">[[#{schedule.common.midClass}]]</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{schedule.glueDemandPlan.midPlanQty}]]：</label>
                    <div class="col-sm-8">
                        <input name="midPlanQty" th:value="*{@nf.stripZeros(midPlanQty)}" class="form-control"
                               type="text" digits="true" max="9999999">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{schedule.glueDemandPlan.midRemark}]]：</label>
                    <div class="col-sm-8">
                        <input name="midRemark" th:field="*{midRemark}" class="form-control" type="text"
                               maxlength="300">
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4">[[#{schedule.common.nightClass}]]</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{schedule.glueDemandPlan.nightPlanQty}]]：</label>
                    <div class="col-sm-8">
                        <input name="nightPlanQty" th:value="*{@nf.stripZeros(nightPlanQty)}" class="form-control"
                               type="text" digits="true"
                               max="9999999">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{schedule.glueDemandPlan.nightRemark}]]：</label>
                    <div class="col-sm-8">
                        <input name="nightRemark" th:field="*{nightRemark}" class="form-control" type="text"
                               maxlength="300">
                    </div>
                </div>
            </div>
        </div>

        <h4 class="form-header h4">[[#{schedule.common.dayClass}]]</h4>
        <div class="row">
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{schedule.glueDemandPlan.dayPlanQty}]]：</label>
                    <div class="col-sm-8">
                        <input name="dayPlanQty" th:value="*{@nf.stripZeros(dayPlanQty)}" class="form-control"
                               type="text" digits="true" max="9999999">
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="form-group">
                    <label class="col-sm-3 control-label">[[#{schedule.glueDemandPlan.dayRemark}]]：</label>
                    <div class="col-sm-8">
                        <input name="dayRemark" th:field="*{dayRemark}" class="form-control" type="text"
                               maxlength="300">
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/glueDemandPlan";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });


    $("#form-glueDemandPlan-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/save", $('#form-glueDemandPlan-add').serialize());
        }
    }
</script>
</body>
</html>
