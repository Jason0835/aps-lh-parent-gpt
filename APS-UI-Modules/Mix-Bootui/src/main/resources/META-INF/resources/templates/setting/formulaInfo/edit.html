<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改配方信息')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-formulaInfo-edit" th:object="${formulaInfo}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.formulaInfo.glue}]]：</label>
            <div class="col-sm-8">
                <input name="glue" th:field="*{glue}" class="form-control" type="text" required="true"
                       maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.formulaInfo.weight}]]：</label>
            <div class="col-sm-8">
                <input name="weight" th:field="*{weight}" class="form-control" type="text" required="true" min="0"
                       max="9999999.999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.formulaInfo.glueType}]]：</label>
            <div class="col-sm-8">
                <select name="glueType" class="form-control" th:with="type=${@dict.getType('GLUE_TYPE')}"
                        required="true">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{glueType}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/formulaInfo";

    $("#form-formulaInfo-edit").validate({
        onkeyup: false,
        rules: {
            glue: {
                remote: {
                    url: prefix + "/checkGlueUnique",
                    type: "post",
                    dataType: "json",
                    data: {
                        "id": function () {
                            return $("#id").val();
                        },
                        "glue": function () {
                            return $.common.trim($("#glue").val());
                        }
                    },
                    dataFilter: function (data, type) {
                        return $.validate.unique(data);
                    }
                }
            },
        },
        messages: {
            "glue": {
                remote: [[#{setting.formulaInfo.glue.unique}]]
            }
        },
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            if ($("#id").val() == null || $("#id").val() == '') {
                $.operate.save(prefix + "/save", $('#form-formulaInfo-edit').serialize());
            } else {
                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-formulaInfo-edit').serializeArray());
            }
        }
    }

</script>
</body>
</html>
