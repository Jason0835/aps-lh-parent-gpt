<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('分厂胶料与密炼区对应列表')" />
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>[[#{setting.factoryGlueAreaRelation.factory}]]：</label>
	                            <select id="factory" class="form-control" name="factory"
	                                    th:with="type=${@dict.getType('FACTORY')}">
	                                <option value="">[[#{ui.frame.btn.all}]]</option>
	                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
	                                        th:value="${dict.dictValue}"></option>
	                            </select>
                            </li>
                            <li>
                                <label>[[#{setting.factoryGlueAreaRelation.glue}]]：</label>
                                <input type="text" name="searchGlue"/>
                            </li>
                            <li>
                                <label>[[#{setting.factoryGlueAreaRelation.mixArea}]]：</label>
	                            <select id="mixArea" class="form-control" name="mixArea"
	                                    th:with="type=${@dict.getType('MIX_AREA')}">
	                                <option value="">[[#{ui.frame.btn.all}]]</option>
	                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
	                                        th:value="${dict.dictValue}"></option>
	                            </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="setting:factoryGlueAreaRelation:add">
                    <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="setting:factoryGlueAreaRelation:edit">
                    <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="setting:factoryGlueAreaRelation:remove">
                    <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
                </a>
                <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="setting:factoryGlueAreaRelation:import">
                    <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
                </a>
                <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="setting:factoryGlueAreaRelation:export">
                    <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
	<th:block th:include="include :: select2-js"/>
	<th:block th:include="include :: bootstrap-select-js"/>
	<th:block th:include="include :: bootstrap-suggest-js"/>
	<th:block th:include="include :: bootstrap-typeahead-js"/>
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('setting:factoryGlueAreaRelation:edit')}]];
        var removeFlag = [[${@permission.hasPermi('setting:factoryGlueAreaRelation:remove')}]];
        var factoryDatas = [[${@dict.getType('FACTORY')}]];
        var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
        var prefix = ctx + "setting/factoryGlueAreaRelation";

        $(function() {
            var options = {
            	uniqueId: 'id',
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                importUrl: prefix + "/importData",
                modalName: [[#{setting.factoryGlueAreaRelation.modelName}]],
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'factory',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.factoryGlueAreaRelation.factory}]],
                    formatter: function (value, row, index) {
                        if ($.common.isEmpty(value)) {
                            return "";
                        }
                        return $.table.selectDictLabel(factoryDatas, value);
                    }
                },
                {
                    field: 'glue',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.factoryGlueAreaRelation.glue}]],
                },
                {
                    field: 'mixArea',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.factoryGlueAreaRelation.mixArea}]],
                    formatter: function (value, row, index) {
                        if ($.common.isEmpty(value)) {
                            return "";
                        }
                        return $.table.selectDictLabel(mixAreaDatas, value);
                    }
                },
                {
                    field: 'remark',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.factoryGlueAreaRelation.remark}]],
                },
                {
                    title: [[#{ui.data.btn.option}]],
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>'+[[#{ui.frame.btn.update}]]+'</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>'+[[#{ui.frame.btn.delete}]]+'</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        // 下载模板
        function importTemplate() {
            window.location.href=prefix + "/importTemplate";
        }
    </script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}" onclick="javascript:$('input[name=\'file\']').click();" />
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}" onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;" onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);" />
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport" > [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp;	<a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
