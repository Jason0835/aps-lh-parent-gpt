<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('终炼胶库存信息列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <th:block th:include="include :: bootstrap-editable-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li class="select-time">
                            <label>[[#{setting.stock.stockDate}]]：</label>
                            <input type="text" class="time-input" id="stockDate"
                                   th:placeholder="yyyy-mm-dd" name="stockDate"/>
                        </li>
                        <li>
                            <label>[[#{setting.stock.mixArea}]]：</label>
                            <select class="form-control" name="mixArea" th:with="type=${@dict.getType('MIX_AREA')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{setting.stock.glue}]]：</label>
                            <div class="neat">
                                <input type="text" name="glue" class="GlueNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
<!--            <a class="btn btn-success" onclick="$.operate.add('',600)" shiro:hasPermission="setting:stock:add">-->
<!--                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]-->
<!--            </a>-->
<!--            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',600)"-->
<!--               shiro:hasPermission="setting:stock:edit">-->
<!--                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]-->
<!--            </a>-->
<!--            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"-->
<!--               shiro:hasPermission="setting:stock:remove">-->
<!--                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]-->
<!--            </a>-->
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="setting:stock:import">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="setting:stock:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-table-editable-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('setting:stock:edit')}]];
    var removeFlag = [[${@permission.hasPermi('setting:stock:remove')}]];
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
    var prefix = ctx + "setting/stock";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    $(function () {
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{setting.stock.modelName}]],
            onEditableSave: onEditableSave,
            onEditableShown: function () {
                setTimeout(function () {
                    $(".form-control.input-sm").select();
                }, 100)
            },
            onEditableHidden: function () {
                $(".editable-submit").click()
            },
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.stock.id}]],
                    visible: false
                },
                {
                    field: 'stockDate',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.stock.stockDate}]],
                },
                {
                    field: 'barCode',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                    title: [[#{setting.stock.barCode}]],
                },
                {
                    field: 'validTime',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.stock.validTime}]],
                },
                {
                    field: 'mixArea',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.stock.mixArea}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(mixAreaDatas, value);
                    }
                },
                {
                    field: 'glue',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    title: [[#{setting.stock.glue}]],
                },
                {
                    field: 'stockNum',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    title: [[#{setting.stock.stockNum}]],
                    // editable: {
                    //     type: 'text',
                    //     title: [[#{setting.stock.stockNum}]],
                    //     emptytext: '-',
                    //     validate: function (value) {
                    //         if ($.common.isEmpty(value)) {
                    //             layer.msg([[#{ui.notNull}]]);
                    //             return [[#{ui.notNull}]];
                    //         }
                    //         // 输入非负整数正则校验
                    //         var regu = /^\d+$/;
                    //         if (!regu.test(value)) {
                    //             layer.msg([[#{ui.message.editable.digits}]]);
                    //             return [[#{ui.message.editable.digits}]];
                    //         }
                    //         if (value.length > 7) {
                    //             layer.msg([[#{ui.message.editable.maxSeven}]]);
                    //             return [[#{ui.message.editable.maxSeven}]];
                    //         }
                    //     }
                    // },
                },
                {
                    field: 'stockWeight',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    title: [[#{setting.stock.stockWeightNum}]],
                    // editable: {
                    //     type: 'text',
                    //     title: [[#{setting.stock.stockWeightNum}]],
                    //     emptytext: '-',
                    //     validate: function (value) {
                    //         if ($.common.isEmpty(value)) {
                    //             layer.msg([[#{ui.notNull}]]);
                    //             return [[#{ui.notNull}]];
                    //         }
                    //         // 正则匹配小数点前可七位，小数点后可三位
                    //         var regu = /^([0-9]{1,7})(\.[0-9]{1,3})?$/;
                    //         if (!regu.test(value)) {
                    //             layer.msg([[#{ui.message.editable.number}]]);
                    //             return [[#{ui.message.editable.number}]];
                    //         }
                    //         //不能超过最大值
                    //         let max=9999999;
                    //         if(max<value){
                    //             layer.msg([[#{ui.message.editable.number}]]);
                    //             return [[#{ui.message.editable.number}]];
                    //         }
                    //     }
                    // },
                },
                {
                    field: 'safeStock',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    title: [[#{setting.stock.safeStock}]],
                    editable: {
                        type: 'text',
                        title: [[#{setting.stock.safeStock}]],
                        emptytext: '-',
                        validate: function (value) {
                            // 输入非负整数正则校验
                            var regu = /^\d+$/;
                            if (!regu.test(value) && $.common.isNotEmpty(value)) {
                                layer.msg([[#{ui.message.editable.digits}]]);
                                return [[#{ui.message.editable.digits}]];
                            }
                            if (value.length > 7) {
                                layer.msg([[#{ui.message.editable.maxSeven}]]);
                                return [[#{ui.message.editable.maxSeven}]];
                            }
                        }
                    },
                },
                {
                    field: 'remark',
                    sortable: true,
                    halign: 'center',
                    align: 'left',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                    title: [[#{ui.remark}]],
                },
                // {
                //     title: [[#{ui.data.btn.option}]],
                //     align: 'center',
                //     formatter: function (value, row, index) {
                //         var actions = [];
                //         actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\',600)"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                //         actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                //         return actions.join('');
                //     }
                // }
                ]
        };
        $.table.init(options);
    });

    function onEditableSave(field, row, rowIndex, oldValue, $el) {
        if ($.common.equals(field, "safeStock") && $.common.isEmpty(row.safeStock) && $.common.isNotEmpty(oldValue)) {
            row['safeStock'] = 0;
        }
        $.operate.updateRow(prefix + "/save", "post", row, rowIndex, function (result) {
            if (result.code == web_status.FAIL) {
                $("#" + table.options.id).bootstrapTable('updateCell', {
                    index: rowIndex,
                    field: field,
                    value: oldValue
                });
            } else if (result.code == web_status.SUCCESS) {
                var resArray = result.data;
                if (resArray) {
                    //更新列表上相同密炼区和胶料名称的安全库存
                    $.each(resArray, function (key, value) {
                        $("#" + table.options.id).bootstrapTable('updateByUniqueId', {
                            id: value.id,
                            row: value
                        });
                    });
                }
            }
        });
    }


    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isOverwriteExistStock}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
<style>
    .popover-title {
        padding: 8px 14px;
        margin: 0 !important;
        font-size: 14px;
        background-color: #FFFFFF;
        border-bottom: 1px solid #ebebeb;
        color: #808080;
        border-radius: 5px 5px 0 0;
    }

    .editable-input {
        vertical-align: top;
        display: inline-block;
        width: auto;
        white-space: normal;
        zoom: 1;
        color: #808080;
    }

    .popover-content {
        padding: 5px;
        background-color: #F0F0F0;
    }

    .popover ::after {
        border-style: none;
    }

    .popover {
        width: 340px;
        background-color: #E7E7E7;
        color: #808080;
    }

    .pagination-detail {
        margin-top: 0 !important;
        margin-bottom: 0 !important;
    }

    .select-table {
        padding-bottom: 0 !important;
    }

    button.btn.btn-default.btn-sm.editable-cancel {
        display: none
    }
</style>
</html>
