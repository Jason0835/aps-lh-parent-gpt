<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改硫磺辅料耗损率设定')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-lhflLossSetting-edit" th:object="${lhflLossSetting}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflLossSetting.mixArea}]]：</label>
            <div class="col-sm-8">
                <select id="mixArea" name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"
                        required="true" onchange="getMachines()">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{mixArea}"
                    ></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.lhflLossSetting.materialName}]]：</label>
            <div class="col-sm-8">
                <input name="materialName" th:field="*{materialName}" class="form-control AccessoriesNames"
                       autocomplete="off"
                       type="text" maxlength="50">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.lhflLossSetting.machineName}]]：</label>
            <div class="col-sm-8">
                <select class="form-control" id="machineCode" name="machineCode">
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflLossSetting.lossRate}]]：</label>
            <div class="col-sm-8">
                <input name="lossRate" th:field="*{lossRate}" class="form-control" type="text"
                       required="true"
                       number="true"
                       min="0" , max="9999.99">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/lhflLossSetting";

    //获取辅料名称列表
    var datas = [[${@setting.getAccessoriesNames()}]];
    $('.AccessoriesNames').typeahead({
        source: datas,
        autoSelect: false,
    });


    $(function () {
        getMachines()
    });

    //获取机台下拉框
    function getMachines() {
        var mixArea = $("#mixArea").val();
        if ($.common.isEmpty(mixArea)) {
            return;
        }
        var config = {
            url: "/setting/lhflMachine/getMachines",
            type: "post",
            dataType: "json",
            data: {"mixArea": mixArea},
            success: function (result) {
                if (result.code == web_status.SUCCESS) {
                    var machines = result.data;
                    var rSelect = ("<option value = ''>" + [[#{ui.frame.btn.all}]] + "</option>");
                    var select = [[${lhflLossSetting.machineCode}]] + "";
                    for (var i = 0; i < machines.length; i++) {
                        if (select == machines[i].machineCode) {
                            rSelect += ("<option value = '" + machines[i].machineCode + "' selected>" + machines[i].machineName + "</option>");
                        } else {
                            rSelect += ("<option value = '" + machines[i].machineCode + "'>" + machines[i].machineName + "</option>");

                        }
                    }
                    $("#machineCode").empty();
                    $("#machineCode").append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }

    $("#form-lhflLossSetting-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            if ($("#id").val() == null || $("#id").val() == '') {
                $.operate.save(prefix + "/save", $('#form-lhflLossSetting-edit').serialize());
            } else {
                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-lhflLossSetting-edit').serializeArray());
            }
        }
    }
</script>
</body>
</html>
