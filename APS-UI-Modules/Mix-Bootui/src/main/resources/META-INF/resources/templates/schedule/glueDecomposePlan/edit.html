<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改分解胶料需求量')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-glueDecomposePlan-edit" th:object="${glueDecomposePlan}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <input id="planQty" name="planQty" th:field="*{planQty}" type="hidden">
        <input id="stockQty" name="stockQty" th:field="*{stockQty}" type="hidden">
        <input id="safeStockQty" name="safeStockQty" th:field="*{safeStockQty}" type="hidden">
        <input id="isFinishing" name="isFinishing" th:field="*{isFinishing}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.glueDecomposePlan.planDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input name="planDate" th:value="${#dates.format(glueDecomposePlan.planDate, 'yyyy-MM-dd')}"
                           class="form-control time-input" placeholder="yyyy-MM-dd" type="text" th:disabled="${glueDecomposePlan.id != null}" required>
                    <input name="planDate" th:value="${#dates.format(glueDecomposePlan.planDate, 'yyyy-MM-dd')}"
                           class="form-control time-input" placeholder="yyyy-MM-dd" type="hidden">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.glueDecomposePlan.mixArea}]]：</label>
            <div class="col-sm-8">
                <input name="mixArea" th:value="${glueDecomposePlan.mixArea}" type="hidden"/>
                <select id="mixArea" class="form-control" name="mixArea" th:with="type=${@setting.scheduleMixAreaPermission()}" onchange="getMachines()" th:disabled="${glueDecomposePlan.id != null}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                            th:value="${dict.dictValue}" th:field="*{mixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.glueDecomposePlan.glue}]]：</label>
            <div class="col-sm-8">
                <input name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off" type="text" th:readonly="${glueDecomposePlan.id != null}"
                       maxlength="30" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{schedule.glueDecomposePlan.produceQty}]]：</label>
            <div class="col-sm-8">
                <input name="produceQty" th:value="*{@nf.stripZeros(produceQty)}" class="form-control" type="text" digits="true" min="0"
                       max="9999999" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machine.machineName}]]：</label>
            <div class="col-sm-8">
                <select class="form-control select2-multiple" id="machineCode"
                        name="machineCode" th:data-none-selected-text="#{ui.frame.btn.choose}"
                        required th:disabled="${isDisabled}">
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/glueDecomposePlan";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
        items: 6
    });


    $("#form-glueDecomposePlan-edit").validate({
        focusCleanup: true
    });

    $(function () {
        getMachines();
    });

    //获取机台下拉框
    function getMachines(){
        var mixArea=$("#mixArea").val();
        var glue = $("#glue").val();
        if ($.common.isEmpty(glue) || $.common.isEmpty(mixArea)) {
            var $machineCode = $("#machineCode");
            $machineCode.empty();
            $machineCode.append("<option value='' disabled>" + [[#{ui.message.filterMachine.mixAreaAndGlueNotNull}]] + "</option>");
            return ;
        }
        var config = {
            url: "/setting/formulaMachine/getFormulaMachineList",
            type: "post",
            dataType: "json",
            data: {"mixArea": mixArea, "glue": glue},
            success: function (result) {
                if (result.code === web_status.SUCCESS){
                    var machines=result.data;
                    var rSelect = '';
                    var select = [[${glueDecomposePlan.machineCode}]] + "";
                    var selets = select.split(",");
                    for(var i = 0; i < machines.length; i++){
                        for(var key in selets){
                            if(selets[key] === machines[i].machineCode){
                                machines[i].isSelected = true;
                            }
                        }
                    }
                    for (var j = 0; j < machines.length; j++) {
                        if (machines[j].isSelected){
                            rSelect += ("<option value = '"+machines[j].machineCode+"' selected>"+machines[j].machineName+"</option>");
                        }else {
                            rSelect += ("<option value = '"+machines[j].machineCode+"'>"+machines[j].machineName+"</option>");
                        }
                    }
                    if ($.common.isEmpty(rSelect)) {
                        rSelect = "<option value='' disabled>" + [[#{ui.message.filterMachine.noGlueMachine}]] + "</option>";
                    }
                    var $machineCode = $("#machineCode");
                    $machineCode.empty();
                    $machineCode.append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }

    function submitHandler() {
        if ($.validate.form()) {
            var serializeArray = $('#form-glueDecomposePlan-edit').serializeArray();
            if (Boolean([[${isDisabled}]])) {
                let machineCode = $("#machineCode option:selected").val();
                serializeArray.push({name: 'machineCode', value: machineCode});
            }
            $.operate.saveUpdateParentRow(prefix + "/save", serializeArray, function (result) {
                if (result.code === web_status.SUCCESS) {
                    var parent = window.parent;
                    var updateList = result.data;
                    for (let i = 0; i < updateList.length; i++) {
                        let item = updateList[i];
                        parent.$("#" + parent.table.options.id).bootstrapTable('updateByUniqueId', {
                            id: item.id,
                            row: item
                        });
                    }
                }
            });
        }
    }
</script>
</body>
</html>
