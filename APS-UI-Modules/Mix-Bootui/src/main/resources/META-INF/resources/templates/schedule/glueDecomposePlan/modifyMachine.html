<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改母炼胶机台')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-glueDecomposePlan-edit" th:object="${glueDecomposePlan}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <input name="planDate" th:value="${#dates.format(glueDecomposePlan.planDate, 'yyyy-MM-dd')}" type="hidden">
        <input id="glue" name="glue" th:field="*{glue}" type="hidden">
        <input id="mixArea" name="mixArea" th:field="*{mixArea}" type="hidden">
        <input id="planQty" name="planQty" th:field="*{planQty}" type="hidden">
        <input id="safeStockQty" name="safeStockQty" th:field="*{safeStockQty}" type="hidden">
        <input id="produceQty" name="produceQty" th:field="*{produceQty}" type="hidden">
        <input id="remark" name="remark" th:field="*{remark}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machine.machineName}]]：</label>
            <div class="col-sm-8">
                <select class="form-control select2-multiple" id="machineCode"
                        name="machineCode" required>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/glueDecomposePlan";
    $("#form-glueDecomposePlan-edit").validate({
        focusCleanup: true
    });

    $(function () {
        getMachines();
    });

    //获取机台下拉框
    function getMachines(){
        var mixArea=$("#mixArea").val();
        var glue = $("#glue").val();
        if ($.common.isEmpty(glue) || $.common.isEmpty(mixArea)) {
            var $machineCode = $("#machineCode");
            $machineCode.empty();
            $machineCode.append("<option value='' disabled>" + [[#{ui.message.filterMachine.mixAreaAndGlueNotNull}]] + "</option>");
            return ;
        }
        var config = {
            url: "/setting/formulaMachine/getFormulaMachineList",
            type: "post",
            dataType: "json",
            data: {"mixArea": mixArea, "glue": glue},
            success: function (result) {
                if (result.code === web_status.SUCCESS){
                    var machines=result.data;
                    var rSelect = '';
                    rSelect += "<option value='' disabled selected>" + [[#{ui.frame.btn.choose}]] + "</option>";
                    for (var j = 0; j < machines.length; j++) {
                        rSelect += ("<option value = '"+machines[j].machineCode+"'>"+machines[j].machineName+"</option>");
                    }
                    if ($.common.isEmpty(rSelect)) {
                        rSelect = "<option value='' disabled>" + [[#{ui.message.filterMachine.noGlueMachine}]] + "</option>";
                    }
                    var $machineCode = $("#machineCode");
                    $machineCode.empty();
                    $machineCode.append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }

    function submitHandler() {
        if ($.validate.form()) {
            var data = $('#form-glueDecomposePlan-edit').serializeArray();
            if (data.filter(item => item.name === 'machineCode').length > 1) {
                $.modal.alertWarning([[#{schedule.glueDecomposePlan.modifyMachine.chooseOne}]]);
                return;
            }
            var machineName = $("#machineCode option:selected").text();
            data.push({name: "machineName", value: machineName});
            $.operate.saveNoRefresh(prefix + "/save", data, function (result) {
                if (result.code === web_status.SUCCESS) {
                    var parent = window.parent;
                    var updateList = result.data;
                    for (let i = 0; i < updateList.length; i++) {
                        let item = updateList[i];
                        parent.$("#" + parent.table.options.id).bootstrapTable('updateByUniqueId', {
                            id: item.id,
                            row: item
                        });
                    }
                }
            });
        }
    }
</script>
</body>
</html>
