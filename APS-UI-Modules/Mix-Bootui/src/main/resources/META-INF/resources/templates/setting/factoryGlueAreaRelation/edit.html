<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改分厂胶料与密炼区对应')" />
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-factoryGlueAreaRelation-edit" th:object="${tFactoryGlueAreaRelation}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{setting.factoryGlueAreaRelation.factory}]]：</label>
                <div class="col-sm-8">
	                <select name="factory" class="form-control" th:with="type=${@dict.getType('FACTORY')}"  required="true">
	                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
	                            th:field="*{factory}"></option>
	                </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{setting.factoryGlueAreaRelation.glue}]]：</label>
                <div class="col-sm-8">
	                <input name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off" type="text"
	                       required="true" maxlength="30">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{setting.factoryGlueAreaRelation.mixArea}]]：</label>
                <div class="col-sm-8">
	                <select name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"  required="true">
	                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
	                            th:field="*{mixArea}"></option>
	                </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{setting.factoryGlueAreaRelation.remark}]]：</label>
                <div class="col-sm-8">
                	<textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
	<th:block th:include="include :: footer"/>
	<th:block th:include="include :: select2-js"/>
	<th:block th:include="include :: bootstrap-select-js"/>
	<th:block th:include="include :: bootstrap-suggest-js"/>
	<th:block th:include="include :: bootstrap-typeahead-js"/>
    <script th:inline="javascript">
        var prefix = ctx + "setting/factoryGlueAreaRelation";
	
	    //获取胶料名称列表
	    var datas = [[${@setting.getGlueNames()}]];
	    $('.GlueNames').typeahead({
	        source: datas,
	        autoSelect: false,
	    });
	    
        $("#form-factoryGlueAreaRelation-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
	            if ($("#id").val() == null || $("#id").val() == '') {
                	$.operate.save(prefix + "/save", $('#form-factoryGlueAreaRelation-edit').serialize());
	            } else {
	                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-factoryGlueAreaRelation-edit').serializeArray());
	            }
            }
        }
	</script>
</body>
</html>
