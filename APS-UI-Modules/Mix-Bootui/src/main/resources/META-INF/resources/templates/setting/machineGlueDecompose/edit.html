<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改密炼机指定胶料分解')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-machineGlueDecompose-edit" th:object="${machineGlueDecompose}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machineGlueDecompose.mixArea}]]：</label>
            <div class="col-sm-8">
                <!--对于添加了disabled="disabled"的值传不到后台问题，在此新增一个hidden的input框，用于传值-->
                <!--<input id="mixArea2" name="mixArea" th:field="*{mixArea}" hidden>-->
                <select id="mixArea" name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"
                        required="true" onchange="getMachines()">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{mixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machineGlueDecompose.glue}]]：</label>
            <div class="col-sm-8">
                <input id="glue" name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off" type="text"
                       maxlength="30" required="true" onchange="getMachines()">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.machineGlueDecompose.machineName}]]：</label>
            <div class="col-sm-8">
                <select class="form-control" id="machineCode" name="machineCode" required>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue1}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue1" th:field="*{motherGlue1}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue2}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue2" th:field="*{motherGlue2}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue3}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue3" th:field="*{motherGlue3}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue4}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue4" th:field="*{motherGlue4}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue5}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue5" th:field="*{motherGlue5}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue6}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue6" th:field="*{motherGlue6}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue7}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue7" th:field="*{motherGlue7}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue8}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue8" th:field="*{motherGlue8}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machineGlueDecompose.motherGlue9}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue9" th:field="*{motherGlue9}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/machineGlueDecompose";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });


    $(function () {
        getMachines()
    });

    //获取机台下拉框
    function getMachines() {
        var mixArea = $("#mixArea").val();
        var glue = $("#glue").val();
        if ($.common.isEmpty(glue) || $.common.isEmpty(mixArea)) {
            var $machineCode = $("#machineCode");
            $machineCode.empty();
            $machineCode.append("<option value='' disabled>" + [[#{ui.message.filterMachine.mixAreaAndGlueNotNull}]] + "</option>");
            return ;
        }
        var config = {
            url: "/setting/MesPmtRecipe/selectMesPmtRecipeMachine",
            type: "post",
            dataType: "json",
            data: {"mixArea": mixArea, "recipeMaterialName": glue},
            success: function (result) {
                if (result.code == web_status.SUCCESS) {
                    var machines = result.data;
                    var rSelect = '';
                    var select = [[${machineGlueDecompose.machineCode}]] + "";
                    for (var i = 0; i < machines.length; i++) {
                        if (select == machines[i].recipeEquipCode) {
                            rSelect += ("<option value = '" + machines[i].recipeEquipCode + "' selected>" + machines[i].machineName + "</option>");
                        } else {
                            rSelect += ("<option value = '" + machines[i].recipeEquipCode + "'>" + machines[i].machineName + "</option>");

                        }
                    }
                    if ($.common.isEmpty(rSelect)) {
                        rSelect = "<option value='' disabled>" + [[#{ui.message.recipeMachine.noGlueMachine}]] + "</option>";
                    }
                    $("#machineCode").empty();
                    $("#machineCode").append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }

    function submitHandler() {
        if ($.validate.form()) {
            if ($("#id").val() == null || $("#id").val() == '') {//新增
                $.operate.save(prefix + "/save", $('#form-machineGlueDecompose-edit').serialize());
            } else { //编辑
                var serializeArray = $('#form-machineGlueDecompose-edit').serializeArray();
                var machineName = $("#machineCode option:selected").text();
                serializeArray.push({name: "machineName", value: machineName});
                $.operate.saveUpdateParentRow(prefix + "/save", serializeArray);
            }
        }
    }
</script>
</body>
</html>
