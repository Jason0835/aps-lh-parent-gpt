<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('物料列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <th:block th:include="include :: bootstrap-editable-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{setting.material.materialCode}]]：</label>
                            <input type="text" name="materialCode"/>
                        </li>
                        <li>
                            <label>[[#{setting.material.materialName}]]：</label>
                            <div class="neat">
                                <input type="text" name="materialName" class="MaterialNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <label>[[#{setting.material.glueType}]]：</label>
                            <select class="form-control" name="glueType" th:with="type=${@dict.getType('GLUE_TYPE')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option value="NULL">&nbsp;</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-primary single disabled" onclick="$.operate.edit()"
               shiro:hasPermission="setting:material:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-table-editable-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('setting:material:edit')}]];
    var removeFlag = [[${@permission.hasPermi('setting:material:remove')}]];
    var prefix = ctx + "setting/material";
    var glueType = [[${@dict.getType('GLUE_TYPE')}]];
    var majorType = [[${@dict.getType('MAJOR_TYPE')}]];

    //获取物料名称列表
    var datas = [[${@setting.getMaterialNames()}]];
    $('.MaterialNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    $(function () {
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            chooseGlueUrl: prefix + "/toChooseGlue/{id}",
            modalName: [[#{setting.material.modelName}]],
            onEditableSave: onEditableSave,
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: [[#{setting.material.id}]],
                    visible: false
                },
                {
                    field: 'materialCode',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 8,
                    title: [[#{setting.material.materialCode}]],
                },
                {
                    field: 'materialName',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.material.materialName}]],
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                },
                {
                    field: 'erpCode',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.material.erpCode}]],
                },
                {
                    field: 'sapMaterialCode',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.material.sapMaterialCode}]],
                },

                {
                    field: 'materialGroup',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.material.materialGroup}]],
                },
                {
                    field: 'minparkTime',
                    sortable: true,
                    halign: 'center',
                    align: 'right',
                    widthUnit: '%',
                    width: 5,
                    title: [[#{setting.material.minparkTime}]],
                },
                {
                    field: 'majorType',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{setting.material.majorType}]],
                    formatter: function (value, row, index) {
                        return $.table.selectDictLabel(majorType, value);
                    }
                },
                {
                    field: 'glueType',
                    sortable: true,
                    halign: 'center',
                    align: 'center',
                    widthUnit: '%',
                    width: 5,
                    title: [[#{setting.material.glueType}]],
                    formatter: function (value, row, index) {
                        if (value == '' || value == undefined) {
                            return '-';
                        }
                        return value;
                    },
                    editable: {
                        type: 'select',
                        title: [[#{setting.material.glueType}]],
                        emptytext: '-',
                        source: function () {
                            var result = [];
                            result.push({value: '', text: ''});
                            $.each(glueType, function (key, value) {
                                result.push({value: value.dictValue, text: value.dictLabel});
                            });
                            return result;
                        }
                    },
                    /* formatter: function (value, row, index) {
                         var actions = [];
                         if ($.common.isEmpty(value)) {
                             actions.push('<a href="javascript:void(0)" onclick="chooseGlueType(\'' + row.id + '\',\'' + index + '\')">' +[[#{ui.frame.btn.choose}]] + [[#{setting.material.glueType}]] + '</a> ');
                             return actions.join('');
                         }
                         var machineName = $.table.selectDictLabel(glueType, value);
                         actions.push('<a href="javascript:void(0)" onclick="chooseGlueType(\'' +row.id+ '\',\'' + index + '\')">' + machineName + '</a> ');
                         return actions.join('');
                     },*/
                },
                {
                    field: 'remark',
                    sortable: true,
                    halign: 'center',
                    widthUnit: '%',
                    width: 20,
                    title: [[#{ui.common.column.remark}]],
                    align: 'left',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 20);
                    },
                },
                {
                    title: [[#{ui.data.btn.option}]],
                    align: 'center',
                    widthUnit: '%',
                    width: 10,
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }

    function chooseGlueType(id) {
        url = table.options.chooseGlueUrl.replace("{id}", id);
        $.modal.open(table.options.modalName, url, 450, 350);
    }

    //行内编辑保存
    function onEditableSave(field, row, rowIndex, oldValue, $el) {
        // 安全库存编辑
        if (field === 'glueType') {
            $.operate.updateRow(prefix + "/save", "post", row, rowIndex, function (result) {
                if (result.code == web_status.FAIL) {
                    $("#" + table.options.id).bootstrapTable('updateCell', {
                        index: rowIndex,
                        field: field,
                        value: oldValue
                    });
                }
            });
        }
    }


</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
<style>
    .popover-title {
        padding: 8px 14px;
        margin: 0 !important;
        font-size: 14px;
        background-color: #FFFFFF;
        border-bottom: 1px solid #ebebeb;
        color: #808080;
        border-radius: 5px 5px 0 0;
    }

    .editable-input {
        vertical-align: top;
        display: inline-block;
        width: auto;
        white-space: normal;
        zoom: 1;
        color: #808080;
    }

    .popover-content {
        padding: 5px;
        background-color: #F0F0F0;
    }

    .popover ::after {
        border-style: none;
    }

    .popover {
        width: 340px;
        background-color: #E7E7E7;
        color: #808080;
    }

    .pagination-detail {
        margin-top: 0 !important;
        margin-bottom: 0 !important;
    }

    .select-table {
        padding-bottom: 0 !important;
    }

    button.btn.btn-default.btn-sm.editable-cancel {
        display: none
    }
</style>
</html>
