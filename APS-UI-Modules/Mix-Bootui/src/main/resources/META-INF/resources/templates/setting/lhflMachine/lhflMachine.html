<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('小料机台信息列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{setting.lhflMachine.machineName}]]：</label>
                            <input type="text" name="machineName"/>
                        </li>
                        <li>
                            <label>[[#{setting.lhflMachine.mixArea}]]：</label>
                            <select class="form-control" name="mixArea" th:with="type=${@dict.getType('MIX_AREA')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{setting.machine.status}]]：</label>
                            <select class="form-control" name="status" th:with="type=${@dict.getType('STATUS')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add('',500)" shiro:hasPermission="setting:lhflMachine:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',500)"
               shiro:hasPermission="setting:lhflMachine:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
           <!-- <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="setting:lhflMachine:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>-->
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="setting:lhflMachine:import">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="setting:lhflMachine:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('setting:lhflMachine:edit')}]];
    var removeFlag = [[${@permission.hasPermi('setting:lhflMachine:remove')}]];
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
    var machineStatus = [[${@dict.getType('STATUS')}]];
    var classShiftDatas = [[${@dict.getType('LH_CLASS_SHIFT')}]];
    var prefix = ctx + "setting/lhflMachine";

    $(function () {
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{setting.lhflMachine.modelName}]],
            columns: [
            	[
		            {
		                checkbox: true,
                        valign: 'middle',
                        rowspan: 2
		            },
	                {
	                    field: 'id',
	                    title: [[#{setting.lhflMachine.id}]],
                        rowspan: 2,
	                    visible: false
	                },
	                {
	                    field: 'mixArea',
	                    halign: 'center',
	                    align: 'center',
                        valign: 'middle',
	                    sortable: true,
	                    widthUnit: '%',
	                    width: 8,
                        rowspan: 2,
	                    title: [[#{setting.lhflMachine.mixArea}]],
	                    formatter: function (value, row, index) {
	                        return $.table.selectDictLabel(mixAreaDatas, value);
	                    }
	                },
	                {
	                    field: 'machineCode',
	                    sortable: true,
	                    halign: 'center',
	                    align: 'center',
                        valign: 'middle',
	                    widthUnit: '%',
	                    width: 15,
                        rowspan: 2,
	                    title: [[#{setting.lhflMachine.machineCode}]],
	                },
	                {
	                    field: 'machineName',
	                    sortable: true,
	                    halign: 'center',
	                    align: 'center',
                        valign: 'middle',
	                    widthUnit: '%',
	                    width: 15,
                        rowspan: 2,
	                    title: [[#{setting.lhflMachine.machineName}]],
	                },
	                {
	                    field: 'classShift',
	                    halign: 'center',
	                    align: 'center',
                        valign: 'middle',
	                    sortable: true,
	                    widthUnit: '%',
	                    width: 10,
                        rowspan: 2,
	                    title: [[#{setting.lhflMachine.classShift}]],
	                    formatter: function (value, row, index) {
	                        return $.table.selectDictLabel(classShiftDatas, value);
	                    }
	                },
	                {
	                    field: 'capacity',
	                    sortable: true,
	                    halign: 'center',
	                    align: 'right',
                        valign: 'middle',
	                    widthUnit: '%',
	                    width: 15,
                        rowspan: 2,
	                    title: [[#{setting.lhflMachine.capacity}]],
	                },
	                {
	                    field: 'status',
	                    sortable: true,
	                    halign: 'center',
	                    align: 'center',
                        valign: 'middle',
	                    widthUnit: '%',
	                    width: 5,
                        rowspan: 2,
	                    title: [[#{setting.machine.status}]],
	                    formatter: function (value, row, index) {
	                        return statusTools(row);
	                    },
	                },
                    {
                        title: [[#{setting.machine.classShift.status.title}]],
                        align: 'center',
                        valign: 'middle',
                        colspan: 3,
                    },
                    {
                        title: [[#{ui.biz.user.other.info}]],
                        align: 'center',
                        valign: 'middle',
                        colspan: 2,
                    },
                ],
                [
                    {
                        field: 'midStatus',
                        halign: 'center',
                        align: 'center',
                        valign: 'middle',
                        width: 5,
                        widthUnit: '%',
                        title: [[#{setting.machine.mid}]],
                        formatter: function (value, row, index) {
                            return midStatusTools(row);
                        },
                    },
                    {
                        field: 'nightStatus',
                        halign: 'center',
                        align: 'center',
                        valign: 'middle',
                        width: 5,
                        widthUnit: '%',
                        title: [[#{setting.machine.night}]],
                        formatter: function (value, row, index) {
                            return nightStatusTools(row);
                        },
                    },
                    {
                        field: 'dayStatus',
                        halign: 'center',
                        align: 'center',
                        valign: 'middle',
                        width: 5,
                        widthUnit: '%',
                        title: [[#{setting.machine.day}]],
                        formatter: function (value, row, index) {
                            return dayStatusTools(row);
                        },
                    },
	                {
	                    field: 'remark',
	                    sortable: true,
	                    halign: 'center',
	                    title: [[#{ui.common.column.remark}]],
	                    align: 'left',
	                    widthUnit: '%',
	                    width: 20,
	                    formatter: function (value, row, index) {
	                        return $.table.tooltip(value, 20);
	                    },
	                },
	                {
	                    title: [[#{ui.data.btn.option}]],
	                    align: 'center',
	                    widthUnit: '%',
	                    width: 10,
	                    formatter: function (value, row, index) {
	                        var actions = [];
	                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\',500)"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
	                        /*actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');*/
	                        return actions.join('');
	                    }
	                }
	            ]
	        ]
        };
        $.table.init(options);
    });

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
    /* 状态显示 */
    function statusTools(row) {
        var datas=JSON.stringify(row)
        if (row.status =='1') {
            return "<i class=\"fa fa-toggle-off text-info fa-2x\" onclick='enable("+ datas + ")'></i> ";
        } else {
            return "<i class=\"fa fa-toggle-on text-info fa-2x\" onclick='disable("+ datas + ")'></i> ";
        }
    }

    /*停用 */
    function disable(datas) {
        $.modal.confirm([[#{ui.biz.alter.isStop}]], function() {
            datas.status = '1';
            datas.midStatus = '1';
            datas.nightStatus = '1';
            datas.dayStatus = '1';
            $.operate.postSwitch(prefix + "/save", datas);
        })
    }

    /*启用 */
    function enable(datas) {
        $.modal.confirm([[#{ui.biz.alter.isOpen}]], function() {
            datas.status = '0';
            $.operate.postSwitch(prefix + "/save", datas);
        })
    }

    function midStatusTools(row) {
        var datas = JSON.stringify(row);
        if (row.midStatus == '1') {
            return "<i class=\"fa fa-toggle-off text-info fa-2x\" onclick='enableMidStatus(" + datas + ", this)'></i> ";
        } else {
            return "<i class=\"fa fa-toggle-on text-info fa-2x\" onclick='disableMidStatus(" + datas + ", this)'></i> ";
        }
    }

    function enableMidStatus(datas, $ele) {
        $.modal.confirm([[#{ui.biz.alter.isOpen}]], function() {
            datas.midStatus = '0';
            datas.status = '0';
            $.operate.postSwitch(prefix + "/save", datas, $ele, 'fa-toggle-off', 'fa-toggle-on', 'disableMidStatus');
        })
    }

    function disableMidStatus(datas, $ele) {
        $.modal.confirm([[#{ui.biz.alter.isStop}]], function () {
            datas.midStatus = '1';
            $.operate.postSwitch(prefix + "/save", datas, $ele, 'fa-toggle-on', 'fa-toggle-off', 'enableMidStatus');
        })
    }

    function nightStatusTools(row) {
        var datas = JSON.stringify(row);
        if (row.nightStatus == '1') {
            return "<i class=\"fa fa-toggle-off text-info fa-2x\" onclick='enableNightStatus(" + datas + ", this)'></i> ";
        } else {
            return "<i class=\"fa fa-toggle-on text-info fa-2x\" onclick='disableNightStatus(" + datas + ", this)'></i> ";
        }
    }

    function enableNightStatus(datas, $ele) {
        $.modal.confirm([[#{ui.biz.alter.isOpen}]], function() {
            datas.nightStatus = '0';
            datas.status = '0';
            $.operate.postSwitch(prefix + "/save", datas, $ele, 'fa-toggle-off', 'fa-toggle-on', 'disableNightStatus');
        })
    }

    function disableNightStatus(datas, $ele) {
        $.modal.confirm([[#{ui.biz.alter.isStop}]], function () {
            datas.nightStatus = '1';
            $.operate.postSwitch(prefix + "/save", datas, $ele, 'fa-toggle-on', 'fa-toggle-off', 'enableNightStatus');
        })
    }
    
    function dayStatusTools(row) {
        var datas = JSON.stringify(row);
        if (row.dayStatus == '1') {
            return "<i class=\"fa fa-toggle-off text-info fa-2x\" onclick='enableDayStatus(" + datas + ", this)'></i> ";
        } else {
            return "<i class=\"fa fa-toggle-on text-info fa-2x\" onclick='disableDayStatus(" + datas + ", this)'></i> ";
        }
    }

    function enableDayStatus(datas, $ele) {
        $.modal.confirm([[#{ui.biz.alter.isOpen}]], function() {
            datas.dayStatus = '0';
            datas.status = '0';
            $.operate.postSwitch(prefix + "/save", datas, $ele, 'fa-toggle-off', 'fa-toggle-on', 'disableDayStatus');
        })
    }

    function disableDayStatus(datas, $ele) {
        $.modal.confirm([[#{ui.biz.alter.isStop}]], function () {
            datas.dayStatus = '1';
            $.operate.postSwitch(prefix + "/save", datas, $ele, 'fa-toggle-on', 'fa-toggle-off', 'enableDayStatus');
        })
    }
    
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
