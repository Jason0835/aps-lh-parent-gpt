<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改终炼母炼分解')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-decompose-edit" th:object="${glueDecompose}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.decompose.glue}]]：</label>
            <div class="col-sm-8">
                <input name="glue" th:field="*{glue}" class="form-control GlueNames" autocomplete="off" type="text"
                       maxlength="30" required="true" onblur="autoCreateMotherGlue();">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.decompose.segment}]]：</label>
            <div class="col-sm-8">
                <select id="segment" name="segment" class="form-control" th:with="type=${@dict.getType('SEGMENT')}"
                        required="true" onchange="autoCreateMotherGlue();">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{segment}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue1}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue1" th:field="*{motherGlue1}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue2}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue2" th:field="*{motherGlue2}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue3}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue3" th:field="*{motherGlue3}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue4}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue4" th:field="*{motherGlue4}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue5}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue5" th:field="*{motherGlue5}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue6}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue6" th:field="*{motherGlue6}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue7}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue7" th:field="*{motherGlue7}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue8}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue8" th:field="*{motherGlue8}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.decompose.motherGlue9}]]：</label>
            <div class="col-sm-8">
                <input name="motherGlue9" th:field="*{motherGlue9}" class="form-control GlueNames" autocomplete="off"
                       type="text" maxlength="30"
                >
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>

<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>

<script th:inline="javascript">
    var prefix = ctx + "setting/decompose";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false
    });

    $("#form-decompose-edit").validate({
        // 唯一性校验 start,如果是组合字段唯一删除即可
        onkeyup: false,
        rules: {
            glue: {
                remote: {
                    url: prefix + "/checkGlueDecomposeUnique",
                    type: "post",
                    dataType: "json",
                    data: {
                        "id": function () {
                            return $("#id").val();
                        },
                        "glue": function () {
                            return $.common.trim($("#glue").val());
                        }
                    },
                    dataFilter: function (data, type) {
                        return $.validate.unique(data);
                    }
                }
            },
        },
        messages: {
            "glue": {
                remote: [[#{setting.decompose.glue.unique}]]
            }
        },
        // 验证成功后调用的方法
      /*  success:function(label) {
            //自动调用创建母炼胶
            autoCreateMotherGlue();
        },*/
        // 唯一性校验 end
        focusCleanup: true
    });

    //前端部分进行母炼胶自动生成
    function autoCreateMotherGlue(){
        //获取母炼胶名称
        let glue = $("#glue").val();
        //获取段数
        let segment = $("#segment").val();
        if(glue==null||glue==''||glue==undefined||segment==null||segment==undefined){
            return;
        }
        let step=parseInt(segment);
        let max=step+1;
        //先对母炼胶数据进行清除
        $("input[name^='motherGlue']").each(function(){
           $(this).val('');
        });
        let domPrefix="motherGlue";
        for(var i=1;i<max;i++){
            if(i==segment){
                break;
            }
            let motherGlue=glue+'/'+segment+i;
            $('#'+domPrefix+i).val(motherGlue);
        }


    }

    function submitHandler() {
        if ($.validate.form()) {
            var segment = $("#segment").val();
            var motherGlue1 = $("#motherGlue1").val();
            var motherGlue2 = $("#motherGlue2").val();
            var motherGlue3 = $("#motherGlue3").val();
            var motherGlue4 = $("#motherGlue4").val();
            var motherGlue5 = $("#motherGlue5").val();
            var motherGlue6 = $("#motherGlue6").val();
            var motherGlue7 = $("#motherGlue7").val();
            var motherGlue8 = $("#motherGlue8").val();
            var motherGlue9 = $("#motherGlue9").val();
            var config = {
                url: prefix + "/checkComplete",
                type: "post",
                dataType: "json",
                data: {
                    "segment": segment,
                    "motherGlue1": motherGlue1,
                    "motherGlue2": motherGlue2,
                    "motherGlue3": motherGlue3,
                    "motherGlue4": motherGlue4,
                    "motherGlue5": motherGlue5,
                    "motherGlue6": motherGlue6,
                    "motherGlue7": motherGlue7,
                    "motherGlue8": motherGlue8,
                    "motherGlue9": motherGlue9
                },
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        if (result.msg == '0') {
                            $.modal.confirm([[#{setting.decompose.segment.checkMotherExists}]], function () {
                                if ($("#id").val() == null || $("#id").val() == '') {
                                    $.operate.save(prefix + "/save", $('#form-decompose-edit').serialize());
                                } else {
                                    $.operate.saveUpdateParentRow(prefix + "/save", $('#form-decompose-edit').serializeArray());
                                }
                            })
                        } else if (result.msg == '1') {
                            if ($("#id").val() == null || $("#id").val() == '') {
                                $.operate.save(prefix + "/save", $('#form-decompose-edit').serialize());
                            } else {
                                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-decompose-edit').serializeArray());
                            }
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }
    }
</script>
</body>
</html>
