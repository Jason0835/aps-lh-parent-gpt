<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改硫磺辅料跨区设置')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-lhflSpanSetting-edit" th:object="${lhflSpanSetting}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflSpanSetting.entrustMixArea}]]：</label>
            <div class="col-sm-8">
                <select id="entrustMixArea" name="entrustMixArea" class="form-control" th:with="type=${@setting.scheduleMixAreaPermission()}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{entrustMixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflSpanSetting.entrustedMixArea}]]：</label>
            <div class="col-sm-8">
                <select id="entrustedMixArea" name="entrustedMixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{entrustedMixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflSpanSetting.materialName}]]：</label>
            <div class="col-sm-8">
                <input name="materialName" th:field="*{materialName}" class="form-control AccessoriesNames"
                       autocomplete="off" type="text" maxlength="50" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/lhflSpanSetting";
    $("#form-lhflSpanSetting-edit").validate({
        focusCleanup: true
    });

    //获取辅料名称列表
    var datas = [[${@setting.getAccessoriesNames()}]];
    $('.AccessoriesNames').typeahead({
        source: datas,
        autoSelect: false,
        items: 7
    });

    function submitHandler() {
        if ($.validate.form()) {
            var entrustMixArea = $("#entrustMixArea option:selected").val();
            var entrustedMixArea = $("#entrustedMixArea option:selected").val();
            if (entrustMixArea === entrustedMixArea) {
                $.modal.alertWarning([[#{ui.message.spanSetting.sameMixArea}]]);
                return;
            }
            var id = $("#id").val();
            if ($.common.isEmpty(id)) {
                $.operate.save(prefix + "/save", $('#form-lhflSpanSetting-edit').serializeArray());
            }else {
                $.operate.saveUpdateParentRow(prefix + "/save", $('#form-lhflSpanSetting-edit').serializeArray());
            }
        }
    }
</script>
</body>
</html>
