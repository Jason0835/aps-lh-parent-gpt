<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('分厂胶料需求计划（初始表）列表')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li class="select-time">
                            <label>[[#{schedule.factoryGluePlanStatistics.planDate}]]：</label>
                            <input type="text" th:value="${initDate}" class="time-input" id="startTime" placeholder="开始时间"
                                   name="startTime"/>
                            <span>-</span>
                            <input type="text" th:value="${initDate}" class="time-input" id="endTime" placeholder="结束时间"
                                   name="endTime"/>
                        </li>
                        <li>
                            <label>[[#{schedule.factoryGluePlanStatistics.factory}]]：</label>
                            <select class="form-control" name="factory" th:with="type=${@dict.getType('FACTORY')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{schedule.factoryGluePlanStatistics.glue}]]：</label>
                            <div class="neat">
                                <input type="text" name="glue" class="GlueNames" autocomplete="off"/>
                            </div>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="schedule:factoryGluePlanStatistics:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-bordered">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/factoryGluePlanStatistics";

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    $(function () {
        var options = {
            url: prefix + "/list",
            exportUrl: prefix + "/export",
            modalName: [[#{schedule.factoryGluePlanStatistics.modelName}]],
            columns:
                [
                    [
                        {
                            title: [[#{ui.baseInfo}]],
                            align: 'center',
                            colspan: 4
                        },
                        {
                            title: [[#{schedule.common.midClass}]],
                            align: 'center',
                            colspan: 2
                        },
                        {
                            title: [[#{schedule.common.nightClass}]],
                            align: 'center',
                            colspan: 2
                        },
                        {
                            title: [[#{schedule.common.dayClass}]],
                            align: 'center',
                            colspan: 2
                        },
                    ],
                    [
                        {
                            field: 'id',
                            title: 'ID',
                            width: 3,
                            widthUnit: '%',
                            visible: false,
                        },
                        {
                            field: 'planDate',
                            sortable: true,
                            align: 'center',
                            width: 7,
                            widthUnit: '%',
                            title: [[#{schedule.factoryGluePlanStatistics.planDate}]],
                        },
                        {
                            field: 'glue',
                            sortable: true,
                            align: 'center',
                            width: 8,
                            widthUnit: '%',
                            title: [[#{schedule.factoryGluePlanStatistics.glue}]],
                        },
                        {
                            field: 'totalPlanQty',
                            sortable: true,
                            align: 'center',
                            width: 7,
                            widthUnit: '%',
                            title: [[#{schedule.factoryGluePlanStatistics.totalPlanQty}]],
                        },
                        {
                            field: 'midPlanQty',
                            sortable: true,
                            align: 'center',
                            width: 7,
                            widthUnit: '%',
                            title: [[#{ui.plan}]],
                        },
                        {
                            field: 'midRemark',
                            sortable: true,
                            align: 'center',
                            width: 18,
                            widthUnit: '%',
                            title: [[#{ui.remark}]],
                            formatter: function (value, row, index) {
                                return $.table.tooltip(value, 20);
                            },
                        },
                        {
                            field: 'nightPlanQty',
                            sortable: true,
                            align: 'center',
                            width: 7,
                            widthUnit: '%',
                            title: [[#{ui.plan}]],
                        },
                        {
                            field: 'nightRemark',
                            sortable: true,
                            align: 'center',
                            title: [[#{ui.remark}]],
                            width: 18,
                            widthUnit: '%',
                            formatter: function (value, row, index) {
                                return $.table.tooltip(value, 20);
                            },
                        },
                        {
                            field: 'dayPlanQty',
                            sortable: true,
                            align: 'center',
                            width: 7,
                            widthUnit: '%',
                            title: [[#{ui.plan}]],
                        },
                        {
                            field: 'dayRemark',
                            sortable: true,
                            align: 'center',
                            title: [[#{ui.remark}]],
                            width: 18,
                            widthUnit: '%',
                            formatter: function (value, row, index) {
                                return $.table.tooltip(value, 20);
                            },
                        }
                    ]
                ]
        };
        $.table.init(options, true);
    });

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
