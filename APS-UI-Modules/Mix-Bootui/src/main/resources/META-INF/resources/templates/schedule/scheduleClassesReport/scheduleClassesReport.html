<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('日计划每日报表统计')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
    <link th:href="@{/css/neat.css}" rel="stylesheet"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li class="select-time">
                            <label>[[#{schedule.scheduleReport.scheduleDate}]]：</label>
                            <input id="queryScheduleDate" type="text" class="time-input" placeholder="yyyy-MM-dd"
                                   th:value="${initDate}" name="queryScheduleDate" required="true"/>
                        </li>
                        <li>
                            <label>[[#{schedule.scheduleReport.mixArea}]]：</label>
                            <select id="mixArea" class="form-control" name="mixArea"
                                    th:with="type=${@setting.scheduleMixAreaPermission()}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{schedule.scheduleReport.procedure}]]：</label>
                            <select id="procedure" class="form-control" name="procedure"
                                    th:with="type=${@dict.getType('REPORT_PROCEDURE_CODE')}">
                                <option value="">[[#{ui.frame.btn.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="searchData()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-warning" onclick="exportData()" shiro:hasPermission="schedule:scheduleClassesReport:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-bordered">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-table-fixed-columns-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "schedule/scheduleClassesReport";
    var summaryStr = [[#{schedule.scheduleReport.summary}]];
    var mixAreaDatas = [[${@dict.getType('MIX_AREA')}]];
    var majorDatas = [[${@dict.getType('REPORT_PROCEDURE_CODE')}]];

    $(function () {
    	//var baseTitle = getBaseTitle();
        var options = {
            uniqueId: 'id',
            url: prefix + "/list",
            exportUrl: prefix + "/export",
            modalName: [[#{schedule.scheduleClassesReport.modelName}]],
            fixedColumns: true,
            pageSize: 10000,
            pageList: [10000],
            rowStyle: function(row, index) {
                // 标记汇总行背景色
                if(row.isSummary == '1'){
                    return {css: {'background-color': '#FFFFBF'}};
                }
                return {};
            },
            columns: [
            	//[
                //    {
                //        halign: 'center',
                //        valign: 'middle',
                //        align: 'center',
                //        colspan: 14,
                //        title: baseTitle
                //    }
                //],
            	[
                    {
                        field: 'mixArea',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        rowspan: 2,
                        title: [[#{schedule.scheduleReport.mixArea}]]
                    },
                    {
                        field: 'procedure',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        rowspan: 2,
                        title: [[#{schedule.scheduleReport.procedure}]],
	                    formatter: function (value, row, index) {
	                    	var formatterName = $.table.selectDictLabel(majorDatas, value);
	                    	if (row.isSummary == '1') {
	                    		formatterName += summaryStr;
	                    	}
	                        return formatterName;
	                    }
                    },
                    {
                        title: [[#{schedule.scheduleClassesReport.mid}]],
                        align: 'center',
                        colspan: 4
                    },
                    {
                        title: [[#{schedule.scheduleClassesReport.night}]],
                        align: 'center',
                        colspan: 4
                    },
                    {
                        title: [[#{schedule.scheduleClassesReport.day}]],
                        align: 'center',
                        colspan: 4
                    },
                ],
            	[
                    {
                        field: 'midPlanSpec',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.planSpec}]],
                    },
                    {
                        field: 'midPlanQty',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.planQty}]],
                    },
                    {
                        field: 'midFinishSpec',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.finishSpec}]],
                    },
                    {
                        field: 'midFinishQty',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.finishQty}]],
                    },
                    {
                        field: 'nightPlanSpec',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.planSpec}]],
                    },
                    {
                        field: 'nightPlanQty',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.planQty}]],
                    },
                    {
                        field: 'nightFinishSpec',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.finishSpec}]],
                    },
                    {
                        field: 'nightFinishQty',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.finishQty}]],
                    },
                    {
                        field: 'dayPlanSpec',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.planSpec}]],
                    },
                    {
                        field: 'dayPlanQty',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.planQty}]],
                    },
                    {
                        field: 'dayFinishSpec',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.finishSpec}]],
                    },
                    {
                        field: 'dayFinishQty',
                        halign: 'center',
                        valign: 'middle',
                        align: 'center',
                        title: [[#{schedule.scheduleClassesReport.finishQty}]],
                    },
                ]
            ]
        };
        $.table.init(options, true);
    });
    
    function searchData() {
    	// 查询前校验查询条件
    	if (validateCondition()) {
    		$.table.search();
    		//var columns = table.options.columns;
        	//columns[0][0].title = getBaseTitle();
        	//$('#bootstrap-table').bootstrapTable('refreshOptions', {columns: columns});
    	}
    }
    
    function exportData() {
    	// 导出前校验查询条件
    	if (validateCondition()) {
    		$.table.exportUiExcel();
    	}
    }
    
    /**
    *	获取表头统计信息
    */
    function getBaseTitle() {
    	var baseTitle = "";
        $.ajax({
            url: prefix + "/getBaseTitle",
            type: "post",
            dataType: "json",
            data: {
                "queryScheduleDate": $("#queryScheduleDate").val(),
                "mixArea": $("#mixArea").val(),
                "procedure": $("#procedure").val(),
            },
            success: function (result) {
            	baseTitle = result;
            }
        });
        return baseTitle;
    }
    
    // 查询条件校验
    function validateCondition() {
    	var queryScheduleDate = $("#queryScheduleDate").val();
    	if ($.common.isEmpty(queryScheduleDate)) {
			$.modal.msgWarning([[#{schedule.scheduleReport.scheduleDate.notEmpty}]]);
			return false;
    	}
    	return true;
    }
    
</script>
</body>
<style>
    .editable-input {
        vertical-align: top;
        display: inline-block;
        width: auto;
        white-space: normal;
        zoom: 1;
        color: #808080;
    }

    .pagination-detail {
        margin-top: 0 !important;
        margin-bottom: 0 !important;
    }

    .select-table {
        padding-bottom: 0 !important;
    }

    button.btn.btn-default.btn-sm.editable-cancel {
        display: none
    }
    .pagination-detail{margin-top: 0px !important;margin-bottom: 0px !important;}
    .select-table{padding-bottom: 0px !important;}
    button.btn.btn-default.btn-sm.editable-cancel {display: none}
</style>
</html>
