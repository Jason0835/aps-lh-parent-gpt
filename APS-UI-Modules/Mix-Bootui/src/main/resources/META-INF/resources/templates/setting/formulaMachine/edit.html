<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改配方与机台对应')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-formulaMachine-edit" th:object="${formulaMachine}">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <input id="editType" name="editType" th:value="${editType}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.formulaMachine.mixArea}]]：</label>
            <div class="col-sm-8">
                <!--对于添加了disabled="disabled"的值传不到后台问题，在此新增一个hidden的input框，用于传值-->
                <input id="mixArea2" name="mixArea" th:field="*{mixArea}" hidden>
                <select id="mixArea" name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"
                        required="true" onchange="getMachines()">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{mixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.formulaMachine.glue}]]：</label>
            <div class="col-sm-8">
                <!--对于添加了disabled="disabled"的值传不到后台问题，在此新增一个hidden的input框，用于传值-->
                <input id="glue2" name="glue" th:field="*{glue}" disabled hidden>
                <input id="glue" name="glue" th:field="*{glue}" class="form-control  GlueNames" autocomplete="off"
                       type="text" maxlength="30" required="true" onchange="getMachines()">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
        <!--        <div class="form-group">-->
        <!--            <label class="col-sm-3 control-label is-required">[[#{setting.formulaMachine.machineCode}]]：</label>-->
        <!--            <div class="col-sm-8">-->
        <!--                <select class="form-control select2-multiple" id="machineCode"-->
        <!--                        name="machineCode" multiple="true" required="true">-->
        <!--                    <option value="">[[#{ui.frame.btn.choose}]]</option>-->
        <!--                    <option th:each="item : ${type}" th:text="${item.machineName}"-->
        <!--                            th:value="${item.machineCode}" th:selected="${#arrays.contains(#strings.arraySplit(formulaMachine.machineCode==null?'':formulaMachine.machineCode,','),#strings.toString(machines.machineCode))}"></option>-->
        <!--                </select>-->
        <!--            </div>-->
        <!--        </div>-->
        <div class="row">
            <div class="col-sm-12">
                <button type="button" class="btn btn-white btn-sm" onclick="addColumn()"><i class="fa fa-plus">
                    [[#{ui.frame.btn.add}]]</i></button>
                <button type="button" class="btn btn-white btn-sm" onclick="sub.delColumn()"><i class="fa fa-minus">
                    [[#{ui.frame.btn.delete}]]</i></button>
                <div class="col-sm-8 select-table table-striped">
                    <table id="bootstrap-table"></table>
                </div>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-suggest-js"/>
<th:block th:include="include :: bootstrap-typeahead-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/formulaMachine";
    var allMachineInfos = [[${@setting.getAllMachineInfo()}]];
    var optionObj = {};

    $(function () {
        var editType = $("#editType").val();
        if (editType == "0") {
            $('#mixArea2').attr("disabled", "disabled");
            $('#glue2').attr("disabled", "disabled");
        } else if (editType == '1') { //编辑
            $('#glue').attr("readonly", "true");
            $('#mixArea').attr("disabled", "disabled");
        }
        var options = {
            id: 'bootstrap-table',
            uniqueId: 'index',
            pagination: false,
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            sidePagination: "client",
            columns: [
                {
                    checkbox: true
                },
                {
                    field: 'index',
                    align: 'center',
                    title: [[#{ui.data.column.index}]],
                    formatter: function (value, row, index) {
                        var columnIndex = $.common.sprintf("<input type='hidden' name='index' value='%s'>", $.table.serialNumber(index));
                        return columnIndex + $.table.serialNumber(index);
                    }
                },
                {
                    field: 'machineCode',
                    align: 'center',
                    title: [[#{setting.formulaMachine.machineCode}]],
                    formatter: function (value, row, index) {
                        var html = getMachineNameHtml(value, row, index);
                        return html;
                    },
                },
                {
                    field: 'machineOrder',
                    align: 'center',
                    title: [[#{setting.formulaMachine.machineOrder}]],
                    formatter: function (value, row, index) {
                        if ($.common.isEmpty(value)) {
                            value = '';
                        }
                        return $.common.sprintf("<div class='col-sm-12'><input class='form-control' name='machineOrderList[%s].machineOrder' value='%s' digits='true' min='0' max='99999' required/></div>", index, value);
                    },
                },
            ]
        };
        $.table.init(options);
        initColumn();
    });

    //初始化列表
    function initColumn() {
        var machineCodes = [[${formulaMachine.machineCode}]];
        var machineNames = [[${formulaMachine.machineName}]];
        if ($.common.isNotEmpty(machineCodes) && $.common.isNotEmpty(machineNames)) {
            var arr = machineCodes.split(",");
            var machineOrders = [[${formulaMachine.machineOrder}]];
            var machineOrderArr = [];
            if ($.common.isNotEmpty(machineOrders)) {
                machineOrderArr = machineOrders.split(",");
            }
            $.each(arr, function (index, item) {
                if ($.common.isNotEmpty(item)) {
                    var row = {
                        machineName: getMachineName(item, allMachineInfos),
                        machineCode: item,
                        machineOrder: machineOrderArr[index],
                    }
                    sub.addColumn(row);
                }
            });
        }
    }

    //添加行
    function addColumn() {
        var mixArea = $("#mixArea").val();
        var glue = $("#glue").val();
        if ($.common.isEmpty(glue) || $.common.isEmpty(mixArea)) {
            $.modal.alertWarning([[#{ui.message.filterMachine.mixAreaAndGlueNotNull}]]);
            return;
        }
        var row = {
            machineName: "",
            machineCode: "",
            machineOrder: ""
        }
        sub.addColumn(row);
    }

    //获取机台名称
    function getMachineName(value, datas) {
        var mixArea = $("#mixArea").val();
        var arr = datas.filter(item => item.mixArea === mixArea);
        $.each(arr, function (index, dict) {
            if (dict.machineCode === value && mixArea === dict.mixArea) {
                return $.common.isEmpty(dict.machineName) ? "" : dict.machineName;
            }
        });
    }

    //拼接机台名称下拉框
    function getMachineNameHtml(value, row, index) {
        var select = $.common.sprintf("<div class='col-sm-12'><select class=\"form-control\" id='machineCode%s' name=\"machineOrderList[%s].machineCode\" required>", index, index);
        var mixArea = $("#mixArea").val();
        var glue = $("#glue").val();
        if ($.common.isEmpty(glue) || $.common.isEmpty(mixArea)) {
            return select + "<option value='' disabled>" + [[#{ui.message.filterMachine.mixAreaAndGlueNotNull}]] + "</option></select></div>";
        }
        // 用于优化，避免点击添加时，频繁发送请求
        if (optionObj.key === mixArea + glue) {
            return select + getSelectMachineOption(value, optionObj.value) + "</select></div>";
        }
        var rSelect = '';
        var config = {
            url: "/setting/MesPmtRecipe/selectMesPmtRecipeMachine",
            type: "post",
            dataType: "json",
            async: false,
            data: {"mixArea": mixArea, "recipeMaterialName": glue},
            beforeSend: function () {
                $.modal.disable();
                $.modal.loading(frame.alter.doingWaiting);
            },
            success: function (result) {
                if (result.code == web_status.SUCCESS) {
                    var machines = result.data;
                    // 用于优化，避免点击添加时，频繁发送请求
                    optionObj = {key: mixArea + glue, value: result.data};
                    for (var i = 0; i < machines.length; i++) {
                        if (value === machines[i].recipeEquipCode) {
                            rSelect += ("<option value='" + machines[i].recipeEquipCode + "' selected>" + machines[i].machineName + "</option>");
                        } else {
                            rSelect += ("<option value='" + machines[i].recipeEquipCode + "'>" + machines[i].machineName + "</option>");
                        }
                    }
                    if ($.common.isEmpty(rSelect)) {
                        rSelect = "<option value='' disabled>" + [[#{ui.message.recipeMachine.noGlueMachine}]] + "</option>";
                    }
                } else {
                    optionObj = {};
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config);
        $.modal.enable();
        $.modal.closeLoading();
        var result = $.common.sprintf("<div class='col-sm-12'><select class=\"form-control\" id='machineCode%s' name=\"machineOrderList[%s].machineCode\" required>", index, index) + rSelect + "</select></div>";
        return result;
    }

    //获取胶料名称列表
    var datas = [[${@setting.getGlueNames()}]];
    $('.GlueNames').typeahead({
        source: datas,
        autoSelect: false,
    });

    //获取机台下拉框
    function getMachines() {
        var tableData = $("#" + table.options.id).bootstrapTable('getData');
        if (tableData.length === 0) {
            return;
        }
        var mixArea = $("#mixArea").val();
        var glue = $("#glue").val();
        if ($.common.isEmpty(glue) || $.common.isEmpty(mixArea)) {
            for (var i = 0; i < tableData.length; i++) {
                var $machineCode = $("#machineCode" + i);
                $machineCode.empty();
                $machineCode.append("<option value='' disabled>" + [[#{ui.message.filterMachine.mixAreaAndGlueNotNull}]] + "</option>");
            }
            return;
        }
        var config = {
            url: "/setting/MesPmtRecipe/selectMesPmtRecipeMachine",
            type: "post",
            dataType: "json",
            data: {"mixArea": mixArea, "recipeMaterialName": glue},
            success: function (result) {
                if (result.code == web_status.SUCCESS) {
                    var machines = result.data;
                    // 用于优化，避免点击添加时，频繁发送请求
                    optionObj = {key: mixArea + glue, value: result.data};
                    var rSelect = '';
                    var select = [[${formulaMachine.machineCode}]] + "";
                    for (var i = 0; i < machines.length; i++) {
                        if (select === machines[i].recipeEquipCode) {
                            rSelect += ("<option value='" + machines[i].recipeEquipCode + "' selected>" + machines[i].machineName + "</option>");
                        } else {
                            rSelect += ("<option value='" + machines[i].recipeEquipCode + "'>" + machines[i].machineName + "</option>");
                        }
                    }
                    if ($.common.isEmpty(rSelect)) {
                        rSelect = "<option value='' disabled>" + [[#{ui.message.recipeMachine.noGlueMachine}]] + "</option>";
                    }
                    for (var i = 0; i < tableData.length; i++) {
                        var $machineCode = $("#machineCode" + i);
                        $machineCode.empty();
                        $machineCode.append(rSelect);
                    }
                } else {
                    optionObj = {};
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }

    /**
     * 根据机台编号，机台集合返回整个select，并选中对应的option
     * @param value 机台编号
     * @param machines 机台集合
     * @returns {string} 整个select
     */
    function getSelectMachineOption(value, machines) {
        var rSelect = '';
        for (var i = 0; i < machines.length; i++) {
            if (value === machines[i].recipeEquipCode) {
                rSelect += ("<option value = '" + machines[i].recipeEquipCode + "' selected>" + machines[i].machineName + "</option>");
            } else {
                rSelect += ("<option value = '" + machines[i].recipeEquipCode + "'>" + machines[i].machineName + "</option>");
            }
        }
        if ($.common.isEmpty(rSelect)) {
            rSelect = "<option value='' disabled>" + [[#{ui.message.recipeMachine.noGlueMachine}]] + "</option>";
        }
        return rSelect;
    }

    function submitHandler() {
        if ($.validate.form()) {
            let id = $("#id").val();
            // 校验必须添加一条机台数据
            var tableData = $("#" + table.options.id).bootstrapTable('getData');
            if (tableData.length === 0) {
                $.modal.alertWarning([[#{setting.formulaMachine.mustAddOneRecord}]]);
                return;
            }
            var $form = $('#form-formulaMachine-edit');
            var data = $form.serializeArray();
            var machineCodeArr = data.filter(item => String(item.name).lastIndexOf("machineCode") >= 0);
            // 校验机台是否有重复，顺序是否有重复
            var machineCodeSet = new Set(machineCodeArr.map(item => item.value));
            if (machineCodeSet.size !== tableData.length) {
                $.modal.alertWarning([[#{setting.formulaMachine.sameMachine}]]);
                return;
            }
            var machineOrderArr = data.filter(item => String(item.name).lastIndexOf("machineOrder") >= 1);
            var machineOrderSet = new Set(machineOrderArr.map(item => item.value));
            if (machineOrderSet.size !== tableData.length) {
                $.modal.alertWarning([[#{setting.formulaMachine.sameOrder}]]);
                return;
            }
            // 拼接机台名称，不刷新页面回显机台名称
            var machineName = '';
            for (var i = 0; i < tableData.length; i++) {
                machineName = machineName + $("#machineCode" + i + " option:selected").text() + ",";
            }
            data.push({name: 'machineName', value: machineName.substring(0, machineName.length - 1)});
            if (id == null || id == '') {
                $.operate.save(prefix + "/save", $form.serialize());
            } else {
                $.operate.saveNoRefresh(prefix + "/save", data, function (result) {
                    //后台的id和机台名称出现变更，通过后台数据更新
                    var parent = window.parent;
                    parent.$("#" + parent.table.options.id).bootstrapTable('updateByUniqueId', {
                        id: id,
                        row: {
                            "id": result.data.id,
                            "machineName": result.data.machineName,
                            "remark": result.data.remark
                        }
                    });
                });
            }
        }
    }
</script>
</body>
<style>
    td {
        position: relative;
    }
</style>
</html>
