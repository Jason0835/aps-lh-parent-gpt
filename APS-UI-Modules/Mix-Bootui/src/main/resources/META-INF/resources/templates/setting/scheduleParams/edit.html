<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改密炼参数信息')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-params-edit" th:object="${settingScheduleParams}">
        <input name="id" th:field="*{id}" type="hidden">
        <input id="editType" name="editType" th:value="${editType}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.safeStock.mixArea}]]：</label>
            <div class="col-sm-8">
                <!--对于添加了disabled="disabled"的值传不到后台问题，在此新增一个hidden的input框，用于传值-->
                <input id="mixArea2" name="mixArea" th:field="*{mixArea}" hidden>
                <select id="mixArea" name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"
                        required="true">
                    <option value="0">[[#{ui.data.column.default}]]</option>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{mixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.paramsCode}]]：</label>
            <div class="col-sm-8">
                <!--对于添加了disabled="disabled"的值传不到后台问题，在此新增一个hidden的input框，用于传值-->
                <input name="paramCode" th:field="*{paramCode}" class="form-control" type="text" required="true"
                       disabled>
                <input id="paramCode" name="paramCode" th:field="*{paramCode}" class="form-control" type="hidden"
                       required="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.paramsName}]]：</label>
            <div class="col-sm-8">
                <input name="paramName" th:field="*{paramName}" class="form-control" type="text" required="true"
                       readonly>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.paramsValue}]]：</label>
            <div class="col-sm-8">
                <input name="paramValue" th:field="*{paramValue}" class="form-control" type="text" required="true"
                       maxlength="16">
            </div>
        </div>
        <div class="form-group" style="display: none">
            <label class="col-sm-3 control-label">[[#{ui.data.column.regular}]]：</label>
            <div class="col-sm-8">
                <input name="regularExpression" th:field="*{regularExpression}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group" style="display: none">
            <label class="col-sm-3 control-label">[[#{ui.data.column.errorTips}]]：</label>
            <div class="col-sm-8">
                <input name="errorTips" th:field="*{errorTips}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/scheduleParams";
    var edit = prefix;

    $(function () {
        var editType = $("#editType").val();
        if (editType == '0') {
            //修改
            edit = prefix + "/edit";
            $('#mixArea').attr("disabled", "disabled");
        } else if (editType == '1') {
            //新增
            edit = prefix + "/copy";
            $('#mixArea2').attr("disabled", "disabled");
        }
    })

    $("#form-params-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var editType = $("#editType").val();
            if (editType == '0') {
                //修改
                $.operate.saveUpdateParentRow(edit, $('#form-params-edit').serializeArray());
            } else if (editType == '1') {
                //复制
                $.operate.save(edit, $('#form-params-edit').serialize());
            }
        }
    }
</script>
</body>
</html>
