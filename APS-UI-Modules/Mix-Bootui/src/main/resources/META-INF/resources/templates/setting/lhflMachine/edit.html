<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改小料机台信息')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-lhflMachine-edit" th:object="${lhflMachine}">
        <input id="editType" name="editType" th:value="${editType}" type="hidden">
        <input id="id" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflMachine.mixArea}]]：</label>
            <div class="col-sm-8">
                <input id="mixArea2" name="mixArea" th:field="*{mixArea}" hidden>
                <select id="mixArea" name="mixArea" class="form-control" th:with="type=${@dict.getType('MIX_AREA')}"
                        required="true">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{mixArea}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflMachine.machineCode}]]：</label>
            <div class="col-sm-8">
                <input id="machineCode" name="machineCode" th:field="*{machineCode}" class="form-control" type="text"
                       isCode="true" maxlength="30"
                       required="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflMachine.machineName}]]：</label>
            <div class="col-sm-8">
                <input id="machineName" name="machineName" th:field="*{machineName}" class="form-control" type="text"
                       maxlength="40"
                       required="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflMachine.classShift}]]：</label>
            <div class="col-sm-8">
                <select name="classShift" class="form-control" th:with="type=${@dict.getType('LH_CLASS_SHIFT')}"
                        required="true">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{classShift}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{setting.lhflMachine.capacity}]]：</label>
            <div class="col-sm-8">
                <input name="capacity" th:field="*{capacity}" class="form-control" type="text" number="true" min="0"
                    digits="true"   max="9999999" required="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machine.status}]]：</label>
            <div class="col-sm-8">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="status" th:checked="${lhflMachine.status == '0' || lhflMachine.status == null ? true : false}">
                    <span></span>
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{setting.machine.midStatus}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="midStatus"
                           th:checked="${lhflMachine.midStatus == '0' || lhflMachine.midStatus == null ? true : false}"
                           onchange="enableStatus(this)">
                    <span></span>
                </label>
            </div>

            <label class="col-sm-3 control-label" style="width: 18%;min-width: 75px;">[[#{setting.machine.nightStatus}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="nightStatus"
                           th:checked="${lhflMachine.nightStatus == '0' || lhflMachine.nightStatus == null ? true : false}"
                           onchange="enableStatus(this)">
                    <span></span>
                </label>
            </div>

            <label class="col-sm-3 control-label" style="width: 15%;min-width: 75px;">[[#{setting.machine.dayStatus}]]：</label>
            <div class="col-sm-3" style="width: 10%;min-width: 75px;">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="dayStatus"
                           th:checked="${lhflMachine.dayStatus == '0' || lhflMachine.dayStatus == null ? true : false}"
                           onchange="enableStatus(this)">
                    <span></span>
                </label>
            </div>
        </div>
        
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "setting/lhflMachine";

    $(function () {
        var editType = $("#editType").val();
        if (editType == "0") {
            $('#mixArea2').attr("disabled", "disabled");
        } else if (editType == '1') { //编辑
            $('#machineCode').attr("readonly", "true");
            $('#mixArea').attr("disabled", "disabled");
        }
    });

    $("#form-lhflMachine-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var data = $("#form-lhflMachine-edit").serializeArray();
            var status = $("input[id='status']").is(':checked') == true ? '0' : '1';
            var midStatus = $("input[id='midStatus']").is(':checked') === true ? '0' : '1';
            var nightStatus = $("input[id='nightStatus']").is(':checked') === true ? '0' : '1';
            var dayStatus = $("input[id='dayStatus']").is(':checked') === true ? '0' : '1';
            data.push({"name": "status", "value": status});
            data.push({"name": "midStatus", "value": midStatus});
            data.push({"name": "nightStatus", "value": nightStatus});
            data.push({"name": "dayStatus", "value": dayStatus});
            if ($("#id").val() == null || $("#id").val() == '') {
                $.operate.save(prefix + "/save", data);
            } else {
                $.operate.saveUpdateParentRow(prefix + "/save", data);
            }
        }
    }

    // 禁用机台状态时，将三班状态都禁用
    function disableStatus() {
        let isChecked = $("#status").is(":checked");
        if (!isChecked) {
            $("#midStatus").removeAttr('checked');
            $("#nightStatus").removeAttr('checked');
            $("#dayStatus").removeAttr('checked');
        }
    }

    // 启用三班状态时，将机台状态启用
    function enableStatus($ele) {
        let isChecked = $($ele).is(":checked");
        if (isChecked) {
            $("#status").prop("checked", true);
        }
    }
</script>
</body>
</html>
