<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('钢带压延注意事管理')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            [[#{ui.common.column.gy.bigRollCode}]]：
                            <input type="text" name="bigRollCode" id="bigRollCode"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>
        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add('',500)"
               shiro:hasPermission="gdyy:gdyyMattersAttention:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',500)"
               shiro:hasPermission="gdyy:gdyyMattersAttention:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="gdyy:gdyyMattersAttention:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
            <a class="btn btn-info" onclick="$.table.importExcel()"
               shiro:hasPermission="gdyy:gdyyMattersAttention:import">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.name.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="gdyy:gdyyMattersAttention:export">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-reorderable-columns="true" data-resizable="true"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
<th:block th:include="include :: bootstrap-table-reorder-columns-js"/>
<th:block th:include="include :: bootstrap-table-resizable-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('gdyy:gdyyMattersAttention:edit')}]];
    var removeFlag = [[${@permission.hasPermi('gdyy:gdyyMattersAttention:remove')}]];
    var prefix = ctx + "gdyy/gdyyMattersAttention";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{ui.data.column.gdyy.params.mattersAttentionName}]],
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: '主键ID',
                    align: 'center',
                    halign: 'center',
                    visible: false
                },
                {
                    field: 'bigRollCode',
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    title: [[#{ui.common.column.gy.bigRollCode}]],
                },
                {
                    field: 'notes',
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    title: [[#{ui.gdyy.mattersAttention.column.note}]],
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value);
                    },
                },
                {
                    field: 'startTime',
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    title: [[#{ui.steelRollColor.column.startTime}]],
                },
                {
                    field: 'endTime',
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    title: [[#{ui.steelRollColor.column.endTime}]],
                },
                {
                    field: 'status',
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    title: [[#{ui.bigRollColor.column.status}]],
                    formatter: function (value, row, index) {
                        if (value == 1) {
                            return '<i class=\"fa fa-toggle-off text-info fa-2x\" onclick="enable(\'' + row.id + '\')"></i> ';
                        } else {
                            return '<i class=\"fa fa-toggle-on text-info fa-2x\" onclick="disable(\'' + row.id + '\')"></i> ';
                        }
                    }
                },
                {
                    field: 'remark',
                    sortable: true,
                    halign: 'center',
                    title: [[#{ui.common.column.remark}]],
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value);
                    },
                },
                {
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    widthUnit: '%',
                    width: 10,
                    title: [[#{ui.data.btn.option}]],
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(' + row.id + ',' + '500' + ')"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                        return actions.join('');
                    }
                }]
        };
        $.table.init(options);
    });

    /* 用户管理-停用 */
    function disable(id) {
        $.modal.confirm([[#{ui.common.layer.boxMsg.context}]], function () {
            $.operate.post(prefix + "/save", {"id": id, "status": 1});
        })
    }

    /* 用户管理启用 */
    function enable(id) {
        $.modal.confirm([[#{ui.common.layer.boxMsg.context}]], function () {
            $.operate.post(prefix + "/save", {"id": id, "status": 0});
        })
    }


    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<!-- 导入区域 -->
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
