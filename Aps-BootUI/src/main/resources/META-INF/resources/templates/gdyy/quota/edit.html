<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改钢带压延定额设定')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-quota-edit" th:object="${quotaSetting}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.gdyy.quota.bigRollCode}]]：</label>
                <div class="col-sm-8">
                    <input name="bigRollCode" th:field="*{bigRollCode}" class="form-control" type="text" isCode="true" maxlength="20" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.quota.quota}]]：</label>
                <div class="col-sm-8">
                    <input name="quota" th:field="*{quota}" class="form-control" type="number" min="0" max="9999999" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "gdyy/quota";
        $("#form-quota-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-quota-edit').serialize());
            }
        }

        // 去除 input框空格，方便后端唯一性校验
        $("input").change(function(){
            $(this).val($(this).val().trim());
        });
    </script>
</body>
</html>
