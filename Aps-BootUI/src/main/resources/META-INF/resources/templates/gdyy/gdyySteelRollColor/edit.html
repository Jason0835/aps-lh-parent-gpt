<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改大卷颜色提示信息')" />
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-order-edit" th:object="${gdyySteelRollColor}">
            <input id="rollId" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.steelRollColor.column.bigRollCode}]]：</label>
                <div class="col-sm-8">
                    <input id="bigRollCode" name="bigRollCode" th:field="*{bigRollCode}" class="form-control" type="text"
                           required="true" isCode="true" maxlength="20">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.bigRollColor.column.colorCode}]]：</label>
                <div class="col-sm-8">
                    <div class="form-control">
                        <input id="colorCode" readonly=true th:placeholder="#{ui.bigRollColor.color.placeholder}" name="colorCode" th:field="*{colorCode}" class="layui-input form-control colorpicker-input" type="text"  maxlength="15">
                        <div id="colorpicker"></div>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.bigRollColor.column.colorType}]]：</label>
                <div class="col-sm-8">
                    <select name="colorType" class="form-control" th:with="type=${@dict.getType('BIG_ROLL_COLOR')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:selected="${id == null ? dict.default : gdyySteelRollColor.colorType == dict.dictValue}"
                                th:value="${dict.dictValue}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.bigRollColor.column.status}]]：</label>
                <div class="col-sm-8">
                    <label class="toggle-switch switch-solid">
                        <input type="checkbox" id="status" th:checked="${gdyySteelRollColor.status == '0' ? true : false}">
                        <span></span>
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea id="remark" name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js"/>
    <th:block th:include="include :: bootstrap-select-js"/>
    <th:block th:include="include :: colorpicker" />
    <script th:inline="javascript">

        layui.use(['colorpicker', 'layer'], function(){
            var colorpicker = layui.colorpicker;
            colorpicker.render({
                elem: '#colorpicker'
                ,predefine: true //开启预定义颜色
                ,colors: '#000'
                ,change: function(color){
                    layui.$("#colorCode").val(color);
                }
                ,done: function(color){
                    layui.$('#colorCode').val(color);
                }
            });
            try{
                layui.$(".layui-colorpicker-trigger-span")[0].style.background=layui.$("#colorCode").val();
            }catch (e) {

            }
        })



        var prefix = ctx + "gdyy/gdyySteelRollColor";

        $("#form-order-edit").validate({
            onkeyup: false,
            rules: {
                bigRollCode: {
                    remote: {
                        url: prefix + "/checkRollCodeUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            "id": function () {
                                return $("#rollId").val();
                            },
                            "bigRollCode": function () {
                                return $.common.trim($("#bigRollCode").val());
                            }
                        },
                        dataFilter: function (data, type) {
                            return $.validate.unique(data);
                        }
                    }
                },
            },
            messages: {
                "bigRollCode": {
                    remote: [[#{ui.roll.alter.isRollCodeExist}]]
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var data = $("#form-order-edit").serializeArray();
                var status = $("input[id='status']").is(':checked') == true ? '0' : '1';
                data.push({"name": "status", "value": status});
                $.operate.save(prefix + "/save", data);
            }
        }
    </script>
</body>
</html>
