<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增钢带压延排程结果')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-add" th:object="${scheduleResult}">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="endTime" name="scheduleDate" type="text" class="time-input form-control" th:value="${initDate}" th:min="${minDate}" placeholder="yyyy-MM-dd" required>
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.gdyy.scheduleResult.bigRollCode}]]：</label>
            <div class="col-sm-8">
                <input id="bigRollCode" name="bigRollCode" class="form-control" type="text" isCode="true" maxlength="20" onblur="toUpperCase()" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class1Plan}]]：</label>
            <div class="col-sm-8">
                <input name="class1Plan" th:field="*{class1Plan}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class1Plan.noStock}]]：</label>
            <div class="col-sm-8">
                <input name="class1Plan" th:field="*{class1PlanNoStock}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class1Finish}]]：</label>
            <div class="col-sm-8">
                <input name="class1Finish" th:field="*{class1Finish}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class1Remark}]]：</label>
            <div class="col-sm-8">
                <input name="class1Remark" th:field="*{class1Remark}" class="form-control" type="text" maxlength="300">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class2Plan}]]：</label>
            <div class="col-sm-8">
                <input name="class2Plan" th:field="*{class2Plan}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class2Plan.noStock}]]：</label>
            <div class="col-sm-8">
                <input name="class1Plan" th:field="*{class2PlanNoStock}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class2Finish}]]：</label>
            <div class="col-sm-8">
                <input name="class2Finish" th:field="*{class2Finish}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class2Remark}]]：</label>
            <div class="col-sm-8">
                <input name="class2Remark" th:field="*{class2Remark}" class="form-control" type="text" maxlength="300">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class3Plan}]]：</label>
            <div class="col-sm-8">
                <input name="class3Plan" th:field="*{class3Plan}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class3Plan.noStock}]]：</label>
            <div class="col-sm-8">
                <input name="class1Plan" th:field="*{class3PlanNoStock}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class3Finish}]]：</label>
            <div class="col-sm-8">
                <input name="class3Finish" th:field="*{class3Finish}" class="form-control" type="number" min="0" max="99999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.gdyy.scheduleResult.class3Remark}]]：</label>
            <div class="col-sm-8">
                <input name="class3Remark" th:field="*{class3Remark}" class="form-control" type="text" maxlength="300">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.stock.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="3" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "gdyy/scheduleResult"
    $("#form-scheduleResult-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var scheduleDate = $('#endTime').val();
            var config = {
                url: prefix + "/validateAdd",
                type: "post",
                dataType: "json",
                data:{"scheduleDate":scheduleDate},
                success: function (result) {
                    if (result.code == web_status.SUCCESS){
                        if(result.msg=='0'){
                            $.modal.confirm([[#{ui.data.column.scheduleResult.isContinueAdd}]], function () {
                                $.operate.save(prefix + "/edit", $('#form-scheduleResult-add').serialize(),addCallBack());
                            })
                        }else{
                            $.operate.save(prefix + "/edit", $('#form-scheduleResult-add').serialize(), addCallBack());
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }
    }

    function addCallBack(){
        parent.$('#scheduleDate').val($('#endTime').val());
    }

    function toUpperCase() {
        let $bigRollCode = $("#bigRollCode");
        var toUpperCase = $bigRollCode.val().toUpperCase();
        $bigRollCode.val(toUpperCase);
    }
</script>
</body>
</html>
