<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改大卷颜色提示信息')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-order-edit" th:object="${gdyyMattersAttention}">
        <input id="rollId" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.steelRollColor.column.bigRollCode}]]：</label>
            <div class="col-sm-8">
                <input id="bigRollCode" name="bigRollCode" th:field="*{bigRollCode}" class="form-control" type="text" required="true" isCode="true" maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.gdyy.mattersAttention.column.note}]]：</label>
            <div class="col-sm-8">
                <textarea id="notes" name="note" th:field="*{notes}" class="form-control" type="text" required="true" maxlength="100"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label ">[[#{ui.steelRollColor.column.startTime}]]：</label>
            <div class="col-sm-8">
                <input type="text" autocomplete="off" class="time-input form-control" id="startTime" th:value="*{#dates.format({startTime}, 'yyyy-MM-dd')}"
                       th:placeholder="#{ui.steelRollColor.column.startTime}" name="startTime"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label ">[[#{ui.steelRollColor.column.endTime}]]：</label>
            <div class="col-sm-8">
                <input type="text" autocomplete="off" class="time-input form-control" id="endTime" th:value="*{#dates.format({endTime}, 'yyyy-MM-dd')}"
                       th:placeholder="#{ui.steelRollColor.column.endTime}" name="endTime"/>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.bigRollColor.column.status}]]：</label>
            <div class="col-sm-8">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="status" th:checked="${gdyyMattersAttention.status == '0' ? true : false}">
                    <span></span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea id="remark" name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">

    var prefix = ctx + "gdyy/gdyyMattersAttention";
    $("#form-order-edit").validate({
        focusCleanup: true
    });
    function submitHandler() {
        if ($.validate.form()) {
            let startTime = $("#startTime").val();
            let endTime = $("#endTime").val();
            if (new Date(startTime) > new Date(endTime)){
                $.modal.alertWarning([[#{ui.data.column.beginDateCanNotGreatThanEndDate}]]);
            }else {
                var data = $("#form-order-edit").serializeArray();
                var status = $("input[id='status']").is(':checked') == true ? '0' : '1';
                data.push({"name": "status", "value": status});
                $.operate.save(prefix + "/save", data);
            }
        }
    }
</script>
</body>
</html>
