<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改外协规格管理')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-roll-edit" th:object="${assistSpec}">
            <input id="assistSpecId" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.common.column.assist.xwyy.materialCode}]]：</label>
                <div class="col-sm-8">
                    <input id="materialCode" name="materialCode" th:field="*{materialCode}" class="form-control" type="text" required="true" isCode="true" maxlength="30">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "xwyy/assistSpec";

        $("#form-roll-edit").validate({
            onkeyup: false,
            rules: {
                materialCode: {
                    remote: {
                        url: prefix + "/checkAssistSpecCodeUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            "id": function () {
                                return $("#assistSpecId").val();
                            },
                            "materialCode": function () {
                                return $.common.trim($("#materialCode").val());
                            }
                        },
                        dataFilter: function (data, type) {
                            return $.validate.unique(data);
                        }
                    }
                },
            },
            messages: {
                "materialCode": {
                    remote: [[#{ui.xwyy.assistSpec.alter.isAssistSpecExist}]]
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/save", $('#form-roll-edit').serialize());
            }
        }
    </script>
</body>
</html>
