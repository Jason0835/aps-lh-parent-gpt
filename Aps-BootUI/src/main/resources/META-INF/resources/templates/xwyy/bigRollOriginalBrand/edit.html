<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改帘布大卷原线品牌')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-bigRollOriginalBrand-edit" th:object="${xwyyBigRollOriginalBrand}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.bigRollOriginalBrand.bigRollCode}]]：</label>
            <div class="col-sm-8">
                <input name="bigRollCode" th:field="*{bigRollCode}" class="form-control" type="text" isCode="true" maxlength="30" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.bigRollOriginalBrand.brand}]]：</label>
            <div class="col-sm-8">
                <input name="brand" th:field="*{brand}" class="form-control" type="text" maxlength="33" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <input name="remark" th:field="*{remark}" class="form-control" type="text">
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "xwyy/bigRollOriginalBrand";
    $("#form-bigRollOriginalBrand-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-bigRollOriginalBrand-edit').serialize());
        }
    }
</script>
</body>
</html>
