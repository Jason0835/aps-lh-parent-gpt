<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改纤维压延外厂需求')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-assistRequirement-edit" th:object="${xwyyAssistRequirement}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="scheduleDate" name="scheduleDate" type="text" class="time-input form-control"
                               th:value="${#dates.format(xwyyAssistRequirement.scheduleDate, 'yyyy-MM-dd')}" placeholder="yyyy-MM-dd" required>
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.xwyy.scheduleResult.bigRollCode}]]：</label>
            <div class="col-sm-8">
                <input name="bigRollCode" th:field="*{bigRollCode}" class="form-control" type="text" isCode="true" maxlength="20" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.assistRequirement.midPlan}]]：</label>
            <div class="col-sm-8">
                <input name="dayPlanQty" th:field="*{dayPlanQty}" class="form-control" type="number" digits="true" min="0" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.assistRequirement.nightPlan}]]：</label>
            <div class="col-sm-8">
                <input name="nightPlanQty" th:field="*{nightPlanQty}" class="form-control" type="number" digits="true" min="0" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.todayStock}]]：</label>
            <div class="col-sm-8">
                <input name="todayStock" th:field="*{todayStock}" class="form-control" type="number" digits="true" min="0" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dayOut}]]：</label>
            <div class="col-sm-8">
                <input name="dayOut" th:field="*{dayOut}" class="form-control" type="number" digits="true" min="0" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.fac5Class1Plan}]]：</label>
            <div class="col-sm-8">
                <input name="fac5Class1Plan" th:field="*{fac5Class1Plan}" class="form-control" type="number" digits="true" min="0" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.fac5Class2Plan}]]：</label>
            <div class="col-sm-8">
                <input name="fac5Class2Plan" th:field="*{fac5Class2Plan}" class="form-control" type="number" digits="true" min="0" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.fac5Class3Plan}]]：</label>
            <div class="col-sm-8">
                <input name="fac5Class3Plan" th:field="*{fac5Class3Plan}" class="form-control" type="number" digits="true" min="0" max="9999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "xwyy/assistRequirement";
    $("#form-assistRequirement-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-assistRequirement-edit').serialize());
        }
    }
</script>
</body>
</html>
