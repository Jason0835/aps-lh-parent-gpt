<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改胎圈定点机台')" />
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-specify-edit" th:object="${specifyMachine}">
            <input id="glueId" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.tq.specifyMachine.column.beadCode}]]：</label>
                <div class="col-sm-8">
                    <input id="beadCode" name="beadCode" th:field="*{beadCode}" class="form-control" type="text" required="true" isCode="true" maxlength="20">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label  is-required">[[#{ui.specifyMachine.column.machineName}]]：</label>
                <div class="col-sm-8">
                    <select name="machineId" class="form-control"  th:with="type=${@tq.getMachineInfo()}" required="true">
                        <option  th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}" th:value="${machineInfo.id}" th:field="*{machineId}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.specifyMachine.column.lineType}]]：</label>
                <div class="col-sm-8">
                    <select name="lineType" class="form-control" th:with="type=${@dict.getType('LINE_TYPE')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{lineType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.specifyMachine.column.jobType}]]：</label>
                <div class="col-sm-8">
                    <select name="jobType" class="form-control" th:with="type=${@dict.getType('JOB_TYPE')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{jobType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea id="remark" name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js"/>
    <th:block th:include="include :: bootstrap-select-js"/>
    <script th:inline="javascript">
        var prefix = ctx + "tq/specifyMachine";

        $("#form-specify-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/save", $('#form-specify-edit').serialize());
            }
        }
    </script>
</body>
</html>
