<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改胎圈口型板信息维护')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-plate-edit" th:object="${MouthPlate}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.mouthPlateCode}]]：</label>
            <div class="col-sm-8">
                <input name="mouthPlateCode" th:field="*{mouthPlateCode}" class="form-control" type="text"
                       required="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.specifyMachine.column.machineName}]]：</label>
            <div class="col-sm-8">
                <select name="machineId" class="form-control" th:with="type=${@tq.getMachineInfo()}" required="true">
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option  th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                            th:value="${machineInfo.id}" th:field="*{machineId}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.mouthPlateStatus}]]：</label>
            <div class="col-sm-8">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="status"
                           th:checked="${id == null ? true : MouthPlate.status == '0' ? true : false}"/>
                    <span></span>
                </label>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "tq/mouthPlate";
    $("#form-plate-edit").validate({
        focusCleanup: true,
    });

    function submitHandler() {
        if ($.validate.form()) {
            var data = $("#form-plate-edit").serializeArray();
            var status = $("input[id='status']").is(':checked') == true ? 0 : 1;
            data.push({"name": "status", "value": status});
            $.operate.save(prefix + "/edit", data);
        }
    }
</script>
</body>
</html>
