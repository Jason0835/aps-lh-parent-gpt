<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改硫化排程结果')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-edit" th:object="${scheduleResult}">
        <input name="id" th:field="*{id}" type="hidden">
        <input id="editType" name="editType" th:value="${editType}" type="hidden">
        <input name="publishSuccessCount" th:field="*{publishSuccessCount}" type="hidden">

        <div class="form-group" id="produceLine" hidden="true">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.produceLine}]]：</label>
            <div class="col-sm-8">
                <select id="lhMachineCode0" name="lhMachineCode" class="form-control"
                        th:data-none-selected-text="#{ui.data.column.selectMachineName}"
                        required>
                    <optgroup th:label="#{ui.data.column.scheduleResult.specialMachine}"
                              th:with="type=${@lh.getMachineInfo(scheduleResult,1)}">
                        <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                                th:value="${machineInfo.machineCode}"
                                th:selected="${#arrays.contains(#strings.arraySplit(scheduleResult.lhMachineCode==null?'':scheduleResult.lhMachineCode,','),#strings.toString(machineInfo.machineCode))}"></option>
                    </optgroup>
                    <optgroup th:label="#{ui.data.column.scheduleResult.otherMachine}"
                              th:with="type=${@lh.getMachineInfo(scheduleResult,2)}">
                        <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                                th:value="${machineInfo.machineCode}"
                                th:selected="${#arrays.contains(#strings.arraySplit(scheduleResult.lhMachineCode==null?'':scheduleResult.lhMachineCode,','),#strings.toString(machineInfo.machineCode))}"></option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="form-group" id="planQty" hidden="true">
            <h4 class="form-header h4">[[#{ui.data.column.scheduleResult.baseInfo}]]</h4>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
                        <div class="col-sm-8">
                            <div class="input-group date">
                                <input name="scheduleDate"
                                       th:value="${#dates.format(scheduleResult.scheduleDate, 'yyyy-MM-dd')}"
                                       class="form-control" placeholder="yyyy-MM-dd" type="hidden">
                                <input name="scheduleDate" id="scheduleDate"
                                       th:value="${#dates.format(scheduleResult.scheduleDate, 'yyyy-MM-dd')}"
                                       class="form-control" placeholder="yyyy-MM-dd" type="text" readonly disabled>
                                <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label ">[[#{ui.data.column.scheduleResult.isRelease}]]：</label>
                        <div class="col-sm-8">
                            <select name="isRelease" class="form-control" th:with="type=${@dict.getType('IS_RELEASE')}"
                                    disabled>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"
                                        th:field="*{isRelease}"></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.sapCode}]]：</label>
                        <div class="col-sm-8">
                            <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.model}]]：</label>
                        <div class="col-sm-8">
                            <input name="specDesc" th:field="*{specDesc}" class="form-control" type="text" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dailyPlanQty}]]：</label>
                        <div class="col-sm-8">
                            <input name="dailyPlanQty" th:field="*{dailyPlanQty}" class="form-control" type="text"
                                   readonly>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.lhMachineName}]]：</label>
                        <div class="col-sm-8">
                            <input id="lhMachineCode1" name="lhMachineCode" th:field="*{lhMachineCode}" type="hidden">
                            <select name="lhMachineCode" class="form-control noselect2 selectpicker"
                                    th:data-none-selected-text="#{ui.data.column.selectMachineName}" multiple disabled>
                                <optgroup th:label="#{ui.data.column.scheduleResult.specialMachine}"
                                          th:with="type=${@lh.getMachineInfo(scheduleResult,1)}">
                                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                                            th:value="${machineInfo.machineCode}"
                                            th:selected="${#arrays.contains(#strings.arraySplit(scheduleResult.lhMachineCode==null?'':scheduleResult.lhMachineCode,','),#strings.toString(machineInfo.machineCode))}"></option>
                                </optgroup>
                                <optgroup th:label="#{ui.data.column.scheduleResult.otherMachine}"
                                          th:with="type=${@lh.getMachineInfo(scheduleResult,2)}">
                                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                                            th:value="${machineInfo.machineCode}"
                                            th:selected="${#arrays.contains(#strings.arraySplit(scheduleResult.lhMachineCode==null?'':scheduleResult.lhMachineCode,','),#strings.toString(machineInfo.machineCode))}"></option>
                                </optgroup>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.lhTime}]]：</label>
                        <div class="col-sm-8">
                            <input name="lhTime" th:field="*{lhTime}" class="form-control" type="text" readonly>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.embryoCode}]]：</label>
                        <div class="col-sm-8">
                            <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" readonly>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                        <div class="col-sm-8">
                            <textarea name="remark" class="form-control" style="width: 825px;" rows="3"
                                      th:field="*{remark}" maxlength="300"></textarea>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                </div>
            </div>

            <h4 class="form-header h4">[[#{ui.data.column.scheduleResult.class1}]]</h4>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1PlanQty}]]：</label>
                        <div class="col-sm-8">
                            <input name="class1PlanQty" th:field="*{class1PlanQty}" class="form-control" type="number" digits="true" min="0" max="999999999">
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1FinishQty}]]：</label>
                        <div class="col-sm-8">
                            <input name="class1FinishQty" th:field="*{class1FinishQty}" class="form-control" type="text" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.analySystem}]]：</label>
                        <div class="col-sm-8">
                            <input name="class1Analysis" th:field="*{class1Analysis}" class="form-control" type="text" th:readonly="true">
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1Analysis}]]：</label>
                        <div class="col-sm-8">
                            <input name="class1AnalysisInput" th:field="*{class1AnalysisInput}" class="form-control" type="text" maxlength="66">
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="form-header h4">[[#{ui.data.column.scheduleResult.class2}]]</h4>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2PlanQty}]]：</label>
                        <div class="col-sm-8">
                            <input name="class2PlanQty" th:field="*{class2PlanQty}" class="form-control" type="number" digits="true" min="0" max="999999999">
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2FinishQty}]]：</label>
                        <div class="col-sm-8">
                            <input name="class2FinishQty" th:field="*{class2FinishQty}" class="form-control" type="text" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.analySystem}]]：</label>
                        <div class="col-sm-8">
                            <input name="class2Analysis" th:field="*{class2Analysis}" class="form-control" type="text" th:readonly="true">
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2Analysis}]]：</label>
                        <div class="col-sm-8">
                            <input name="class2AnalysisInput" th:field="*{class2AnalysisInput}" class="form-control" type="text" maxlength="66">
                        </div>
                    </div>
                </div>
            </div>

            <h4 class="form-header h4">[[#{ui.data.column.scheduleResult.class3}]]</h4>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3PlanQty}]]：</label>
                        <div class="col-sm-8">
                            <input name="class3PlanQty" th:field="*{class3PlanQty}" class="form-control" type="number" digits="true" min="0" max="999999999">
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3FinishQty}]]：</label>
                        <div class="col-sm-8">
                            <input name="class3FinishQty" th:field="*{class3FinishQty}" class="form-control" type="text" readonly>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.analySystem}]]：</label>
                        <div class="col-sm-8">
                            <input name="class3Analysis" th:field="*{class3Analysis}" class="form-control" type="text" th:readonly="true">
                        </div>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-group">
                        <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3Analysis}]]：</label>
                        <div class="col-sm-8">
                            <input name="class3AnalysisInput" th:field="*{class3AnalysisInput}" class="form-control" type="text" maxlength="66">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "lh/scheduleResult";
    $("#form-scheduleResult-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var editType = $("#editType").val();
            var data = $("#form-scheduleResult-edit").serializeArray();
            if(editType=='1') { //转机台页面
                var config = {
                    url: prefix + "/validateChangeMachine",
                    type: "post",
                    dataType: "json",
                    data: data,
                    success: function (result) {
                        if (result.code == web_status.SUCCESS){
                            data.push( {"name": "isSuccess", "value": result.data.isSuccess} );
                            data.push( {"name": "cxBatchNo", "value": result.data.cxBatchNo} );
                            $.operate.save(prefix + "/changeMachine", data);
                        } else {
                            $.modal.alertWarning(result.msg);
                        }
                    }
                };
                $.ajax(config)
            }else if(editType=='2') { //调量页面
                $.operate.save(prefix + "/changeQty", data);
            }
        }
    }

    // 根据编辑类型显示页面
    $(function () {
        var editType = $("#editType").val();
        if (editType == '1') { //转机台页面
            $('#produceLine').attr('hidden',false);
            $('#lhMachineCode1').attr('disabled','disabled');
        } else if (editType == '2') { //调量页面
            $('#planQty').attr('hidden',false);
            $('#lhMachineCode0').attr('disabled','disabled');

            var dayFinishRate = $("#dayFinishRate").val();
            var str = Number(dayFinishRate * 100).toFixed(2) + "%";
            $("#dayFinishRate").val(str);

            var nightFinishRate = $("#nightFinishRate").val();
            var str = Number(nightFinishRate * 100).toFixed(2) + "%";
            $("#nightFinishRate").val(str);

            var midFinishRate = $("#midFinishRate").val();
            var str = Number(midFinishRate * 100).toFixed(2) + "%";
            $("#midFinishRate").val(str);

            //历史的排程记录，不允许修改计划量和顺序
            var scheduleDate = $("#scheduleDate").val();
            scheduleDate = scheduleDate.replace(/-/g, "/");
            let now = new Date()
            let three1PlanTime = new Date(scheduleDate)
            let three2PlanTime = new Date(scheduleDate + " 08:00:00")
            let three3PlanTime = new Date(scheduleDate + " 16:00:00")
            //超过1班
            if (now > three1PlanTime) {
                $("input[name='class1PlanQty']").attr("readonly", true);
            }
            //超过2班
            if (now > three2PlanTime) {
                $("input[name='class2PlanQty']").attr("readonly", true);
            }
            //超过3班
            if (now > three3PlanTime) {
                $("input[name='class3PlanQty']").attr("readonly", true);
            }
        }
    });


</script>
<style>
    .select2-container--bootstrap .select2-results__group {
        color: #777;
        display: block;
        padding: 6px 12px;
        font-size: 13px;
        line-height: 1.42857143;
        white-space: nowrap;
    }
</style>
</body>
</html>
