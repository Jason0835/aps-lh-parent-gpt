<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改硫化定点机台信息')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-lhSpecifyMachine-edit" th:object="${lhSpecifyMachine}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.sapCode}]]：</label>
                <div class="col-sm-8">
                    <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text" isCode="true" maxlength="20" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.specifyMachine.column.machineName}]]：</label>
                <div class="col-sm-8">
                    <select name="machineCode" class="form-control"  th:with="type=${@lh.getMachineInfo()}" required="true">
                        <option  th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}" th:value="${machineInfo.machineCode}" th:field="*{machineCode}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.lineType}]]：</label>
                <div class="col-sm-8">
                    <select name="lineType" class="form-control" th:with="type=${@dict.getType('LINE_TYPE')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{lineType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.jobType}]]：</label>
                <div class="col-sm-8">
                    <select name="jobType" class="form-control" th:with="type=${@dict.getType('JOB_TYPE')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{jobType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "lh/lhSpecifyMachine";
        $("#form-lhSpecifyMachine-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-lhSpecifyMachine-edit').serialize());
            }
        }
    </script>
</body>
</html>
