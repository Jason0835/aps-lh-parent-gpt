<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('硫化调度员排程操作日志列表')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>[[#{ui.data.column.dispatcherlog.operType}]]：</label>
                                <select name="operType" th:with="type=${@dict.getType('DISPATCHER_OPER_TYPE')}" class="form-control">
                                    <option value="">[[#{ui.frame.btn.all}]]</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li class="select-time">
                                <label>[[#{ui.data.column.dispatcherlog.scheduleDate}]]：</label>
                                <input type="text" class="time-input" id="scheduleDate"
                                       th:placeholder="yyyy-mm-dd" name="scheduleDate"/>
                            </li>
                            <li>
                                <label>[[#{ui.data.column.dispatcherlog.createBy}]]：</label>
                                <input type="text" name="createBy"/>
                            </li>
                            <li class="select-time">
                                <label>[[#{ui.data.column.maintenance.log.createTime}]]：</label>
                                <input type="text" class="time-input"
                                       th:placeholder="#{ui.data.column.stock.startTime}" name="startTime"/>
                                <span  style='color: black;'>-</span>
                                <input type="text" class="time-input" id="endTime"
                                       th:placeholder="#{ui.data.column.stock.endTime}" name="endTime"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="lh:dispatcherLog:export">
                    <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
                </a>
            </div>

            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table" data-reorderable-columns="true" data-resizable="true"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
     <script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
     <th:block th:include="include :: select2-js" />
     <th:block th:include="include :: bootstrap-select-js" />
     <th:block th:include="include :: bootstrap-table-reorder-columns-js" />
     <th:block th:include="include :: bootstrap-table-resizable-js" />
    <script th:inline="javascript">
        var operTypeDatas = [[${@dict.getType('DISPATCHER_OPER_TYPE')}]];
        var prefix = ctx + "lh/dispatcherLog";

        var lhMachineNameList = [[${@lh.getMachineInfo()}]];

        $(function() {
            var options = {
                url: prefix + "/list",
                exportUrl: prefix + "/export",
                modalName: [[#{ui.data.column.lh.dispatcherlog.modelName}]],
                columns:[
                    [{title: [[#{ui.data.column.scheduleResult.baseInfo}]], align: 'center', colspan: 7},
                        {title: [[#{ui.data.column.dispatcherlog.beforeOper}]], align: 'center', colspan: 4},
                        {title: [[#{ui.data.column.dispatcherlog.AfterOper}]], align: 'center', colspan: 4}
                    ],
                    [
                        {
                            checkbox: true,
                            valign: 'middle',
                            align: 'center',
                        },
                        {
                            field: 'id',
                            title:'主键id',
                            visible: false
                        },
                        {
                            field: 'operType',
                            title: [[#{ui.data.column.dispatcherlog.operType}]],
                            valign: 'middle',
                            align: 'center',
                            halign:'center',
                            sortable: true,
                            formatter: function(value, row, index) {
                               return $.table.selectDictLabel(operTypeDatas, value);
                            }
                        },
                        {
                            field: 'scheduleDate',
                            title: [[#{ui.data.column.dispatcherlog.scheduleDate}]],
                            valign: 'middle',
                            align: 'center',
                            halign:'center',
                            sortable: true,
                        },
                        {
                            field: 'sapCode',
                            title: [[#{ui.data.column.cx.dispatcherlog.sapCode}]],
                            valign: 'middle',
                            align: 'center',
                            halign:'center',
                            sortable: true,
                        },
                        {
                            field: 'createBy',
                            title: [[#{ui.data.column.dispatcherlog.createBy}]],
                            valign: 'middle',
                            align: 'center',
                            halign:'center',
                            sortable: true,
                        },
                        {
                            field: 'createTime',
                            title: [[#{ui.data.column.dispatcherlog.createTime}]],
                            valign: 'middle',
                            align: 'center',
                            halign:'center',
                            sortable: true,
                        },
                        {
                            field: 'beforeMachineCode',
                            title: [[#{ui.data.column.dispatcherlog.lhMachineCode}]],
                            valign: 'middle',
                            align: 'center',
                            halign:'center',
                            sortable: true,
                            formatter: function (value, row, index) {
                                if ($.common.isEmpty(value)) {
                                    return '';
                                }
                                return selectMachineName(lhMachineNameList, value);
                            }
                        },
                        {
                            field: 'beforeClass1Plan',
                            title: [[#{ui.data.column.dispatcherlog.onePlan}]],
                            valign: 'middle',
                            align: 'left',
                            halign:'center',
                            sortable: true,
                        },
                        {
                            field: 'beforeClass2Plan',
                            title: [[#{ui.data.column.dispatcherlog.twoPlan}]],
                            valign: 'middle',
                            align: 'left',
                            halign:'center',
                            sortable: true,
                        },
                        {
                            field: 'beforeClass3Plan',
                            title: [[#{ui.data.column.dispatcherlog.threePlan}]],
                            valign: 'middle',
                            align: 'left',
                            halign:'center',
                            sortable: true,
                        },
                        {
                            field: 'afterMachineCode',
                            title: [[#{ui.data.column.dispatcherlog.lhMachineCode}]],
                            valign: 'middle',
                            align: 'center',
                            halign:'center',
                            sortable: true,
                            formatter: function (value, row, index) {
                                if ($.common.isEmpty(value)) {
                                    return '';
                                }
                                return selectMachineName(lhMachineNameList, value);
                            },
                            cellStyle: function(value, row, index) {
                                if ( row.beforeMachineCode != row.afterMachineCode){
                                    return { css: { "background": "#FF7B7B"} };
                                }
                                return {};
                            },
                        },
                        {
                            field: 'afterClass1Plan',
                            title: [[#{ui.data.column.dispatcherlog.onePlan}]],
                            valign: 'middle',
                            align: 'left',
                            halign:'center',
                            sortable: true,
                            cellStyle: function(value, row, index) {
                                if ( row.beforeClass1Plan != row.afterClass1Plan){
                                    return { css: { "background": "#FF7B7B"} };
                                }
                                return {};
                            },
                        },
                        {
                            field: 'afterClass2Plan',
                            title: [[#{ui.data.column.dispatcherlog.twoPlan}]],
                            valign: 'middle',
                            align: 'left',
                            halign:'center',
                            sortable: true,
                            cellStyle: function(value, row, index) {
                                if ( row.beforeClass2Plan != row.afterClass2Plan){
                                    return { css: { "background": "#FF7B7B"} };
                                }
                                return {};
                            },
                        },
                        {
                            field: 'afterClass3Plan',
                            title: [[#{ui.data.column.dispatcherlog.threePlan}]],
                            valign: 'middle',
                            align: 'left',
                            halign:'center',
                            sortable: true,
                            cellStyle: function(value, row, index) {
                                if ( row.beforeClass3Plan != row.afterClass3Plan){
                                    return { css: { "background": "#FF7B7B"} };
                                }
                                return {};
                            },
                        },
                        ]]
            };
            $.table.init(options);
        });

        //回显机台名称
        function selectMachineName(datas, value) {
            if ($.common.isEmpty(datas)) {
                return '';
            }
            var actions = [];
            var arr = value.split(",");
            $.each(datas, function (index, dict) {
                $.each(arr, function (index, item) {
                    if (dict.machineCode + '' == (item)) {
                        var machineName = $.common.equals("default", dict.machineName) || $.common.isEmpty(dict.machineName) ? "" : dict.machineName;
                        actions.push($.common.sprintf("<span>%s</span>", machineName, dict.machineName));
                        return false;
                    }
                })
            });
            return actions.join(',');
        }

    </script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}" onclick="javascript:$('input[name=\'file\']').click();" />
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}" onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;" onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);" />
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport" > [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp;	<a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
