<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改模具变动单')"/>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-moldChange-edit" th:object="${lhMoldChangePlan}">
        <input id="id" name="id" th:field="*{id}" type="hidden">

        <div class="form-group" id="scheduleDateDiv">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input id="scheduleDate" name="scheduleDate"
                           th:value="${#dates.format(lhMoldChangePlan.scheduleDate, 'yyyy-MM-dd')}"
                           class="form-control" placeholder="yyyy-MM-dd" type="text">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.moldChange.lhMachineName}]]：</label>
            <div class="col-sm-8">
                <select id="lhMachineCode" name="lhMachineCode" class="form-control" required="true"
                        th:with="type=${@lh.getMachineInfo('0')}" onchange="getLhMachineName()">
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                            th:value="${machineInfo.machineCode}" th:field="*{lhMachineCode}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.moldChange.changeTime}]]：</label>
            <div class="col-sm-8">
                <input name="changeTime" type="text"  th:value="*{#dates.format({changeTime}, 'yyyy-MM-dd HH:mm:ss')}"
                       class="form-control" id="changeTime" placeholder="yyyy-MM-dd HH:mm:ss">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.moldChange.changeType}]]：</label>
            <div class="col-sm-8">
                <select name="changeType" class="form-control" required="true" data-th-selected="*{changeType}"
                        th:with="type=${@dict.getType('CHANGE_TYPE')}" multiple>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:selected="${#arrays.contains(#strings.arraySplit(lhMoldChangePlan.changeType == null ? '' : lhMoldChangePlan.changeType, ','),#strings.toString(dict.dictValue))}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.cxScheduleResult.storageLocation}]]：</label>
            <div class="col-sm-8">
                <select name="stockArea" class="form-control" required="true"
                        th:with="type=${@dict.getType('STORAGE_LOCATION')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{stockArea}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.moldChange.beforeSapCode}]]：</label>
            <div class="col-sm-8">
                <input name="beforeSapCode" th:field="*{beforeSapCode}" class="form-control" type="text" maxlength="333" isCode="true">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.moldChange.beforeSpecDesc}]]：</label>
            <div class="col-sm-8">
                <textarea name="beforeSpecDesc" class="form-control" rows="2" th:field="*{beforeSpecDesc}" maxlength="1000"></textarea>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.moldChange.tireRoughStock}]]：</label>
            <div class="col-sm-8">
                <input name="tireRoughStock" th:field="*{tireRoughStock}" class="form-control" type="number" isInteger="true" min="0"
                       max="99999999">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.moldChange.afterSapCode}]]：</label>
            <div class="col-sm-8">
                <textarea name="afterSapCode" class="form-control" rows="2" th:field="*{afterSapCode}" maxlength="333" isCode="true"></textarea>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.moldChange.afterSpecDesc}]]：</label>
            <div class="col-sm-8">
                <textarea name="afterSpecDesc" class="form-control" rows="2" th:field="*{afterSpecDesc}" maxlength="1000"></textarea>
            </div>
        </div>


        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>

        <input id="lhMachineName" name="lhMachineName" th:field="*{lhMachineName}" type="hidden">
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">
    var prefix = ctx + "lh/moldChange";

    $(function () {
        var id = $("#id").val();
        if (id != "") {
            $('#moldBatchNo').attr("disabled", "disabled");
            $('#scheduleDate').attr("disabled", "disabled");
            $('#span1').css("color", "white");
        }else {
            $('#scheduleDateDiv').attr("hidden", "true");
        }

        layui.use('laydate', function(){
            var laydate = layui.laydate;

            laydate.render({
                elem: '#changeTime',
                type: 'datetime',
                trigger: 'click'
            });

        });
    });

    $("#form-moldChange-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-moldChange-edit').serialize());
        }
    }

    function getLhMachineName() {
        var lhMachineName = $("#lhMachineCode").find("option:selected").text();
        $("#lhMachineName").val(lhMachineName);
    }

</script>
</body>
</html>
