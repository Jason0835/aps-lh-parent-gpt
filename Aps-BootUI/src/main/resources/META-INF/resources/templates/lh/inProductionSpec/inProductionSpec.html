                        <li class="select-time">
                            <label>[[#{ui.data.column.inProductionSpec.productDate}]]：</label>

                        </li>
                        <li>
                            <label>[[#{ui.data.column.inProductionSpec.leftRightMold}]]：</label>
                            <input type="text" name="leftRightMold"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>

                        </li>
                    </ul>
                </div>

            <table id="bootstrap-table" data-reorderable-columns="true" data-resizable="true"></table>
        </div>

<th:block th:include="include :: footer"/>
<script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
<th:block th:include="include :: bootstrap-table-reorder-columns-js"/>
<th:block th:include="include :: bootstrap-table-resizable-js"/>
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('lh:inProductionSpec:edit')}]];
    var removeFlag = [[${@permission.hasPermi('lh:inProductionSpec:remove')}]];
    var isEmptyMoldDatas = [[${@dict.getType('IS_HAVE')}]];
    var prefix = ctx + "lh/inProductionSpec";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            showSearch: false,
            showRefresh: false,
            showToggle: false,
            showColumns: false,
            modalName: [[#{ui.data.column.lhInProductionSpec.modelName}]],
            columns: [
                {
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'productDate',
                    title: [[#{ui.data.column.inProductionSpec.productDate}]],
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'lhMachineName',
                    title: [[#{ui.data.column.inProductionSpec.lhMachineCode}]],
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'lhStreamCode',
                    title: [[#{ui.data.column.inProductionSpec.lhStreamCode}]],
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'sapCode',
                    title: [[#{ui.data.column.inProductionSpec.sapCode}]],
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'leftRightMold',
                    title: [[#{ui.data.column.inProductionSpec.leftRightMold}]],
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'isEmptyMold',
                    title: [[#{ui.data.column.inProductionSpec.isEmptyMold}]],
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(isEmptyMoldDatas, value);
                    }
                },
                {
                    field: 'remark',
                    title: [[#{ui.common.column.remark}]],
                    sortable: true,
                    align: 'center',
                    halign: 'center',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value, 35);
                    },
                },
            ]
        };
        $.table.init(options);
    });

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
