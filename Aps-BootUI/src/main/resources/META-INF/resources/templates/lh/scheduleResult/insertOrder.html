<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增硫化排程结果')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-add">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="endTime" name="scheduleDate" type="text" class="time-input form-control" th:value="${initDate}" th:min="${minDate}" placeholder="yyyy-MM-dd" required>
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.sapCode}]]：</label>
            <div class="col-sm-8">
                <input name="sapCode" class="form-control" type="text" isCode="true" maxlength="60" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.lhMachineName}]]：</label>
            <div class="col-sm-8">
                <select name="lhMachineCode" class="form-control" th:with="type=${@lh.getMachineInfo('0')}" required>
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"th:value="${machineInfo.machineCode}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input name="embryoCode" class="form-control" type="text" isCode="true" maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class1PlanQty" class="form-control" type="number" digits="true" min="0" max="999999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1Analysis}]]：</label>
            <div class="col-sm-8">
                <input name="class1AnalysisInput" class="form-control" type="text" maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class2PlanQty" class="form-control" type="number" digits="true" min="0" max="999999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2Analysis}]]：</label>
            <div class="col-sm-8">
                <input name="class2AnalysisInput" class="form-control" type="text" maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class3PlanQty" class="form-control" type="number" digits="true" min="0" max="999999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3Analysis}]]：</label>
            <div class="col-sm-8">
                <input name="class3AnalysisInput" class="form-control" type="text" maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "lh/scheduleResult"
    $("#form-scheduleResult-add").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            let data = $('#form-scheduleResult-add').serializeArray();
            var scheduleDate = $('#endTime').val();
            var config = {
                url: prefix + "/validateAdd",
                type: "post",
                dataType: "json",
                data: data,
                success: function (result) {
                    if (result.code === web_status.SUCCESS){
                        data.push( {"name": "isSuccess", "value": result.data.isSuccess} );
                        data.push( {"name": "cxBatchNo", "value": result.data.cxBatchNo} );
                        data.push( {"name": "batchNo", "value": result.data.batchNo} );
                        if (result.msg === ''){
                            $.operate.save(prefix + "/edit", data, reloadMachineName);
                        }else {
                            $.modal.confirm(result.msg, function () {
                                $.operate.save(prefix + "/edit", data, reloadMachineName);
                            })
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }
    }

    function reloadMachineName(){
        parent.$('#scheduleDate').val($('#endTime').val());
    }


</script>
<style>
    .select2-container--bootstrap .select2-results__group {
        color: #777;
        display: block;
        padding: 6px 12px;
        font-size: 13px;
        line-height: 1.42857143;
        white-space: nowrap;
    }
</style>
</body>
</html>
