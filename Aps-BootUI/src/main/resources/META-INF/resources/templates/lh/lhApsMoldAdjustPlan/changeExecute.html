<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改是否执行')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-lhApsMoldAdjustPlan-edit">
        <input name="ids" th:value="${ids}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.lhApsMoldAdjustPlan.isExecute}]]：</label>
            <div class="col-sm-4 radio-box" th:each="dict : ${@dict.getType('IS_HAVE')}">
                <input type="radio" th:id="${'status_' + dict.dictCode}" name="isExecute" th:value="${dict.dictValue}"
                       required>
                <label th:for="${'status_' + dict.dictCode}"
                       th:text="${dict.dictLabel}"></label>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">

    var prefix = ctx + "lh/lhApsMoldAdjustPlan";

    $("#form-lhApsMoldAdjustPlan-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/changeExecute", $('#form-lhApsMoldAdjustPlan-edit').serialize());
        }
    }
</script>
</body>
<style>
    .i-checks label.error, .check-box label.error, .radio-box label.error {
        left: 160px;
        top: 0;
    }
</style>
</html>
