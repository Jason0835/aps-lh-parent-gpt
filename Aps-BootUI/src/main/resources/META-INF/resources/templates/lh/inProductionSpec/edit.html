<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改硫化机台当前生产规格')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-inProductionSpec-edit" th:object="${lhInProductionSpec}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.productDate}]]：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input name="productDate" th:value="${#dates.format(lhInProductionSpec.productDate, 'yyyy-MM-dd')}" class="form-control" placeholder="yyyy-MM-dd" type="text">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.lhMachineCode}]]：</label>
                <div class="col-sm-8">
                    <input name="lhMachineCode" th:field="*{lhMachineCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.lhStreamCode}]]：</label>
                <div class="col-sm-8">
                    <input name="lhStreamCode" th:field="*{lhStreamCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.sapCode}]]：</label>
                <div class="col-sm-8">
                    <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.leftRightMold}]]：</label>
                <div class="col-sm-8">
                    <input name="leftRightMold" th:field="*{leftRightMold}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "lh/inProductionSpec";
        $("#form-inProductionSpec-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-inProductionSpec-edit').serialize());
            }
        }

        $("input[name='productDate']").datetimepicker({
            format: "yyyy-mm-dd",
            minView: "month",
            autoclose: true
        });
    </script>
</body>
</html>
