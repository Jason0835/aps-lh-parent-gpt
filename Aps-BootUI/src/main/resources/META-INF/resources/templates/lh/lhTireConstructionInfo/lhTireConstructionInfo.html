<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('硫化外胎施工信息列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{ui.data.column.lhTireConstructionInfo.sapCode}]]：</label>
                            <input type="text" name="sapCode"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.lhTireConstructionInfo.embryoCode}]]：</label>
                            <input type="text" name="embryoCode"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.lhTireConstructionInfo.embryoVersion}]]：</label>
                            <input type="text" name="embryoVersion"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="lh:lhTireConstructionInfo:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-resizable="true"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: bootstrap-table-resizable-js" />
<script th:inline="javascript">
    var prefix = ctx + "lh/lhTireConstructionInfo";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{ui.data.column.lhTireConstructionInfo.modelName}]],
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: 'id',
                    align: 'center',
                    halign:'center',
                    sortable: true,
                    visible: false
                },
                {
                    field: 'sapCode',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.lhTireConstructionInfo.sapCode}]],
                    sortable: true,
                },
                {
                    field: 'embryoCode',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.lhTireConstructionInfo.embryoCode}]],
                    sortable: true,
                },
                {
                    field: 'embryoVersion',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.lhTireConstructionInfo.embryoVersion}]],
                    sortable: true,
                },
                {
                    field: 'specDesc',
                    align: 'left',
                    halign:'center',
                    widthUnit: '%',
                    width: 25,
                    title: [[#{ui.data.column.cxScheduleResult.specDesc}]],
                    sortable: true,
                    formatter:function (value, row, index) {
                        return $.table.tooltip(value,50);
                    },
                },
                {
                    field: 'clampingPressure',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.lhTireConstructionInfo.clampingPressure}]],
                    sortable: true,
                },
                {
                    field: 'curingTime',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.lhTireConstructionInfo.curingTime}]],
                    sortable: true,
                },
                {
                    field: 'remark',
                    halign:'center',
                    widthUnit: '%',
                    width: 20,
                    title: [[#{ui.data.column.remark}]],
                    sortable: true,
                    formatter:function (value, row, index) {
                        return $.table.tooltip(value,50);
                    },
                }]
        };
        $.table.init(options);
        setAutoHeight();
    });

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }

    $(window).resize(function() {
        /*全屏或者放大缩小屏幕时候重新设置固定表格的高度*/
        setAutoHeight();
        setTimeout(function () {
            document.getElementsByClassName('th-inner')[0].innerHTML=baseInfo;
            $(".fixed-columns").find(".th-inner")[0].innerHTML=baseInfo;
        },1000);
    });

    //刷新表格高度
    function setAutoHeight(){
        /*全屏或者放大缩小屏幕时候重新设置固定表格的高度*/
        var wh = $(window).height();//ifram容器高度
        var fixTop = $(".fixed-table-container").offset().top;  //表格到顶部的像素
        var bh = wh-(fixTop-50);//基础默认表格高度
        $('#bootstrap-table').bootstrapTable("resetView",{height:bh});
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
