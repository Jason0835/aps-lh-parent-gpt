<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改支领计划')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-take-edit" th:object="${mixTakePlan}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.factoryCode}]]：</label>
                <div class="col-sm-8">
                    <input name="factoryCode" th:field="*{factoryCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.machineName}]]：</label>
                <div class="col-sm-8">
                    <input name="machineName" th:field="*{machineName}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.planTotalQty}]]：</label>
                <div class="col-sm-8">
                    <input name="planTotalQty" th:field="*{planTotalQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.class1PlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class1PlanQty" th:field="*{class1PlanQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.class1TakeQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class1TakeQty" th:field="*{class1TakeQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.class2PlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class2PlanQty" th:field="*{class2PlanQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.class2TakeQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class2TakeQty" th:field="*{class2TakeQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.class3PlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class3PlanQty" th:field="*{class3PlanQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.class3TakeQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class3TakeQty" th:field="*{class3TakeQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.take.planDate}]]：</label>
                <div class="col-sm-8">
                    <input name="planDate" th:field="*{planDate}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "lh/mix/take";
        $("#form-take-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-take-edit').serialize());
            }
        }
    </script>
</body>
</html>
