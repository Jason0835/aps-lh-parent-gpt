<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改密炼配方信息')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-recipeInfo-edit" th:object="${mixRecipeInfo}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.recipeInfo.factoryCode}]]：</label>
                <div class="col-sm-8">
                    <input name="factoryCode" th:field="*{factoryCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.recipeInfo.recipeCode}]]：</label>
                <div class="col-sm-8">
                    <input name="recipeCode" th:field="*{recipeCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.recipeInfo.mixingTime}]]：</label>
                <div class="col-sm-8">
                    <input name="mixingTime" th:field="*{mixingTime}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.recipeInfo.intervalTime}]]：</label>
                <div class="col-sm-8">
                    <input name="intervalTime" th:field="*{intervalTime}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "lh/mix/recipeInfo";
        $("#form-recipeInfo-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-recipeInfo-edit').serialize());
            }
        }
    </script>
</body>
</html>
