<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改母炼胶小料库存')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-masterMaterialStock-edit" th:object="${mixMasterMaterialStock}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.masterMaterialStock.factoryCode}]]：</label>
                <div class="col-sm-8">
                    <input name="factoryCode" th:field="*{factoryCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.masterMaterialStock.materialCode}]]：</label>
                <div class="col-sm-8">
                    <input name="materialCode" th:field="*{materialCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.masterMaterialStock.stockNum}]]：</label>
                <div class="col-sm-8">
                    <input name="stockNum" th:field="*{stockNum}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.masterMaterialStock.stockDate}]]：</label>
                <div class="col-sm-8">
                    <input name="stockDate" th:field="*{stockDate}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "lh/mix/masterMaterialStock";
        $("#form-masterMaterialStock-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-masterMaterialStock-edit').serialize());
            }
        }
    </script>
</body>
</html>
