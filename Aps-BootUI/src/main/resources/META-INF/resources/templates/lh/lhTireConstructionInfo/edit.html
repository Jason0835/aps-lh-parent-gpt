<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改硫化外胎施工信息')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-lhTireConstructionInfo-edit" th:object="${lhTireConstructionInfo}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.lhTireConstructionInfo.sapCode}]]：</label>
                <div class="col-sm-8">
                    <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text" isCode="true" required maxlength="20">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.lhTireConstructionInfo.clampingPressure}]]：</label>
                <div class="col-sm-8">
                    <input name="clampingPressure" th:field="*{clampingPressure}" class="form-control" type="number" min="0" max="9999.9">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.lhTireConstructionInfo.curingTime}]]：</label>
                <div class="col-sm-8">
                    <input name="curingTime" th:field="*{curingTime}" class="form-control" type="number" min="0" max="99999.9">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text" maxlength="300">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "lh/lhTireConstructionInfo";
        $("#form-lhTireConstructionInfo-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-lhTireConstructionInfo-edit').serialize());
            }
        }
    </script>
</body>
</html>
