<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改胶料日计划计划')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-rubberPlan-edit" th:object="${mixRubberPlan}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.rubberPlan.factoryCode}]]：</label>
                <div class="col-sm-8">
                    <input name="factoryCode" th:field="*{factoryCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.rubberPlan.materialCode}]]：</label>
                <div class="col-sm-8">
                    <input name="materialCode" th:field="*{materialCode}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.rubberPlan.macheinName}]]：</label>
                <div class="col-sm-8">
                    <input name="macheinName" th:field="*{macheinName}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.rubberPlan.class1PlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class1PlanQty" th:field="*{class1PlanQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.rubberPlan.class2PlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class2PlanQty" th:field="*{class2PlanQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.rubberPlan.class3PlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="class3PlanQty" th:field="*{class3PlanQty}" class="form-control" type="number">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.rubberPlan.planDate}]]：</label>
                <div class="col-sm-8">
                    <input name="planDate" th:field="*{planDate}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "lh/mix/rubberPlan";
        $("#form-rubberPlan-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-rubberPlan-edit').serialize());
            }
        }
    </script>
</body>
</html>
