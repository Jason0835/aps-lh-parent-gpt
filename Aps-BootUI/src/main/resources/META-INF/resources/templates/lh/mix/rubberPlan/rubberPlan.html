<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('胶料日计划计划列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{ui.data.column.rubberPlan.factoryCode}]]：</label>
                            <input type="text" name="factoryCode"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.rubberPlan.materialCode}]]：</label>
                            <input type="text" name="materialCode"/>
                        </li>
                        <li class="select-time">
                            <label>[[#{ui.data.column.rubberPlan.planDate}]]：</label>
                            <input type="text" class="time-input"
                                   th:placeholder="yyyy-mm-dd" name="planDate"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="lh:rubberPlan:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit()"
               shiro:hasPermission="lh:rubberPlan:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="lh:rubberPlan:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-resizable="true"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: bootstrap-table-resizable-js" />
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('lh:rubberPlan:edit')}]];
    var removeFlag = [[${@permission.hasPermi('lh:rubberPlan:remove')}]];
    var prefix = ctx + "lh/mix/rubberPlan";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{ui.data.column.rubberPlan.modelName}]],
            columns: [
                {
                    checkbox: true
                },
                {
                    field: 'id',
                    title: [[#{ui.data.column.rubberPlan.id}]],
                    sortable: true,
                    visible: false
                },
                {
                    field: 'factoryCode',
                    title: [[#{ui.data.column.rubberPlan.factoryCode}]],
                    sortable: true,
                },
                {
                    field: 'macheinName',
                    title: [[#{ui.data.column.rubberPlan.macheinName}]],
                    sortable: true,
                },
                {
                    field: 'materialCode',
                    title: [[#{ui.data.column.rubberPlan.materialCode}]],
                    sortable: true,
                },
                {
                    field: 'macheinCode',
                    sortable: true,
                    visible: false
                },
                {
                    field: 'class1PlanQty',
                    title: [[#{ui.data.column.rubberPlan.class1PlanQty}]],
                    sortable: true,
                },
                {
                    field: 'class2PlanQty',
                    title: [[#{ui.data.column.rubberPlan.class2PlanQty}]],
                    sortable: true,
                },
                {
                    field: 'class3PlanQty',
                    title: [[#{ui.data.column.rubberPlan.class3PlanQty}]],
                    sortable: true,
                },
                {
                    field: 'planDate',
                    title: [[#{ui.data.column.rubberPlan.planDate}]],
                    sortable: true,
                },
                {
                    field: 'remark',
                    title: [[#{ui.data.column.remark}]],
                    sortable: true,
                },
                {
                    title: [[#{ui.data.btn.option}]],
                    align: 'center',
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                        return actions.join('');
                    }
                }],
            onLoadSuccess: function (data) {
                mergeCells(data, "factoryCode", "", $("#bootstrap-table"));
                mergeCells(data, "macheinName", "", $("#bootstrap-table"));
            }
        };
        $.table.init(options);
    });

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }

    /**
      * 合并相同行
      * @param data 原始数据（在服务端完成排序）
      * @param fieldName 合并属性数组
     * @param condition 合并添加（符合前一个condition和当前condition相等才合并）
      * @param target 目标表格对象
      */
    function mergeCells(dataAll, fieldName,condition, target) {
        var data = dataAll;
        setTimeout(function () {
            if (data.rows.length == 0) {
                return;
            }
            var numArr = [];
            var number = 0;
            if (data.rows.length > 1) {
                for (let i = 0; i < data.rows.length; i++) {
                    if (data.rows[i][fieldName] != '' && data.rows[i][fieldName] != '-') {
                        if (data.rows[i - 1]) {
                            if (data.rows[i - 1][fieldName] != '' && data.rows[i - 1][fieldName] != '-') {
                                if (data.rows[i - 1][fieldName] == data.rows[i][fieldName] && data.rows[i - 1][condition] == data.rows[i][condition]) {
                                    number++
                                } else {
                                    number = number + 1
                                    numArr.push({index: i - number, number: number, pan: '1'})
                                    number = 0
                                }
                            }
                        }
                        if (!data.rows[i + 1]) {
                            number = number
                            numArr.push({index: i - number, number: number + 1, pan: '2'})
                            number = 0
                        } else {
                            if (data.rows[i + 1][fieldName] == '' || data.rows[i + 1][fieldName] == '-') {
                                number = number
                                numArr.push({index: i - number, number: number + 1, pan: '3'})
                                number = 0
                            }
                        }
                    } else {
                        numArr.push({index: i, number: 1, pan: '4'})
                    }
                }
            } else {
                numArr.push({index: 0, number: 1, pan: '5'})
            }
            // console.log(numArr);
            for (let x = 0; x < numArr.length; x++) {
                if (x % 2) {
                    for (let y = 0; y < numArr[x]['number']; y++) {
                        //  $(target).children('tbody').children('tr').eq(numArr[x]['index']+y).css('background','yellow')
                    }
                } else {
                    for (let y = 0; y < numArr[x]['number']; y++) {
                        $(target).children('tbody').children('tr').eq(numArr[x]['index'] + y).css('background', '#fff')
                    }
                }
                $(target).bootstrapTable('mergeCells', {
                    index: numArr[x]['index'],
                    field: fieldName,
                    colspan: 1,
                    rowspan: numArr[x]['number']
                });
            }
        }, 0)
    }

</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
