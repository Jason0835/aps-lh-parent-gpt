<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改钢丝圈定额设定')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-quota-edit" th:object="${gsqQuotaSetting}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.quota.steelRingCode}]]：</label>
            <div class="col-sm-8">
                <input name="steelRingCode" th:field="*{steelRingCode}" class="form-control" type="text"  maxlength="20" isCode="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.machine.machineName}]]：</label>
            <div class="col-sm-8">
                <select name="machineId" class="form-control" th:with="type=${@gsq.getMachineInfo()}">
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                            th:value="${machineInfo.id}" th:field="*{machineId}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.quota.quota}]]：</label>
            <div class="col-sm-8">
                <input name="quota" th:field="*{quota}" class="form-control" type="number" min="0" max="9999999" required="required">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "gsq/quota";
    $("#form-quota-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-quota-edit').serialize());
        }
    }

    $("input").change(function () {
        $(this).val($(this).val().trim());
    });


</script>
</body>
</html>
