<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改钢丝圈排程结果')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-list" th:object="${selectList}">
        <div class="form-group" id="produceLine2">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.produceLine}]]：</label>
            <div class="col-sm-8">
                <select id="machineId" name="machineId" required class="form-control selectpicker" th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}" th:with="type=${@gsq.getMachineInfo('0')}">
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}" th:value="${machineInfo.id}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">
    var prefix = ctx + "gsq/scheduleResult";
    $("#form-scheduleResult-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var machineId = $('#machineId').val();
            var datas = [];
            var list = [[${selectList}]];
            datas.push({"name": "selects", "value": JSON.stringify(list)})
            $.operate.save(prefix + "/batchChangeMachine/" + machineId, datas, function (result) {
                if (result.code == web_status.FAIL) {
                    var parent = window.parent;
                    $.modal.close();
                    parent.$.table.refresh();
                    parent.$.modal.alertError(result.msg);
                }
            });
        }
    }
</script>
</body>
<style>
    .select2-container--bootstrap .select2-results__group {
        color: #777;
        display: block;
        padding: 6px 12px;
        font-size: 13px;
        line-height: 1.42857143;
        white-space: nowrap;
    }
</style>
</html>
