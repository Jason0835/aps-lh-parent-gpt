<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('新增钢丝圈排程结果')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-add">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="endTime" name="scheduleDate" type="text" class="time-input form-control" th:value="${initDate}" th:min="${minDate}" placeholder="yyyy-MM-dd" required>
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.gsq.scheduleResult.steelRingCode}]]：</label>
            <div class="col-sm-8">
                <input id="steelRingCode" name="steelRingCode" class="form-control" type="text" isCode="true" maxlength="20" onblur="toUpperCase()" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.produceLine}]]：</label>
            <div class="col-sm-8">
                <select name="machineId" class="form-control selectpicker" th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}" th:with="type=${@gsq.getMachineInfo('0')}" required>
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"th:value="${machineInfo.id}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dayPlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="midPlanQty" class="form-control" type="number" min="0" max="99999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dayHandAnalysis}]]：</label>
            <div class="col-sm-8">
                <input name="midHandAnalysis" class="form-control" type="text"
                       maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.nightPlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="nightPlanQty" class="form-control" type="number" min="0" max="99999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.nightHandAnalysis}]]：</label>
            <div class="col-sm-8">
                <input name="nightHandAnalysis" class="form-control" type="text"
                       maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.midPlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="dayPlanQty" class="form-control" type="number" min="0" max="99999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.midHandAnalysis}]]：</label>
            <div class="col-sm-8">
                <input name="dayHandAnalysis" class="form-control" type="text"
                       maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="3" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">
    var prefix = ctx + "gsq/scheduleResult"
    $("#form-scheduleResult-add").validate({
        focusCleanup: true,
    });

    function submitHandler() {
        if ($.validate.form()) {
            var scheduleDate = $('#endTime').val();
            var config = {
                url: prefix + "/validateAdd",
                type: "post",
                dataType: "json",
                data:{"scheduleDate":scheduleDate},
                success: function (result) {
                    if (result.code == web_status.SUCCESS){
                        if(result.msg=='0'){
                            $.modal.confirm([[#{ui.data.column.scheduleResult.isContinueAdd}]], function () {
                                $.operate.save(prefix + "/edit", $('#form-scheduleResult-add').serialize(),reloadMachineName());
                            })
                        }else{
                            $.operate.save(prefix + "/edit", $('#form-scheduleResult-add').serialize(),reloadMachineName());
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }
    }

    function reloadMachineName(){
        parent.$('#scheduleDate').val($('#endTime').val());
    }

    function toUpperCase() {
        let $steelRingCode = $("#steelRingCode");
        var toUpperCase = $steelRingCode.val().toUpperCase();
        $steelRingCode.val(toUpperCase);
    }

</script>
</body>
<style>
    .select2-container--bootstrap .select2-results__group {
        color: #777;
        display: block;
        padding: 6px 12px;
        font-size: 13px;
        line-height: 1.42857143;
        white-space: nowrap;
    }
</style>
</html>
