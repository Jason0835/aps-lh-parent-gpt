<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改钢丝圈排程结果')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-edit">
        <input name="id" th:value="${id}" type="hidden">
        <input name="publishSuccessCount" th:value="${publishSuccessCount}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.produceLine}]]：</label>
            <div class="col-sm-8">
                <select name="machineId" class="form-control selectpicker" th:with="type=${machineInfoList}" th:data-none-selected-text="#{ui.data.column.selectMachineName}" required>
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}" th:value="${machineInfo.id}"></option>
                </select>
            </div>
        </div>

    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">
    var prefix = ctx + "gsq/scheduleResult";
    $("#form-scheduleResult-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            let fromData = $('#form-scheduleResult-edit').serializeArray();
            $.operate.saveNoRefresh(prefix + "/chooseMachine", fromData, updateParentCell, updateParentMove);
        }
    }

    function updateParentCell (result){
        if (result.code == web_status.SUCCESS) {
            var parent = window.parent;
            var rowIndex = [[${rowIndex}]];
            let fromData = $('#form-scheduleResult-edit').serializeArray();
            parent.$("#" + parent.table.options.id).bootstrapTable('updateCell', {
                index: rowIndex,
                field: "machineId",
                value: fromData[2].value
            });
            parent.$("#" + parent.table.options.id).bootstrapTable('updateCell', {
                index: rowIndex,
                field: "isRelease",
                value: fromData[1].value == 0 ? '0' : '5'
            });
        }
    }

    function updateParentMove() {
        //解决选机台后，固定列会往回滚的问题（start）
        var parent = window.parent;
        var left = parent.$(".fixed-table-body")[0].scrollLeft;
        if(left < 1){
            parent.$(".fixed-table-body")[0].scrollLeft = left+1;
        }else{
            parent.$(".fixed-table-body")[0].scrollLeft = left-1;
        }
        //解决选机台后，固定列会往回滚的问题（end）
    }
</script>
</body>
</html>
