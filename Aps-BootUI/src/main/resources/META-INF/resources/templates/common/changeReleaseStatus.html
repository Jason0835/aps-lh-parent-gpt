<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改排程结果发布状态')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-edit">
        <input name="scheduleDate" th:value="${#dates.format(scheduleDate, 'yyyy-MM-dd')}" type="hidden">
        <input id="prefix" name="prefix" th:value="${prefix}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.isRelease}]]：</label>
            <div class="col-sm-4 radio-box" th:each="dict : ${@dict.getType('IS_RELEASE')}" th:if="${dict.dictValue == '1' || dict.dictValue == '2'}">
                <input type="radio" th:id="${'status_' + dict.dictCode}" name="isRelease" th:value="${dict.dictValue}"
                       required>
                <label th:for="${'status_' + dict.dictCode}"
                       th:text="${dict.dictLabel}"></label>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">

    var prefix = ctx + $("#prefix").val();

    $("#form-scheduleResult-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/changeReleaseStatus", $('#form-scheduleResult-edit').serialize());
        }
    }
</script>
</body>
<style>
    .i-checks label.error, .check-box label.error, .radio-box label.error {
        left: 160px;
        top: 0;
    }
</style>
</html>
