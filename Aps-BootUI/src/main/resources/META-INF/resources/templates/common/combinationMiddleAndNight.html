<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('归并排程中夜班计划量')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-edit">
        <input name="ids" th:value="${ids}" type="hidden">
        <input id="prefix" name="prefix" th:value="${prefix}" type="hidden">
        <input id="scheduleDate" name="scheduleDate" th:value="${#dates.format(scheduleDate, 'yyyy-MM-dd')}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.combinationMiddleAndNight.shift}]]：</label>
            <div class="col-sm-4 radio-box">
                <label>
                    <input type="radio" id="classifiedShift1" name="classifiedShift" th:value="1" required>
                    [[#{ui.data.column.combinationMiddleAndNight.middleShift}]]
                </label>
            </div>
            <div class="col-sm-4 radio-box">
                <label>
                    <input type="radio" id="classifiedShift2" name="classifiedShift" th:value="2" required>
                    [[#{ui.data.column.combinationMiddleAndNight.nightShift}]]
                </label>
            </div>
            <div id="tipDiv" style="color:red;display: none" class="col-sm-4">历史排程记录不允许进行“中夜班归并”操作</div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">

    var prefix = ctx + $("#prefix").val();

    $("#form-scheduleResult-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            // var scheduleDate = $("#scheduleDate").val();
            // var config = {
            //     url: prefix + "/isPublish",
            //     type: "post",
            //     dataType: "json",
            //     data: {"scheduleDate": scheduleDate},
            //     success: function (result) {
            //         if (result.code == web_status.SUCCESS){
            //             $.operate.save(prefix + "/combinationMiddleAndNight", $('#form-scheduleResult-edit').serialize());
            //         } else {
            //             $.modal.alertWarning([[#{ui.data.column.scheduleResult.mergeProduct.isPublished}]]);
            //         }
            //     }
            // };
            // $.ajax(config)
            var scheduleDate = $("#scheduleDate").val();
            var scheduleTimeStr = scheduleDate;  //胎面胶第一个班是0点结束
            scheduleTimeStr = scheduleTimeStr.replace(/-/g, "/");
            var scheduleTime = new Date(scheduleTimeStr);
            if(new Date() > scheduleTime) {
                $("#tipDiv").show();
            } else {
                $.operate.save(prefix + "/combinationMiddleAndNight", $('#form-scheduleResult-edit').serialize(), function (result) {
                    if (result.code == web_status.FAIL) {
                        var parent = window.parent;
                        $.modal.close();
                        parent.$.modal.alertError(result.msg);
                    }
                });
            }
        }
    }
</script>
</body>
<style>
    .i-checks label.error, .check-box label.error, .radio-box label.error {
        left: 170px;
        top: 0;
    }
    .m {margin: 60px 25px;}
</style>
</html>
