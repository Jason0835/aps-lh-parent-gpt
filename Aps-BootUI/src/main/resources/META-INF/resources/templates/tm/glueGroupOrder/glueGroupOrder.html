<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('胎面胶料组别顺序列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                [[#{ui.glueGroup.column.glueGroupCode}]]：<input type="text" name="glueGroupCode"/>
                            </li>
                            <li>
                                [[#{ui.glueGroup.column.glueGroupName}]]：<input type="text" name="glueGroupName"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add('',350)" shiro:hasPermission="tm:glueGroupOrder:add">
                    <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit('',350)" shiro:hasPermission="tm:glueGroupOrder:edit">
                    <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="tm:glueGroupOrder:remove">
                    <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
                </a>
                <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="tm:glueGroupOrder:import">
                    <i class="fa fa-download"></i> [[#{ui.frame.btn.name.import}]]
                </a>
                <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="tm:glueGroupOrder:export">
                    <i class="fa fa-upload"></i> [[#{ui.frame.btn.export}]]
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table" data-reorderable-columns="true" data-resizable="true"></table>
            </div>
        </div>
    </div>

    <th:block th:include="include :: footer" />
     <script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
     <th:block th:include="include :: bootstrap-table-reorder-columns-js" />
     <th:block th:include="include :: bootstrap-table-resizable-js" />

    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('tm:glueGroupOrder:edit')}]];
        var removeFlag = [[${@permission.hasPermi('tm:glueGroupOrder:remove')}]];
        var prefix = ctx + "tm/glueGroupOrder";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                importUrl: prefix + "/importData",
                modalName: [[#{ui.tm.glueGroup.column.modalName}]],
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'ID',
                    halign:'center',
                    align: 'left',
                    sortable: true,
                    visible: false
                },
                {
                    field: 'glueGroupCode',
                    title: [[#{ui.glueGroup.column.glueGroupCode}]],
                    halign:'center',
                    align: 'center',
                    sortable: true,
                    widthUnit: '%',
                    width: 20,
                },
                {
                    field: 'glueGroupName',
                    title: [[#{ui.glueGroup.column.glueGroupName}]],
                    halign:'center',
                    align: 'center',
                    sortable: true,
                    widthUnit: '%',
                    width: 20,
                },
                {
                    field: 'orderNum',
                    title: [[#{ui.glueGroup.column.orderNum}]],
                    halign:'center',
                    align: 'center',
                    sortable: true,
                    widthUnit: '%',
                    width: 20,
                },
                {
                    field: 'remark',
                    title: [[#{ui.common.column.remark}]],
                    halign:'center',
                    align: 'left',
                    sortable: true,
                    formatter:function (value, row, index) {
                        return $.table.tooltip(value,20);
                    },
                    widthUnit: '%',
                    width: 20,
                },
                {
                    title: [[#{ui.data.btn.option}]],
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit('+row.id+','+'350'+')"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                        return actions.join('');
                    },
                    widthUnit: '%',
                    width: 20,
                }]
            };
            $.table.init(options);
        });

        // 下载模板
        function importTemplate() {
            window.location.href = prefix + "/importTemplate";
        }
    </script>
</body>
<!-- 导入区域 -->
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
