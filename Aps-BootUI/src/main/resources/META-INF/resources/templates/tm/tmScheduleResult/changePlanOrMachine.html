<script th:inline="javascript">
    var prefix = ctx + "tm/tmScheduleResult";

    $(function () {
        var editType = $("#editType").val();
        if(editType=='1') { //转机台页面
            $('#produceLine').attr('hidden',false);
            $('#machineId1').attr('disabled','disabled');
        }else if(editType=='2'){ //调量页面
            $('#planQty').attr('hidden',false);
            $('#machineId0').attr('disabled','disabled');

            var dayFinishRate=$("#dayFinishRate").val();
            var str = Number(dayFinishRate * 100).toFixed(2)+"%";;
            $("#dayFinishRate").val(str);

            var nightFinishRate=$("#nightFinishRate").val();
            var str = Number(nightFinishRate * 100).toFixed(2)+"%";;
            $("#nightFinishRate").val(str);

            //历史的排程记录，不允许修改计划量和顺序
            var scheduleDate = $("#scheduleDate").val();
            scheduleDate = scheduleDate.replace(/-/g, "/");
            let two1PlanTime = new Date(scheduleDate)
            let two2PlanTime = new Date(scheduleDate + " 12:00:00")
            let now = new Date()
            //如果超过一班
            if (now > two1PlanTime) {
                $("input[name='dayPlanQty']").attr("readonly", true);
                $("input[name='dayProduceOrder']").attr("readonly", true);
            }
            //如果超过二班
            if (now > two2PlanTime) {
                $("input[name='nightPlanQty']").attr("readonly", true);
                $("input[name='nightProduceOrder']").attr("readonly", true);
            }
        }
    });

    $("#form-tmScheduleResult-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var editType = $("#editType").val();
            if(editType == '1') { //转机台页面
                $.operate.save(prefix + "/changeMachine", $('#form-tmScheduleResult-edit').serialize());
            }else {
                $.operate.save(prefix + "/changeQty", $('#form-tmScheduleResult-edit').serialize());
            }
        }
    }

</script>
