<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('运维删除排程')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-specify-edit" >
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.maintenance.log.procedureCode}]]：</label>
            <div class="col-sm-8">
                <select id="procedureCode" name="procedureCode" th:with="type=${@dict.getType('PROCEDURE_CODE')}" class="form-control" required="true" onchange="procedureChange()">
                    <option value="">[[#{ui.frame.btn.choose}]]</option>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="endTime" name="scheduleDate" type="text" class="time-input form-control" placeholder="yyyy-MM-dd" required="true">
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>

        <div class="form-group" id="sapCodeDiv" style="display:none">
            <label class="col-sm-3 control-label">[[#{ui.data.column.maintenance.log.sap}]]：</label>
            <div class="col-sm-8">
                <input id="sapCode" name="sapCode" placeholder="不填则表示所有" class="form-control" type="text"  isCode="true" maxlength="60">
            </div>
        </div>

        <div class="form-group" id="materialCodeDiv">
            <label id="materialLabel" class="col-sm-3 control-label">[[#{ui.data.column.maintenance.log.material}]]：</label>
            <div class="col-sm-8">
                <input id="materialCode" name="materialCode" placeholder="不填则表示所有" class="form-control" type="text" isCode="true" maxlength="60">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.maintenance.log.machine}]]：</label>
            <div class="col-sm-8" id="machine_list">
                <select id="machineId" name="machineId" class="form-control" th:fragment="machine_list" >
                    <option value="">[[#{ui.frame.btn.all}]]</option>
                    <option th:each="machineInfo : ${machineList}" th:text="${machineInfo.machineName}" th:value="${machineInfo.id}" ></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.maintenance.log.operReason}]]：</label>
            <div class="col-sm-8">
                <textarea name="operReason" class="form-control" rows="2" maxlength="300" required="true"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer" />
<script th:inline="javascript">
    var prefix = ctx + "maintenanceLog";

    $("#form-specify-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/deleteSchedule", $('#form-specify-edit').serialize());
        }
    }

    function procedureChange() {
        var procedureCode = $("#procedureCode").val();
        if(procedureCode == "0" || procedureCode == "1") {
            //成型硫化工序
            $("#sapCodeDiv").show();
            $("#sapCode").removeAttr("disabled");
        } else {
            $("#sapCodeDiv").hide();
            $("#sapCode").attr("disabled","disabled");
        }

        if(procedureCode == "0") {
            $("#materialCodeDiv").hide();
            $("#materialCode").attr("disabled");
        } else  {
            $("#materialCodeDiv").show();
            $("#materialCode").removeAttr("disabled");
        }
        modifyMaterialLabel(procedureCode);  //根据选择的工序，修改“物料编号"label的内容

        //ajax局部刷新机台下拉框
        var url = prefix + "/listMachineByProcedure?procedureCode=" + procedureCode
        $.ajax({
            url: url,
            type: 'GET',
            success: function (data) {
                $("#machine_list").html(data);
            }
        })
    }

    function modifyMaterialLabel(procedureCode) {
        if(procedureCode == "0" || procedureCode == "1") {
            $("#materialLabel").text("胎胚代码：");
        } else if(procedureCode == "2") {
            $("#materialLabel").text("胎面代码：");
        } else if(procedureCode == "3") {
            $("#materialLabel").text("胎侧代码：");
        } else if(procedureCode == "4") {
            $("#materialLabel").text("内衬代码：");
        } else if(procedureCode == "5") {
            $("#materialLabel").text("胎圈代码：");
        } else if(procedureCode == "6") {
            $("#materialLabel").text("钢丝圈代码：");
        } else if(procedureCode == "7") {
            $("#materialLabel").text("1#钢带代码：");
        } else if(procedureCode == "8") {
            $("#materialLabel").text("帘布代码：");
        } else if(procedureCode == "9") {
            $("#materialLabel").text("钢压大卷代码：");
        } else if(procedureCode == "10") {
            $("#materialLabel").text("帘布大卷代码：");
        }
    }
</script>
</body>
</html>
