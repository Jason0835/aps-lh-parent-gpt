<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改成型收尾范围系数')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-closeOutRange-edit" th:object="${cxCloseOutRange}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.closeOutRange.rangeName}]]：</label>
                <div class="col-sm-8">
                    <input name="rangeName" th:field="*{rangeName}" class="form-control" type="text" required maxlength="100">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.closeOutRange.closeOutRangeMinimum}]]：</label>
                <div class="col-sm-8">
                    <input id="closeOutRangeMinimum" name="closeOutRangeMinimum" th:field="*{closeOutRangeMinimum}" class="form-control" type="number" min="0" max="99999999" isInteger="true" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.closeOutRange.closeOutRangeMaximum}]]：</label>
                <div class="col-sm-8">
                    <input id="closeOutRangeMaximum" name="closeOutRangeMaximum" th:field="*{closeOutRangeMaximum}" class="form-control" type="number" min="0" max="99999999" isInteger="true" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.closeOutRange.rangeValue}]]：</label>
                <div class="col-sm-8">
                    <input name="rangeValue" th:field="*{rangeValue}" class="form-control" type="number" min="0" max="99999.9" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text" maxlength="300">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/closeOutRange";
        $("#form-closeOutRange-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var closeOutRangeMinimum = $("#closeOutRangeMinimum").val();
                var closeOutRangeMaximum = $("#closeOutRangeMaximum").val();
                if(Number(closeOutRangeMinimum)>Number(closeOutRangeMaximum)){
                    $.modal.alertWarning([[#{ui.error.message.minMoreThanMax}]]);
                    return ;
                }
                $.operate.save(prefix + "/edit", $('#form-closeOutRange-edit').serialize());
            }
        }
    </script>
</body>
</html>
