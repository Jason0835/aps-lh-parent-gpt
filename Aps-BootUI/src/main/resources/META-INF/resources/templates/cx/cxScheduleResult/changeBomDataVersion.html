<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改投产施工信息')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-productConstruction-edit" th:object="${cxScheduleResult}">
        <input name="id" th:field="*{id}" type="hidden">
        <input  id="scheduleDate" name="scheduleDate" th:value="*{#dates.format({scheduleDate}, 'yyyy-MM-dd')}" type="hidden">
        <input name="cxMachineCode" th:field="*{cxMachineCode}" type="hidden">
        <input name="sapCode" th:field="*{sapCode}" type="hidden">
        <input name="publishSuccessCount" th:field="*{publishSuccessCount}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" readonly>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <select  name="bomDataVersion" class="form-control" th:with="type=${embryoVersions}" required>
                    <option th:each="item : ${type}" th:text="${item.embryoVersion}" th:value="${item.embryoVersion}" th:field="*{bomDataVersion}" th:dimension="${item.dimension}" th:specDesc="${item.specDesc}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">

    var prefix = ctx + "cx/cxScheduleResult";

    $("#form-productConstruction-edit").validate({
        focusCleanup: true
    });


    function submitHandler() {
        if ($.validate.form()) {
            //Joran 2021-12-07 获取版本施工寸口信息
            var dimension=$("select[name='bomDataVersion'] ").find("option:selected").attr("dimension");
            var specDesc=$("select[name='bomDataVersion'] ").find("option:selected").attr("specDesc");
            var data = $("#form-productConstruction-edit").serializeArray();
            data.push({"name": "specDimension", "value": dimension});
            data.push({"name": "specDesc", "value": specDesc});
            $.operate.save(prefix + "/changeBomDataVersion",data);
        }
    }
</script>
</body>
</html>
