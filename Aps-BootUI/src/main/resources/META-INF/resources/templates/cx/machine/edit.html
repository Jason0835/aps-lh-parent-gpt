<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改成型机台信息')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-info-edit" th:object="${cxMachineInfo}">
        <input id="machineId" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.machine.machineCode}]]：</label>
            <div class="col-sm-8">
                <input id="machineCode" name="machineCode" th:field="*{machineCode}" class="form-control" type="text"
                       required="true" isCode="true" maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.machine.machineName}]]：</label>
            <div class="col-sm-8">
                <input id="machineName" name="machineName" th:field="*{machineName}" class="form-control" type="text" required="true"maxlength="20">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.machine.machineType}]]：</label>
            <div class="col-sm-8">
                <select name="type" class="form-control" th:with="type=${@dict.getType('CX_MACHINE_TYPE')}" >
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{type}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.type}]]：</label>
            <div class="col-sm-8">
                <select name="machineType" class="form-control" th:with="type=${@dict.getType('MACHINE_TYPE')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{machineType}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.dimensionMiniMum}]]：</label>
            <div class="col-sm-8">
                <input id="dimensionMiniMum" name="dimensionMiniMum" th:field="*{dimensionMiniMum}" class="form-control" type="number"  min="0" max="9999.99">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.dimensionMaxiMum}]]：</label>
            <div class="col-sm-8">
                <input id="dimensionMaxiMum" name="dimensionMaxiMum" th:field="*{dimensionMaxiMum}" class="form-control" type="number"  min="0" max="9999.99">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.operatorQty}]]：</label>
            <div class="col-sm-8">
                <input name="operatorQty" th:field="*{operatorQty}" class="form-control" type="number"  min="0" max="999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.machine.quata}]]：</label>
            <div class="col-sm-8">
                <input name="quata" th:field="*{quata}" class="form-control" type="number" required="true" min="0"  digits="true" max="9999999">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.quotaRatio}]]：</label>
            <div class="col-sm-8">
                <input id="quotaRatio" name="quotaRatio" th:field="*{quotaRatio}" class="form-control"  type="number"  min="0.01" max="9999.99">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.classShift}]]：</label>
            <div class="col-sm-8">
                <div class="radio-box" th:each="dict : ${@dict.getType('CLASS_SHIFT')}">
                    <input type="radio" th:id="${dict.dictCode}" name="classShift" th:value="${dict.dictValue}"
                           th:checked="${cxMachineInfo.id==null?dict.default:(cxMachineInfo.classShift==dict.dictValue)}"/>
                    <label th:for="${dict.dictValue}" th:text="${dict.dictLabel}"></label>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.machine.status}]]：</label>
            <div class="col-sm-8">
                <label class="toggle-switch switch-solid">
                    <input type="checkbox" id="status" th:checked="${cxMachineInfo.status == '0' || cxMachineInfo.status == null ? true : false}">
                    <span></span>
                </label>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "cx/machine";

    $(function () {
        var machineId = $("#machineId").val();
        if(machineId !="") { //编辑页面
            $('#machineCode').attr("disabled","disabled");
            $('#noid').attr("disabled","disabled");
            $("#span1").css("color","white");
            $("#span0").css("color","white");
        }
    });

    $("#form-info-edit").validate({
        onkeyup: false,
        rules: {
            machineCode: {
                remote: {
                    url: prefix + "/checkMachineCodeUnique",
                    type: "post",
                    dataType: "json",
                    data: {
                        "id": function () {
                            return $("#machineId").val();
                        },
                        "machineCode": function () {
                            return $.common.trim($("#machineCode").val());
                        }
                    },
                    dataFilter: function (data, type) {
                        return $.validate.unique(data);
                    }
                }
            },
            machineName: {
                remote: {
                    url: prefix + "/checkMachineCodeUnique",
                    type: "post",
                    dataType: "json",
                    data: {
                        "id": function () {
                            return $("#machineId").val();
                        },
                        "machineName": function () {
                            return $.common.trim($("#machineName").val());
                        }
                    },
                    dataFilter: function (data, type) {
                        return $.validate.unique(data);
                    }
                }
            },
        },
        messages: {
            "machineCode": {
                remote: [[#{ui.data.column.cx.machine.message}]]
            },
            "machineName": {
                remote: [[#{ui.data.column.cx.machineName.message}]]
            }
        },
        focusCleanup: true
    });


    function submitHandler(){
        if ($.validate.form()) {
            var config = {
                url: prefix + "/checkMachineCodeUnique",
                type: "post",
                dataType: "json",
                data:{
                    "id": $("#machineId").val(),
                    "machineCode": $("#machineCode").val(),
                },
                success: function (result) {
                    if('1'==result){
                        $.modal.alertWarning([[#{ui.data.column.cx.machine.message}]]);
                    }else if('0'==result){
                        checkMachineName();
                    }
                }
            };
            $.ajax(config)
        }
    }

    function checkMachineName(){
        var config = {
            url: prefix + "/checkMachineCodeUnique",
            type: "post",
            dataType: "json",
            data:{
                "id": $("#machineId").val(),
                "machineName": $("#machineName").val(),
            },
            success: function (result) {
                if('1'==result){
                    $.modal.alertWarning([[#{ui.data.column.cx.machineName.message}]]);
                }else if('0'==result){
                    lastSubmit();
                }
            }
        };
        $.ajax(config)
    }

    function lastSubmit() {
        var dimensionMiniMum = $("#dimensionMiniMum").val();
        var dimensionMaxiMum = $("#dimensionMaxiMum").val();
        if(Number(dimensionMiniMum)>Number(dimensionMaxiMum) && $.common.isNotEmpty(dimensionMaxiMum)){
            $.modal.alertWarning([[#{ui.data.column.machine.dimensionMaximumBigThanDimensionMinmum}]]);
            return ;
        }
        if ($.validate.form()) {
            var data = $("#form-info-edit").serializeArray();
            var status = $("input[id='status']").is(':checked') == true ? '0' : '1';
            data.push({"name": "status", "value": status});
            $.operate.save(prefix + "/edit", data);
        }
    }
</script>
</body>
</html>
