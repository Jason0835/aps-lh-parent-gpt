<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改投产施工信息')"/>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-productConstruction-edit" th:object="${cxProductConstructionInfo}">
        <input name="id" th:field="*{id}" type="hidden">
        <input id="queryType" name="queryType" th:field="*{queryType}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" readonly>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <input id="embryoVersion" name="embryoVersion" th:field="*{embryoVersion}" class="form-control" type="text" readonly>
            </div>
        </div>

        <div id="tireFabric1Version1" hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.tireFabricCode1}]]：</label>
                <div class="col-sm-8">
                    <input id="tireFabricCode1" name="tireFabricCode1" th:field="*{tireFabricCode1}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.tireFabric1Version}]]：</label>
                <div class="col-sm-8">
                    <select id="tireFabric1Version" name="tireFabric1Version" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.tireFabric1Version}" th:value="${item.tireFabricCode1}"
                                th:selected="${cxProductConstructionInfo.tireFabric1Version eq item.tireFabric1Version}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="tireFabric2Version1"  hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.tireFabricCode2}]]：</label>
                <div class="col-sm-8">
                    <input id="tireFabricCode2" name="tireFabricCode2" th:field="*{tireFabricCode2}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.tireFabric2Version}]]：</label>
                <div class="col-sm-8">
                    <select id="tireFabric2Version" name="tireFabric2Version" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.tireFabric2Version}" th:value="${item.tireFabricCode2}"
                                th:selected="${cxProductConstructionInfo.tireFabric2Version eq item.tireFabric2Version}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="tireFabric3Version1"  hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.tireFabricCode3}]]：</label>
                <div class="col-sm-8">
                    <input id="tireFabricCode3" name="tireFabricCode3" th:field="*{tireFabricCode3}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.tireFabric3Version}]]：</label>
                <div class="col-sm-8">
                    <select id="tireFabric3Version" name="tireFabric3Version" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.tireFabric3Version}" th:value="${item.tireFabricCode3}"
                                th:selected="${cxProductConstructionInfo.tireFabric3Version eq item.tireFabric3Version}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="cordVersion1"  hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.cordSpec}]]：</label>
                <div class="col-sm-8">
                    <input id="cordSpec" name="cordSpec" th:field="*{cordSpec}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.cordVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="cordVersion" name="cordVersion" class="form-control" th:with="type=${versions}" required>
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.cordVersion}" th:value="${item.cordVersion}" th:field="*{cordVersion}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="insideVersion1"  hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.insideCode}]]：</label>
                <div class="col-sm-8">
                    <input id="insideCode" name="insideCode" th:field="*{insideCode}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.insideVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="insideVersion" name="insideVersion" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.insideVersion}" th:value="${item.insideCode}"
                                th:selected="${cxProductConstructionInfo.insideVersion eq item.insideVersion}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="sidewallVersion1" hidden>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.sidewallCode}]]：</label>
                <div class="col-sm-8">
                    <input id="sidewallCode" name="sidewallCode" th:field="*{sidewallCode}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.sidewallVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="sidewallVersion" name="sidewallVersion" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.sidewallVersion}" th:value="${item.sidewallCode}"
                                th:selected="${cxProductConstructionInfo.sidewallVersion eq item.sidewallVersion}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="beadVersion1" hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.beadCode}]]：</label>
                <div class="col-sm-8">
                    <input id="beadCode" name="beadCode" th:field="*{beadCode}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.beadVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="beadVersion" name="beadVersion" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.beadVersion}" th:value="${item.beadCode}"
                                th:selected="${cxProductConstructionInfo.beadVersion eq item.beadVersion}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="tireRingVersion1" hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.tireRingCode}]]：</label>
                <div class="col-sm-8">
                    <input id="tireRingCode" name="tireRingCode" th:field="*{tireRingCode}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.tireRingVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="tireRingVersion" name="tireRingVersion" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.tireRingVersion}" th:value="${item.tireRingCode}"
                                th:selected="${cxProductConstructionInfo.tireRingVersion eq item.tireRingVersion}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="belt1Version1" hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.beltCode1}]]：</label>
                <div class="col-sm-8">
                    <input id="beltCode1" name="beltCode1" th:field="*{beltCode1}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.belt1Version}]]：</label>
                <div class="col-sm-8">
                    <select id="belt1Version" name="belt1Version" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.belt1Version}" th:value="${item.beltCode1}"
                                th:selected="${cxProductConstructionInfo.belt1Version eq item.belt1Version}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="belt2Version1" hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.beltCode2}]]：</label>
                <div class="col-sm-8">
                    <input id="beltCode2" name="beltCode2" th:field="*{beltCode2}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.belt2Version}]]：</label>
                <div class="col-sm-8">
                    <select id="belt2Version" name="belt2Version" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.belt2Version}" th:value="${item.beltCode2}"
                                th:selected="${cxProductConstructionInfo.belt2Version eq item.belt2Version}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="articleCrownVersion1" hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.articleCrownSpec}]]：</label>
                <div class="col-sm-8">
                    <input id="articleCrownSpec" name="articleCrownSpec" th:field="*{articleCrownSpec}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.articleCrownVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="articleCrownVersion" name="articleCrownVersion" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.articleCrownVersion}" th:value="${item.articleCrownSpec}"
                                th:selected="${cxProductConstructionInfo.articleCrownVersion eq item.articleCrownVersion}"></option>
                    </select>
                </div>
            </div>
        </div>

        <div id="treadVersion1" hidden="true">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.treadCode}]]：</label>
                <div class="col-sm-8">
                    <input id="treadCode" name="treadCode" th:field="*{treadCode}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.treadVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="treadVersion" name="treadVersion" class="form-control" th:with="type=${versions}" required onchange="changeDetail()">
                        <option value="">[[#{ui.frame.btn.choose}]]</option>
                        <option th:each="item : ${type}" th:text="${item.treadVersion}" th:value="${item.treadCode}"
                                th:selected="${cxProductConstructionInfo.treadVersion eq item.treadVersion}"></option>
                    </select>
                </div>
            </div>
        </div>

    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">

    var prefix = ctx + "cx/productConstruction";

    $(function () {
        var editType = $("#queryType").val();
        if(editType=='TREAD') { // * 胎面：TREAD
            $('#treadVersion1').attr('hidden',false);
        }else if(editType=='SIDEWALL'){// * 胎侧：SIDEWALL
            $('#sidewallVersion1').attr('hidden',false);
        }else if(editType=='INSIDE'){// * 内衬：INSIDE
            $('#insideVersion1').attr('hidden',false);
        }else if(editType=='TIRE_RING'){// * 胎圈：TIRE_RING
            $('#tireRingVersion1').attr('hidden',false);
        }else if(editType=='BEAD'){// * 钢丝圈：BEAD
            $('#beadVersion1').attr('hidden',false);
        }else if(editType=='BELT1'){// * 1#钢带：BELT1
            $('#belt1Version1').attr('hidden',false);
        }else if(editType=='BELT2'){// * 2#钢带：BELT2
            $('#belt2Version1').attr('hidden',false);
        }else if(editType=='ARTICLE_CROWN'){// * 钢压大卷：ARTICLE_CROWN
            $('#articleCrownVersion1').attr('hidden',false);
        }else if(editType=='TIRE_FABRIC1'){// * 1#胎体布：TIRE_FABRIC1
            $('#tireFabric1Version1').attr('hidden',false);
        }else if(editType=='TIRE_FABRIC2'){// * 2#胎体布：TIRE_FABRIC2
            $('#tireFabric2Version1').attr('hidden',false);
        }else if(editType=='TIRE_FABRIC3'){// * 3#胎体布：TIRE_FABRIC3
            $('#tireFabric3Version1').attr('hidden',false);
        }else if(editType=='CORD'){// * 帘布大卷：CORD
            $('#cordVersion1').attr('hidden',false);
        }
    });

    $("#form-productConstruction-edit").validate({
        focusCleanup: true
    });

    //为了下拉框反显半部件编码，用下拉框的vaule存编码值，用下拉框的html存版本值，
    function changeDetail(){
        var editType = $("#queryType").val();
        if($.common.isEmpty(editType)){
            return;
        }
        if(editType=='TREAD') { // * 胎面：TREAD
            var treadCode=$("#treadVersion").find("option:selected").val();
            $("#treadCode").val(treadCode);
        }else if(editType=='SIDEWALL'){// * 胎侧：SIDEWALL
            var sidewallCode=$("#sidewallVersion").find("option:selected").val();
            $("#sidewallCode").val(sidewallCode);
        }else if(editType=='INSIDE'){// * 内衬：INSIDE
            var insideCode=$("#insideVersion").find("option:selected").val();
            $("#insideCode").val(insideCode);
        }else if(editType=='TIRE_RING'){// * 胎圈：TIRE_RING
            var tireRingCode=$("#tireRingVersion").find("option:selected").val();
            $("#tireRingCode").val(tireRingCode);
        }else if(editType=='BEAD'){// * 钢丝圈：BEAD
            var beadCode=$("#beadVersion").find("option:selected").val();
            $("#beadCode").val(beadCode);
        }else if(editType=='BELT1'){// * 1#钢带：BELT1
            var beltCode1=$("#belt1Version").find("option:selected").val();
            $("#beltCode1").val(beltCode1);
        }else if(editType=='BELT2'){// * 2#钢带：BELT2
            var beltCode2=$("#belt2Version").find("option:selected").val();
            $("#beltCode2").val(beltCode2);
        }else if(editType=='ARTICLE_CROWN'){// * 钢压大卷：ARTICLE_CROWN
            var articleCrownSpec=$("#articleCrownVersion").find("option:selected").val();
            $("#articleCrownSpec").val(articleCrownSpec);
        }else if(editType=='TIRE_FABRIC1'){// * 1#胎体布：TIRE_FABRIC1
            var tireFabricCode1=$("#tireFabric1Version").find("option:selected").val();
            $("#tireFabricCode1").val(tireFabricCode1);
        }else if(editType=='TIRE_FABRIC2'){// * 2#胎体布：TIRE_FABRIC2
            var tireFabricCode2=$("#tireFabric2Version").find("option:selected").val();
            $("#tireFabricCode2").val(tireFabricCode2);
        }else if(editType=='TIRE_FABRIC3'){// * 3#胎体布：TIRE_FABRIC3
            var tireFabricCode3=$("#tireFabric3Version").find("option:selected").val();
            $("#tireFabricCode3").val(tireFabricCode3);
        }else if(editType=='CORD'){// * 帘布大卷：CORD
            var cordSpec=$("#cordVersion").find("option:selected").val();
            $("#cordSpec").val(cordSpec);
        }
    }

    function submitHandler() {
        if ($.validate.form()) {
            var editType = $("#queryType").val();
            if($.common.isEmpty(editType)){
                return;
            }
            if(editType=='TREAD') { // * 胎面：TREAD
                var treadVersion=$("#treadVersion").find("option:selected").html();
                $("#treadVersion").find("option:selected").val(treadVersion);
            }else if(editType=='SIDEWALL'){// * 胎侧：SIDEWALL
                var sidewallVersion=$("#sidewallVersion").find("option:selected").html();
                $("#sidewallVersion").find("option:selected").val(sidewallVersion);
            }else if(editType=='INSIDE'){// * 内衬：INSIDE
                var insideVersion=$("#insideVersion").find("option:selected").html();
                $("#insideVersion").find("option:selected").val(insideVersion);
            }else if(editType=='TIRE_RING'){// * 胎圈：TIRE_RING
                var tireRingVersion=$("#tireRingVersion").find("option:selected").html();
                $("#tireRingVersion").find("option:selected").val(tireRingVersion);
            }else if(editType=='BEAD'){// * 钢丝圈：BEAD
                var beadVersion=$("#beadVersion").find("option:selected").html();
                $("#beadVersion").find("option:selected").val(beadVersion);
            }else if(editType=='BELT1'){// * 1#钢带：BELT1
                var belt1Version=$("#belt1Version").find("option:selected").html();
                $("#belt1Version").find("option:selected").val(belt1Version);
            }else if(editType=='BELT2'){// * 2#钢带：BELT2
                var belt2Version=$("#belt2Version").find("option:selected").html();
                $("#belt2Version").find("option:selected").val(belt2Version);
            }else if(editType=='ARTICLE_CROWN'){// * 钢压大卷：ARTICLE_CROWN
                var articleCrownVersion=$("#articleCrownVersion").find("option:selected").html();
                $("#articleCrownVersion").find("option:selected").val(articleCrownVersion);
            }else if(editType=='TIRE_FABRIC1'){// * 1#胎体布：TIRE_FABRIC1
                var tireFabric1Version=$("#tireFabric1Version").find("option:selected").html();
                $("#tireFabric1Version").find("option:selected").val(tireFabric1Version);
            }else if(editType=='TIRE_FABRIC2'){// * 2#胎体布：TIRE_FABRIC2
                var tireFabric2Version=$("#tireFabric2Version").find("option:selected").html();
                $("#tireFabric2Version").find("option:selected").val(tireFabric2Version);
            }else if(editType=='TIRE_FABRIC3'){// * 3#胎体布：TIRE_FABRIC3
                var tireFabric3Version=$("#tireFabric3Version").find("option:selected").html();
                $("#tireFabric3Version").find("option:selected").val(tireFabric3Version);
            }else if(editType=='CORD'){// * 帘布大卷：CORD
                var cordVersion=$("#cordVersion").find("option:selected").html();
                $("#cordVersion").find("option:selected").val(cordVersion);
            }
            var datas=$('#form-productConstruction-edit').serialize();
            $.operate.save(prefix + "/edit", datas);
        }
    }
</script>
</body>
</html>
