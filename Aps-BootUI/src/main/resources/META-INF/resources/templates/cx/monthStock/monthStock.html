<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('月结库存信息表')"/>
    <th:block th:include="include :: datetimepicker-css"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li class="select-time">
                            <label>[[#{ui.data.column.cx.monthStock.stockMonth}]]：</label>
                            <input type="text" class="input-sm form-control" id="datetimepicker-startTime"
                                   placeholder="开始时间" name="beginStockMonth" autocomplete="off" style="width: 100px"/>
                            <span>-</span>
                            <input type="text" class="input-sm form-control" id="datetimepicker-endTime"
                                   placeholder="结束时间" name="endStockMonth" autocomplete="off" style="width: 100px"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.productStatus.bomDataVersion}]]：</label>
                            <input type="text" name="bomDataVersion"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.cx.monthStock.embryoCode}]]：</label>
                            <input type="text" name="embryoCode"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.cx.monthStock.stockNum}]]：</label>
                            <input type="number" name="stockNum" digits="true"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add('',450)" shiro:hasPermission="cx:monthStock:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',450)"
               shiro:hasPermission="cx:monthStock:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="cx:monthStock:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="cx:monthStock:import">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.name.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="cx:monthStock:export">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-reorderable-columns="true" data-resizable="true"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: datetimepicker-js"/>
<script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
<th:block th:include="include :: bootstrap-table-reorder-columns-js" />
<th:block th:include="include :: bootstrap-table-resizable-js" />
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('cx:monthStock:edit')}]];
    var removeFlag = [[${@permission.hasPermi('cx:monthStock:remove')}]];
    var prefix = ctx + "cx/monthStock";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{ui.data.column.cx.monthStock.modelName}]],
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    title: '主键ID',
                    align: 'center',
                    halign:'center',
                    sortable: true,
                    visible: false
                },
                {
                    field: 'stockMonth',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.cx.monthStock.stockMonth}]],
                    sortable: true,
                },
                {
                    field: 'bomDataVersion',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.productStatus.bomDataVersion}]],
                    sortable: true,
                },
                {
                    field: 'embryoCode',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.cx.monthStock.embryoCode}]],
                    sortable: true,
                },
                {
                    field: 'stockNum',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.cx.monthStock.stockNum}]],
                    sortable: true,
                },
                {
                    field: 'remark',
                    halign:'center',
                    widthUnit: '%',
                    width: 25,
                    title: [[#{ui.common.column.remark}]],
                    sortable: true,
                    formatter:function (value, row, index) {
                        return $.table.tooltip(value,25);
                    },
                },
                {
                    align: 'center',
                    halign:'center',
                    widthUnit: '%',
                    width: 15,
                    title: [[#{ui.data.btn.option}]],
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit('+row.id+','+'350'+')"><i class="fa fa-edit"></i>' + [[#{ui.frame.btn.update}]] + '</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>' + [[#{ui.frame.btn.delete}]] + '</a>');
                        return actions.join('');
                    },
                }]
        };
        $.table.init(options);

        // 日期控件
        $("#datetimepicker-startTime").datetimepicker({
            format: 'yyyy-mm',
            startView: 3,//代表日期控件打开默认展示的是月
            minView: 3,//代表日期控件展示的最低到月
            maxView: 4,//代表日期控件展示的最高到年
            todayBtn: true,
            autoclose: true,
            endDate: new Date(),
        }).on('changeDate', function (event) {
            event.preventDefault();
            event.stopPropagation();
            var startTime = event.date;
            $('#datetimepicker-endTime').datetimepicker('setStartDate', startTime);
        });

        $("#datetimepicker-endTime").datetimepicker({
            format: 'yyyy-mm',
            startView: 3,//代表日期控件打开默认展示的是月
            minView: 3,//代表日期控件展示的最低到月
            maxView: 4,//代表日期控件展示的最高到年
            todayBtn: true,
            autoclose: true,
            endDate: new Date(),
        }).on('changeDate', function (event) {
            event.preventDefault();
            event.stopPropagation();
            var endTime = event.date;
            $("#datetimepicker-startTime").datetimepicker('setEndDate', endTime);
        });
    });
    // 下载模板
    function importTemplate() {
        window.location.href=prefix + "/importTemplate";
    }

</script>
</body>
<!-- 导入区域 -->
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <input type="button" th:value="#{ui.file.btn.text}" onclick="javascript:$('input[name=\'file\']').click();" />
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}" onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;" onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);" />
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport" > [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp;	<a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
