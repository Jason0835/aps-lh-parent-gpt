<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('规格字体颜色设置列表')" />
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>[[#{ui.data.column.specColor.specDesc}]]：</label>
                                <input type="text" name="specDesc"/>
                            </li>
                            <li>
                                <label>[[#{ui.data.column.specColor.colorCode}]]：</label>
                                <input type="text" name="colorCode"/>
                            </li>
                            <li>
                                <label>[[#{ui.data.column.specColor.colorType}]]：</label>
                                <select name="colorType" th:with="type=${@dict.getType('BIG_ROLL_COLOR')}" class="form-control">
                                    <option value="">[[#{ui.frame.btn.all}]]</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <label>[[#{ui.data.column.status}]]：</label>
                                <select name="status" th:with="type=${@dict.getType('STATUS')}" class="form-control">
                                    <option value="">[[#{ui.frame.btn.all}]]</option>
                                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add('',400)" shiro:hasPermission="cx:specColor:add">
                    <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit('',400)" shiro:hasPermission="cx:specColor:edit">
                    <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="cx:specColor:remove">
                    <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
                </a>
                <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="cx:specColor:import">
                    <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]
                </a>
                <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="cx:specColor:export">
                    <i class="fa fa-upload"></i> [[#{ui.frame.btn.export}]]
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table" data-resizable="true"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
     <script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
     <th:block th:include="include :: bootstrap-table-reorder-columns-js" />
     <th:block th:include="include :: select2-js"/>
     <th:block th:include="include :: bootstrap-select-js"/>
     <th:block th:include="include :: bootstrap-table-resizable-js" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('cx:specColor:edit')}]];
        var removeFlag = [[${@permission.hasPermi('cx:specColor:remove')}]];
        var colorTypeDatas = [[${@dict.getType('BIG_ROLL_COLOR')}]];
        var prefix = ctx + "cx/specColor";

        $(function() {
            var options = {
                uniqueId: 'id',
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                importUrl: prefix + "/importData",
                modalName: [[#{ui.data.column.specColor.modelName}]],
                columns: [{
                    checkbox: true,
                },
                {
                    field: 'id',
                    title: '主键id',
                    align: 'left',
                    halign:'center',
                    sortable: true,
                    visible: false
                },
                {
                    field: 'specDesc',
                    widthUnit: '%',
                    width: 30,
                    align: 'left',
                    halign:'center',
                    title: [[#{ui.data.column.specColor.specDesc}]],
                    sortable: true,
                    formatter:function (value, row, index) {
                        return $.table.tooltip(value, 50);
                    },
                },
                {
                    field: 'colorType',
                    widthUnit: '%',
                    width: 10,
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.specColor.colorType}]],
                    sortable: true,
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(colorTypeDatas, value);
                    }
                },
                {
                    field: 'colorCode',
                    widthUnit: '%',
                    width: 10,
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.specColor.colorCode}]],
                    sortable: true,
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<span style="margin-right:5px;width:12px;height:12px;display: inline-block;background: '+value+'"></span><span>'+value+'</span>');
                        return actions.join('');
                    }
                },
                {
                    field: 'status',
                    widthUnit: '%',
                    width: 10,
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.status}]],
                    sortable: true,
                    formatter: function(value, row, index) {
                        if (value == 1) {
                            return '<i class=\"fa fa-toggle-off text-info fa-2x\" onclick="enable(\'' + row.id + '\')"></i> ';
                        } else {
                            return '<i class=\"fa fa-toggle-on text-info fa-2x\" onclick="disable(\'' + row.id + '\')"></i> ';
                        }
                    }
                },
                {
                    field: 'remark',
                    halign:'center',
                    title: [[#{ui.common.column.remark}]],
                    sortable: true,
                    formatter:function (value, row, index) {
                        return $.table.tooltip(value,28);
                    },
                    widthUnit: '%',
                    width: 20,
                },
                {
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.btn.option}]],
                    widthUnit: '%',
                    width: 15,
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit('+row.id+','+'400'+')"><i class="fa fa-edit"></i>'+[[#{ui.frame.btn.update}]]+'</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>'+[[#{ui.frame.btn.delete}]]+'</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        /* 状态-停用 */
        function disable(id) {
            let rowData = $("#bootstrap-table").bootstrapTable('getRowByUniqueId', id);
            rowData.status = 1;
            $.modal.confirm([[#{ui.common.layer.boxMsg.context}]], function() {
                $.operate.post(prefix + "/edit", rowData);
            })
        }

        /* 状态启用 */
        function enable(id) {
            let rowData = $("#bootstrap-table").bootstrapTable('getRowByUniqueId', id);
            rowData.status = 0;
            $.modal.confirm([[#{ui.common.layer.boxMsg.context}]], function() {
                $.operate.post(prefix + "/edit", rowData);
            })
        }

        // 下载模板
        function importTemplate() {
            window.location.href=prefix + "/importTemplate";
        }
    </script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}" onclick="javascript:$('input[name=\'file\']').click();" />
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}" onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;" onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);" />
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport" > [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp;	<a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
