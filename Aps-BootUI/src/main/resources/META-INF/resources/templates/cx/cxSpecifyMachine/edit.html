<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改定点机台')"/>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-cxSpecifyMachine-edit" th:object="${cxSpecifyMachine1}">
        <input name="id" th:field="*{id}" type="hidden">
        <input id="machineCodeInit" name="machineCodeInit" th:field="*{machineCode}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.sapCode}]]：</label>
            <div class="col-sm-8">
                <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text" isCode="true" maxlength="20" required>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" isCode="true" maxlength="20" required onchange="getEmbryoMachine()">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.machineCode}]]：</label>
            <div class="col-sm-8">
                <select id="machineCode" name="machineCode" class="form-control" th:with="type=${machineCode}"  required="true">
                    <option  th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}" th:value="${machineInfo.machineCode}" th:field="*{machineCode}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.lineType}]]：</label>
            <div class="col-sm-8">
                <select name="lineType" class="form-control" th:with="type=${@dict.getType('LINE_TYPE')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{lineType}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.specifyMachine.jobType}]]：</label>
            <div class="col-sm-8">
                <select name="jobType" class="form-control" th:with="type=${@dict.getType('JOB_TYPE')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{jobType}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">
    var prefix = ctx + "cx/cxSpecifyMachine";
    $("#form-cxSpecifyMachine-edit").validate({
        focusCleanup: true
    });

    $(function() {
         getEmbryoMachine();
    });

        //获取胎胚版本下拉框
        function getEmbryoMachine(){
            var embryoCode=$("#embryoCode").val();
            if($.common.isEmpty(embryoCode)){
                return;
            }
            var orimachineCode = $("#machineCodeInit").val();
            var config2 = {
                url: ctx + "cx/cxScheduleResult/getCxMachines",
                type: "post",
                dataType: "json",
                data:{"embryoCode":embryoCode},
                success: function (result) {
                    if (result.code == web_status.SUCCESS){
                        var cxMachines=result.data;
                        var rSelect = '';
                        for(var i = 0; i < cxMachines.length; i++){
                            rSelect += ("<option value = '"+cxMachines[i].machineCode+"'>"+cxMachines[i].machineName+"</option>");
                        }

                        $("#machineCode").empty();
                        $("#machineCode").append(rSelect);
                        if($.common.isNotEmpty(orimachineCode)){
                            $("#machineCode").val(orimachineCode);
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config2);
        }

    function submitHandler() {
        if ($.validate.form()) {
            debugger;
            var specifyMachineObj = $('#form-cxSpecifyMachine-edit').serializeArray();
            var rowJson = {};
            for(var i = 0;i<specifyMachineObj.length;i++){
                if (specifyMachineObj[i].name == "machineCode"){
                    rowJson[specifyMachineObj[i].name]=$("#machineCode").val();
                }else{
                    rowJson[specifyMachineObj[i].name]=specifyMachineObj[i].value;
                }

             }
            $.operate.save(prefix + "/edit", rowJson);
        }
    }
</script>
</body>
</html>
