<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改投产施工信息')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-productConstruction-edit" th:object="${entity}">
        <input name="id" th:field="*{id}" type="hidden">
        <input name="monthPlanApsVersion" th:field="*{monthPlanApsVersion}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" readonly>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <select  name="bomDataVersion" class="form-control" th:with="type=${embryoVersions}" required>
                    <option th:each="item : ${type}" th:text="${item.embryoVersion}" th:value="${item.embryoVersion}" th:field="*{bomDataVersion}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">

    var prefix = ctx + "cx/mdmMonthProdPlan";

    $("#form-productConstruction-edit").validate({
        focusCleanup: true
    });


    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/changeBomDataVersion", $('#form-productConstruction-edit').serialize());
        }
    }
</script>
</body>
</html>
