<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改投产列表项备注信息')" />
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-cxProductStatus-edit" th:object="${cxProdutStatus}">
            <input name="id" th:field="*{id}" type="hidden">

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark"  class="form-control" rows="3" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>


        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js"/>
    <th:block th:include="include :: bootstrap-select-js"/>
    <script th:inline="javascript">

        var prefix = ctx + "cx/productStatus";

        $("#form-cxProductStatus-edit").validate({
            focusCleanup: true
        });

        $("input").change(function () {
            $(this).val($(this).val().trim());
        });

        function submitHandler() {
            if ($.validate.form()) {
                var data = $("#form-cxProductStatus-edit").serializeArray();
                $.operate.save(prefix + "/editRemark", data);
            }
        }

    </script>
</body>
</html>
