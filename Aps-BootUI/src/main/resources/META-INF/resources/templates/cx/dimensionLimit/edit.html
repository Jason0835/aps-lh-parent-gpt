<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改成型投产班次同寸口硫化班次限定设置')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-dimensionLimit-edit" th:object="${cxProductDimensionLimit}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.dimensionLimit.specDimension}]]：</label>
                <div class="col-sm-8">
                    <input name="specDimension" th:field="*{specDimension}" class="form-control" type="number" min="0" max="999999.99" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.dimensionLimit.minAvgShift}]]：</label>
                <div class="col-sm-8">
                    <input id="minAvgShift" name="minAvgShift" th:field="*{minAvgShift}" class="form-control" type="number" min="0" max="999999.99" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.dimensionLimit.maxAvgShift}]]：</label>
                <div class="col-sm-8">
                    <input id="maxAvgShift" name="maxAvgShift" th:field="*{maxAvgShift}" class="form-control" type="number" min="0" max="999999.99" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.dimensionLimit.shiftParams}]]：</label>
                <div class="col-sm-8">
                    <input name="shiftParams" th:field="*{shiftParams}" class="form-control" type="number" min="-9999.9" max="9999.9" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text" maxlength="300">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/dimensionLimit";
        $("#form-dimensionLimit-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var minAvgShift = $("#minAvgShift").val();
                var maxAvgShift = $("#maxAvgShift").val();
                if(Number(minAvgShift)>Number(maxAvgShift)){
                    $.modal.alertWarning([[#{ui.data.column.machineLimit.minGreatThanMax}]]);
                    return ;
                }
                $.operate.save(prefix + "/edit", $('#form-dimensionLimit-edit').serialize());
            }
        }
    </script>
</body>
</html>
