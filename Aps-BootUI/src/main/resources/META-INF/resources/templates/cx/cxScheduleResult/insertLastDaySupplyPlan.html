<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改前日增补计划')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-cxScheduleResult-edit" th:object="${lastDaySupplyPlan}">
        <input name="id" th:field="*{id}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="select-time">
                    <input id="endTime" name="scheduleDate" type="text" class="time-input form-control"
                           th:value="${initDate}" th:min="${minDate}" placeholder="yyyy-MM-dd" required>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.taskType}]]：</label>
            <div class="col-sm-8">
                <select id="taskType" name="taskType" class="form-control" th:with="type=${@dict.getType('TASK_TYPE')}"
                        disabled>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{taskType}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.sapCode}]]：</label>
            <div class="col-sm-8">
                <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text" isCode="true" required
                       maxlength="20">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text"
                       isCode="true" required maxlength="20" onchange="getEmbryoVersions()">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <select id="embryoVersions" name="bomDataVersion" class="form-control" th:with="type=${embryoVersions}"
                        required>
                    <option th:each="item : ${type}" th:text="${item.embryoVersion}" th:value="${item.embryoVersion}"
                            th:field="*{bomDataVersion}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.storageLocation}]]：</label>
            <div class="col-sm-8">
                <select name="storageLocation" class="form-control" th:with="type=${@dict.getType('STORAGE_LOCATION')}"
                        required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"
                            th:field="*{storageLocation}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.cxMachineCode}]]：</label>
            <div class="col-sm-8">
                <select id="cxMachineCode" name="cxMachineCode" required class="form-control selectpicker"
                        th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}"
                        th:with="type=${cxMachineCode}">
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                            th:value="${machineInfo.machineCode}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class1PlanQty" th:field="*{class1PlanQty}" class="form-control" type="number" min="0"
                       digits="true" max="99999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1AnalysisInput}]]：</label>
            <div class="col-sm-8">
                <input name="class1AnalysisInput" th:field="*{class1AnalysisInput}" class="form-control" type="text"
                       maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class2PlanQty" th:field="*{class2PlanQty}" class="form-control" type="number" min="0"
                       digits="true" max="99999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2AnalysisInput}]]：</label>
            <div class="col-sm-8">
                <input name="class2AnalysisInput" th:field="*{class2AnalysisInput}" class="form-control" type="text"
                       maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class3PlanQty" th:field="*{class3PlanQty}" class="form-control" type="number" min="0"
                       digits="true" max="99999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3AnalysisInput}]]：</label>
            <div class="col-sm-8">
                <input name="class3AnalysisInput" th:field="*{class3AnalysisInput}" class="form-control" type="text"
                       maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class4PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class4PlanQty" th:field="*{class4PlanQty}" class="form-control" type="number" min="0"
                       digits="true" max="99999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class4AnalysisInput}]]：</label>
            <div class="col-sm-8">
                <input name="class4AnalysisInput" th:field="*{class4AnalysisInput}" class="form-control" type="text"
                       maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class5PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class5PlanQty" th:field="*{class5PlanQty}" class="form-control" type="number" min="0"
                       digits="true" max="999999">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class5AnalysisInput}]]：</label>
            <div class="col-sm-8">
                <input name="class5AnalysisInput" th:field="*{class5AnalysisInput}" class="form-control" type="text"
                       maxlength="66">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.stock.remark}]]：</label>
            <div class="col-sm-8">
                <textarea id="remarkid" name="remark" class="form-control" rows="2" th:field="*{remark}"
                          maxlength="300"></textarea>
            </div>
        </div>

    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">

    var prefix = ctx + "cx/cxScheduleResult";

    $("#form-cxScheduleResult-edit").validate({
        focusCleanup: true
    });

    $("input").change(function () {
        $(this).val($(this).val().trim());
    });

    $("#lhMachineCode").change(function () {
        var lhMachineCode = []
        lhMachineCode = $("#lhMachineCode").val();
        if ($.common.isNotEmpty(lhMachineCode)) {
            var qty = lhMachineCode.length;
            $("#lhMachineQty").val(qty);
        }
    });

    //获取胎胚版本下拉框
    function getEmbryoVersions() {
        var embryoCode = $("#embryoCode").val();
        if ($.common.isEmpty(embryoCode)) {
            return;
        }
        var config = {
            url: prefix + "/getProductEmbryoVersions",
            type: "post",
            dataType: "json",
            data: {"embryoCode": embryoCode},
            success: function (result) {
                if (result.code == web_status.SUCCESS) {
                    var embryoVersions = result.data;
                    var rSelect = '';
                    for (var i = 0; i < embryoVersions.length; i++) {
                        rSelect += ("<option value = '" + embryoVersions[i].embryoVersion + "'>" + embryoVersions[i].embryoVersion + "</option>");
                    }
                    $("#embryoVersions").empty();
                    $("#embryoVersions").append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config);

         var config2 = {
                url: prefix + "/getCxMachines",
                type: "post",
                dataType: "json",
                data:{"embryoCode":embryoCode},
                success: function (result) {
                    if (result.code == web_status.SUCCESS){
                        var cxMachines=result.data;
                        var rSelect = '';
                        for(var i = 0; i < cxMachines.length; i++){
                            rSelect += ("<option value = '"+cxMachines[i].machineCode+"'>"+cxMachines[i].machineName+"</option>");
                        }
                        $("#cxMachineCode").empty();
                        $("#cxMachineCode").append(rSelect);
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config2);
    }

    function submitHandler() {
        if ($.validate.form()) {
            // var data = $('#form-cxScheduleResult-edit').serializeArray();
            // var config = {
            //     url: "/cx/lastDaySupplyPlan/validateBeforeAdd",
            //     type: "post",
            //     dataType: "json",
            //     data: data,
            //     success: function (result) {
            //         if (result.code == web_status.SUCCESS) {
            //             if (result.msg == '0') {
            //                 $.modal.confirm([[#{ui.data.column.scheduleResult.isContinueAdd}]], function () {
            //                     validteAndAdd();
            //                 })
            //             } else {
            //                 validteAndAdd();
            //             }
            //         } else {
            //             $.modal.alertWarning(result.msg);
            //         }
            //     }
            // };
            // $.ajax(config)
            $.operate.save("/cx/lastDaySupplyPlan/save", $('#form-cxScheduleResult-edit').serialize());
        }
    }

    function reloadMachineName() {
        parent.$('#scheduleDate').val($('#endTime').val());
    }

</script>
<style>
    .select2-container--bootstrap .select2-results__group {
        color: #777;
        display: block;
        padding: 6px 12px;
        font-size: 13px;
        line-height: 1.42857143;
        white-space: nowrap;
    }
</style>
</body>

</html>
