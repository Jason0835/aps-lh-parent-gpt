<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改成型投产班次库存限定设置')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-shiftLimit-edit" th:object="${cxProductStockLimit}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.shiftLimit.limitName}]]：</label>
                <div class="col-sm-8">
                    <input name="limitName" th:field="*{limitName}" class="form-control" type="text" required maxlength="100">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.shiftLimit.type}]]：</label>
                <div class="col-sm-8">
                    <select name="type" class="form-control" th:with="type=${@dict.getType('MACHINE_TYPE')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{type}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.shiftLimit.limitType}]]：</label>
                <div class="col-sm-8">
                    <select name="limitType" class="form-control" th:with="type=${@dict.getType('limit_type')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{limitType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.shiftLimit.stockNum}]]：</label>
                <div class="col-sm-8">
                    <input name="stockNum" th:field="*{stockNum}" class="form-control" type="number"isInteger="true" min="0" max="99999999" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.shiftLimit.shiftParams}]]：</label>
                <div class="col-sm-8">
                    <input name="shiftParams" th:field="*{shiftParams}" class="form-control" type="number" min="-9999.9" max="9999.9" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text" maxlength="300">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/shiftLimit";
        $("#form-shiftLimit-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-shiftLimit-edit').serialize());
            }
        }
    </script>
</body>
</html>
