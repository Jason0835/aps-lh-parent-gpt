<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('施工信息列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            [[#{ui.construction.embryoCode}]]：
                            <input type="text" name="embryoCode"/>
                        </li>
                        <li>
                            [[#{ui.construction.dimension}]]：
                            <input type="number" name="dimension"/>
                        </li>
                        <li>
                            [[#{ui.construction.spec}]]：
                            <input type="text" name="specDesc"/>
                        </li>
                        <li>
                            <label>[[#{ui.construction.embryoVersion}]]：</label>
                            <input type="text" name="embryoVersion"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.productConstruction.productionStage}]]：</label>
                            <select name="productionStage" th:with="type=${@dict.getType('PRODUCTION_STAGE')}"
                                    class="form-control">
                                <option value="">[[#{ui.frame.select.select.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.productConstruction.halfPartsQueryType}]]：</label>
                            <select name="halfPartsQueryType" th:with="type=${@dict.getType('HALF_PARTS_CODE')}"
                                    class="form-control">
                                <option value="">[[#{ui.frame.select.select.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>

                        <li>
                            <label>[[#{ui.data.column.productConstruction.halfPartsQueryCode}]]：</label>
                            <input type="text" name="halfPartsQueryCode"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="col-sm-12 select-table table-bordered">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>

<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
