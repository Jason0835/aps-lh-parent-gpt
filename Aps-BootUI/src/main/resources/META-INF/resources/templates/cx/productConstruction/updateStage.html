<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改投产施工信息')"/>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-productConstruction-edit" th:object="${cxProductConstructionInfo}">
        <input name="id" th:field="*{id}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" readonly>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <input id="embryoVersion" name="embryoVersion" th:field="*{embryoVersion}" class="form-control" type="text" readonly>
            </div>
        </div>


        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productConstruction.productionStage}]]：</label>
            <div class="col-sm-8">
                <select name="productionStage" class="form-control" th:with="type=${@dict.getType('PRODUCTION_STAGE')}">
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{productionStage}"></option>
                </select>
            </div>
        </div>

    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">

    var prefix = ctx + "cx/productConstruction";

    $("#form-productConstruction-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var datas=$('#form-productConstruction-edit').serialize();
            $.operate.save(prefix + "/updateProductionStage", datas);
        }
    }
</script>
</body>
</html>
