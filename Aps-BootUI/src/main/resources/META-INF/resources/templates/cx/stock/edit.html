<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('胎面胶库存信息')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <!--/*@thymesVar id="cxStock" type=""*/-->
    <form class="form-horizontal m" id="form-stock-edit" th:object="${cxStock}">
        <input id="editType" name="editType" th:value="${editType}" type="hidden">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stock.stockDate}]]：</label>
            <div class="col-sm-8">
                <!--对于添加了disabled="disabled"的值传不到后台问题，在此新增一个hidden的input框-->
                <input  id="stockDateid2" name="stockDate" th:value="*{#dates.format({stockDate}, 'yyyy-MM-dd')}" type="hidden">
                <input id="stockDateid" name="stockDate" type="text" class="time-input form-control" th:value="*{#dates.format({stockDate}, 'yyyy-MM-dd')}"
                       placeholder="yyyy-MM-dd" required="required">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stock.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text"
                       required="required" maxlength="50" isCode="true" onchange="getEmbryoVersions()">
            </div>
        </div>

        <div id="qunidaye" class="form-group" hidden="true">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <input id="bomDataVersion" name="bomDataVersion" th:field="*{bomDataVersion}" class="form-control" type="text"readonly>
            </div>
        </div>

        <div id="qunidaye2" class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <select id="embryoVersions" name="bomDataVersion" class="form-control" th:with="type=${embryoVersions}" required>
                    <option th:each="item : ${type}" th:text="${item.embryoVersion}" th:value="${item.embryoVersion}" th:field="*{bomDataVersion}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stock.stockNumAvailable}]]：</label>
            <div class="col-sm-8">
                <input id="stockNumid"  required="required" name="stockNum" th:field="*{stockNum}" class="form-control" type="number" min="0" max="999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.stock.unavailableStock}]]：</label>
            <div class="col-sm-8">
                <input id="unavailableStockid" name="unavailableStock" th:field="*{unavailableStock}" class="form-control" type="number" min="0" max="999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.stock.modifyNum}]]：</label>
            <div class="col-sm-8">
                <input id="modifyNumid" name="modifyNum" th:field="*{modifyNum}" type="number" class="form-control"  min="-999999" max="999999" isInteger="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.stock.badNum}]]：</label>
            <div class="col-sm-8">
                <input id="badNumid" name="badNum" th:field="*{badNum}" class="form-control" type="number" min="0" max="999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.stock.remark}]]：</label>
            <div class="col-sm-8">
                <textarea id="remarkid" name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "cx/stock";
    $(function () {
        var editType = $("#editType").val();
        if(editType=='0') { //新增页面
            $('#stockDateid2').attr("disabled","disabled");
            $('#qunidaye').attr("disabled","disabled");

            $('#bomDataVersion').attr("disabled","disabled");

        }else if(editType=='1'){ //编辑（日期、物料编号、备注）
            $('#stockNumid').attr("readonly","true");
            $('#unavailableStockid').attr("readonly","true");
            $('#modifyNumid').attr("readonly","true");
            $('#badNumid').attr("readonly","true");
            $('#stockDateid2').attr("disabled","disabled");
        }else if(editType=='2'){ //库存修正（库存、不良量、修正量）
            $('#stockDateid').attr("disabled","disabled");
            $('#stockNumid').attr("readonly","true");
            $('#unavailableStockid').attr("readonly","true");
            $('#embryoCode').attr("readonly","true");
            $('#remarkid').attr("readonly","true");
            $('#remarkid').css("background-color","#EEEEEE");
            $('#bomDataVersion').attr("readonly","true");

            $('#embryoVersions').attr("disabled","disabled");
            $('#qunidaye2').attr("hidden",true);
            $('#qunidaye').attr('hidden',false);

        }
    });
    $("#form-stock-edit").validate({
        focusCleanup: true
    });

    //获取胎胚版本下拉框
    function getEmbryoVersions(){
        var embryoCode=$("#embryoCode").val();
        if($.common.isEmpty(embryoCode)){
            return;
        }
        var config = {
            url: prefix + "/getProductEmbryoVersions",
            type: "post",
            dataType: "json",
            data:{"embryoCode":embryoCode},
            success: function (result) {
                if (result.code == web_status.SUCCESS){
                    var embryoVersions=result.data;
                    var rSelect = '';
                    for(var i = 0; i < embryoVersions.length; i++){
                        rSelect += ("<option value = '"+embryoVersions[i].embryoVersion+"'>"+embryoVersions[i].embryoVersion+"</option>");
                    }
                    $("#embryoVersions").empty();
                    $("#embryoVersions").append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }

    function submitHandler() {
        var stockNumid= $('#stockNumid').val();
        var modifyNumid=  $('#modifyNumid').val();
        var badNumid=  $('#badNumid').val();
        if(Number(stockNumid)+Number(modifyNumid)-Number(badNumid)<0){
            $.modal.alertWarning([[#{ui.data.column.stock.stockNumValidate}]]);
            return;
        }
        if ($.validate.form()) {
            var editType = $("#editType").val();
            if(editType=='0'){
                $.operate.save(prefix + "/add", $('#form-stock-edit').serialize());
            }else{
                $.operate.save(prefix + "/edit", $('#form-stock-edit').serialize());
            }
        }
    }

</script>
</body>
</html>
