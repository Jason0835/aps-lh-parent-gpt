<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改库存地点映射')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-stockLocationMapping-edit" th:object="${cxStockLocationMapping}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stockLocationMapping.apsStorageLocation}]]：</label>
                <div class="col-sm-8">
                    <select name="apsStorageLocation" class="form-control" th:with="type=${@dict.getType('STORAGE_LOCATION')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{apsStorageLocation}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stockLocationMapping.mpsStorageLocation}]]：</label>
                <div class="col-sm-8">
                    <input name="mpsStorageLocation" th:field="*{mpsStorageLocation}" class="form-control" type="text" required isCode="true" maxlength="20">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.stockLocationMapping.tireStoreType}]]：</label>
                <div class="col-sm-8">
                    <select name="tireStoreType" class="form-control" th:with="type=${@dict.getType('STOCK_LOCATION_TIRE_TYPE')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{tireStoreType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <input name="remark" th:field="*{remark}" class="form-control" type="text" maxlength="300">
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/stockLocationMapping";
        $("#form-stockLocationMapping-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-stockLocationMapping-edit').serialize());
            }
        }
    </script>
</body>
</html>
