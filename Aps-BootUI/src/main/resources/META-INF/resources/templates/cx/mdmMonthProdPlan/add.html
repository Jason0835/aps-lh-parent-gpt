<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改主计划月度生产计划')" />
    <th:block th:include="include :: datetimepicker-css"/>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-mdmMonthProdPlan-add" th:object="${mdmMonthProdPlan}">
            <input name="id" th:field="*{id}" type="hidden">


            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.mdmMonthProdPlan.mainPlanMonth}]]：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input  name="mainPlanMonth" th:value="${#dates.format(mdmMonthProdPlan.mainPlanMonth, 'yyyy-MM')}" class="form-control" th:placeholder="#{ui.data.column.mdmMonthProdPlan.mainPlanMonth}" type="text" required autocomplete="off">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.mdmMonthProdPlan.isFinamized}]]：</label>
                <div class="col-sm-8">
                    <input  name="isFinamized" th:value="0" type="hidden" >
                    <select  name="isFinamized" class="form-control" th:with="type=${@dict.getType('ISORNOT')}"  disabled>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="0" th:field="*{isFinamized}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.mdmMonthProdPlan.materialCode}]]：</label>
                <div class="col-sm-8">
                    <input name="materialCode" th:field="*{materialCode}" class="form-control" type="text" maxlength="20" required isCode="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.mdmMonthProdPlan.embryoCode}]]：</label>
                <div class="col-sm-8">
                    <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" maxlength="20" required isCode="true" onchange="getSpecDesc()">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.mdmMonthProdPlan.qualityGrade}]]：</label>
                <div class="col-sm-8">
                    <select  name="qualityGrade" class="form-control" th:with="type=${@dict.getType('quality_level')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictLabel}" th:field="*{qualityGrade}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.cxMachineCode}]]：</label>
                <div class="col-sm-8">
                    <select id="cxMachineCode" name="cxMachineCode" class="form-control" th:with="type=${@cx.getMachineInfo('0')}" th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}" required>
                        <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                        <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"th:value="${machineInfo.machineCode}" th:field="*{cxMachineCode}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stockLocationSort.stockLocation}]]：</label>
                <div class="col-sm-8">
                    <select  id="storageLocation" name="storageLocation" class="form-control" th:with="type=${@dict.getType('STORAGE_LOCATION')}" required>
                        <option value="">[[#{ui.frame.select.stockLocation}]]</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{storageLocation}"></option>
                    </select>
                </div>
            </div>

            <input  id="specDesc" name="specDesc" th:field="*{specDesc}"  type="hidden">
            <input id="specDimension" name="specDimension" th:field="*{specDimension}"  type="hidden">

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.theoryProductionPlan}]]：</label>
                <div class="col-sm-8">
                    <input name="theoryProductionPlan" th:field="*{theoryProductionPlan}" class="form-control"  type="number" min="0" max="9999999"  digits="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.actualArrangement}]]：</label>
                <div class="col-sm-8">
                    <input name="actualArrangement" th:field="*{actualArrangement}" class="form-control"  type="number" min="0" max="9999999" digits="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.expectedExcessArrears}]]：</label>
                <div class="col-sm-8">
                    <input name="expectedExcessArrears" th:field="*{expectedExcessArrears}" class="form-control"  type="number" min="-9999999" max="9999999" isInteger="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.actualOverProduction}]]：</label>
                <div class="col-sm-8">
                    <input name="actualOverProduction" th:field="*{actualOverProduction}" class="form-control"  type="number" min="-9999999" max="9999999" isInteger="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.balance}]]：</label>
                <div class="col-sm-8">
                    <input name="balance" th:field="*{balance}" class="form-control"  type="number" min="-9999999" max="9999999" isInteger="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.beginDate}]]：</label>
                <div class="col-sm-8">
                    <input id="beginDate" name="beginDate" type="text" class="time-input form-control" th:value="*{#dates.format({beginDate}, 'yyyy-MM-dd')}" placeholder="yyyy-MM-dd">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.endDate}]]：</label>
                <div class="col-sm-8">
                    <input id="endDate" name="endDate" type="text" class="time-input form-control" th:value="*{#dates.format({endDate}, 'yyyy-MM-dd')}" placeholder="yyyy-MM-dd">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.specialRequirements}]]：</label>
                <div class="col-sm-8">
                    <input name="specialRequirements" th:field="*{specialRequirements}" class="form-control" type="text" maxlength="66">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.mdmMonthProdPlan.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>

            <input id="cxMachineName" name="cxMachineName" th:field="*{cxMachineName}"  type="hidden">
            <input id="lhMachineName" name="lhMachineName" th:field="*{lhMachineName}"  type="hidden" >
            <input id="storageLocationDesc" name="storageLocationDesc" th:field="*{storageLocationDesc}" type="hidden" >
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js"/>
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">

        var prefix = ctx + "cx/mdmMonthProdPlan";
        $("#form-mdmMonthProdPlan-add").validate({
            focusCleanup: true
        });

        // 日期控件
        $("input[name='mainPlanMonth']").datetimepicker({
            format: "yyyy-mm",
            startView: 3,//代表日期控件打开默认展示的是月
            minView: 3,//代表日期控件展示的最低到月
            maxView: 4,//代表日期控件展示的最高到年
            autoclose: true,
        });

        //根据胎胚代码获取规格尺寸
        function getSpecDesc(){
            var embryoCode=$("#embryoCode").val()
            if($.common.isEmpty(embryoCode)){
                return;
            }
            var config = {
                url: prefix + "/getSpecDesc",
                type: "post",
                dataType: "json",
                data: {embryoCode: embryoCode},
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        $("#specDesc").val(result.data.specDesc);
                        $("#specDimension").val(result.data.dimension)
                    }
                }
            };
            $.ajax(config)
        }



        function submitHandler() {
            if ($.validate.form()) {
                var beginDate=$("#beginDate").val();
                var endDate=$("#endDate").val();
                if($.common.isNotEmpty(beginDate) && $.common.isNotEmpty(endDate)){
                    var bd=new Date(beginDate);
                    var ed=new Date(endDate);
                    if(bd>ed){
                        $.modal.alertWarning([[#{ui.data.column.beginDateCanNotGreatThanEndDate}]]);
                        return;
                    }
                }
                var cxMachineName=$("#cxMachineCode").find("option:selected").html();
                var lhMachineName=$("#lhMachineCode").find("option:selected").html();
                var storageLocationDesc=$("#storageLocation").find("option:selected").html();
                $('#cxMachineName').val(cxMachineName);
                $('#lhMachineName').val(lhMachineName);
                $('#storageLocationDesc').val(storageLocationDesc);
                $.operate.save(prefix + "/add",$('#form-mdmMonthProdPlan-add').serializeArray());
            }
        }

    </script>
</body>
</html>
