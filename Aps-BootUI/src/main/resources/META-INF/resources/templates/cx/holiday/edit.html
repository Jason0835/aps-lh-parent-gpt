<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改假日设定')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-holiday-edit" th:object="${cxHolidaySetting}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.holiday.holidayDay}]]：</label>
            <div class="col-sm-8">
                <div class="input-daterange input-group">
                    <input name="startTime" type="text" class="input-sm form-control" id="laydate-startTime" autocomplete="off" th:placeholder="#{ui.data.column.holiday.holidayDay}" required/>
                    <span class="input-group-addon">-</span>
                    <input name="endTime" type="text" class="input-sm form-control" id="laydate-endTime" autocomplete="off" th:placeholder="#{ui.data.column.holiday.holidayDay}" required/>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "cx/holiday";
    $("#form-holiday-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            let startTime = $("#laydate-startTime").val();
            let endTime = $("#laydate-endTime").val();
            if (new Date(startTime) > new Date(endTime)){
                $.modal.alertWarning([[#{ui.data.column.beginDateCanNotGreatThanEndDate}]]);
            }else {
                $.operate.save(prefix + "/edit", $('#form-holiday-edit').serialize());
            }
        }
    }

    layui.use('laydate', function() {
        var laydate = layui.laydate;

        var startDate = laydate.render({
            elem: '#laydate-startTime',
            theme: 'molv',
            trigger: 'click',
        });

        var endDate = laydate.render({
            elem: '#laydate-endTime',
            theme: 'molv',
            trigger: 'click',
        });
    });
</script>
</body>
</html>
