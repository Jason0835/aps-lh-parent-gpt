<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li class="select-time">
                            <label>[[#{ui.data.column.inProductionSpec.productDate}]]：</label>
                            <input type="text" class="time-input" id="productDate" th:value="${initDate}"
                                   th:placeholder="yyyy-mm-dd" name="productDate"/>
                        </li>
                        <li>
                            [[#{ui.data.column.cxScheduleResult.cxMachineCode}]]：
                            <select id="cxMachineCode" name="cxMachineCode" th:with="type=${@cx.getMachineInfo()}" class="form-control">
                                <option value="">[[#{ui.frame.select.select.all}]]</option>
                                <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}" th:value="${machineInfo.machineCode}"></option>
                            </select>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.inProductionSpec.sapCode}]]：</label>
                            <input type="text" name="sapCode"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.inProductionSpec.embryoCode}]]：</label>
                            <input type="text" name="embryoCode"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.inProductionSpec.bomDataVersion}]]：</label>
                            <input type="text" name="bomDataVersion"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">

<!--                <i class="fa fa-upload"></i> [[#{ui.frame.btn.import}]]-->
<!--            </a>-->
<!--            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"-->
<!--               shiro:hasPermission="cx:inProductionSpec:export">-->
<!--                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]-->
<!--            </a>-->
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-reorderable-columns="true" data-resizable="true"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<th:block th:include="include :: bootstrap-table-reorder-columns-js" />
<th:block th:include="include :: bootstrap-table-resizable-js" />
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('cx:inProductionSpec:edit')}]];
    var removeFlag = [[${@permission.hasPermi('cx:inProductionSpec:remove')}]];
    var cxMachineNameList = [[${@cx.getMachineInfo()}]];
    var prefix = ctx + "cx/inProductionSpec";

    $(function () {
        var options = {
            url: prefix + "/list",
            // createUrl: prefix + "/add",
            // updateUrl: prefix + "/edit/{id}",
            // removeUrl: prefix + "/remove",
            // exportUrl: prefix + "/export",
            // importUrl: prefix + "/importData",
            modalName: [[#{ui.data.column.inProductionSpec.modelName}]],
            columns: [
                {
                    field: 'id',
                    visible: false
                },
                {
                    field: 'productDate',
                    title: [[#{ui.data.column.inProductionSpec.productDate}]],
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'cxMachineCode',
                    title: [[#{ui.data.column.cxScheduleResult.cxMachineCode}]],
                    align: 'center',
                    halign: 'center',
                    formatter: function (value, row, index) {
                        if ($.common.isEmpty(value)) {
                            return '';
                        }
                        return selectMachineName(cxMachineNameList, value);
                    }
                },
                {
                    field: 'sapCode',
                    title: [[#{ui.data.column.inProductionSpec.sapCode}]],
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'embryoCode',
                    title: [[#{ui.data.column.inProductionSpec.embryoCode}]],
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'bomDataVersion',
                    title: [[#{ui.data.column.inProductionSpec.bomDataVersion}]],
                    align: 'center',
                    halign: 'center',
                },
                {
                    field: 'remark',
                    title: [[#{ui.common.column.remark}]],
                    align: 'center',
                    halign: 'center',
                    formatter: function (value, row, index) {
                        return $.table.tooltip(value);
                    },
                },
            ]
        };
        $.table.init(options, true);
    });

    //回显机台名称
    function selectMachineName(datas, value) {
        if ($.common.isEmpty(datas)) {
            return '';
        }
        var actions = [];
        var arr = value.split(",");
        $.each(datas, function (index, dict) {
            $.each(arr, function (index, item) {
                if (dict.machineCode == (item)) {
                    var machineName = $.common.isEmpty(dict.machineName) ? "" : dict.machineName;
                    actions.push($.common.sprintf("<span>%s</span>", machineName, dict.machineName));
                    return false;
                }
            })
        });
        return actions.join(',');
    }

    // 下载模板
    function importTemplate() {
        window.location.href = prefix + "/importTemplate";
    }
</script>
</body>
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <!--调整文件上传支持国际化-->
            <input type="button" th:value="#{ui.file.btn.text}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}"
                   onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;"
                   onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport"> [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp; <a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i>
                [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
