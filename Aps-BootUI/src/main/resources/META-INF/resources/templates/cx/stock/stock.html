<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('成型库存信息列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li class="select-time">
                            <label>[[#{ui.data.column.stock.stockDate}]]：</label>
                            <input type="text" class="time-input"
                                   th:placeholder="#{ui.data.column.stock.startTime}" name="startTime"/>
                            <span  style='color: black;'>-</span>
                            <input type="text" class="time-input" id="endTime"
                                   th:placeholder="#{ui.data.column.stock.endTime}" name="endTime"/>
                        </li>

                        <li>
                            <label>[[#{ui.data.column.productStatus.bomDataVersion}]]：</label>
                            <input type="text" name="bomDataVersion"/>
                        </li>

                        <li>
                            <label>[[#{ui.data.column.stock.embryoCode}]]：</label>
                            <input type="text" name="embryoCode"/>
                        </li>
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add('',450)" shiro:hasPermission="cx:stock:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <!--<a class="btn btn-primary single disabled" onclick="$.operate.edit('',450)" shiro:hasPermission="cx:stock:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>-->
            <a class="btn btn-primary single disabled" onclick="modifyStock()" shiro:hasPermission="cx:stock:modifyStock">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.stock.modify2}]]
            </a>
            <a class="btn btn-primary multiple disabled" onclick="releaseStock()" shiro:hasPermission="cx:stock:releaseStock">
                <i class="fa fa-edit"></i> [[#{ui.data.column.stock.unavailableStock.release}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="cx:stock:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
            <a class="btn btn-info" onclick="$.table.importExcel()" shiro:hasPermission="cx:stock:import">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.name.import}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()" shiro:hasPermission="cx:stock:export">
                <i class="fa fa-upload"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table" data-reorderable-columns="true" data-resizable="true"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script th:src="@{/js/jquery-ui-1.10.4.min.js}"></script>
<th:block th:include="include :: bootstrap-table-reorder-columns-js" />
<th:block th:include="include :: bootstrap-table-resizable-js" />
<script th:inline="javascript">
    var editFlag = [[${@permission.hasPermi('cx:stock:edit')}]];
    var editFlag2 = [[${@permission.hasPermi('cx:stock:modifyStock')}]];
    var removeFlag = [[${@permission.hasPermi('cx:stock:remove')}]];
    var prefix = ctx + "cx/stock";

    $(function () {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            updateUrl2: prefix + "/modifyStock/{id}",
            removeUrl: prefix + "/remove",
            exportUrl: prefix + "/export",
            importUrl: prefix + "/importData",
            modalName: [[#{ui.frame.page.stock.title}]],
            columns: [{
                checkbox: true
            },
                {
                    field: 'id',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.stock.id}]],
                    sortable: true,
                    visible: false
                },
                {
                    field: 'startTime',
                    sortable: true,
                    visible: false
                },
                {
                    field: 'endTime',
                    sortable: true,
                    visible: false
                },
                {
                    field: 'stockDate',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.stock.stockDate}]],
                    sortable: true,
                },
                {
                    field: 'bomDataVersion',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.productStatus.bomDataVersion}]],
                    sortable: true,
                },
                {
                    field: 'embryoCode',
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.column.stock.embryoCode}]],
                    sortable: true,
                },
                {
                    field: 'scheduleUseStock',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.stock.scheduleUseStock}]],
                    sortable: true,
                },
                {
                    field: 'stockNum',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.stock.stockNumAvailable}]],
                    sortable: true,
                },
                {
                    field: 'unavailableStock',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.stock.unavailableStock}]],
                    sortable: true,
                },
                {
                    field: 'modifyNum',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.stock.modifyNum}]],
                    sortable: true,
                },
                {
                    field: 'badNum',
                    align: 'right',
                    halign:'center',
                    title: [[#{ui.data.column.stock.badNum}]],
                    sortable: true,
                },
                {
                    field: 'remark',
                    halign:'center',
                    title: [[#{ui.common.column.remark}]],
                    sortable: true,
                    formatter:function (value, row, index) {
                        return $.table.tooltip(value,35);
                    },
                },
                {
                    widthUnit: '%',
                    width: 15,
                    align: 'center',
                    halign:'center',
                    title: [[#{ui.data.btn.option}]],
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag2 + '" href="javascript:void(0)" onclick="modifyStock(\'' + row.id + '\')"><i class="fa fa-edit"></i>'+[[#{ui.frame.btn.stock.modify2}]]+'</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>'+[[#{ui.frame.btn.delete}]]+'</a>');
                        return actions.join('');
                    },
                }]
        };
        $.table.init(options);
        setAutoHeight();
    });

    function modifyStock(id) {
        table.set();
        if ($.common.isEmpty(id)) {
            var id = $.common.isEmpty(table.options.uniqueId) ? $.table.selectFirstColumns() : $.table.selectColumns(table.options.uniqueId);
            if (id.length == 0) {
                $.modal.alertWarning(frame.alter.mustChooseOneRecord);
                return;
            }
        }
        url = table.options.updateUrl2.replace("{id}", id);
        $.modal.open([[#{ui.frame.btn.stock.modify2}]], url,800,450);
    };
    
    function releaseStock() {
        table.set();
        var rows = $.common.isEmpty(table.options.uniqueId) ? $.table.selectFirstColumns() : $.table.selectColumns(table.options.uniqueId);
        $.modal.confirm([[#{ui.biz.alter.makeSureReleaseStock}]], function () {
            $.operate.post(prefix + "/releaseStock", {"ids": rows.join()}, function (result) {
                if (result.code == web_status.FAIL) {
                    $.table.refresh();
                }
            });
        })
    }

    // 下载模板
    function importTemplate() {
        window.location.href=prefix + "/importTemplate";
    }

    $(window).resize(function() {
        /*全屏或者放大缩小屏幕时候重新设置固定表格的高度*/
        setAutoHeight();
        setTimeout(function () {
            document.getElementsByClassName('th-inner')[0].innerHTML=baseInfo;
            $(".fixed-columns").find(".th-inner")[0].innerHTML=baseInfo;
        },1000);
    });

    //刷新表格高度
    function setAutoHeight(){
        /*全屏或者放大缩小屏幕时候重新设置固定表格的高度*/
        var wh = $(window).height();//ifram容器高度
        var fixTop = $(".fixed-table-container").offset().top;  //表格到顶部的像素
        var bh = wh-(fixTop-50);//基础默认表格高度
        $('#bootstrap-table').bootstrapTable("resetView",{height:bh});
    }
</script>
</body>
<!-- 导入区域 -->
<script id="importTpl" type="text/template">
    <form enctype="multipart/form-data" class="mt20 mb10">
        <div class="col-xs-offset-1">
            <input type="button" th:value="#{ui.file.btn.text}" onclick="javascript:$('input[name=\'file\']').click();" />
            <input name="fileName" style="border: hidden;" readonly th:placeholder="#{ui.file.placeholder}" onclick="javascript:$('input[name=\'file\']').click();"/>
            <input type="file" id="file" name="file" style="display: none;" onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);" />
            <div class="mt10 pt5">
                <input type="checkbox" id="updateSupport" name="updateSupport" > [[#{ui.biz.alter.isUpdateExistUser}]]
                &nbsp;	<a onclick="importTemplate()" class="btn btn-default btn-xs"><i class="fa fa-file-excel-o"></i> [[#{ui.frame.btn.download.template}]]</a>
            </div>
            <font color="red" class="pull-left mt10">
                [[#{ui.biz.alter.onlyExcel}]]
            </font>
        </div>
    </form>
</script>
</html>
