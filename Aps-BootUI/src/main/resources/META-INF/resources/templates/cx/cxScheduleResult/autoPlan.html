<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('自动排程')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-scheduleResult-autoPlan">
        <input id="editType" name="editType" th:value="${editType}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="endTime" name="scheduleDate" type="text" class="time-input form-control" th:value="${initDate}" th:min="${initDate}" placeholder="yyyy-MM-dd" required>
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group" id="machine" hidden>
            <label class="col-sm-3 control-label">[[#{ui.data.column.cxScheduleResult.cxMachineCode}]]：</label>
            <div class="col-sm-8">
                <select id="cxMachineCode" name="cxMachineCode" class="form-control selectpicker" th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}" th:with="type=${@cx.getMachineInfo('0')}">
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"th:value="${machineInfo.machineCode}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">

    var prefix = ctx + "cx/cxScheduleResult";

    $(function () {
        var editType = $("#editType").val();
        if(editType=='1') {
            //Nick 20231020单机排程暂时隐藏不开发给客户
            //$('#machine').attr('hidden',false);
        }
    });

    $("#form-scheduleResult-autoPlan").validate({
        focusCleanup: true,
    });

    function submitHandler() {
        if ($.validate.form()) {
            let scheduleDate = $("#endTime").val();
            var editType = $("#editType").val();
            if(editType=='1') { //成型自动排程
                var cxMachineCode = $("#cxMachineCode").val();
                var config = {
                    url: prefix + "/validateAutoPlan",
                    type: "post",
                    dataType: "json",
                    data: {scheduleDate: scheduleDate,
                           cxMachineCode: cxMachineCode},
                    success: function (result) {
                        if (result.code == web_status.SUCCESS) {
                            if (result.msg == "0") { //已发布,有权限重新生成
                                $.modal.confirm([[#{ui.biz.alter.makeSureRecreateByPublished}]], function () {
                                    $.operate.save(prefix + "/autoPlan", {"scheduleDate": scheduleDate,"cxMachineCode": cxMachineCode},function (result) {
                                        if (result.code == web_status.SUCCESS) {
                                            parent.$('#scheduleDate').val(scheduleDate);
                                        }
                                    });
                                })
                            } else if (result.msg == "1") { //已经生成，提示是否重新生成
                                $.modal.confirm([[#{ui.biz.alter.makeSureRecreate}]], function () {
                                    $.operate.save(prefix + "/autoPlan", {"scheduleDate": scheduleDate,"cxMachineCode": cxMachineCode},function (result) {
                                        if (result.code == web_status.SUCCESS) {
                                            parent.$('#scheduleDate').val(scheduleDate);
                                        }
                                    });
                                })
                            } else if (result.msg == "2") { //未生成，直接生成
                                $.operate.save(prefix + "/autoPlan", {"scheduleDate": scheduleDate,"cxMachineCode": cxMachineCode},function (result) {
                                    if (result.code == web_status.SUCCESS) {
                                        parent.$('#scheduleDate').val(scheduleDate);
                                    }
                                });
                            } else if (result.msg == "3") { //已发布，提示不能重新生成
                                $.modal.alertWarning([[#{ui.biz.alter.CanNotRecreate}]]);
                            }
                        } else {
                            $.modal.alertWarning(result.msg);
                        }
                    }
                };
            }else if(editType=='2'){ //硫化自动排程
                var config = {
                    url: prefix + "/lhValidateAutoPlan",
                    type: "post",
                    dataType: "json",
                    data: {scheduleDate: scheduleDate},
                    success: function (result) {
                        if (result.code == web_status.SUCCESS) {
                            if (result.msg == "1") { //已经生成，提示是否重新生成
                                $.modal.confirm([[#{ui.biz.alter.makeSureRecreate}]], function () {
                                    $.operate.save(prefix + "/lhAutoPlan", {"scheduleDate": scheduleDate},function (result) {
                                        if (result.code == web_status.SUCCESS) {
                                            parent.$('#scheduleDate').val(scheduleDate);
                                        }
                                    });
                                })
                            } else if (result.msg == "2") { //未生成，直接生成
                                $.operate.save(prefix + "/lhAutoPlan", {"scheduleDate": scheduleDate},function (result) {
                                    if (result.code == web_status.SUCCESS) {
                                        parent.$('#scheduleDate').val(scheduleDate);
                                    }
                                });
                            } else if (result.msg == "3") { //已发布，提示不能重新生成
                                $.modal.alertWarning([[#{ui.biz.alter.CanNotRecreate}]]);
                            }
                        } else {
                            $.modal.alertWarning(result.msg);
                        }
                    }
                };
            }else if(editType=='3'){ //生成模具变动单
                var config = {
                    url: prefix + "/modelChangeValidate",
                    type: "post",
                    dataType: "json",
                    data: {"scheduleDate": scheduleDate},
                    success: function (result) {
                        if (result.code == web_status.SUCCESS){
                            if(result.msg=='0'){
                                $.modal.confirm([[#{ui.data.column.scheduleResult.modelChangeValidate}]], function () {
                                    $.operate.save(prefix + "/modelChange", {"scheduleDate": scheduleDate});
                                });
                            }else{
                                $.operate.save(prefix + "/modelChange", {"scheduleDate": scheduleDate});
                            }
                        } else {
                            $.modal.alertWarning(result.msg);
                        }
                    }
                };
            }else if(editType=='4'){ //生成模具调整计划
                $.operate.save(prefix + "/modelAdjustPlan", {"scheduleDate": scheduleDate});
            }
            $.ajax(config)
        }
    }

</script>
</body>
</html>
