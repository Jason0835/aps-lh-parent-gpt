<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改成型月结库存')" />
    <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-monthStock-edit" th:object="${monthStock}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.monthStock.stockMonth}]]：</label>
                <div class="col-sm-8">
                    <div class="input-group date">
                        <input id="stockMonth" name="stockMonth" th:value="${#dates.format(monthStock.stockMonth, 'yyyy-MM')}" class="form-control" th:placeholder="#{ui.data.column.cx.monthStock.stockMonth}" type="text" required autocomplete="off">
                        <input id="stockMonthHidden" name="stockMonth" th:value="${#dates.format(monthStock.stockMonth, 'yyyy-MM')}" class="form-control" th:placeholder="#{ui.data.column.cx.monthStock.stockMonth}" type="hidden">
                        <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.monthStock.embryoCode}]]：</label>
                <div class="col-sm-8">
                    <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" isCode="true" onchange="getEmbryoVersions()" required maxlength="30">
                </div>
            </div>

            <div id="qunidaye" class="form-group" hidden="true">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
                <div class="col-sm-8">
                    <input id="bomDataVersion" name="bomDataVersion" th:field="*{bomDataVersion}" class="form-control" type="text"readonly>
                </div>
            </div>

            <div id="qunidaye2" class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
                <div class="col-sm-8">
                    <select id="embryoVersions" name="bomDataVersion" class="form-control" th:with="type=${embryoVersions}" required>
                        <option th:each="item : ${type}" th:text="${item.embryoVersion}" th:value="${item.embryoVersion}" th:field="*{bomDataVersion}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.monthStock.stockNum}]]：</label>
                <div class="col-sm-8">
                    <input id="stockNum" name="stockNum" th:field="*{stockNum}" class="form-control" type="number" digits="true" required min="0" max="999999999">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/monthStock";
        $("#form-monthStock-edit").validate({
            focusCleanup: true
        });

        //获取胎胚版本下拉框
        function getEmbryoVersions(){
            var embryoCode=$("#embryoCode").val();
            if($.common.isEmpty(embryoCode)){
                return;
            }
            var config = {
                url: prefix + "/getProductEmbryoVersions",
                type: "post",
                dataType: "json",
                data:{"embryoCode":embryoCode},
                success: function (result) {
                    if (result.code == web_status.SUCCESS){
                        var embryoVersions=result.data;
                        var rSelect = '';
                        for(var i = 0; i < embryoVersions.length; i++){
                            rSelect += ("<option value = '"+embryoVersions[i].embryoVersion+"'>"+embryoVersions[i].embryoVersion+"</option>");
                        }
                        $("#embryoVersions").empty();
                        $("#embryoVersions").append(rSelect);
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }


        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-monthStock-edit').serialize());
            }
        }

        // 日期控件
        $("input[name='stockMonth']").datetimepicker({
            format: "yyyy-mm",
            startView: 3,//代表日期控件打开默认展示的是月
            minView: 3,//代表日期控件展示的最低到月
            maxView: 4,//代表日期控件展示的最高到年
            autoclose: true,
        });

        $(function () {
            var id = $("#id").val();
            if(id != "") { //编辑页面
                $('#stockMonth').attr("disabled","disabled");
                $('#embryoCode').attr("readonly","true");
                $('#stockNum').attr("readonly","true");
                $('#bomDataVersion').attr("readonly","true");

                $('#embryoVersions').attr("disabled","disabled");
                $('#qunidaye2').attr("hidden",true);
                $('#qunidaye').attr('hidden',false);
            }else {
                $('#stockMonthHidden').attr("disabled","disabled")

                $('#bomDataVersion').attr("disabled","disabled");
                $('#qunidaye').attr("disabled","disabled");
            }
        });
    </script>
</body>
</html>
