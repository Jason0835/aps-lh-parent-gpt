<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改成型排程中夜班完成量')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-midNightFinish-edit" th:object="${midNightShiftFinish}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.finishDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input name="finishDate" th:value="${#dates.format(midNightShiftFinish.finishDate, 'yyyy-MM-dd')}"
                           class="time-input form-control" placeholder="yyyy-MM-dd" type="text">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.cxMachineCode}]]：</label>
            <div class="col-sm-8">
                <input name="cxMachineCode" th:field="*{cxMachineCode}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.sapCode}]]：</label>
            <div class="col-sm-8">
                <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.bomDataVersion}]]：</label>
            <div class="col-sm-8">
                <input name="bomDataVersion" th:field="*{bomDataVersion}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.class1FinishQty}]]：</label>
            <div class="col-sm-8">
                <input name="class1FinishQty" th:field="*{class1FinishQty}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.class2FinishQty}]]：</label>
            <div class="col-sm-8">
                <input name="class2FinishQty" th:field="*{class2FinishQty}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.midNightFinish.remark}]]：</label>
            <div class="col-sm-8">
                <input name="remark" th:field="*{remark}" class="form-control" type="text">
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "cx/midNightFinish";
    $("#form-midNightFinish-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-midNightFinish-edit').serialize());
        }
    }
</script>
</body>
</html>
