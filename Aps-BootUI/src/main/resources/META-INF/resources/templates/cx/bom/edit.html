<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改BOM信息')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-bom-edit" th:object="${bomInfo}">
            <input id="bomInfoId" name="id" th:field="*{id}" type="hidden">
<!--            <div class="form-group">-->
<!--                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.tier}]]：</label>-->
<!--                <div class="col-sm-8">-->
<!--                    <input name="tier" th:field="*{tier}" class="form-control" type="text">-->
<!--                </div>-->
<!--            </div>-->
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.bom.erpCode}]]：</label>
                <div class="col-sm-8">
                    <input name="erpCode" th:field="*{erpCode}" class="form-control" type="text" required isCode="true" maxlength="20">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.parentErpCode}]]：</label>
                <div class="col-sm-8">
                    <div class="input-group">
                        <input class="form-control" type="text" onclick="selectBomTree()" id="treeName" readonly="true" th:field="*{parentErpCode}" maxlength="20">
                        <input class="form-control" type="hidden" onclick="selectBomTree()" id="treeId" th:field="*{parentErpCodeId}" maxlength="20">
                        <span class="input-group-addon"><i class="fa fa-search"></i></span>
                    </div>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.bom.specCode}]]：</label>
                <div class="col-sm-8">
                    <input name="specCode" th:field="*{specCode}" class="form-control" type="text" isCode="true" required maxlength="33">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.bom.specName}]]：</label>
                <div class="col-sm-8">
                    <input name="specName" th:field="*{specName}" class="form-control" type="text" required maxlength="33">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.unit}]]：</label>
                <div class="col-sm-8">
                    <input name="unit" th:field="*{unit}" class="form-control" type="text" maxlength="6">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.dosage}]]：</label>
                <div class="col-sm-8">
                    <input name="dosage" th:field="*{dosage}" class="form-control" type="number" min="0" maxlength="99999.99">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.dosageForm}]]：</label>
                <div class="col-sm-8">
                    <input name="dosageForm" th:field="*{dosageForm}" class="form-control" type="number" maxlength="8">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.productionStage}]]：</label>
                <div class="col-sm-8">
                    <input name="productionStage" th:field="*{productionStage}" class="form-control" type="text" maxlength="3">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.sapVersion}]]：</label>
                <div class="col-sm-8">
                    <input name="sapVersion" th:field="*{sapVersion}" class="form-control" type="text" maxlength="3">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.bomVersion}]]：</label>
                <div class="col-sm-8">
                    <input name="bomVersion" th:field="*{bomVersion}" class="form-control" type="text" maxlength="3">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.childMaterialVersion}]]：</label>
                <div class="col-sm-8">
                    <input name="childMaterialVersion" th:field="*{childMaterialVersion}" class="form-control" type="text" maxlength="3">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.bom.bomType}]]：</label>
                <div class="col-sm-8">
<!--                    <select name="bomType" class="form-control" th:with="type=${@dict.getType('${dictType}')}">-->
<!--                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{bomType}"></option>-->
<!--                    </select>-->
                    <input name="childMaterialVersion" th:field="*{bomType}" class="form-control" type="text" maxlength="6">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/bom";
        $("#form-bom-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-bom-edit').serialize());
            }
        }

        /*BOM信息-新增/编辑-选择父ERP品号树*/
        function selectBomTree() {
            var treeId = $("#treeId").val();
            var options = {
                title: [[#{ui.data.column.cx.bom.bomSelect}]],
                width: "380",
                url: treeId > 0 ? prefix + "/selectBomTree/" + treeId : prefix + "/selectBomTree",
                callBack: doSubmit
            };
            $.modal.openOptions(options);
        }

        function doSubmit(index, layero){
            var body = layer.getChildFrame('body', index);
               $("#treeName").val(body.find('#treeName').val());
               $("#treeId").val(body.find('#treeId').val());
               layer.close(index);
        }
    </script>
</body>
</html>
