<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改投产施工信息')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-productConstruction-edit" th:object="${cxProductConstructionInfo}">
        <input name="id" th:field="*{id}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" onchange="getEmbryoVersions()" required>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
            <div class="col-sm-8">
                <select id="embryoVersions" name="embryoVersion" class="form-control" th:with="type=${embryoVersions}" required>
                    <option th:each="item : ${type}" th:text="${item.embryoVersion}" th:value="${item.embryoVersion}" th:field="*{embryoVersion}"></option>
                </select>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "cx/productConstruction";
    $("#form-productConstruction-edit").validate({
        focusCleanup: true
    });

    //获取胎胚版本下拉框
    function getEmbryoVersions(){
        var embryoCode=$("#embryoCode").val();
        if($.common.isEmpty(embryoCode)){
            return;
        }
        var config = {
            url: prefix + "/getEmbryoVersions",
            type: "post",
            dataType: "json",
            data:{"embryoCode":embryoCode},
            success: function (result) {
                if (result.code == web_status.SUCCESS){
                    var embryoVersions=result.data;
                    var rSelect = '';
                    for(var i = 0; i < embryoVersions.length; i++){
                        rSelect += ("<option value = '"+embryoVersions[i].embryoVersion+"'>"+embryoVersions[i].embryoVersion+"</option>");
                    }
                    $("#embryoVersions").empty();
                    $("#embryoVersions").append(rSelect);
                } else {
                    $.modal.alertWarning(result.msg);
                }
            }
        };
        $.ajax(config)
    }

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-productConstruction-edit').serialize());
        }
    }
</script>
</body>
</html>
