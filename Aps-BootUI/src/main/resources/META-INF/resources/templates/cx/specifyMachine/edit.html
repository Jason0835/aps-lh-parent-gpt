<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改定点机台')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-specifyMachine-edit" th:object="${tSpecifyMachine}">
            <input id="tSpecifyMachineId" name="id" th:field="*{id}" type="hidden">

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.machine.embryoCode}]]：</label>
                <div class="col-sm-8">
                    <input id="embryoCode" name="embryoCode" th:field="*{embryoCode}" onchange="getSpecDesc()" class="form-control" type="text" required isCode="true" maxlength="20">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.sap}]]：</label>
                <div class="col-sm-8">
                    <input name="sap" th:field="*{sap}" class="form-control" type="text" isCode="true" maxlength="20">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.specDesc}]]：</label>
                <div class="col-sm-8">
                    <input id="specDesc" name="specDesc" th:field="*{specDesc}" class="form-control" type="text" maxlength="200" th:readonly="true">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.lineType}]]：</label>
                <div class="col-sm-8">
                    <select name="lineType" class="form-control" th:with="type=${@dict.getType('LINE_TYPE')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{lineType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.jobType}]]：</label>
                <div class="col-sm-8">
                    <select name="jobType" class="form-control" th:with="type=${@dict.getType('JOB_TYPE')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{jobType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.cx.machine.projectDesc}]]：</label>
                <div class="col-sm-8">
                    <input name="projectDesc" th:field="*{projectDesc}" class="form-control" type="text" maxlength="200">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/specifyMachine";

        $("#form-specifyMachine-edit").validate({
            focusCleanup: true
        });

        //根据胎胚代码获取规格尺寸
        function getSpecDesc(){
            var embryoCode=$("#embryoCode").val()
            if($.common.isEmpty(embryoCode)){
                return;
            }
            var config = {
                url: "/cx/mdmMonthProdPlan/getSpecDesc",
                type: "post",
                dataType: "json",
                data: {embryoCode: embryoCode},
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        $("#specDesc").val(result.data.specDesc);
                    }else{
                        $("#embryoCode").val('');
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }

        function submitHandler() {
            if ($.validate.form()) {
                var embryoCode=$("#embryoCode").val()
                if($.common.isEmpty(embryoCode)){
                    return;
                }
                var config = {
                    url: "/cx/mdmMonthProdPlan/getSpecDesc",
                    type: "post",
                    dataType: "json",
                    data: {embryoCode: embryoCode},
                    success: function (result) {
                        if (result.code == web_status.SUCCESS) {
                            $.operate.save(prefix + "/edit", $('#form-specifyMachine-edit').serialize());
                        }else{
                            $.modal.alertWarning(result.msg);
                        }
                    }
                };
                $.ajax(config)
            }
        }

    </script>
</body>
</html>
