<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改库存地点生产顺序')" />
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-stockLocationSort-edit" th:object="${cxStockLocationSort}">
            <input id="id" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stockLocationSort.stockLocation}]]：</label>
                <div class="col-sm-8">
                    <select id="stockLocation" name="stockLocation" class="form-control" th:with="type=${@dict.getType('STORAGE_LOCATION')}" required>
                        <option value="">[[#{ui.frame.select.stockLocation}]]</option>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{stockLocation}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.stockLocationSort.productSort}]]：</label>
                <div class="col-sm-8">
                    <input name="productSort" th:field="*{productSort}" class="form-control" type="number" digits="true" min="0" max="999" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/stockLocationSort";
        $("#form-stockLocationSort-edit").validate({
            onkeyup: false,
            rules: {
                stockLocation: {
                    remote: {
                        url: prefix + "/checkCxStockLocationSortUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            "id": function () {
                                return $("#id").val();
                            },
                            "stockLocation": function () {
                                return $("#stockLocation").val();
                            },
                        },
                        dataFilter: function (data, type) {
                            return $.validate.unique(data);
                        }
                    }
                },
            },
            messages: {
                "stockLocation": {
                    remote: [[#{ui.cx.stockLocationSort.alter.exist}]]
                }
            },
            focusCleanup: true,
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-stockLocationSort-edit').serialize());
            }
        }
    </script>
</body>
</html>
