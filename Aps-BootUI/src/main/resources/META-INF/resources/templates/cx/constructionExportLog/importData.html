<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('导入排程结果')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" enctype="multipart/form-data" id="form-import">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.constructionExportLog.fileType}]]：</label>
            <div class="col-sm-8">
                <select id="fileType" name="fileType" class="form-control" th:with="type=${@dict.getType('PROCEDURE_CODE')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.frame.btn.chooseFile}]]：</label>
            <div class="col-sm-8">
                <input id="fileName" name="fileName" class="form-control" required readonly
                       th:placeholder="#{ui.frame.btn.clickChoose}"
                       onclick="javascript:$('input[name=\'file\']').click();">
                <input type="file" id="file" name="file" style="display: none;"
                       onchange="javascript:$('input[name=\'fileName\']').val(this.files[0].name);"/>
            </div>
        </div>

        <font color="red" class="pull-left mt10">[[#{ui.biz.alter.onlyExcel}]]</font>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">

    var prefix = ctx +"cx/constructionExportLog";



    $("#form-scheduleResult-autoPlan").validate({
        focusCleanup: true,
    });

    function submitHandler() {
        if ($.validate.form()) {
            var fileName = $("#fileName").val();
            if (fileName == '' || (!$.common.endWith(fileName, '.xls') && !$.common.endWith(fileName, '.xlsx')
                && !$.common.endWith(fileName, '.XLS') && !$.common.endWith(fileName, '.XLSX'))) {
                $.modal.msgWarning(frame.alter.importExcel);
                return false;
            }
            $.modal.loading(frame.alter.doingWaiting);
            var formData = new FormData();
            var file = document.querySelector('[type=file]');
            var fileType = $("#fileType").val();
            formData.append("file", file.files[0]);
            formData.append("fileType", fileType);
            $.ajax({
                url: prefix + "/importMaterial",
                data: formData,
                cache: false,
                contentType: false,
                processData: false,
                type: 'POST',
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        $.modal.close();
                    } else {
                        $.modal.enable();
                        $.modal.alertError(result.msg);
                    }
                    window.parent.$.table.refresh();
                    $.modal.closeLoading();
                }
            });
        }
    }

</script>
</body>
</html>
