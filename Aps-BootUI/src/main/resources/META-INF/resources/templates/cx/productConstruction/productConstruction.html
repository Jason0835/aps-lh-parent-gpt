<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">

</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>[[#{ui.data.column.productConstruction.embryoCode}]]：</label>
                            <input type="text" name="embryoCode"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.productConstruction.embryoVersion}]]：</label>
                            <input type="text" name="embryoVersion"/>
                        </li>
                        <li>
                            <label>[[#{ui.data.column.productConstruction.productionStage}]]：</label>
                            <select name="productionStage" th:with="type=${@dict.getType('PRODUCTION_STAGE')}"
                                    class="form-control">
                                <option value="">[[#{ui.frame.select.select.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>

                        <li>
                            <label>[[#{ui.data.column.productConstruction.halfPartsQueryType}]]：</label>
                            <select name="halfPartsQueryType" th:with="type=${@dict.getType('HALF_PARTS_CODE')}"
                                    class="form-control">
                                <option value="">[[#{ui.frame.select.select.all}]]</option>
                                <option th:each="dict : ${type}" th:text="${dict.dictLabel}"
                                        th:value="${dict.dictValue}"></option>
                            </select>
                        </li>

                        <li>
                            <label>[[#{ui.data.column.productConstruction.halfPartsQueryCode}]]：</label>
                            <input type="text" name="halfPartsQueryCode"/>
                        </li>

                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i
                                    class="fa fa-search"></i>&nbsp;[[#{ui.frame.btn.search}]]</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;[[#{ui.frame.btn.reset}]]</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add('',500,500)"
               shiro:hasPermission="cx:productConstruction:add">
                <i class="fa fa-plus"></i> [[#{ui.frame.btn.add}]]
            </a>
            <a class="btn btn-primary single disabled" onclick="$.operate.edit('',1200,500)"
               shiro:hasPermission="cx:productConstruction:edit">
                <i class="fa fa-edit"></i> [[#{ui.frame.btn.modify}]]
            </a>
            <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()"
               shiro:hasPermission="cx:stock:remove">
                <i class="fa fa-remove"></i> [[#{ui.frame.btn.delete}]]
            </a>
            <a class="btn btn-warning" onclick="$.table.exportUiExcel()"
               shiro:hasPermission="cx:productConstruction:export">
                <i class="fa fa-download"></i> [[#{ui.frame.btn.export}]]
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-table"></table>
        </div>
    </div>
</div>
