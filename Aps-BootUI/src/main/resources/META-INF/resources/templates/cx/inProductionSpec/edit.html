<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改成型机台当前生产规格')"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-inProductionSpec-edit" th:object="${inProductionSpec}">
        <input name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.productDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <input name="productDate" th:value="${#dates.format(inProductionSpec.productDate, 'yyyy-MM-dd')}"
                           class="time-input form-control" placeholder="yyyy-MM-dd" type="text">
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.cxMachineCode}]]：</label>
            <div class="col-sm-8">
                <input name="cxMachineCode" th:field="*{cxMachineCode}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.sapCode}]]：</label>
            <div class="col-sm-8">
                <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.bomDataVersion}]]：</label>
            <div class="col-sm-8">
                <input name="bomDataVersion" th:field="*{bomDataVersion}" class="form-control" type="text">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.inProductionSpec.remark}]]：</label>
            <div class="col-sm-8">
                <input name="remark" th:field="*{remark}" class="form-control" type="text">
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var prefix = ctx + "cx/inProductionSpec";
    $("#form-inProductionSpec-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/edit", $('#form-inProductionSpec-edit').serialize());
        }
    }

</script>
</body>
</html>
