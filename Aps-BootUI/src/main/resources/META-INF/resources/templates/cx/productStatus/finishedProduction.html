<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改成型排程结果')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-productStatus-edit" th:object="${cxPlanProductStatus}">

        <input name="id" th:field="*{id}" type="hidden">
        <input name="ids" th:field="*{ids}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.productionDate}]]：</label>
            <div class="col-sm-8">
                <div class="input-group date">
                    <div class="select-time">
                        <input id="endTime" name="scheduleDate" type="text" class="time-input form-control" placeholder="yyyy-MM-dd" required>
                        <input type="hidden"  id="startTime"/>
                    </div>
                    <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.bomDataVersion}]]：</label>
            <div class="col-sm-8">
                <input name="bomDataVersion" th:field="*{bomDataVersion}" class="form-control" type="text" th:readonly="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.sapCode}]]：</label>
            <div class="col-sm-8">
                <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text" th:readonly="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.embryoCode}]]：</label>
            <div class="col-sm-8">
                <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" th:readonly="true">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.cxMachineCode}]]：</label>
            <div class="col-sm-8">
                <select id="cxMachineCode" name="cxMachineCode" class="form-control"
                        th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}" required>
                    <optgroup th:with="type=${@cx.getMachineInfo('0',cxPlanProductStatus.embryoCode)}">
                        <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}"
                                th:value="${machineInfo.machineCode}"></option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cxScheduleResult.storageLocation}]]：</label>
            <div class="col-sm-8">
                <select name="storageLocation" class="form-control" th:with="type=${@dict.getType('STORAGE_LOCATION')}" required>
                    <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{storageLocation}"></option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class1PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class1PlanQty" th:field="*{class1PlanQty}" class="form-control" type="number" min="0" digits="true" max="9999999">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class2PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class2PlanQty" th:field="*{class2PlanQty}" class="form-control" type="number" min="0" digits="true" max="9999999">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class3PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class3PlanQty" th:field="*{class3PlanQty}" class="form-control" type="number" min="0" digits="true" max="9999999">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class4PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class4PlanQty" th:field="*{class4PlanQty}" class="form-control" type="number" min="0" digits="true"  max="9999999">
            </div>
        </div>

        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.class5PlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="class5PlanQty" th:field="*{class5PlanQty}" class="form-control" type="number" min="0" digits="true" max="9999999">
            </div>
        </div>


    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">

    var prefix = ctx + "cx/productStatus";

    $("#form-productStatus-edit").validate({
        focusCleanup: true
    });

    $("input").change(function () {
        $(this).val($(this).val().trim());
    });

    $(function (){
        // 日期控件初始赋值
        layui.use('laydate', function () {
            var laydate = layui.laydate;
            laydate.render({
                elem: '#endTime',
                value: new Date(),
                isInitValue: true,
            });
        });
    })

    function submitHandler() {
        if ($.validate.form()) {
            var data = $("#form-productStatus-edit").serializeArray();
            var config = {
                url: prefix + "/validateProduction",
                type: "post",
                dataType: "json",
                data: data,
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        if($.common.isNotEmpty(result.msg)){
                            $.modal.confirm(result.msg, function () {
                                $.operate.save(prefix + "/edit", data);
                            })
                        }else{
                            $.operate.save(prefix + "/edit", data);
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }
    }

</script>
</body>
</html>
