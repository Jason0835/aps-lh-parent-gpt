<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改成型排产限制')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-limit-edit" th:object="${ScheduleLimit}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.machine.type}]]：</label>
                <div class="col-sm-8">
                    <select name="machineType" class="form-control" th:with="type=${@dict.getType('MACHINE_TYPE')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{machineType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.limit.specDimension}]]：</label>
                <div class="col-sm-8">
                    <input name="specDimension" th:field="*{specDimension}" class="form-control" type="number" required min="0" max="9999999">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.limit.tireAvgLhStockMinimun}]]：</label>
                <div class="col-sm-8">
                    <input name="tireAvgLhStockMinimun" th:field="*{tireAvgLhStockMinimun}" class="form-control" type="number" digits="true" min="0" max="99" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.limit.tireAveLhStockMaximun}]]：</label>
                <div class="col-sm-8">
                    <input name="tireAveLhStockMaximun" th:field="*{tireAveLhStockMaximun}" class="form-control" type="number" digits="true" min="0" max="99" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cx.limit.maxLhClass}]]：</label>
                <div class="col-sm-8">
                    <input name="maxLhClass" th:field="*{maxLhClass}" class="form-control" type="number" digits="true"  min="0" max="99" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/limit";
        $("#form-limit-edit").validate({
            focusCleanup: true,
            rules: {
                specDimension: {
                    range:[0,99999999.99],
                },
                tireAvgLhStockMinimun: {
                    range:[0,99],
                },
                tireAveLhStockMaximun: {
                    range:[0,99],
                },
                maxLhClass: {
                    range:[0,99],
                }
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-limit-edit').serialize());
            }
        }
    </script>
</body>
</html>
