<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改成型计划投产状态')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-productStatus-edit" th:object="${cxPlanProductStatus}">
            <input name="id" th:field="*{id}" type="hidden">
            <input name="adjustSource" th:field="*{adjustSource}" type="hidden">
            <input id="editType" name="editType" th:value="${editType}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.monthPlanApsVersion}]]：</label>
                <div class="col-sm-8">
                    <input name="monthPlanApsVersion" th:field="*{monthPlanApsVersion}" class="form-control" type="text" th:readonly="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.bomDataVersion}]]：</label>
                <div class="col-sm-8">
                    <input name="bomDataVersion" th:field="*{bomDataVersion}" class="form-control" type="text" th:readonly="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.sapCode}]]：</label>
                <div class="col-sm-8">
                    <input name="sapCode" th:field="*{sapCode}" class="form-control" type="text" th:readonly="true">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.embryoCode}]]：</label>
                <div class="col-sm-8">
                    <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" th:readonly="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.productStatus}]]：</label>
                <div class="col-sm-8">
                    <select id="productStatus" name="productStatus" class="form-control" th:with="type=${@dict.getType('PRODUCT_STATUS')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{productStatus}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.markUnProduct}]]：</label>
                <div class="col-sm-8">
                    <select id="markUnProduct" name="markUnProduct" class="form-control" th:with="type=${@dict.getType('MARK_UN_PRODUCT')}">
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{markUnProduct}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.monthPlanTotalQty}]]：</label>
                <div class="col-sm-8">
                    <input id="monthPlanTotalQty" name="monthPlanTotalQty" th:field="*{monthPlanTotalQty}" class="form-control" type="number" th:readonly="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.stock.modifyNum}]]：</label>
                <div class="col-sm-8">
                    <input id="monthPlanTotalModifyQty" name="monthPlanTotalModifyQty" th:field="*{monthPlanTotalModifyQty}" class="form-control" type="number" isInteger="true" min="-999999" max="999999">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.productStatus.specDimension}]]：</label>
                <div class="col-sm-8">
                    <input name="specDimension" th:field="*{specDimension}" class="form-control" type="text" th:readonly="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/productStatus";

        $(function () {
            var editType = $("#editType").val();
            if(editType=='1') { //编辑页面
                $('#monthPlanTotalModifyQty').attr('readonly','true');
            }else if(editType=='2'){ //调量页面
                $('#productStatus').attr("disabled","disabled");
                $('#markUnProduct').attr("disabled","disabled");
            }
        });


        $("#form-productStatus-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var editType = $("#editType").val();
                if(editType=='1') { //编辑页面
                    $.operate.save(prefix + "/edit", $('#form-productStatus-edit').serialize());
                }else if(editType=='2'){ //调量页面
                    var monthPlanTotalModifyQty=Number($('#monthPlanTotalModifyQty').val());
                    if(monthPlanTotalModifyQty==0){
                        $.modal.alertWarning([[#{ui.data.column.productStatus.canNotBeNull}]]);
                        return;
                    }
                    $.operate.save(prefix + "/modifyQty", $('#form-productStatus-edit').serialize());
                }

            }
        }
    </script>
</body>
</html>
