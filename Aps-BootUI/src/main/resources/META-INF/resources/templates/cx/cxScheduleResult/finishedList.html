    /**
      * 合并相同行
      */
    function mergeCells(dataAll, fieldName, condition, target) {
        var data = dataAll;
        setTimeout(function () {
            if (data.rows.length == 0) {
                return;
            }
            var numArr = [];
            var number = 0;
            if (data.rows.length > 1) {
                for (let i = 0; i < data.rows.length; i++) {
                    if (data.rows[i][fieldName] != '' && data.rows[i][fieldName] != '-') {
                        if (data.rows[i - 1]) {
                            if (data.rows[i - 1][fieldName] != '' && data.rows[i - 1][fieldName] != '-') {
                                if (data.rows[i - 1][fieldName] == data.rows[i][fieldName] && data.rows[i - 1][condition] == data.rows[i][condition]) {
                                    number++
                                } else {
                                    number = number + 1
                                    numArr.push({index: i - number, number: number, pan: '1'})
                                    number = 0
                                }
                            }
                        }
                        if (!data.rows[i + 1]) {
                            number = number
                            numArr.push({index: i - number, number: number + 1, pan: '2'})
                            number = 0
                        } else {
                            if (data.rows[i + 1][fieldName] == '' || data.rows[i + 1][fieldName] == '-') {
                                number = number
                                numArr.push({index: i - number, number: number + 1, pan: '3'})
                                number = 0
                            }
                        }
                    } else {
                        numArr.push({index: i, number: 1, pan: '4'})
                    }
                }
            } else {
                numArr.push({index: 0, number: 1, pan: '5'})
            }
            // console.log(numArr);
            for (let x = 0; x < numArr.length; x++) {
                if (x % 2) {
                    for (let y = 0; y < numArr[x]['number']; y++) {
                        //  $(target).children('tbody').children('tr').eq(numArr[x]['index']+y).css('background','yellow')
                    }
                } else {
                    for (let y = 0; y < numArr[x]['number']; y++) {
                        $(target).children('tbody').children('tr').eq(numArr[x]['index'] + y).css('background', '#fff')
                    }
                }
                $(target).bootstrapTable('mergeCells', {
                    index: numArr[x]['index'],
                    field: fieldName,
                    colspan: 1,
                    rowspan: numArr[x]['number']
                });
            }
        }, 0)
    }


    //回显机台名称
    function selectMachineName(datas, value) {
        if ($.common.isEmpty(datas)) {
            return '';
        }
        var actions = [];
        var arr = value.split(",");
        $.each(datas, function (index, dict) {
            $.each(arr, function (index, item) {
                if (dict.machineCode == (item)) {
                    var machineName = $.common.isEmpty(dict.machineName) ? "" : dict.machineName;
                    actions.push($.common.sprintf("<span>%s</span>", machineName, dict.machineName));
                    return false;
                }
            })
        });
        return actions.join(',');
    }

        $.modal.open([[#{ui.data.column.cxScheduleResult.lhMachineChangeMoldDesc}]], url);
    };
