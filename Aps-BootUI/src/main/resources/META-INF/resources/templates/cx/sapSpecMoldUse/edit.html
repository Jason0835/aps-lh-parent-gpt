<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改规格使用模数')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-sapSpecMoldUse-edit" th:object="${sapSpecMoldUse}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.sapSpecMoldUse.sapCode}]]：</label>
                <div class="col-sm-8">
                    <input id="sapCode" name="sapCode" th:field="*{sapCode}" onchange="getSpecDesc()" class="form-control" type="text" isCode="true" maxlength="20" required>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.sapSpecMoldUse.specDesc}]]：</label>
                <div class="col-sm-8">
                    <input id="specDesc" name="specDesc" th:field="*{specDesc}" class="form-control" type="text" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.data.column.sapSpecMoldUse.embryoCode}]]：</label>
                <div class="col-sm-8">
                    <input name="embryoCode" th:field="*{embryoCode}" class="form-control" type="text" isCode="true" maxlength="20">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.sapSpecMoldUse.moldNum}]]：</label>
                <div class="col-sm-8">
                    <input name="moldNum" th:field="*{moldNum}" class="form-control" type="number" isInteger="true" min="0" max="99999999" required>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cx/sapSpecMoldUse";
        $("#form-sapSpecMoldUse-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-sapSpecMoldUse-edit').serialize());
            }
        }

        //根据sapCode获取规格尺寸
        function getSpecDesc(){
            var sapCode=$("#sapCode").val()
            if($.common.isEmpty(embryoCode)){
                return;
            }
            var config = {
                url: prefix + "/getSpecDesc",
                type: "post",
                dataType: "json",
                data: {sapCode: sapCode},
                success: function (result) {
                    if (result.code == web_status.SUCCESS) {
                        $("#specDesc").val(result.data.specDesc);
                    } else {
                        $("#specDesc").val('');
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }

    </script>
</body>
</html>
