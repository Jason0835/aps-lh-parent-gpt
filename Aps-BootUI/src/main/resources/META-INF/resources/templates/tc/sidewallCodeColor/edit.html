<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改胎侧代码前缀颜色设定')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-sidewallCodeColor-edit" th:object="${tcSidewallCodeColor}">
            <input id="id" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.sidewallCodeColor.sidewallCode}]]：</label>
                <div class="col-sm-8">
                    <input id="sidewallCode" name="sidewallCode" th:field="*{sidewallCode}" class="form-control" type="text" required maxlength="20" isCode="true">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.sidewallCodeColor.matchType}]]：</label>
                <div class="col-sm-8">
                    <select name="matchType" class="form-control" th:with="type=${@dict.getType('match_type')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{matchType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.sidewallCodeColor.colorType}]]：</label>
                <div class="col-sm-8">
                    <select name="colorType" class="form-control" th:with="type=${@dict.getType('BIG_ROLL_COLOR')}" required>
                        <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}" th:field="*{colorType}"></option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.sidewallCodeColor.colorCode}]]：</label>
                <div class="col-sm-8">
                    <div class="form-control">
                        <input id="colorCode" th:placeholder="#{ui.bigRollColor.color.placeholder}" name="colorCode" th:field="*{colorCode}" class="layui-input form-control colorpicker-input" type="text" maxlength="15" readonly>
                        <div id="colorpicker"></div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.status}]]：</label>
                <div class="col-sm-8">
                    <label class="toggle-switch switch-solid">
                        <input type="checkbox" id="status" th:checked="${tcSidewallCodeColor.status == '0' ? true : false}">
                        <span></span>
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.stock.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>

        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: colorpicker" />
    <script th:inline="javascript">
        var prefix = ctx + "tc/sidewallCodeColor";


        layui.use(['colorpicker', 'layer'], function(){
            var colorpicker = layui.colorpicker;
            colorpicker.render({
                elem: '#colorpicker'
                ,predefine: true //开启预定义颜色
                ,colors: '#000'
                ,change: function(color){
                    layui.$("#colorCode").val(color);
                }
                ,done: function(color){
                    layui.$('#colorCode').val(color);
                }
            });
            try{
                layui.$(".layui-colorpicker-trigger-span")[0].style.background=layui.$("#colorCode").val();
            }catch (e) {

            }
        })

        function submitHandler() {
            if ($.validate.form()) {
                var data = $("#form-sidewallCodeColor-edit").serializeArray();
                var status = $("input[id='status']").is(':checked') == true ? '0' : '1';
                data.push({"name": "status", "value": status});
                $.operate.save(prefix + "/edit", data);
            }
        }
    </script>
</body>
</html>
