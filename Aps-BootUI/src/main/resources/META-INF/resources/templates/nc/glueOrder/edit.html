<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改内衬胶料顺序')"/>
    <th:block th:include="include :: select2-css" />
    <th:block th:include="include :: bootstrap-select-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-order-edit" th:object="${glueOrder}">
        <input id="glueId" name="id" th:field="*{id}" type="hidden">
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.glueOrder.column.glueGroup}]]：</label>
            <div class="col-sm-8">
                <select name="glueGroupId" class="form-control" th:with="glueGroups=${@nc.getGlueGroups()}" required="true">
                    <option value="">[[#{ui.frame.btn.choose}]]</option>
                    <option th:each="glueGroup : ${glueGroups}" th:text="${glueGroup.glueGroupName}" th:value="${glueGroup.id}" th:field="*{glueGroupId}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.glueOrder.column.glueCode}]]：</label>
            <div class="col-sm-8">
                <input id="glueCode" name="glueCode" th:field="*{glueCode}" class="form-control" type="text" required="true" isCode="true" maxlength="30">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.glueOrder.column.orderNum}]]：</label>
            <div class="col-sm-8">
                <input name="orderNum" th:field="*{orderNum}" class="form-control" type="text" required="true" max="999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea id="remark" name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>
    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js" />
<th:block th:include="include :: bootstrap-select-js" />
<script th:inline="javascript">
    var prefix = ctx + "nc/glueOrder";

    $("#form-order-edit").validate({
        onkeyup: false,
        rules: {
            glueCode: {
                remote: {
                    url: prefix + "/checkGlueCodeUnique",
                    type: "post",
                    dataType: "json",
                    data: {
                        "id": function () {
                            return $("#glueId").val();
                        },
                        "glueCode": function () {
                            return $.common.trim($("#glueCode").val());
                        }
                    },
                    dataFilter: function (data, type) {
                        return $.validate.unique(data);
                    }
                }
            },
        },
        messages: {
            "glueCode": {
                remote: [[#{ui.glueOrder.alter.isGlueExist}]]
            }
        },
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            $.operate.save(prefix + "/save", $('#form-order-edit').serialize());
        }
    }
</script>
</body>
</html>
