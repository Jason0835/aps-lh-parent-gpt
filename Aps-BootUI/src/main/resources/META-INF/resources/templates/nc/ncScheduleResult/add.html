<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('修改内衬胶排程结果')"/>
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
    <form class="form-horizontal m" id="form-ncScheduleResult-edit" th:object="${ncScheduleResult}">

        <input name="id" th:field="*{id}" type="hidden">

        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
            <div class="col-sm-8">
                <div class="select-time">
                    <input id="endTime" name="scheduleDate" type="text" class="time-input form-control" th:value="${initDate}" th:min="${minDate}" placeholder="yyyy-MM-dd" required>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.liningCode}]]：</label>
            <div class="col-sm-8">
                <input id="liningCode" required name="liningCode" th:field="*{liningCode}" class="form-control" type="text"
                       isCode="true" maxlength="20" onblur="toUpperCase()">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.produceLine}]]：</label>
            <div class="col-sm-8">
                <select name="machineId"  th:with="type=${@nc.getMachineInfo('0')}" class="form-control" th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}" required>
                    <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                    <option  th:each="machineInfo : ${type}" th:value="${machineInfo.id}" th:text="${machineInfo.machineName}"></option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dayPlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="dayPlanQty" th:field="*{dayPlanQty}" class="form-control" type="number" min="0" max="9999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dayAnalysis}]]：</label>
            <div class="col-sm-8">
                <input name="dayHandAnalysis" th:field="*{dayHandAnalysis}" class="form-control" type="text" maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.nightPlanQty}]]：</label>
            <div class="col-sm-8">
                <input name="nightPlanQty" th:field="*{nightPlanQty}" class="form-control" type="number" min="0" max="9999999" digits="true">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.nightAnalysis}]]：</label>
            <div class="col-sm-8">
                <input name="nightHandAnalysis" th:field="*{nightHandAnalysis}" class="form-control" type="text" maxlength="100">
            </div>
        </div>
        <div class="form-group">
            <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
            <div class="col-sm-8">
                <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
            </div>
        </div>

        <input name="cxBatchNo" th:field="*{cxBatchNo}" class="form-control" type="hidden">
        <input name="batchNo" th:field="*{batchNo}" class="form-control" type="hidden">
        <input name="orderNo" th:field="*{orderNo}" class="form-control" type="hidden">

    </form>
</div>
<th:block th:include="include :: footer"/>
<th:block th:include="include :: select2-js"/>
<th:block th:include="include :: bootstrap-select-js"/>
<script th:inline="javascript">

    var prefix = ctx + "nc/ncScheduleResult";

    $("#form-ncScheduleResult-edit").validate({
        focusCleanup: true
    });

    function submitHandler() {
        if ($.validate.form()) {
            var scheduleDate = $('#endTime').val();
            var config = {
                url: prefix + "/validateAdd",
                type: "post",
                dataType: "json",
                data:{"scheduleDate":scheduleDate},
                success: function (result) {
                    if (result.code == web_status.SUCCESS){
                        if(result.msg=='0'){
                            $.modal.confirm([[#{ui.data.column.scheduleResult.isContinueAdd}]], function () {
                                $.operate.save(prefix + "/edit", $('#form-ncScheduleResult-edit').serialize(),reloadMachineName());
                            })
                        }else{
                            $.operate.save(prefix + "/edit", $('#form-ncScheduleResult-edit').serialize(),reloadMachineName());
                        }
                    } else {
                        $.modal.alertWarning(result.msg);
                    }
                }
            };
            $.ajax(config)
        }
    }

    function reloadMachineName(){
        parent.$('#scheduleDate').val($('#endTime').val());
    }

    function toUpperCase() {
        let $liningCode = $("#liningCode");
        var toUpperCase = $liningCode.val().toUpperCase();
        $liningCode.val(toUpperCase);
    }
</script>
</body>
</html>
