<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改内衬胶料组别顺序')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-order-edit" th:object="${glueGroupOrder}">
            <input id="glueId" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.glueGroup.column.glueGroupCode}]]：</label>
                <div class="col-sm-8">
                    <input id="glueGroupCode" name="glueGroupCode" th:field="*{glueGroupCode}" class="form-control" type="text" required="true" isCode="true" maxlength="30">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.glueGroup.column.glueGroupName}]]：</label>
                <div class="col-sm-8">
                    <input name="glueGroupName" th:field="*{glueGroupName}" class="form-control" type="text" required="true" maxlength="15">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.glueGroup.column.orderNum}]]：</label>
                <div class="col-sm-8">
                    <input name="orderNum" th:field="*{orderNum}" class="form-control" type="text" required="true" max="999" digits="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea id="remark" name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "nc/glueGroupOrder";
        // $("#form-order-edit").validate({
        //     focusCleanup: true
        // });

        $("#form-order-edit").validate({
            onkeyup: false,
            rules: {
                glueGroupCode: {
                    remote: {
                        url: prefix + "/checkGlueGroupCodeUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            "id": function () {
                                return $("#glueId").val();
                            },
                            "glueGroupCode": function () {
                                return $.common.trim($("#glueGroupCode").val());
                            }
                        },
                        dataFilter: function (data, type) {
                            return $.validate.unique(data);
                        }
                    }
                },
            },
            messages: {
                "glueGroupCode": {
                    remote: [[#{ui.glueGroup.alter.isGlueGroupExist}]]
                }
            },
            focusCleanup: true
        });

        // var glueId = $("#glueId").val();
        // if(glueId != '') {
        //     $('#remark').attr("readonly","readonly");
        // }
        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/save", $('#form-order-edit').serialize());
            }
        }
    </script>
</body>
</html>
