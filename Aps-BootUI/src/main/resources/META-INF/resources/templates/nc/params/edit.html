<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改内衬参数信息')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-params-edit" th:object="${Params}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.paramsCode}]]：</label>
                <div class="col-sm-8">
                    <input name="paramCode" th:field="*{paramCode}" class="form-control" type="text" required="true" disabled>
                    <input id="paramCode" name="paramCode" th:field="*{paramCode}" class="form-control" type="hidden" required="true">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.paramsName}]]：</label>
                <div class="col-sm-8">
                    <input name="paramName" th:field="*{paramName}" class="form-control" type="text" required="true" readonly>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.paramsValue}]]：</label>
                <div class="col-sm-8">
                    <input name="paramValue" th:field="*{paramValue}" class="form-control" type="text" required="true">
                </div>
            </div>
            <div class="form-group" style="display: none">
                <label class="col-sm-3 control-label">[[#{ui.data.column.regular}]]：</label>
                <div class="col-sm-8">
                    <input name="regularExpression" th:field="*{regularExpression}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group" style="display: none">
                <label class="col-sm-3 control-label">[[#{ui.data.column.errorTips}]]：</label>
                <div class="col-sm-8">
                    <input name="errorTips" th:field="*{errorTips}" class="form-control" type="text">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "nc/params";
        $("#form-params-edit").validate({
            onkeyup: false,
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-params-edit').serialize());
            }
        }
    </script>
</body>
</html>
