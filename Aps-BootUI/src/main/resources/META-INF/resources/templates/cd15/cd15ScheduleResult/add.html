<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改15度裁断排程结果')" />
    <th:block th:include="include :: select2-css"/>
    <th:block th:include="include :: bootstrap-select-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-cd15ScheduleResult-edit" th:object="${cd15ScheduleResult}">
            <input name="id" th:field="*{id}" type="hidden">

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.scheduleDate}]]：</label>
                <div class="col-sm-8">
                    <div class="select-time">
                        <input id="endTime" name="scheduleDate" type="text" class="time-input form-control"th:value="${initDate}" th:min="${minDate}" placeholder="yyyy-MM-dd" required>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.scheduleResult.produceLine}]]：</label>
                <div class="col-sm-8">
                    <select name="machineId" required class="form-control selectpicker" th:data-none-selected-text="#{ui.data.column.scheduleResult.chooseMachine}" th:with="type=${@cd15.getMachineInfo('0')}">
                        <option value="">[[#{ui.data.column.selectMachineName}]]</option>
                        <option th:each="machineInfo : ${type}" th:text="${machineInfo.machineName}" th:value="${machineInfo.id}"></option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cd15ScheduleResult.steelStripCode1}]]：</label>
                <div class="col-sm-8">
                    <input id="steelStripCode1" name="steelStripCode1" th:field="*{steelStripCode1}" class="form-control" type="text" isCode="true" required  maxlength="20" onblur="toUpperCase()">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label is-required">[[#{ui.data.column.cd15ScheduleResult.steelStripCode2}]]：</label>
                <div class="col-sm-8">
                    <input name="steelStripCode2" th:field="*{steelStripCode2}" class="form-control" type="text" isCode="true" required maxlength="20" onblur="toUpperCase()">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dayPlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="dayPlanQty1" th:field="*{dayPlanQty1}" class="form-control" type="number" min="0" max="9999999" isInteger="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.dayHandAnalysis}]]：</label>
                <div class="col-sm-8">
                    <input name="dayHandAnalysis1" th:field="*{dayHandAnalysis1}" class="form-control" type="text" maxlength="100" >
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.nightPlanQty}]]：</label>
                <div class="col-sm-8">
                    <input name="nightPlanQty1" th:field="*{nightPlanQty1}" class="form-control" type="number" min="0"  max="9999999" isInteger="true">
                </div>
            </div>
            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.data.column.scheduleResult.nightHandAnalysis}]]：</label>
                <div class="col-sm-8">
                    <input name="nightHandAnalysis1" th:field="*{nightHandAnalysis1}" class="form-control" type="text" maxlength="100">
                </div>
            </div>

            <div class="form-group">
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>

            <input name="cxBatchNo" th:field="*{cxBatchNo}" class="form-control" type="hidden">
            <input name="batchNo" th:field="*{batchNo}" class="form-control" type="hidden">
            <input name="orderNo" th:field="*{orderNo}" class="form-control" type="hidden">

        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <th:block th:include="include :: bootstrap-select-js" />
    <script th:inline="javascript">

        var prefix = ctx + "cd15/cd15ScheduleResult";

        $("#form-cd15ScheduleResult-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                var scheduleDate = $('#endTime').val();
                var config = {
                    url: prefix + "/validateAdd",
                    type: "post",
                    dataType: "json",
                    data:{"scheduleDate":scheduleDate},
                    success: function (result) {
                        if (result.code == web_status.SUCCESS){
                            if(result.msg=='0'){
                                $.modal.confirm([[#{ui.data.column.scheduleResult.isContinueAdd}]], function () {
                                    $.operate.save(prefix + "/edit", $('#form-cd15ScheduleResult-edit').serialize(),reloadMachineName());
                                })
                            }else{
                                $.operate.save(prefix + "/edit", $('#form-cd15ScheduleResult-edit').serialize(),reloadMachineName());
                            }
                        } else {
                            $.modal.alertWarning(result.msg);
                        }
                    }
                };
                $.ajax(config)
            }
        }

        function reloadMachineName(){
            parent.$('#scheduleDate').val($('#endTime').val());
        }

        $("input").change(function () {
            $(this).val($(this).val().trim());
        });

        function toUpperCase() {
            let $steelStripCode1 = $("#steelStripCode1");
            let $steelStripCode2 = $("#steelStripCode2");
            var toUpperCase1 = $steelStripCode1.val().toUpperCase();
            var toUpperCase2 = $steelStripCode2.val().toUpperCase();
            $steelStripCode1.val(toUpperCase1);
            $steelStripCode2.val(toUpperCase2);
        }

    </script>
</body>
</html>
