<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改钢压大卷信息维护')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-roll-edit" th:object="${bigRoll}">
            <input id="bigRollId" name="id" th:field="*{id}" type="hidden">
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.common.column.gy.bigRollCode}]]：</label>
                <div class="col-sm-8">
                    <input id="bigRollCode" name="bigRollCode" th:field="*{bigRollCode}" class="form-control" type="text" required="true" isCode="true" maxlength="30">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label is-required">[[#{ui.bigRoll.column.actClothLength}]]：</label>
                <div class="col-sm-8">
                    <input name="actClothLength" th:field="*{actClothLength}" class="form-control" type="number" min="0" max="999999" required>
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.bigRoll.column.convertProduceNum}]]：</label>
                <div class="col-sm-8">
                    <input name="convertProduceNum" th:field="*{convertProduceNum}" class="form-control" type="number" digits="true" min="0" max="999999">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.bigRoll.column.clothLength}]]：</label>
                <div class="col-sm-8">
                    <input name="clothLength" th:field="*{clothLength}" class="form-control" type="number" min="0" max="999999">
                </div>
            </div>
            <div class="form-group">    
                <label class="col-sm-3 control-label">[[#{ui.common.column.remark}]]：</label>
                <div class="col-sm-8">
                    <textarea name="remark" class="form-control" rows="2" th:field="*{remark}" maxlength="300"></textarea>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "cd15/bigRoll";

        $("#form-roll-edit").validate({
            onkeyup: false,
            rules: {
                bigRollCode: {
                    remote: {
                        url: prefix + "/checkBigRollCodeUnique",
                        type: "post",
                        dataType: "json",
                        data: {
                            "id": function () {
                                return $("#bigRollId").val();
                            },
                            "bigRollCode": function () {
                                return $.common.trim($("#bigRollCode").val());
                            }
                        },
                        dataFilter: function (data, type) {
                            return $.validate.unique(data);
                        }
                    }
                },
            },
            messages: {
                "bigRollCode": {
                    remote: [[#{ui.cd15.bigRoll.alter.isBigRollExist}]]
                }
            },
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/save", $('#form-roll-edit').serialize());
            }
        }
    </script>
</body>
</html>
