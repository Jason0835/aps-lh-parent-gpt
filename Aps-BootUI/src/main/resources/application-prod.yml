# 项目相关配置
ruoyi:
  # 名称
  name: Telecom Frame
  # 版本
  version: 4.6.2
  # 版权年份
  copyrightYear: 2021
  # 实例演示开关
  demoEnabled: false
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: /data/app/ui/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 跨域开关
  enableCors: true
# 开发环境配置
server-port: 9066
#nacos服务器
nacos:
  server-addr: 172.21.7.167:8848,172.21.7.168:8848,172.21.7.169:8848
  run-group: APS_PROD_GROUP
  cfg-group: APS_PROD_GROUP
  run-namespace: "prod"
  cfg-namespace: "prod"
url:
  preview: http://172.21.7.170:8012
  current: http://172.21.7.170:9066
#系统标识
project:
  project-tag: aps
  system-tag: aps

# Spring配置
spring-app-name: aps-bootui
# 单机配置 addr和port
redis-sentinel-master: mymaster
redis-sentinel-nodes: 172.21.7.167:26379,172.21.7.168:26379,172.21.7.169:26379
redis-password: 99hGAKSuM8d
redis-database: 5
#redis-password:
zipkin-addr: "http://172.21.7.170:9411/"

#是否需要走单点
shiro-sso-enable: false
sso:
  cas-addr: http://172.21.7.170:8899/cas
  #cas-addr: https://casserverpac4j.herokuapp.com
#网关配置,只用来取验证码，feignClient使用的是注册中心的网关信息。
gateway-addr: http://172.21.7.170:8080/
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: ${server-port}
  servlet:
    # 应用的访问路径
    context-path: /
    session:
      cookie:
        name: mysessionID
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 30
    max-http-form-post-size: -1
  max-http-header-size: 409600

# 日志配置
logging:
  level:
    com.ruoyi: error
    org.springframework: error
    com.zlt: error

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

#系统标识
system-tag: aps

# Spring
# Spring配置
spring:
  profiles:
    active: prod
  autoconfigure:
    exclude:
      - com.ruoyi.common.i18n.configure.LocaleConfig
  main:
    allow-bean-definition-overriding: true
  application:
    # 应用名称
    name: ruoyi-admin-mis
  resources:
    static-locations: classpath:META-INF/resources/static/
  # 模板引擎
  thymeleaf:
    prefix: classpath:META-INF/resources/templates/
    mode: HTML
    encoding: utf-8
    # 禁用缓存
    cache: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    # 包括common包里面的语言，后端同步
    basename: static/i18n/messages,i18n/commonMessages,i18n/apsui,i18n/language,i18n/monthplan,i18n/languagemix
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  100MB
      # 设置总上传的文件大小
      max-request-size:  500MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

  #nacos
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${nacos.server-addr}
        group: ${nacos.run-group}
        namespace: ${nacos.run-namespace}
      config:
        # 配置中心地址
        server-addr: ${nacos.server-addr}
        group: ${nacos.cfg-group}
        namespace: ${nacos.cfg-namespace}
        # 配置文件格式
        file-extension: yml
        shared-configs[0]:
          data-id: application-${project.project-tag}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: ${nacos.cfg-group}

        shared-configs[1]:
          data-id: system-api-prefix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: ${nacos.cfg-group}

        #自动刷新配置文件
        refresh-enabled: true
  #这个不能用共享，它比nacos前注入
  zipkin:
    baseUrl: ${zipkin-addr}
    flushInterval: 3
    compression:
      enabled: true
    locator:
      discovery:
        enabled: true
  redis:
    host: ${redis-addr}
    port: ${redis-port}
    password: ${redis-password}
    database: ${redis-database}
shiro:
  #使用单点登录时，sso = true
  sso:
    enable: ${shiro-sso-enable}
    cas: ${sso.cas-addr}
    clientName: casClient
    currentCas: ${sso.current-addr}
    loginUrl: ${shiro.sso.cas}/login?service=${sso.current-addr}${shiro.sso.indexUrl}
    logoutUrl: ${shiro.sso.cas}/logout?service=${sso.current-addr}${shiro.sso.indexUrl}
    indexUrl: ${shiro.user.toIndexUrl}
    unauthorizedUrl: ${shiro.user.unauthorizedUrl}
    validateSessionUri: /casTicket/getTicketBySessionId
    aliveTickesUri: /casTicket/getTicketList
    deleteSessionUri: /casTicket/deleteTicketBySessionId
  # sso = false 时，走user配置
  user:
    # 登录地址
    loginUrl: /login
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # CAS跳转首页地址
    toIndexUrl: /toIndex
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: false
    # 验证码类型 math 数组计算 char 字符
    captchaType: math
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain:
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
    # 设置密钥，务必保持唯一性（生成方式，直接拷贝到main运行即可）Base64.encodeToString(CipherUtils.generateNewKey(128, "AES").getEncoded()) （默认启动生成随机秘钥，随机秘钥会导致之前客户端RememberMe Cookie无效，如设置固定秘钥RememberMe Cookie则有效）
    cipherKey:
  session:
    # Session超时时间，-1代表永不过期（默认30分钟）
    expireTime: 360
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 10
    # 同一个用户最大会话数，比如2的意思是同一个账号允许最多同时两个人登录（默认-1不限制）
    maxSession: -1
    # 踢出之前登录的/之后登录的用户，默认踢出之前登录的用户
    kickoutAfter: false

feign:
  client:
    config:
      default: #默认配置
        readTimeout: 600000 #读取超时时间
        connectTimeout: 600000

#放前端需要加载的所有国际化语言包路径
ui:
  i18n-messages: static/i18n/messages,i18n/commonMessages,i18n/announceMessages,static/i18n/msg,static/i18n/fileui,i18n/dmsui,i18n/apiMessages,i18n/messages,i18n/ValidationMessages,i18n/authMessages,i18n/systemMessages,i18n/FileMessages,i18n/modRepairApply_I18n,i18n/modStockCheck_I18n,i18n/modPurchasePlan_I18n,i18n/modReceive_I18n,i18n/modAllot_I18n,i18n/moldui
  forceLang: AUTO
# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false

#网关配置,只用来取验证码，feignClient使用的是注册中心的网关信息。
gateway:
  url: ${gateway-addr}
  casUrl: ${sso.cas-addr}
  retryTimes: 1

fileEncrypt:
  ll:
    enabled: false

#UI使用的文件加解密开关
fileEncryptEnabled: true

#前端编辑时子表可能提交超过1000，覆写框架的配置
binder:
  autoGrowCollectionLimit: 10000


#JVM启动参数：java.compile=none
#fileManage-enable: true
#fileManage-minio-addr: http://172.21.7.170:9000  #对象存储服务的URL
#fileManage-minio-accessKey: uploaduser #Access key账户
#fileManage-minio-secretKey: uploaduser  #Secret key密码
#uploadFilePath:
#  imageFile: /data/app/ui/uploadPath/imagePath

check:
  isCheckFirstLogin: false
  isCheckPWDTimeout: false