
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: 80
  ascription: aps
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    max-threads: 800
    # Tomcat启动初始化的线程数，默认值25
    min-spare-threads: 30
  max-http-header-size: 102400

# 项目相关配置
ruoyi:
  # 名称
  name: Telecom Frame
  # 版本
  version: 2.2.1
  # 版权年份
  copyrightYear: 2020
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/Telecom/uploadPath
  # 获取ip地址开关
  addressEnabled: false

#nacos服务器
nacos:
  server-addr: 192.168.10.123:8848

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn
    com.zlt: debug

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

check:
  isCheckFirstLogin: false
  isCheckPWDTimeout: false

# Spring配置
spring:
  profiles:
    active: test
  main:
    allow-bean-definition-overriding: true
  application:
    # 应用名称
    name: aps-bootui
  resources:
    static-locations: classpath:META-INF/resources/static/
  # 模板引擎
  thymeleaf:
    prefix: classpath:META-INF/resources/templates/
    mode: HTML
    encoding: utf-8
    # 禁用缓存
    cache: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    # 包括common包里面的语言，后端同步，20201202 linbn
    basename: static/i18n/messages,i18n/commonMessages,i18n/apsui,i18n/language,i18n/monthplan,i18n/languagemix
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size:  10MB
      # 设置总上传的文件大小
      max-request-size:  20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

  #nacos
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${nacos.server-addr}
        group: ${nacos.run-group}
        namespace: ${nacos.run-namespace}
      config:
        # 配置中心地址
        server-addr: ${nacos.server-addr}
        group: ${nacos.cfg-group}
        namespace: ${nacos.cfg-namespace}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        #        shared-dataids: application-aps-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[0]:
          data-id: application-aps-test.${spring.cloud.nacos.config.file-extension}
        shared-configs[1]:
          data-id: system-api-prefix-test.${spring.cloud.nacos.config.file-extension}
        #自动刷新配置文件
        refresh-enabled: true
  #这个不能用共享，它比nacos前注入
  redis:
    host: 192.168.2.93
    port: 6379
    password:
    database: 1
  zipkin:
    baseUrl: "http://192.168.2.93:9411/"
    flushInterval: 3
    compression:
      enabled: true
    locator:
      discovery:
        enabled: true
shiro:
  #使用单点登录时，sso = true
  sso:
    #是否需要走单点
    enable: false
    cas: http://localhost:8899/cas
    clientName: casClient
    currentCas: http://localhost  #cas跳转前路径
    loginUrl: ${shiro.sso.cas}/login?service=${shiro.sso.currentCas}${shiro.sso.indexUrl}
    logoutUrl: ${shiro.sso.cas}/logout?service=${shiro.sso.currentCas}${shiro.sso.indexUrl}
    indexUrl: ${shiro.user.toIndexUrl}
    unauthorizedUrl: ${shiro.user.unauthorizedUrl}
    validateSessionUri: /casTicket/getTicketBySessionId
    aliveTickesUri: /casTicket/getTicketList
    deleteSessionUri: /casTicket/deleteTicketBySessionId
  # sso = false 时，走user配置
  user:
    # 登录地址
    loginUrl: /login
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # CAS跳转首页地址
    toIndexUrl: /toIndex
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: false
    # 验证码类型 math 数组计算 char 字符
    captchaType: math
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain:
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
    # 设置密钥，务必保持唯一性（生成方式，直接拷贝到main运行即可）KeyGenerator keygen = KeyGenerator.getInstance("AES"); SecretKey deskey = keygen.generateKey(); System.out.println(Base64.encodeToString(deskey.getEncoded()));
    cipherKey: zSyK5Kp6PZAAjlT+eeNMlg==
  session:
    # Session超时时间，-1代表永不过期（默认30分钟）
    expireTime: 30
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 10
    # 同一个用户最大会话数，比如2的意思是同一个账号允许最多同时两个人登录（默认-1不限制）
    maxSession: -1
    # 踢出之前登录的/之后登录的用户，默认踢出之前登录的用户
    kickoutAfter: false

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true

#请求处理的超时时间
ribbon:
  ReadTimeout: 1000000
  ConnectTimeout: 1000000

#网关配置,只用来取验证码，feignClient使用的是注册中心的网关信息。
gateway:
  url: http://127.0.0.1:8080/
  casUrl: http://127.0.0.1:8899/cas
  retryTimes: 1
#系统编码
system:
  currentCode: APS

#excel文件模板
excelTemplateModel: excelTemplateModel/
#导入文件是否需要解密
fileEncrypt:
  ll:
    enabled: false

