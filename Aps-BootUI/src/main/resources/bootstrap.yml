
# 开发环境配置
server:
  # 服务器的HTTP端口，默认为80
  port: ${server-port}
  servlet:
    # 应用的访问路径
    context-path: /
    session:
      cookie:
        name: mysessionID
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # tomcat最大线程数，默认为200
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

vue:
  enabled: false


# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn
    com.zlt: debug

# 用户配置
user:
  password:
    # 密码错误{maxRetryCount}次锁定10分钟
    maxRetryCount: 5

#系统标识
system-tag: frame

# Spring
# Spring配置
spring:
  profiles:
    active: test,Special

  autoconfigure:
    exclude:
      - com.ruoyi.common.i18n.configure.LocaleConfig

  main:
    allow-bean-definition-overriding: true
  application:
    # 应用名称
    name: ${spring-app-name}
  resources:
    static-locations: classpath:META-INF/resources/static/
  # 模板引擎
  thymeleaf:
    prefix: classpath:META-INF/resources/templates/
    mode: HTML
    encoding: utf-8
    # 禁用缓存
    cache: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    # 包括common包里面的语言，后端同步，20201202 linbn
    basename: ${ui.i18n-messages}
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 文件上传
  servlet:
     multipart:
       # 单个文件大小
       max-file-size:  110MB
       # 设置总上传的文件大小
       max-request-size:  520MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

  #nacos
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 192.168.10.123:8848
        group: APS_TEST_GROUP
        namespace: "dctest"
      config:
        # 配置中心地址
        server-addr: 192.168.10.123:8848
        group: APS_TEST_GROUP
        namespace: "dctest"
        # 配置文件格式
        file-extension: yml
        # 共享配置
#        shared-dataids: application-aps-prod.${spring.cloud.nacos.config.file-extension}

        #自动刷新配置文件
        refresh-enabled: true
#这个不能用共享，它比nacos前注入
  zipkin:
    baseUrl: ${zipkin-addr}
    flushInterval: 3
    compression:
      enabled: true
    locator:
      discovery:
        enabled: true
shiro:
  #使用单点登录时，sso = true
  sso:
    enable: ${shiro-sso-enable}
    cas: ${sso.cas-addr}
    clientName: casClient
    currentCas: ${sso.current-addr}
    loginUrl: ${shiro.sso.cas}/login?service=${sso.current-addr}${shiro.sso.indexUrl}
    logoutUrl: ${shiro.sso.cas}/logout?service=${sso.current-addr}${shiro.sso.indexUrl}
    indexUrl: ${shiro.user.toIndexUrl}
    unauthorizedUrl: ${shiro.user.unauthorizedUrl}
    validateSessionUri: /casTicket/getTicketBySessionId
    aliveTickesUri: /casTicket/getTicketList
    deleteSessionUri: /casTicket/deleteTicketBySessionId
  # sso = false 时，走user配置
  user:
    # 登录地址
    loginUrl: /login
    # 权限认证失败地址
    unauthorizedUrl: /unauth
    # CAS跳转首页地址
    toIndexUrl: /toIndex
    # 首页地址
    indexUrl: /index
    # 验证码开关
    captchaEnabled: false
    # 验证码类型 math 数组计算 char 字符
    captchaType: math
  cookie:
    # 设置Cookie的域名 默认空，即当前访问的域名
    domain: 
    # 设置cookie的有效访问路径
    path: /
    # 设置HttpOnly属性
    httpOnly: true
    # 设置Cookie的过期时间，天为单位
    maxAge: 30
    # 设置密钥，务必保持唯一性（生成方式，直接拷贝到main运行即可）Base64.encodeToString(CipherUtils.generateNewKey(128, "AES").getEncoded()) （默认启动生成随机秘钥，随机秘钥会导致之前客户端RememberMe Cookie无效，如设置固定秘钥RememberMe Cookie则有效）
    cipherKey: 
  session:
    # Session超时时间，-1代表永不过期（默认30分钟）
    # 这个时间要设置比后端的短，前端先超时，才能正常反馈。后端超时会提示接口错误。
    expireTime: 11
    # 同步session到数据库的周期（默认1分钟）
    dbSyncPeriod: 1
    # 相隔多久检查一次session的有效性，默认就是10分钟
    validationInterval: 5
    # 同一个用户最大会话数，比如2的意思是同一个账号允许最多同时两个人登录（默认-1不限制）
    maxSession: -1
    # 踢出之前登录的/之后登录的用户，默认踢出之前登录的用户
    kickoutAfter: false
  rememberMe:
    # 是否开启记住我
    enabled: true

# 防止XSS攻击
xss: 
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice/*
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true

#请求处理的超时时间
ribbon:
  ReadTimeout: 20000
  ConnectTimeout: 20000

#网关配置,只用来取验证码，feignClient使用的是注册中心的网关信息。
gateway:
  url: ${gateway-addr}
  casUrl: ${sso.cas-addr}
  retryTimes: 1

fileEncrypt:
  ll:
    enabled: false

uploadFilePath:
  imageFile: D:/Telecom/uploadPath/imagePath

fileManage:
  enabled: ${fileManage-enable}
  minio:
    url: ${fileManage-minio-addr}  #对象存储服务的URL
    accessKey: ${fileManage-minio-accessKey} #Access key账户
    secretKey: ${fileManage-minio-secretKey}  #Secret key密码
    bucketDefault: upload-normal-file
    dirDefault: upload


check:
  isCheckFirstLogin: false
  isCheckPWDTimeout: false

--- #Redis单机配置
spring:
  config:
    activate:
      on-profile:
        - dev
        - test
        - prod
        - Special
  redis:
    host: 192.168.2.93
    port: 6379
    password:
    database: 7


# feign 配置
feign:
  sentinel:
    enabled: true
  okhttp:
    enabled: true
  httpclient:
    enabled: false
  client:
    config:
      zltConfig:
        errorDecoder: com.zlt.common.facade.FeignErrorResponseCatcher
        connectTimeout: 20000
        readTimeout: 220000
      default:
        errorDecoder: com.zlt.common.facade.FeignErrorResponseCatcher
        connectTimeout: 20000
        readTimeout: 220000
    default-config: zltConfig
  compression:
    request:
      enabled: false
    response:
      enabled: false