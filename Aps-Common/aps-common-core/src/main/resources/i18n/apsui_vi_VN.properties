ui.text.info.factorder=*C\u1EA5u h\u00ECnh m\u00E3 v\u1EADt t\u01B0 l\u00E0 * t\u01B0\u1EE3ng tr\u01B0ng cho t\u1EA5t c\u1EA3 m\u00E3 v\u1EADt t\u01B0 trong k\u1EBF ho\u1EA1ch kh\u00E1ch h\u00E0ng c\u00F3 m\u1EE9c \u0111\u1ED9 \u01B0u ti\u00EAn gi\u1ED1ng v\u1EDBi c\u00F4ng ty. \u0110\u1ED1i v\u1EDBi s\u1EA3n xu\u1EA5t t\u1EA1i \u0111i\u1EC3m c\u1ED1 \u0111\u1ECBnh, c\u1EA5u h\u00ECnh m\u00E3 h\u00E0ng t\u01B0\u01A1ng \u1EE9ng v\u1EDBi m\u1ED9t c\u00F4ng ty. Xu\u1EA5t kh\u00E1ch h\u00E0ng ch\u01B0a c\u1EA5u h\u00ECnh: Kh\u00E1ch h\u00E0ng \u0111\u00E3 c\u00F3 k\u1EBF ho\u1EA1ch trong 2 th\u00E1ng g\u1EA7n nh\u1EA5t.
