ui.text.info.main.last.collect.plan=*Nh\u1EADp c\u1EADp nh\u1EADt h\u00E0ng lo\u1EA1t, c\u1EA7n xu\u1EA5t d\u1EEF li\u1EC7u tr\u01B0\u1EDBc, thay th\u1EBF h\u00E0ng lo\u1EA1t s\u1ED1 l\u01B0\u1EE3ng nhu c\u1EA7u s\u1EA3n xu\u1EA5t (ban h\u00E0nh) v\u00E0 y\u00EAu c\u1EA7u \u0111\u1EB7c bi\u1EC7t theo kh\u00F3a ch\u00EDnh d\u1EEF li\u1EC7u. C\u00E1c tr\u01B0\u1EDDng kh\u00E1c s\u1EBD kh\u00F4ng \u0111\u01B0\u1EE3c c\u1EADp nh\u1EADt.
