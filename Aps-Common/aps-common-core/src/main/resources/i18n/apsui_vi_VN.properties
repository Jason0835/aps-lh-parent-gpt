ui.text.info.threeAndFour=*2+3, phi\u00EAn b\u1EA3n m\u1EDBi c\u1EE7a 3 s\u1EED d\u1EE5ng phi\u00EAn b\u1EA3n \u0111\u1EA7u ra c\u1EE7a 2. Phi\u00EAn b\u1EA3n ban h\u00E0nh c\u1EE7a 3 m\u1EB7c \u0111\u1ECBnh s\u1EED d\u1EE5ng phi\u00EAn b\u1EA3n m\u1EDBi nh\u1EA5t do b\u1ED9 ph\u1EADn k\u1EBF ho\u1EA1ch t\u1ED5ng h\u1EE3p ban h\u00E0nh xu\u1ED1ng tinh g\u1ECDn, ph\u1EA3n h\u1ED3i s\u1EA3n xu\u1EA5t c\u1EE7a 3 m\u1EB7c \u0111\u1ECBnh s\u1EED d\u1EE5ng phi\u00EAn b\u1EA3n m\u1EDBi nh\u1EA5t.
