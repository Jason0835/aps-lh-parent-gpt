# Tomcat
server:
  port: 9512

nacos:
  server-addr: 192.168.2.93:8848
#  server-addr: 127.0.0.1:8848

#系统标识
system-tag: aps
# Spring
spring:
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        namespace: test
        group: APS_TEST_GROUP
      config:
        shared-configs[0]:
          data-id: application-${system-tag}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: TEST_GROUP
        shared-configs[1]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: TEST_GROUP
        refresh-enabled: true
        namespace: test
        group: TEST_GROUP

