# Tomcat
server:
  port: 8080

nacos:
#  server-addr: 192.168.2.93:8848
  server-addr: 127.0.0.1:8848


# Spring
#系统标识
system-tag: aps
# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-gateway
  profiles:
    # 环境配置
    active: dev
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${nacos.server-addr}
      config:
        # 配置中心地址
        server-addr: ${nacos.server-addr}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs[0]:
          data-id: application-${system-tag}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[1]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        refresh-enabled: true
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 127.0.0.1:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: ${nacos.server-addr}
            dataId: sentinel-ruoyi-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: flow
