# Tomcat
server:
  port: 9500

nacos:
  server-addr: 192.168.3.112:9917,192.168.3.115:9917,192.168.3.122:9917

#系统标识
system-tag: aps
# Spring
spring:
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        namespace: prod
        group: APS_PROD_GROUP
      config:
        # 共享配置
        shared-configs[0]:
          data-id: application-${system-tag}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[1]:
          data-id: druid_${system-tag}_${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[2]:
          data-id: system-frame-${system-tag}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[3]:
          data-id: system-api-prefix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        shared-configs[4]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
          group: PROD_GROUP
        refresh-enabled: true
        namespace: prod
        group: PROD_GROUP

