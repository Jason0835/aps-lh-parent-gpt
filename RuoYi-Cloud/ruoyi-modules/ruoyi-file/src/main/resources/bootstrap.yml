# Tomcat
server:
  port: 9300

nacos:
  #  server-addr: 192.168.2.93:8848
  server-addr: 127.0.0.1:8848
# Spring
#系统标识
system-tag: aps
# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-file
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: ${nacos.server-addr}
      config:
        # 配置中心地址
        server-addr: ${nacos.server-addr}
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs[0]:
          data-id: application-${system-tag}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[1]:
          #引用Cloud内部服务的都要加这个配置
          data-id: system-api-prefix-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        shared-configs[2]:
          data-id: zipkin-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
        #自动刷新配置文件
        refresh-enabled: true
#文件上传路径
uploadFilePath:
  exportFile: /app/aps/uploadFile/exportFile
  importFile: /app/aps/uploadFile/importFile
  imageFile: /app/aps/uploadFile/imageFile